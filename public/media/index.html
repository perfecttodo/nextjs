<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><title>影音雲端管理</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="brand.js"></script><style>.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}*{scrollbar-width:thin;scrollbar-color:rgba(51,65,85,0.6) transparent}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:0 0}::-webkit-scrollbar-thumb{background:rgba(71,85,105,.4);border-radius:9999px;transition:background .2s ease}::-webkit-scrollbar-thumb:hover{background:rgba(99,102,241,.6)}footer.player-bar{padding-bottom:calc(.75rem + env(safe-area-inset-bottom,0px))}#mobileDrawer{transition:transform .3s ease-in-out}#mobileDrawerToggle.is-open .fa-bars::before{content:"\f00d"}.plugin-body:empty{display:none}@keyframes playingHighlight{0%,100%{background-color:rgba(49,46,129,.3)}50%{background-color:rgba(49,46,129,.45)}}tr.playing-row{background-color:rgba(79,70,229,.22);box-shadow:inset 4px 0 0 0 #6366f1;animation:playingPulse 2.2s ease-in-out infinite;transition:background-color .3s ease}tr.playing-row:hover{background-color:rgba(79,70,229,.35)!important}.sidebar-card{flex-shrink:0;min-width:0}.sidebar-card-header{transition:background-color .15s ease;cursor:pointer;user-select:none}.sidebar-card-header:hover{background-color:rgba(30,41,59,.45)}.sidebar-card-body{display:grid;grid-template-rows:1fr}.sidebar-card-body>.inner{overflow:hidden;min-height:0;box-sizing:border-box;padding-bottom:1rem}.sidebar-card.is-collapsed .sidebar-card-body>.inner{padding-bottom:0}.sidebar-card.is-ready .sidebar-card-body{transition:grid-template-rows .28s cubic-bezier(.4, 0, .2, 1)}.sidebar-card.is-ready .sidebar-card-body>.inner{transition
