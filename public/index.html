<html lang="zh-Hant"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首頁</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #38bdf8;
            --primary-hover: #0ea5e9;
            --border-color: #334155;
            --max-width: 900px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: var(--max-width);
            width: 100%;
            text-align: center;
        }

        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: var(--border-color);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        h1 span {
            color: var(--primary-color);
        }

        p.subtitle {
            font-size: 1.125rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .link-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .link-item:hover {
            border-color: var(--primary-color);
            transform: translateY(-3px);
        }

        .link-item h3 {
            font-size: 1.25rem;
            color: var(--primary-color);
        }

        .link-item p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        footer {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <!-- 頭像或圖示 -->
            <div class="avatar">👨&zwj;💻</div>
            
            <h1><span>Alex</span></h1>
            <p class="subtitle">前後端軟體工程師</p>
            
            <p style="color: var(--text-muted); max-width: 600px; margin: 0 auto 1.5rem;">
               歡迎來到我的數位空間。這裡匯集了我的個人作品、求職履歷、開源專案與技術心得。
            </p>

            <!-- 導覽按鈕區塊 -->
            <div class="links-grid">
                <!-- 連結至子目錄的履歷頁 -->
                <a href="./resume/" class="link-item">
                    <h3>📄 求職作品集</h3>
                    <p>查看我的工作經歷、技術棧與精選專案</p>
                </a>
                
                <!-- 連結至其他專案或部落格 (可自行替換網址) -->
                <a href="/exam/index.html" target="_blank" class="link-item">
                    <h3>💻 考試練習App</h3>
                    <p>考試專用</p>
                </a>

                <a href="/episode" target="_blank" class="link-item">
                    <h3>🌐 新聞英文學習App</h3>
                    <p>聽新聞學英文</p>
                </a>
            </div>
        </div>

        <footer>
            <p>© 2026. All Rights Reserved.</p>
        </footer>
    </div>


</body></html>
