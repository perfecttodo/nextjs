<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>快樂小讀者</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="view-list" class="view active">
    <header class="top-bar" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <h1 style="font-size:22px;">📚 快樂小讀者</h1>
      <div class="pref-bar" style="display:flex;gap:8px;flex-wrap:wrap;">
        <button id="btn-open-manager" class="btn-speed" style="border-color:#F43F5E;background:#FFF1F2;color:#BE123C;">🗂️ 錄音庫</button>
        <button id="btn-pref-voice" class="btn-speed">🗣️ 粵語</button>
        <button id="btn-pref-script" class="btn-speed">🔤 港澳繁</button>
      </div>
    </header>
    <div id="story-grid" class="story-grid"></div>
  </main>

  <main id="view-reader" class="view">
    <header class="reader-header">
      <button id="btn-back" class="btn-back" style="padding:8px 12px;font-size:16px;">⬅️ 返回</button>
      <span id="header-status-pill" class="header-status-pill">粵語 · 1.0x</span>
      <div class="header-right" style="gap:6px;">
        <button id="btn-tap-jump" class="btn-speed" style="padding:7px 10px;font-size:14px;border-color:#0EA5E9;background:#F0F9FF;color:#0369A1;">👆 點哪讀哪</button>
        <button id="btn-open-settings" class="btn-speed" style="padding:7px 12px;font-size:15px;border-color:#64748B;background:#F8FAFC;color:#1E293B;">⚙️ 設定</button>
        <span id="wake-badge" class="badge" style="display:none;">☀️</span>
      </div>
    </header>
    <div id="parent-rec-banner" style="display:none;background:#FFF1F2;color:#9F1239;padding:10px 16px;text-align:center;font-size:17px;font-weight:bold;border-bottom:2px solid #FECDD3;position:sticky;top:62px;z-index:90;">
      <div style="display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;">
        <span id="rec-status-text">準備開始錄音...</span>
        <button id="btn-stop-rec-inline" style="background:#EF4444;color:#fff;border:none;padding:6px 14px;border-radius:12px;font-weight:bold;font-size:15px;cursor:pointer;">⏹️ 停止錄音</button>
      </div>
      <div style="display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;">
        <select id="mic-device-select" style="padding:6px 10px;border-radius:10px;border:1px solid #FDA4AF;font-size:14px;background:#fff;color:#881337;max-width:220px;"><option value="">🎙️ 預設麥克風</option></select>
        <canvas id="mic-waveform" width="240" height="40" style="background:#fff;border-radius:12px;border:1px solid #FECDD3;"></canvas>
      </div>
    </div>
    <article id="story-content" class="story-content"></article>
    <section id="record-panel" class="record-panel hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
        <span style="font-weight:bold;color:#1E293B;font-size:16px;">🎧 寶寶剛才的朗讀錄音</span>
        <button id="btn-close-record" style="border:none;background:#F1F5F9;color:#475569;padding:4px 12px;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;">✖️ 關閉</button>
      </div>
      <audio id="recorded-audio" controls playsinline></audio>
      <div class="record-actions">
        <button id="btn-loop" class="btn-pill">🔁 循環播放</button>
        <button id="btn-save-kid-db" class="btn-pill btn-save">✅ 保存到系統</button>
        <a id="btn-download" class="btn-pill" style="background:#E0F2FE;color:#0369A1;" download="我的朗讀.webm">⬇️ 下載</a>
      </div>
    </section>
    <footer class="control-dock">
      <button id="btn-play-tts" class="btn-big btn-tts"><span class="icon">🎧</span><span class="label">聽故事</span></button>
      <button id="btn-read-along" class="btn-big btn-mic"><span class="icon">🎤</span><span class="label">自己讀</span></button>
    </footer>
  </main>

  <div id="modal-settings" class="modal-backdrop hidden">
    <div class="modal-card" style="max-width:440px;max-height:88vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h3 style="margin:0;">⚙️ 閱讀與語音設定</h3>
        <button id="btn-close-settings" class="btn-back" style="padding:6px 14px;">完成</button>
      </div>
      <div class="settings-grid">
        <div class="setting-row"><label>🗣️ 朗讀語音</label><button id="btn-reader-voice" class="btn-speed" style="border-color:#8B5CF6;background:#F5F3FF;color:#5B21B6;">🗣️ 粵語</button></div>
        <div class="setting-row"><label>🔤 顯示字形</label><button id="btn-reader-script" class="btn-speed" style="border-color:#EC4899;background:#FDF2F8;color:#9D174D;">🔤 港澳繁</button></div>
        <div class="setting-row"><label>🐇 朗讀語速</label><button id="btn-speed" class="btn-speed">🐇 1.0x</button></div>
        <div class="setting-row"><label>🎯 對齊模式</label><button id="btn-mode" class="btn-speed" style="border-color:#38BDF8;background:#F0F9FF;color:#0369A1;">🎯 精讀</button></div>
        <div class="setting-row"><label>🔁 循環播放</label><button id="btn-repeat" class="btn-speed" style="border-color:#10B981;background:#ECFDF5;color:#047857;">⏹️ 單篇</button></div>
        <div class="setting-row"><label>🎤 自己讀方式</label><button id="btn-read-mode" class="btn-speed" style="border-color:#F97316;background:#FFF7ED;color:#C2410C;">⏱️ 提詞跟讀</button></div>
        <div class="setting-row" id="row-parent-play" style="display:none;"><label>👨‍👩‍👧 切換家庭錄音</label><button id="btn-parent-play" class="btn-speed" style="border-color:#F59E0B;background:#FEF3C7;color:#B45309;">👨‍👩‍👧 父母聲</button></div>
        <div class="setting-row" style="border-bottom:none;padding-top:4px;"><label>🎙️ 父母陪讀錄音</label><button id="btn-parent-rec" class="btn-speed" style="border-color:#F43F5E;background:#FFF1F2;color:#BE123C;">🎙️ 開始錄製</button></div>
      </div>
    </div>
  </div>

  <div id="modal-preview" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3>🎧 試聽父母陪讀錄音</h3>
      <p style="color:#64748B;margin:6px 0 12px;">請先點擊播放試聽，確認清楚後再保存：</p>
      <audio id="preview-audio" controls playsinline style="width:100%;margin-bottom:14px;"></audio>
      <div style="margin-bottom:16px;text-align:left;"><label style="font-weight:bold;font-size:15px;display:block;margin-bottom:6px;">錄音標籤：</label><input id="preview-label-input" type="text" value="媽媽的聲音" style="width:100%;padding:10px 12px;font-size:16px;border:2px solid #CBD5E1;border-radius:12px;" /></div>
      <div style="display:flex;gap:12px;"><button id="btn-discard-rec" class="btn-pill" style="background:#FEE2E2;color:#B91C1C;">🗑️ 放棄重錄</button><button id="btn-confirm-save" class="btn-pill btn-save">✅ 確認保存</button></div>
    </div>
  </div>

  <div id="modal-manager" class="modal-backdrop hidden">
    <div class="modal-card" style="max-width:620px;max-height:85vh;display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h3 style="margin:0;">🗂️ 家庭錄音管理庫</h3><button id="btn-close-manager" class="btn-back" style="padding:6px 14px;">✖️ 關閉</button></div>
      <div id="manager-list" style="overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px;padding:4px;"></div>
    </div>
  </div>
  <script src="./i18n.js"></script>
  <script src="./parent_voice.js"></script>
  <script src="./app.js"></script>
</body>
</html>
