<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>快樂小讀者</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="view-list" class="view active">
    <header class="top-bar" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <h1 style="font-size:24px;">📚 快樂小讀者</h1>
      <div class="pref-bar" style="display:flex;gap:8px;flex-wrap:wrap;">
        <button id="btn-open-manager" class="btn-speed" style="border-color:#F43F5E;background:#FFF1F2;color:#BE123C;">🗂️ 父母錄音庫</button>
        <button id="btn-pref-voice" class="btn-speed">🗣️ 粵語</button>
        <button id="btn-pref-script" class="btn-speed">🔤 港澳繁體</button>
      </div>
    </header>
    <div id="story-grid" class="story-grid"></div>
  </main>

  <main id="view-reader" class="view">
    <header class="reader-header" style="flex-wrap:wrap;gap:8px;">
      <button id="btn-back" class="btn-back">⬅️ 返回</button>
      <h2 id="reader-title">載入中...</h2>
      <div class="header-right" style="flex-wrap:wrap;justify-content:flex-end;">
        <button id="btn-parent-rec" class="btn-speed" style="border-color:#F43F5E;background:#FFF1F2;color:#BE123C;">🎙️ 父母錄音</button>
        <button id="btn-parent-play" class="btn-speed" style="display:none;border-color:#F59E0B;background:#FEF3C7;color:#B45309;">👨‍👩‍👧 父母聲</button>
        <button id="btn-reader-voice" class="btn-speed" style="border-color:#8B5CF6;background:#F5F3FF;color:#5B21B6;">🗣️ 粵語</button>
        <button id="btn-reader-script" class="btn-speed" style="border-color:#EC4899;background:#FDF2F8;color:#9D174D;">🔤 港澳繁</button>
        <button id="btn-repeat" class="btn-speed" style="border-color:#10B981;background:#ECFDF5;color:#047857;">⏹️ 單篇</button>
        <button id="btn-mode" class="btn-speed" style="border-color:#38BDF8;background:#F0F9FF;color:#0369A1;">🎯 精讀</button>
        <button id="btn-speed" class="btn-speed">🐇 1.0x</button>
        <span id="wake-badge" class="badge" style="display:none;">☀️ 常亮</span>
      </div>
    </header>

    <!-- 錄音提示與即時聲波條（父母錄音與自己讀共用） -->
    <div id="parent-rec-banner" style="display:none;background:#FFF1F2;color:#9F1239;padding:10px 16px;text-align:center;font-size:18px;font-weight:bold;border-bottom:2px solid #FECDD3;position:sticky;top:64px;z-index:90;">
      <div id="rec-status-text">準備開始錄音...</div>
      <div style="display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;">
        <select id="mic-device-select" style="padding:6px 10px;border-radius:10px;border:1px solid #FDA4AF;font-size:14px;background:#fff;color:#881337;max-width:240px;">
          <option value="">🎙️ 預設麥克風</option>
        </select>
        <canvas id="mic-waveform" width="280" height="44" style="background:#fff;border-radius:12px;border:1px solid #FECDD3;"></canvas>
      </div>
    </div>

    <article id="story-content" class="story-content"></article>
    <section id="record-panel" class="record-panel hidden">
      <audio id="recorded-audio" controls playsinline></audio>
      <div class="record-actions">
        <button id="btn-loop" class="btn-pill">🔁 循環播放錄音</button>
        <a id="btn-download" class="btn-pill btn-save" download="我的朗讀.webm">💾 保存錄音</a>
      </div>
    </section>
    <footer class="control-dock">
      <button id="btn-play-tts" class="btn-big btn-tts"><span class="icon">🎧</span><span class="label">聽故事</span></button>
      <button id="btn-read-along" class="btn-big btn-mic"><span class="icon">🎤</span><span class="label">自己讀</span></button>
    </footer>
  </main>

  <div id="modal-preview" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3>🎧 試聽父母陪讀錄音</h3>
      <p style="color:#64748B;margin:6px 0 12px;">請先點擊播放試聽，確認清楚後再保存：</p>
      <audio id="preview-audio" controls playsinline style="width:100%;margin-bottom:14px;"></audio>
      <div style="margin-bottom:16px;text-align:left;">
        <label style="font-weight:bold;font-size:15px;display:block;margin-bottom:6px;">錄音標籤（方便區分爸爸/媽媽）：</label>
        <input id="preview-label-input" type="text" value="媽媽的聲音" style="width:100%;padding:10px 12px;font-size:16px;border:2px solid #CBD5E1;border-radius:12px;" />
      </div>
      <div style="display:flex;gap:12px;">
        <button id="btn-discard-rec" class="btn-pill" style="background:#FEE2E2;color:#B91C1C;">🗑️ 放棄重錄</button>
        <button id="btn-confirm-save" class="btn-pill btn-save">✅ 確認保存</button>
      </div>
    </div>
  </div>

  <div id="modal-manager" class="modal-backdrop hidden">
    <div class="modal-card" style="max-width:620px;max-height:85vh;display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin:0;">🗂️ 父母陪讀錄音管理</h3>
        <button id="btn-close-manager" class="btn-back" style="padding:6px 14px;">✖️ 關閉</button>
      </div>
      <div id="manager-list" style="overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px;padding:4px;"></div>
    </div>
  </div>

  <script src="./parent_voice.js"></script>
  <script src="./app.js"></script>
</body>
</html>
