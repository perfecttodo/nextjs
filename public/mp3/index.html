    <!-- ============================================================
         Core: DataSource Adapter Factory & Shared Helpers
         ============================================================ -->
    <script>
    (function () {
        'use strict';
        const ext = window.MP3AppExtension;
        if (!ext) { console.warn('[Adapter] MP3AppExtension 未就绪'); return; }

        /* ==================== 通用辅助 ==================== */

        ext.ensureSourceCategory = function (name) {
            if (!name) return;
            const cats = ext.categories;
            if (!cats.includes(name)) {
                cats.push(name);
                ext.saveCategories(cats);
            }
        };

        ext.removeSourceData = function ({ sourceKeys = [], categoryNames = [] } = {}) {
            if (sourceKeys.length) {
                ext.allFiles = ext.allFiles.filter(f => !sourceKeys.includes(f._source));
            }
            if (categoryNames.length) {
                const cats = ext.categories.filter(c => !categoryNames.includes(c));
                ext.categories = cats;
                ext.saveCategories(cats);
                if (categoryNames.includes(ext.currentCategory)) {
                    ext.currentCategory = '全部';
                }
            }
        };

        ext.stopIfPlayingFrom = function (sourceKeys) {
            const keys = [].concat(sourceKeys);
            const cur = ext.currentPlayingFile;
            if (!cur) return false;
            const file = ext.allFiles.find(f => ext.getFileKey(f) === cur);
            if (!file || !keys.includes(file._source)) return false;

            const ap = ext.audioPlayer;
            ap.pause();
            ap.removeAttribute('src');
            try { ap.load(); } catch (e) {}
            ext.currentPlayingFile = null;

            const t = document.getElementById('currentSongTitle');
            const c = document.getElementById('currentSongCategory');
            if (t) t.innerText = '尚未選擇播放歌曲';
            if (c) c.innerText = '就緒';
            if (typeof window.MP3SetPlayerSourceBadge === 'function') window.MP3SetPlayerSourceBadge(null);
            ext.updatePlayButton();
            ext.updatePlayerLikeState();
            ext.updatePlayerDislikeState();
            ext.resetMediaSession();
            return true;
        };

        ext.decorateFiles = function (rawList, opts) {
            const { getKey, sourceKey = '' } = opts || {};
            const keyFn = typeof getKey === 'function' ? getKey : (f) => ext.getFileKey(f);
            const likedMap = ext.getLikedMap();
            const dislikedMap = ext.getDislikedMap();
            const tagsMap = ext.getTagsMap();
            let lk = false, dk = false, tk = false;

            const out = (rawList || []).map(raw => {
                const key = keyFn(raw);
                const fallbackKey = raw.relativePath || raw.filename || '';

                let rawLike = likedMap[key];
                if (!rawLike && fallbackKey && likedMap[fallbackKey]) {
                    rawLike = likedMap[fallbackKey];
                    likedMap[key] = rawLike;
                    lk = true;
                }
                let rawDislike = dislikedMap[key];
                if (!rawDislike && fallbackKey && dislikedMap[fallbackKey]) {
                    rawDislike = dislikedMap[fallbackKey];
                    dislikedMap[key] = rawDislike;
                    dk = true;
                }
                let tags = tagsMap[key];
                if (!tags && fallbackKey && tagsMap[fallbackKey]) {
                    tags = tagsMap[fallbackKey];
                    tagsMap[key] = tags;
                    tk = true;
                }

                return Object.assign({}, raw, {
                    _key: key,
                    _source: sourceKey || raw._source,
                    isLiked: !!rawLike,
                    likedAt: ext.parseLikedAt(rawLike),
                    isDisliked: !!rawDislike,
                    tags: tags || []
                });
            });

            if (lk) ext.saveLikedMap(likedMap);
            if (dk) ext.saveDislikedMap(dislikedMap);
            if (tk) ext.saveTagsMap(tagsMap);
            return out;
        };

        /* ==================== HLS 播放器模块懒加载 ==================== */

        const HLS_PLAYER_SRC = 'hls-player.js';
        let hlsPlayerLoadingPromise = null;

        function ensureHlsPlayerModule() {
            if (window.MP3HlsPlayer) return Promise.resolve(window.MP3HlsPlayer);
            if (hlsPlayerLoadingPromise) return hlsPlayerLoadingPromise;

            hlsPlayerLoadingPromise = new Promise((resolve, reject) => {
                const existing = document.querySelector('script[data-mp3-hls-player]');
                if (existing) {
                    if (window.MP3HlsPlayer) { resolve(window.MP3HlsPlayer); return; }
                    existing.addEventListener('load', () => {
                        if (window.MP3HlsPlayer) resolve(window.MP3HlsPlayer);
                        else reject(new Error('hls-player 模块加载后未注册 API'));
                    });
                    existing.addEventListener('error', () => reject(new Error('hls-player 模块加载失败')));
                    return;
                }
                const s = document.createElement('script');
                s.src = HLS_PLAYER_SRC;
                s.dataset.mp3HlsPlayer = '1';
                s.onload = () => {
                    if (window.MP3HlsPlayer) resolve(window.MP3HlsPlayer);
                    else reject(new Error('hls-player 模块加载后未注册 API'));
                };
                s.onerror = () => reject(new Error('hls-player 模块加载失败（路径：' + HLS_PLAYER_SRC + '）'));
                document.head.appendChild(s);
            }).catch(e => {
                hlsPlayerLoadingPromise = null;
                throw e;
            });

            return hlsPlayerLoadingPromise;
        }

        /* ==================== 统一媒体装载 ==================== */

        ext.playMedia = async function (url, { type = 'auto', onStatus } = {}) {
            const ap = ext.audioPlayer;
            const isHls = type === 'hls' || (type === 'auto' && /\.m3u8(\?|$)/i.test(url));

            if (isHls) {
                onStatus?.('正在加载 HLS 播放器…');
                try {
                    await ensureHlsPlayerModule();
                } catch (e) {
                    onStatus?.('HLS 播放器加载失败：' + e.message, 'error');
                    throw new Error('HLS 播放器加载失败：' + e.message);
                }
                if (!window.MP3HlsPlayer) {
                    throw new Error('HLS 播放器模块未注册（hls-player.js 未正确加载）');
                }
                await window.MP3HlsPlayer.play(ap, url, { onStatus });
            } else {
                if (window.MP3HlsPlayer) {
                    try { window.MP3HlsPlayer.destroy(); } catch (e) {}
                }
                ap.removeAttribute('crossorigin');
                ap.src = url;
                await ap.play().catch(e => { throw new Error('播放失败：' + e.message); });
            }
        };

        ext.ensureHlsPlayerModule = ensureHlsPlayerModule;

        /* ==================== 核心：Source Adapter 工厂 ==================== */

        window.MP3RegisterSourceAdapter = function ({
            id,
            categoryName,
            list,
            resolveMedia,
            delete: del,
            onStatusChange,
            onPlaying,
            reset,
            onUnload,
        }) {
            if (!id || typeof list !== 'function' || typeof resolveMedia !== 'function') {
                throw new Error('registerSourceAdapter: id/list/resolveMedia 必填');
            }
            window.MP3DataSourceHandlers = window.MP3DataSourceHandlers || {};

            async function refreshList() {
                const res = await list({ page: 1, pageSize: 999999 });
                const decorated = ext.decorateFiles(res.files || [], {
                    getKey: (f) => ext.getFileKey(f),
                    sourceKey: id
                });
                ext.allFiles = ext.allFiles.filter(f => f._source !== id).concat(decorated);
                ext.ensureSourceCategory(categoryName);
                ext.renderAll();
                return { files: decorated, total: decorated.length, totalPages: 1 };
            }

            window.MP3DataSourceHandlers[id] = {
                reset() {
                    try { reset?.(); } catch (e) { console.warn(`[${id}] reset 失败:`, e); }
                },
                async play(file) {
                    try {
                        const media = await resolveMedia(file);
                        if (!media) throw new Error('resolveMedia 返回空');
                        if (typeof media.play === 'function') {
                            await media.play(ext.audioPlayer);
                        } else if (media.url) {
                            await ext.playMedia(media.url, {
                                type: media.type || 'auto',
                                onStatus: (msg, tone) => onStatusChange?.(msg, tone)
                            });
                        } else {
                            throw new Error('resolveMedia 返回格式不正确');
                        }
                        onPlaying?.(file);
                    } catch (e) {
                        onStatusChange?.('播放失败：' + e.message, 'error');
                        throw e;
                    }
                },
                async delete(file) {
                    if (!del) throw new Error('此來源不支援刪除');
                    await del(file);
                    const key = ext.getFileKey(file);
                    const wasPlaying = ext.currentPlayingFile === key;
                    ext.cleanupFileMetadata(key);
                    ext.allFiles = ext.allFiles.filter(f => ext.getFileKey(f) !== key);
                    if (wasPlaying) ext.stopIfPlayingFrom(id);
                    ext.renderAll();
                }
            };

            return {
                async refresh() { return refreshList(); },
                async unload() {
                    try { onUnload?.(); } catch (e) { console.warn(`[${id}] onUnload 异常:`, e); }
                    ext.stopIfPlayingFrom(id);
                    ext.removeSourceData({ sourceKeys: [id], categoryNames: [categoryName] });
                    ext.renderAll();
                    delete window.MP3DataSourceHandlers[id];
                }
            };
        };

        console.log('[Core] DataSource Adapter v1.2 ready（含 HLS 懒加载）');
    })();
    </script>

    <script>
        window.MP3SourceRegistry = window.MP3SourceRegistry || {
            local: { label: '本地', icon: 'fa-solid fa-hard-drive', badgeClass: 'bg-slate-800/80 text-slate-300 border-slate-600/60', dotClass: 'bg-slate-400' },
            gdrive: { label: 'Drive', icon: 'fa-brands fa-google-drive', badgeClass: 'bg-emerald-950/50 text-emerald-300 border-emerald-500/30', dotClass: 'bg-emerald-400' },
            news: { label: 'News', icon: 'fa-solid fa-newspaper', badgeClass: 'bg-amber-950/50 text-amber-300 border-amber-500/30', dotClass: 'bg-amber-400' }
        };

        window.MP3GetSourceMeta = function(file) {
            const key = (file && file._source) || 'local';
            const meta = window.MP3SourceRegistry[key];
            if (meta) return Object.assign({ key }, meta);
            return { key, label: key, icon: 'fa-solid fa-cloud', badgeClass: 'bg-indigo-950/50 text-indigo-300 border-indigo-500/30', dotClass: 'bg-indigo-400' };
        };

        window.MP3RenderSourceBadge = function(file) {
            const meta = window.MP3GetSourceMeta(file);
            return `<span class="source-badge inline-flex items-center gap-1 px-1.5 py-0.5 rounded border text-[10px] font-medium shrink-0 ${meta.badgeClass}" title="来源：${escapeHtmlAttr(meta.label)}">
                <i class="${meta.icon} text-[9px]"></i><span>${escapeHtmlAttr(meta.label)}</span>
            </span>`;
        };

        window.MP3SetPlayerSourceBadge = function(file) {
            const el = document.getElementById('currentSongSourceBadge');
            if (!el) return;
            if (!file) { el.classList.add('hidden'); return; }
            const meta = window.MP3GetSourceMeta(file);
            el.className = `inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded border text-[10px] font-medium shrink-0 ${meta.badgeClass}`;
            el.innerHTML = `<i class="${meta.icon} text-[9px]"></i>${escapeHtmlAttr(meta.label)}`;
            el.classList.remove('hidden');
        };

        window.currentSourceFilter = 'all';

        window.refreshSourceFilterOptions = function() {
            const sel = document.getElementById('sourceFilter');
            if (!sel) return;
            const files = (window.MP3AppExtension && window.MP3AppExtension.allFiles) || [];
            const present = new Set();
            if (files.length === 0) present.add('local');
            else files.forEach(f => present.add(f._source || 'local'));

            while (sel.options.length > 1) sel.remove(1);
            const orderedKeys = Object.keys(window.MP3SourceRegistry || {});
            const presentArr = [...present].sort((a, b) => {
                const ia = orderedKeys.indexOf(a);
                const ib = orderedKeys.indexOf(b);
                return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
            });
            presentArr.forEach(key => {
                const meta = window.MP3GetSourceMeta({ _source: key });
                const opt = document.createElement('option');
                opt.value = key; opt.textContent = meta.label;
                sel.appendChild(opt);
            });
            if (window.currentSourceFilter !== 'all' && !present.has(window.currentSourceFilter)) {
                window.currentSourceFilter = 'all';
                sel.value = 'all';
            } else sel.value = window.currentSourceFilter;
        };

        window.handleSourceFilterChange = function(value) {
            window.currentSourceFilter = value;
            window.MP3AppExtension.currentPage = 1;
            window.MP3AppExtension.renderTable();
        };
    </script>

    <script>
    (function() {
        'use strict';

        const REGISTRY = {
            local: {
                id: 'local', name: '本地目錄', description: '支援多個 API 端點與多個目錄',
                icon: 'fa-solid fa-folder-open', iconClass: 'text-slate-400',
                scriptSrc: 'local-plugin.js', globalVar: 'MP3LocalPlugin',
                autoEnable: true, dataSourceKeys: []
            },
            multiUser: {
                id: 'multiUser', name: '多用戶', description: '每個用戶獨立的 Like 記憶',
                icon: 'fa-solid fa-user-shield', iconClass: 'text-indigo-400',
                scriptSrc: 'multi-user-plugin.js', globalVar: 'MP3MultiUserPlugin',
                autoEnable: true, dataSourceKeys: []
            },
            copyFav: {
                id: 'copyFav', name: '複製我的最愛', description: '把「我的最愛」複製到指定本地目錄',
                icon: 'fa-solid fa-copy', iconClass: 'text-rose-400',
                scriptSrc: 'copy-favorites-plugin.js', globalVar: 'MP3CopyFavoritesPlugin',
                dataSourceKeys: []
            },
            news: {
                id: 'news', name: 'News 播放列表', description: '通過 /api/mp3/news 加載新聞音頻（m3u8）',
                icon: 'fa-solid fa-newspaper', iconClass: 'text-amber-400',
                scriptSrc: 'news-plugin.js', globalVar: 'MP3NewsPlugin',
                dataSourceKeys: ['news']
            },
            gdrive: {
                id: 'gdrive', name: 'Google Drive 音樂', description: '從 Drive 的 music/fav 加載音樂',
                icon: 'fa-brands fa-google-drive', iconClass: 'text-emerald-400',
                scriptSrc: 'google-drive-plugin.js', globalVar: 'MP3GoogleDrivePlugin',
                dataSourceKeys: ['gdrive']
            },
            videoPlayer: {
                id: 'videoPlayer',
                name: '视频渲染',
                description: '检测到视频轨道时显示悬浮小窗，支持全屏/画中画',
                icon: 'fa-solid fa-tv',
                iconClass: 'text-purple-400',
                scriptSrc: 'video-player-plugin.js',
                globalVar: 'MP3VideoPlayerPlugin',
                autoEnable: true,
                dataSourceKeys: []
            },
            filesystem: {
            id: 'filesystem',
            name: '本地檔案（瀏覽器）',
            description: '直接讀取本機目錄，無需 API（Chrome / Edge）',
            icon: 'fa-solid fa-folder-tree',
            iconClass: 'text-cyan-400',
            scriptSrc: 'filesystem-plugin.js',
            globalVar: 'MP3FileSystemPlugin',
            dataSourceKeys: ['filesystem']
        },
        };

        const STORAGE_KEY = 'mp3_enabled_dynamic_plugins';
        const enabled = new Set();
        const storedRaw = localStorage.getItem(STORAGE_KEY);

        if (storedRaw === null) {
            Object.values(REGISTRY).forEach(meta => { if (meta.autoEnable) enabled.add(meta.id); });
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...enabled])); } catch (e) {}
        } else {
            try {
                const parsed = JSON.parse(storedRaw);
                if (Array.isArray(parsed)) parsed.forEach(id => { if (REGISTRY[id]) enabled.add(id); });
            } catch (e) {}
        }

        const loadedPlugins = {};
        const loadingPlugins = {};
        const loadedScripts = new Set();
        let uiRoot = null;

        function persist() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...enabled])); } catch(e) {}
        }

        function withTimeout(promise, ms, msg) {
            return Promise.race([
                Promise.resolve(promise),
                new Promise((_, reject) =>
                    setTimeout(() => reject(new Error(msg || `操作超时（${ms}ms）`)), ms)
                )
            ]);
        }

        function getBodyContainer(id) {
            return uiRoot ? uiRoot.querySelector(`.plugin-body[data-plugin-id="${id}"]`) : null;
        }

        function cleanupDataSources(meta) {
            if (!window.MP3DataSourceHandlers) return;
            const keys = Array.isArray(meta.dataSourceKeys) ? meta.dataSourceKeys : [meta.id];
            keys.forEach(k => {
                try { delete window.MP3DataSourceHandlers[k]; } catch (e) {}
            });
        }

        async function rollbackPlugin(id, meta, plugin) {
            console.warn(`[PluginManager] 回滚插件 ${id}…`);
            if (plugin && typeof plugin.unload === 'function') {
                try { await withTimeout(plugin.unload(), 4000, 'unload 超时'); }
                catch (e) { console.warn(`[PluginManager] ${id}.unload 异常:`, e); }
            }
            const bodyEl = getBodyContainer(id);
            if (bodyEl) bodyEl.innerHTML = '';
            cleanupDataSources(meta);
            try { delete window[meta.globalVar]; } catch (e) {}
            const ext = window.MP3AppExtension;
            if (ext && Array.isArray(ext.allFiles)) {
                const sourceKeys = Array.isArray(meta.dataSourceKeys) ? meta.dataSourceKeys : [];
                if (sourceKeys.length > 0) {
                    try {
                        ext.allFiles = ext.allFiles.filter(f => !sourceKeys.includes(f._source));
                        if (typeof window.renderTable === 'function') window.renderTable();
                    } catch (e) { console.warn('[PluginManager] 清理 allFiles 失败:', e); }
                }
            }
            enabled.delete(id);
            persist();
        }

        function loadScriptOnce(src) {
            if (loadedScripts.has(src)) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.dataset.pluginSrc = src;
                s.onload = () => { loadedScripts.add(src); resolve(); };
                s.onerror = () => reject(new Error('无法加载插件脚本：' + src));
                document.head.appendChild(s);
            });
        }

        async function enablePlugin(id) {
            const meta = REGISTRY[id];
            if (!meta) throw new Error('未知插件：' + id);
            if (loadedPlugins[id]) return loadedPlugins[id];
            if (loadingPlugins[id]) return loadingPlugins[id];

            const task = (async () => {
                let plugin = null;
                try {
                    await withTimeout(loadScriptOnce(meta.scriptSrc), 10000, '加载脚本超时');
                    plugin = window[meta.globalVar];
                    if (!plugin) throw new Error(`插件未暴露全局变量：${meta.globalVar}`);
                    if (typeof plugin.init !== 'function') {
                        const v = plugin.version || '未知';
                        throw new Error(`插件版本 ${v} 缺少 init() 方法`);
                    }
                    await withTimeout(plugin.init(), 15000, 'init 超时');
                    loadedPlugins[id] = plugin;
                    enabled.add(id);
                    persist();
                    return plugin;
                } catch (err) {
                    console.error(`[PluginManager] 插件「${meta.name}」启用失败:`, err);
                    await rollbackPlugin(id, meta, plugin || window[meta.globalVar]);
                    throw err;
                }
            })();

            loadingPlugins[id] = task;
            try { return await task; }
            finally { delete loadingPlugins[id]; }
        }

        async function disablePlugin(id) {
            const meta = REGISTRY[id];
            const plugin = loadedPlugins[id];
            if (plugin && typeof plugin.unload === 'function') {
                try { await withTimeout(plugin.unload(), 5000, 'unload 超时'); }
                catch (e) { console.warn(`[PluginManager] ${id}.unload 异常（忽略并继续清理）:`, e); }
            }
            delete loadedPlugins[id];
            enabled.delete(id);
            persist();
            const bodyEl = getBodyContainer(id);
            if (bodyEl) bodyEl.innerHTML = '';
            cleanupDataSources(meta);
        }

        function injectUI() {
            const slot = document.getElementById('pluginSlot');
            if (!slot) { setTimeout(injectUI, 200); return; }
            if (uiRoot) return;

            uiRoot = document.createElement('div');
            uiRoot.id = 'pluginManagerCard';
            uiRoot.className = 'sidebar-card bg-slate-900/80 border border-slate-800 rounded-2xl shadow-xl overflow-hidden';
            uiRoot.dataset.collapseKey = 'plugins';

            const itemsHtml = Object.values(REGISTRY).map(meta => `
                <div class="plugin-item py-2 border-b border-slate-800/60 last:border-none">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <i class="${meta.icon} ${meta.iconClass || 'text-indigo-400'} text-sm shrink-0"></i>
                            <div class="min-w-0">
                                <div class="text-xs text-slate-200 font-medium truncate">${escapeHtmlAttr(meta.name)}</div>
                                <div class="text-[10px] text-slate-500 truncate plugin-desc">${escapeHtmlAttr(meta.description)}</div>
                            </div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer shrink-0">
                            <input type="checkbox" class="plugin-toggle sr-only peer" data-plugin-id="${meta.id}" ${enabled.has(meta.id) ? 'checked' : ''}>
                            <div class="w-9 h-5 bg-slate-700 rounded-full peer peer-checked:bg-indigo-600 transition"></div>
                            <span class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full transition peer-checked:translate-x-4"></span>
                        </label>
                    </div>
                    <div class="plugin-body mt-2" data-plugin-id="${meta.id}"></div>
                </div>
            `).join('');

            uiRoot.innerHTML = `
                <button type="button" class="sidebar-card-header w-full flex items-center justify-between gap-2 px-4 py-3 text-left" onclick="toggleSidebarCard('plugins')" aria-expanded="true">
                    <span class="flex items-center gap-2 min-w-0">
                        <i class="fa-solid fa-puzzle-piece text-indigo-400 text-xs"></i>
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider truncate">插件中心</span>
                    </span>
                    <span class="flex items-center gap-2 shrink-0">
                        <span class="text-[10px] text-slate-600">按需加載</span>
                        <i class="fa-solid fa-chevron-down sidebar-card-chevron text-slate-500 text-[10px]"></i>
                    </span>
                </button>
                <div class="sidebar-card-body">
                    <div class="inner px-4">
                        ${itemsHtml}
                    </div>
                </div>
            `;
            slot.appendChild(uiRoot);

            if (typeof window.MP3SetupSidebarCards === 'function') {
                try { window.MP3SetupSidebarCards(); } catch (e) {}
            }

            uiRoot.querySelectorAll('.plugin-toggle').forEach(toggle => {
                toggle.addEventListener('change', async (e) => {
                    const id = e.target.dataset.pluginId;
                    const on = e.target.checked;
                    const meta = REGISTRY[id];
                    const itemEl = e.target.closest('.plugin-item');
                    const descEl = itemEl ? itemEl.querySelector('.plugin-desc') : null;
                    const origDesc = meta.description;

                    try {
                        if (on) await enablePlugin(id);
                        else await disablePlugin(id);
                        if (descEl) descEl.textContent = origDesc;
                    } catch (err) {
                        e.target.checked = !on;
                        if (descEl) {
                            descEl.textContent = '⚠️ ' + (err.message || '启用失败');
                            descEl.classList.add('text-rose-400');
                            setTimeout(() => {
                                descEl.textContent = origDesc;
                                descEl.classList.remove('text-rose-400');
                            }, 5000);
                        }
                    }

                    try {
                        if (typeof window.refreshSourceFilterOptions === 'function') window.refreshSourceFilterOptions();
                        if (typeof window.renderTable === 'function') window.renderTable();
                    } catch (e) { console.warn('[PluginManager] 刷新失败:', e); }
                });
            });
        }

        async function restoreAll() {
            const order = Object.keys(REGISTRY).sort((a, b) => {
                const rank = id => id === 'multiUser' ? 0 : id === 'local' ? 1 : 2;
                return rank(a) - rank(b);
            });
            if (enabled.has('multiUser')) {
                try { await enablePlugin('multiUser'); }
                catch (e) { console.error('[PluginManager] multiUser 恢复失败:', e); }
            }
            const rest = order.filter(id => id !== 'multiUser' && enabled.has(id));
            const results = await Promise.allSettled(rest.map(id => enablePlugin(id)));
            results.forEach((r, i) => {
                if (r.status === 'rejected') {
                    console.error(`[PluginManager] ${rest[i]} 恢复失败:`, r.reason);
                }
            });
            persist();
        }

        window.MP3PluginManager = {
            REGISTRY,
            enable: enablePlugin,
            disable: disablePlugin,
            isEnabled: (id) => enabled.has(id),
            isLoaded: (id) => !!loadedPlugins[id],
            getBodyContainer
        };

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(async () => {
                injectUI();
                await restoreAll();
                if (typeof window.refreshSourceFilterOptions === 'function') {
                    try { window.refreshSourceFilterOptions(); } catch (e) {}
                }
            }, 400);
        });
    })();
    </script>
