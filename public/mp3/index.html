        function filterCategory(cat) {
            currentCategory = cat;
            currentTagFilter = null;
            currentPage = 1;
            pendingScrollToCurrentSong = false;
            updateUrlParams();
            renderCategories();
            renderTagCloud();
            renderTable();
        }

        function renderTagCloud() {
            const container = document.getElementById('tagCloudContainer');
            const tagsMap = getTagsMap();
            const tagCounts = {};

            Object.values(tagsMap).forEach(tags => {
                tags.forEach(tag => { tagCounts[tag] = (tagCounts[tag] || 0) + 1; });
            });

            const uniqueTags = Object.keys(tagCounts);
            if (uniqueTags.length === 0) {
                container.innerHTML = `<span class="text-[11px] text-slate-500 px-1">尚無任何標籤</span>`;
                return;
            }

            let html = `<span onclick="filterByTag(null)" class="cursor-pointer px-2 py-1 rounded-lg text-[11px] transition ${!currentTagFilter ? 'bg-indigo-600 text-white font-medium' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}">全部標籤</span>`;
            uniqueTags.forEach(tag => {
                const isActive = (currentTagFilter === tag);
                html += `<span onclick="filterByTag('${tag}')" class="cursor-pointer px-2 py-1 rounded-lg text-[11px] transition flex items-center space-x-1 ${isActive ? 'bg-indigo-600 text-white font-medium' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}"><span>#${tag}</span><span class="text-[9px] opacity-70">(${tagCounts[tag]})</span></span>`;
            });
            container.innerHTML = html;
        }

        function filterByTag(tag) {
            currentTagFilter = tag;
            currentPage = 1;
            pendingScrollToCurrentSong = false;
            renderCategories();
            renderTagCloud();
            renderTable();
        }

        async function editSongTags(encodedKey, encodedName) {
            const fileKey = decodeURIComponent(encodedKey);
            const displayName = decodeURIComponent(encodedName);
            const tagsMap = getTagsMap();
            const currentTags = tagsMap[fileKey] || [];
            const inputTags = await showCustomModal({
                title: '管理歌曲標籤',
                subtitle: displayName,
                message: '請輸入標籤（多個標籤請用半形逗號 , 隔開）：',
                type: 'confirm',
                isPrompt: true,
                defaultValue: currentTags.join(', '),
                confirmText: '儲存標籤'
            });

            if (inputTags === null) return;
            const newTags = inputTags.split(',').map(t => t.trim()).filter(t => t.length > 0);
            if (newTags.length > 0) tagsMap[fileKey] = [...new Set(newTags)];
            else delete tagsMap[fileKey];

            saveTagsMap(tagsMap);
            loadFiles(false);
        }

        function manageTagsPrompt() {
            showCustomModal({ title: '標籤管理提示', message: '點擊每首歌右側的「+標籤」按鈕可為該曲目新增或修改標籤，點擊左側標籤即可過濾歌曲。', type: 'info' });
        }

        // ==================== 過濾邏輯 ====================
        function getFilteredFiles() {
            const keyword = (document.getElementById('searchInput').value || '').toLowerCase();
            return allFiles.filter(f => {
                const key = f.relativePath || f.filename;

                // 搜尋
                const matchKey = (f.displayName || f.filename).toLowerCase().includes(keyword) || 
                                 key.toLowerCase().includes(keyword);

                // 標籤過濾
                const matchTag = !currentTagFilter || (f.tags && f.tags.includes(currentTagFilter));

                // Dislike 分類：只顯示被隱藏的
                if (currentCategory === 'Dislike') {
                    return f.isDisliked && matchKey && matchTag;
                }

                // 其他分類：排除被隱藏的
                if (f.isDisliked) return false;

                if (currentCategory === '我的最愛') {
                    return f.isLiked && matchKey && matchTag;
                }
                if (currentCategory !== '全部') {
                    return f.category === currentCategory && matchKey && matchTag;
                }
                return matchKey && matchTag;
            });
        }

        // ==================== Like / Dislike ====================
        function toggleLike(encodedKey, event) {
            if (event) event.stopPropagation();
            const fileKey = decodeURIComponent(encodedKey);
            const file = allFiles.find(f => (f.relativePath || f.filename) === fileKey);
            if (!file) return;

            file.isLiked = !file.isLiked;

            // 若原本被隱藏，取消隱藏
            if (file.isLiked && file.isDisliked) {
                file.isDisliked = false;
                const dislikedMap = getDislikedMap();
                delete dislikedMap[fileKey];
                saveDislikedMap(dislikedMap);
            }

            const likedMap = getLikedMap();
            if (file.isLiked) likedMap[fileKey] = true; else delete likedMap[fileKey];
            saveLikedMap(likedMap);

            if (currentPlayingFile === fileKey) {
                updatePlayerLikeState();
                updatePlayerDislikeState();
            }

            renderCategories();
            renderTable();

            if (isAutoMode && currentPlayingFile === fileKey && file.isLiked) {
                clearAutoTimer();
                const timerText = document.getElementById('autoTimerText');
                timerText.classList.remove('hidden');
                timerText.innerText = '[已Like，3秒後換歌...]';
                autoTimer = setTimeout(() => { if (isAutoMode) playNext(); }, 3000);
            }
        }

        function toggleFileDislike(encodedKey) {
            const fileKey = decodeURIComponent(encodedKey);
            const file = allFiles.find(f => (f.relativePath || f.filename) === fileKey);
            if (!file) return;

            file.isDisliked = !file.isDisliked;
            const dislikedMap = getDislikedMap();

            if (file.isDisliked) {
                dislikedMap[fileKey] = true;
                // 取消最愛
                if (file.isLiked) {
                    file.isLiked = false;
                    const likedMap = getLikedMap();
                    delete likedMap[fileKey];
                    saveLikedMap(likedMap);
                }
            } else {
                delete dislikedMap[fileKey];
            }
            saveDislikedMap(dislikedMap);

            if (currentPlayingFile === fileKey) {
                updatePlayerLikeState();
                updatePlayerDislikeState();
                // 若正在播放且被隱藏，跳下一首
                if (file.isDisliked && !audioPlayer.paused) {
                    playNext();
                }
            }

            renderCategories();
            renderTable();
        }

        function togglePlayerLike() {
            if (!currentPlayingFile) return;
            toggleLike(encodeURIComponent(currentPlayingFile));
        }

        function togglePlayerDislike() {
            if (!currentPlayingFile) return;
            toggleFileDislike(encodeURIComponent(currentPlayingFile));
        }

        function updatePlayerLikeState() {
            const btn = document.getElementById('playerLikeBtn');
            const icon = document.getElementById('playerLikeIcon');
            if (!currentPlayingFile) { btn.classList.add('hidden'); return; }
            btn.classList.remove('hidden');
            const file = allFiles.find(f => (f.relativePath || f.filename) === currentPlayingFile);
            if (file && file.isLiked) {
                icon.className = 'fa-solid fa-heart text-rose-500';
                btn.title = '取消最愛 (快捷鍵: L)';
            } else {
                icon.className = 'fa-regular fa-heart text-slate-500 hover:text-slate-300';
                btn.title = '加入最愛 (快捷鍵: L)';
            }
        }

        function updatePlayerDislikeState() {
            const btn = document.getElementById('playerDislikeBtn');
            const icon = document.getElementById('playerDislikeIcon');
            if (!currentPlayingFile) { btn.classList.add('hidden'); return; }
            btn.classList.remove('hidden');
            const file = allFiles.find(f => (f.relativePath || f.filename) === currentPlayingFile);
            if (file && file.isDisliked) {
                icon.className = 'fa-solid fa-thumbs-down text-amber-400';
                btn.title = '取消隱藏';
            } else {
                icon.className = 'fa-regular fa-thumbs-down text-slate-500 hover:text-amber-400';
                btn.title = '隱藏此歌曲';
            }
        }

        // ==================== 播放控制 ====================
        function togglePlayMode() {
            const modes = ['loop', 'shuffle', 'single', 'sequence'];
            let currentIdx = modes.indexOf(playMode);
            if (currentIdx === -1) currentIdx = 0;
            playMode = modes[(currentIdx + 1) % modes.length];

            localStorage.setItem('mp3_last_play_mode', playMode);

            const btn = document.getElementById('playModeBtn');
            const modeText = document.getElementById('modeText');
            btn.innerHTML = modeIconsSVG[playMode];
            modeText.innerText = modeNames[playMode];
            btn.title = `播放模式: ${modeNames[playMode]}`;
        }

        function toggleAutoMode() {
            isAutoMode = !isAutoMode;
            localStorage.setItem('mp3_last_auto_mode', isAutoMode);
            const btn = document.getElementById('autoModeBtn');
            if (isAutoMode) {
                btn.className = 'text-xs px-2.5 py-1 rounded-lg border border-amber-500/50 bg-amber-500/20 text-amber-400 transition flex items-center space-x-1 shadow-md';
                if (currentPlayingFile && !audioPlayer.paused) startAutoTimer(10);
            } else {
                btn.className = 'text-xs px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-400 transition flex items-center space-x-1';
                clearAutoTimer();
            }
        }

        function changeVolume(val) {
            audioPlayer.volume = val;
            localStorage.setItem('mp3_last_volume', val);
        }

        function startAutoTimer(seconds) {
            clearAutoTimer();
            if (!isAutoMode) return;
            remainingSeconds = seconds;
            updateTimerDisplay(remainingSeconds);

            autoCountdownInterval = setInterval(() => {
                remainingSeconds--;
                if (remainingSeconds > 0) updateTimerDisplay(remainingSeconds);
                else { updateTimerDisplay(0); clearInterval(autoCountdownInterval); }
            }, 1000);

            autoTimer = setTimeout(() => { if (isAutoMode) playNext(); }, seconds * 1000);
        }

        function clearAutoTimer() {
            if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
            if (autoCountdownInterval) { clearInterval(autoCountdownInterval); autoCountdownInterval = null; }
            const timerText = document.getElementById('autoTimerText');
            timerText.classList.add('hidden');
            timerText.innerText = '';
        }

        function updateTimerDisplay(sec) {
            const timerText = document.getElementById('autoTimerText');
            if (!isAutoMode) { timerText.classList.add('hidden'); return; }
            timerText.classList.remove('hidden');
            timerText.innerText = `[自動換歌: ${sec}s]`;
        }

        // 核心播放函式：自動跳到目標頁 + 渲染後滾動定位
        function playSong(encodedKey, encodedName) {
            const fileKey = decodeURIComponent(encodedKey);
            const displayName = encodedName ? decodeURIComponent(encodedName) : fileKey;
            const dir = document.getElementById('dirInput').value.trim();
            const streamUrl = `/api/mp3?dir=${encodeURIComponent(dir)}&action=stream&filename=${encodeURIComponent(fileKey)}`;

            // 先將分頁同步到目標歌曲所在頁
            syncPageToFile(fileKey);

            if (currentPlayingFile !== fileKey) {
                currentPlayingFile = fileKey;
                pendingScrollToCurrentSong = true;
                audioPlayer.src = streamUrl;
                audioPlayer.play();
                document.getElementById('currentSongTitle').innerText = displayName;
                const fileObj = allFiles.find(f => (f.relativePath || f.filename) === fileKey);
                document.getElementById('currentSongCategory').innerText = fileObj ? fileObj.category : '';
                
                updateMediaSessionMetadata(displayName);

                localStorage.setItem('mp3_last_played_key', fileKey);
                localStorage.setItem('mp3_last_played_title', displayName);
            } else {
                if (audioPlayer.paused) audioPlayer.play(); else audioPlayer.pause();
            }

            updatePlayerLikeState();
            updatePlayerDislikeState();
            renderTable();
            updatePlayButton();

            if (isAutoMode && !audioPlayer.paused) startAutoTimer(10);
            else clearAutoTimer();
        }

        function playPrev() {
            const list = getFilteredFiles();
            if (list.length === 0) return;
            const currentIndex = list.findIndex(f => (f.relativePath || f.filename) === currentPlayingFile);
            let prevIndex = currentIndex - 1;
            if (prevIndex < 0) prevIndex = list.length - 1;
            const target = list[prevIndex];
            playSong(encodeURIComponent(target.relativePath || target.filename), encodeURIComponent(target.displayName || ''));
        }

        function playNext() {
            clearAutoTimer();
            const list = getFilteredFiles();
            if (list.length === 0) return;

            if (playMode === 'shuffle') {
                let randomIndex = Math.floor(Math.random() * list.length);
                if (list.length > 1 && (list[randomIndex].relativePath || list[randomIndex].filename) === currentPlayingFile) {
                    randomIndex = (randomIndex + 1) % list.length;
                }
                const target = list[randomIndex];
                playSong(encodeURIComponent(target.relativePath || target.filename), encodeURIComponent(target.displayName || ''));
                return;
            }

            const currentIndex = list.findIndex(f => (f.relativePath || f.filename) === currentPlayingFile);
            let nextIndex = currentIndex + 1;
            if (nextIndex >= list.length) {
                if (playMode === 'sequence') {
                    audioPlayer.pause();
                    currentPlayingFile = null;
                    updatePlayerLikeState();
                    updatePlayerDislikeState();
                    renderTable();
                    updatePlayButton();
                    return;
                }
                nextIndex = 0;
            }
            const target = list[nextIndex];
            playSong(encodeURIComponent(target.relativePath || target.filename), encodeURIComponent(target.displayName || ''));
        }

        function onAudioEnded() {
            if (playMode === 'single') { 
                audioPlayer.currentTime = 0; 
                audioPlayer.play(); 
                return; 
            }
            playNext();
        }

        function onAudioError() {
            const titleEl = document.getElementById('currentSongTitle');
            if (titleEl) titleEl.innerText = "⚠️ 檔案損毀或無法播放，自動跳過...";
            setTimeout(() => playNext(), 1000);
        }

        function togglePlay() {
            if (!audioPlayer.src) {
                const list = getFilteredFiles();
                if (list.length > 0) playSong(encodeURIComponent(list[0].relativePath || list[0].filename), encodeURIComponent(list[0].displayName || ''));
                return;
            }
            if (audioPlayer.paused) { 
                audioPlayer.play(); 
                if (isAutoMode) startAutoTimer(10); 
            } else { 
                audioPlayer.pause(); 
                clearAutoTimer(); 
            }
            updatePlayButton();
            renderTable();
        }

        function updatePlayButton() {
            const btn = document.getElementById('playPauseBtn');
            btn.innerHTML = audioPlayer.paused ? '<i class="fa-solid fa-play text-xs"></i>' : '<i class="fa-solid fa-pause text-xs"></i>';

            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = audioPlayer.paused ? 'paused' : 'playing';
            }
        }

        function updateProgress() {
            if (isNaN(audioPlayer.duration)) return;
            document.getElementById('progressBar').value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            document.getElementById('currentTime').innerText = formatTime(audioPlayer.currentTime);
            document.getElementById('durationTime').innerText = formatTime(audioPlayer.duration);

            if (currentPlayingFile && !audioPlayer.paused) {
                sessionStorage.setItem('mp3_last_played_time', audioPlayer.currentTime);
            }
        }

        function seekAudio(val) {
            if (!isNaN(audioPlayer.duration)) {
                audioPlayer.currentTime = (val / 100) * audioPlayer.duration;
                sessionStorage.setItem('mp3_last_played_time', audioPlayer.currentTime);
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // ==================== 分類 / 刪除 / 複製 ====================
        async function changeCategory(encodedKey, newCategory) {
            const fileKey = decodeURIComponent(encodedKey);
            const dir = document.getElementById('dirInput').value.trim();
            const res = await fetch('/api/mp3', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dir, filename: fileKey, newCategory })
            });
            const data = await res.json();
            if (data.success) loadFiles(false);
            else showCustomModal({ title: '修改失敗', message: data.error, type: 'error' });
        }

        async function deleteSong(encodedKey) {
            const fileKey = decodeURIComponent(encodedKey);
            const confirmed = await showCustomModal({
                title: '刪除檔案確認',
                subtitle: '此操作無法復原',
                message: '確定要從硬碟中刪除這個 MP3 檔案嗎？',
                type: 'danger',
                confirmText: '確認刪除'
            });

            if (!confirmed) return;
            const dir = document.getElementById('dirInput').value.trim();
            const res = await fetch(`/api/mp3?dir=${encodeURIComponent(dir)}&filename=${encodeURIComponent(fileKey)}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                if (currentPlayingFile === fileKey) {
                    audioPlayer.pause();
                    currentPlayingFile = null;
                    localStorage.removeItem('mp3_last_played_key');
                    sessionStorage.removeItem('mp3_last_played_time');
                    updatePlayerLikeState();
                    updatePlayerDislikeState();
                    clearAutoTimer();
                }
                loadFiles(false);
            } else {
                showCustomModal({ title: '刪除失敗', message: data.error, type: 'error' });
            }
        }

        async function copyFavoriteSongs() {
            const likedMap = getLikedMap();
            const likedKeys = Object.keys(likedMap);
            if (likedKeys.length === 0) {
                showCustomModal({ title: '提示', message: '目前沒有任何「我的最愛」歌曲可供複製！', type: 'info' });
                return;
            }

            const savedTargetDir = localStorage.getItem('mp3_copy_target_dir') || '';
            const targetDir = await showCustomModal({
                title: '複製我的最愛',
                subtitle: `共選定 ${likedKeys.length} 首收藏歌曲`,
                message: '請輸入要複製過去的目標資料夾絕對路徑：',
                type: 'confirm',
                isPrompt: true,
                defaultValue: savedTargetDir,
                confirmText: '開始複製'
            });

            if (!targetDir || !targetDir.trim()) return;
            const trimmedTargetDir = targetDir.trim();
            localStorage.setItem('mp3_copy_target_dir', trimmedTargetDir);
            const currentSourceDir = document.getElementById('dirInput').value.trim();

            const res = await fetch('/api/mp3/copy-favorites', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sourceDir: currentSourceDir, targetDir: trimmedTargetDir, filenames: likedKeys })
            });
            const data = await res.json();
            if (data.success) {
                showCustomModal({ title: '複製完成', message: `已成功將最愛歌曲複製。\n成功：${data.successCount} 首`, type: 'success' });
            } else {
                showCustomModal({ title: '複製失敗', message: data.error, type: 'error' });
            }
        }

        // ==================== 分頁 / 渲染 ====================
        function handleSearch() { currentPage = 1; pendingScrollToCurrentSong = false; updateUrlParams(); renderTable(); }
        function goToPage(p) { currentPage = p; pendingScrollToCurrentSong = false; updateUrlParams(); renderTable(); }
        function changePageSize(sz) { 
            pageSize = parseInt(sz); 
            currentPage = 1; 
            pendingScrollToCurrentSong = false;
            updateUrlParams(); 
            renderTable(); 
        }

        function renderTable() {
            const tbody = document.getElementById('fileTableBody');
            let filtered = getFilteredFiles();
            document.getElementById('fileCountText').innerText = `共 ${filtered.length} 首`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-12 text-slate-500"><i class="fa-solid fa-music text-3xl mb-2 block"></i>沒有找到符合的 MP3 檔案</td></tr>`;
                document.getElementById('paginationContainer').innerHTML = '';
                document.getElementById('topPageIndicator').innerText = `1 / 1`;
                document.getElementById('topPrevBtn').disabled = true;
                document.getElementById('topNextBtn').disabled = true;
                pendingScrollToCurrentSong = false;
                return;
            }

            const totalPages = Math.ceil(filtered.length / pageSize);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIdx = (currentPage - 1) * pageSize;
            const pageItems = filtered.slice(startIdx, startIdx + pageSize);

            let html = '';
            pageItems.forEach(file => {
                const fileKey = file.relativePath || file.filename;
                const isPlaying = currentPlayingFile === fileKey;
                const sizeMb = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
                const catOptions = categories.map(c => `<option value="${c}" ${c === file.category ? 'selected' : ''}>${c}</option>`).join('');
                const tagsHtml = (file.tags || []).map(t => `<span class="bg-indigo-950 text-indigo-300 border border-indigo-500/30 px-1.5 py-0.5 rounded text-[10px]">#${t}</span>`).join(' ');

                // 統一使用 encodeURIComponent 傳參，避免單引號 / 反斜線轉義問題
                const encodedKey = encodeURIComponent(fileKey);
                const encodedName = encodeURIComponent(file.displayName || file.filename);
                const rowId = `row-${encodedKey.replace(/[%._-]/g, '_')}`;

                html += `
                    <tr id="${rowId}" class="transition ${isPlaying ? 'bg-indigo-950/30 border-l-4 border-indigo-500' : 'hover:bg-slate-900/50'}">
                        <td class="py-3 px-4 md:px-6" colspan="4">
                            <div class="flex flex-col md:flex-row md:items-center gap-3">
                                <!-- 歌名 + 播放 + Like -->
                                <div class="flex items-center space-x-3 flex-1 min-w-0">
                                    <button onclick="playSong('${encodedKey}', '${encodedName}')" class="w-9 h-9 rounded-lg ${isPlaying ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-indigo-400 hover:bg-indigo-600 hover:text-white'} flex items-center justify-center transition shadow flex-shrink-0">
                                        <i class="fa-solid ${isPlaying && !audioPlayer.paused ? 'fa-pause' : 'fa-play'} text-xs"></i>
                                    </button>
                                    <div class="overflow-hidden flex-1 min-w-0">
                                        <div class="flex items-center space-x-2">
                                            <span class="font-medium text-slate-200 truncate" title="${file.displayName}">${file.displayName}</span>
                                            <button onclick="toggleLike('${encodedKey}', event)" class="text-xs transition ${file.isLiked ? 'text-rose-500 hover:text-rose-400' : 'text-slate-600 hover:text-slate-400'}" title="最愛">
                                                <i class="${file.isLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i>
                                            </button>
                                        </div>
                                        ${file.relativePath && file.relativePath !== file.filename ? `<div class="text-[11px] text-slate-500 truncate">${file.relativePath}</div>` : ''}
                                    </div>
                                </div>

                                <!-- 分類下拉 + 標籤（手機端底部） -->
                                <div class="flex flex-wrap items-center gap-2 md:w-44 md:flex-shrink-0 md:justify-end">
                                    <select onchange="changeCategory('${encodedKey}', this.value)" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2 py-1 text-slate-300 focus:outline-none focus:border-indigo-500">
                                        ${catOptions}
                                    </select>
                                    ${tagsHtml}
                                    <button onclick="editSongTags('${encodedKey}', '${encodedName}')" class="text-[10px] text-slate-500 hover:text-indigo-400 px-1 border border-dashed border-slate-700 rounded" title="編輯標籤">+標籤</button>
                                </div>

                                <!-- 大小 -->
                                <div class="hidden lg:block w-20 flex-shrink-0 text-xs text-slate-400 whitespace-nowrap">${sizeMb}</div>

                                <!-- 操作 -->
                                <div class="flex items-center justify-end gap-1 md:w-20 flex-shrink-0">
                                    <button onclick="toggleFileDislike('${encodedKey}')" class="p-1.5 rounded-lg transition ${file.isDisliked ? 'text-amber-400 hover:text-amber-300' : 'text-slate-500 hover:text-amber-400'}" title="${file.isDisliked ? '取消隱藏' : '隱藏此歌曲'}">
                                        <i class="${file.isDisliked ? 'fa-solid' : 'fa-regular'} fa-thumbs-down text-sm"></i>
                                    </button>
                                    <button onclick="deleteSong('${encodedKey}')" class="text-slate-500 hover:text-rose-400 p-1.5 transition" title="刪除檔案">
                                        <i class="fa-solid fa-trash-can text-sm"></i>
                                    </button>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            renderPagination(totalPages, filtered.length);

            // 主動切歌 / 恢復播放後，才滾動到目標歌曲
            if (pendingScrollToCurrentSong && currentPlayingFile) {
                const rowId = `row-${encodeURIComponent(currentPlayingFile).replace(/[%._-]/g, '_')}`;
                const targetRow = document.getElementById(rowId);
                if (targetRow) {
                    targetRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
                pendingScrollToCurrentSong = false;
            }
        }

        function renderPagination(totalPages, totalItems) {
            const container = document.getElementById('paginationContainer');
            
            document.getElementById('topPageIndicator').innerText = `${currentPage} / ${totalPages}`;
            document.getElementById('topPrevBtn').disabled = (currentPage <= 1);
            document.getElementById('topNextBtn').disabled = (currentPage >= totalPages);

            let html = `
                <span class="text-xs text-slate-400">顯示第 ${(currentPage - 1) * pageSize + 1} - ${Math.min(currentPage * pageSize, totalItems)} 筆，共 ${totalItems} 筆資料</span>
                <div class="flex items-center space-x-1.5">
                    <button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled class="px-2.5 py-1 bg-slate-900 text-slate-600 rounded-lg text-xs cursor-not-allowed"' : 'class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition"'}>首頁</button>
                    <button onclick="goToPage(currentPage - 1)" ${currentPage === 1 ? 'disabled class="px-2.5 py-1 bg-slate-900 text-slate-600 rounded-lg text-xs cursor-not-allowed"' : 'class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition"'}>上一頁</button>
                    <span class="text-xs text-indigo-400 font-mono px-2">${currentPage} / ${totalPages}</span>
                    <button onclick="goToPage(currentPage + 1)" ${currentPage >= totalPages ? 'disabled class="px-2.5 py-1 bg-slate-900 text-slate-600 rounded-lg text-xs cursor-not-allowed"' : 'class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition"'}>下一頁</button>
                    <button onclick="goToPage(${totalPages})" ${currentPage >= totalPages ? 'disabled class="px-2.5 py-1 bg-slate-900 text-slate-600 rounded-lg text-xs cursor-not-allowed"' : 'class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition"'}>末頁</button>
                </div>
            `;
            container.innerHTML = html;
        }

        // ==================== Modal ====================
        function showCustomModal({ title, subtitle = '系統通知', message, type = 'info', isPrompt = false, defaultValue = '', confirmText = '確定' }) {
            return new Promise((resolve) => {
                const modal = document.getElementById('customModal');
                const modalBox = document.getElementById('modalBox');
                const titleEl = document.getElementById('modalTitle');
                const subtitleEl = document.getElementById('modalSubtitle');
                const bodyEl = document.getElementById('modalBody');
                const confirmBtn = document.getElementById('modalConfirmBtn');
                const cancelBtn = document.getElementById('modalCancelBtn');
                const iconEl = document.getElementById('modalIcon');
                const iconContainer = document.getElementById('modalIconContainer');

                titleEl.innerText = title;
                subtitleEl.innerText = subtitle;
                confirmBtn.innerText = confirmText;

                let iconClass = 'fa-solid fa-circle-info';
                let iconBgClass = 'bg-indigo-500/20 text-indigo-400';
                let confirmBtnClass = 'bg-indigo-600 hover:bg-indigo-500 shadow-indigo-600/30';

                if (type === 'error' || type === 'danger') {
                    iconClass = 'fa-solid fa-triangle-exclamation';
                    iconBgClass = 'bg-rose-500/20 text-rose-400';
                    confirmBtnClass = 'bg-rose-600 hover:bg-rose-500 shadow-rose-600/30';
                } else if (type === 'success') {
                    iconClass = 'fa-solid fa-circle-check';
                    iconBgClass = 'bg-emerald-500/20 text-emerald-400';
                    confirmBtnClass = 'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-600/30';
                }

                iconEl.className = iconClass;
                iconContainer.className = `w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${iconBgClass}`;
                confirmBtn.className = `px-5 py-2 rounded-xl text-xs font-medium text-white transition shadow-lg ${confirmBtnClass}`;

                const needsCancel = (type === 'confirm' || type === 'danger' || isPrompt);
                cancelBtn.classList.toggle('hidden', !needsCancel);

                if (isPrompt) {
                    bodyEl.innerHTML = `<p class="mb-2 text-slate-300">${message}</p><input type="text" id="modalPromptInput" value="${defaultValue}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">`;
                } else {
                    bodyEl.innerHTML = `<p>${message.replace(/\n/g, '<br>')}</p>`;
                }

                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalBox.classList.remove('scale-95');
                    if (isPrompt) {
                        const inputEl = document.getElementById('modalPromptInput');
                        if (inputEl) { inputEl.focus(); inputEl.select(); }
                    }
                }, 10);

                const newConfirmBtn = confirmBtn.cloneNode(true);
                const newCancelBtn = cancelBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
                cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

                const closeModal = (result) => {
                    modal.classList.add('opacity-0');
                    modalBox.classList.add('scale-95');
                    setTimeout(() => { modal.classList.add('hidden'); resolve(result); }, 200);
                };

                newConfirmBtn.addEventListener('click', () => {
                    closeModal(isPrompt ? document.getElementById('modalPromptInput').value : true);
                });
                newCancelBtn.addEventListener('click', () => {
                    closeModal(isPrompt ? null : false);
                });
                if (isPrompt) {
                    document.getElementById('modalPromptInput').addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') newConfirmBtn.click();
                    });
                }
            });
        }
    </script>

    <!-- ==================== 多用戶外掛（內聯整合） ==================== -->
    <script>
    (function() {
        const STORAGE_KEYS = {
            USERS: 'mp3_plugin_users_list',
            CURRENT_USER: 'mp3_plugin_current_user',
            DEFAULT_USER_NAME: '預設用戶'
        };

        let usersList = ['預設用戶'];
        let currentUser = '預設用戶';

        function initPluginStorage() {
            const savedUsers = localStorage.getItem(STORAGE_KEYS.USERS);
            if (savedUsers) {
                try { usersList = JSON.parse(savedUsers); } catch(e) {}
            } else {
                localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(usersList));
            }

            const lastUser = localStorage.getItem(STORAGE_KEYS.CURRENT_USER);
            if (lastUser && usersList.includes(lastUser)) {
                currentUser = lastUser;
            } else {
                currentUser = usersList[0];
                localStorage.setItem(STORAGE_KEYS.CURRENT_USER, currentUser);
            }
        }

        function getStorageKeyForUser(username) {
            if (username === STORAGE_KEYS.DEFAULT_USER_NAME) {
                return 'mp3_liked_map';
            }
            return `mp3_${username}_liked_map`;
        }

        function getUserLikesMap(username) {
            const key = getStorageKeyForUser(username);
            try {
                return JSON.parse(localStorage.getItem(key) || '{}');
            } catch(e) { return {}; }
        }

        function saveUserLikesMap(username, map) {
            const key = getStorageKeyForUser(username);
            localStorage.setItem(key, JSON.stringify(map));
        }

        function injectUserUI() {
            const drawerContent = document.getElementById('sidebarContentWrapper');
            if (!drawerContent) return;

            const userSection = document.createElement('div');
            userSection.className = 'bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl';
            userSection.innerHTML = `
                <div class="flex items-center justify-between mb-2 px-1">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center">
                        <i class="fa-solid fa-user-shield text-indigo-400 mr-1.5"></i> 多用戶
                    </h2>
                    <button onclick="window.pluginOpenManageModal()" class="text-[11px] text-indigo-400 hover:underline"><i class="fa-solid fa-gear mr-1"></i>管理</button>
                </div>
                <div class="flex items-center space-x-2">
                    <select id="pluginUserSelect" onchange="window.pluginSwitchUser(this.value)" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-xl px-3 py-1.5 focus:outline-none focus:border-indigo-500 font-medium flex-1">
                        ${usersList.map(u => `<option value="${u}" ${u === currentUser ? 'selected' : ''}>${u}</option>`).join('')}
                    </select>
                    <button onclick="window.pluginPromptAddUser()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1.5 rounded-xl text-xs transition shadow" title="新增用戶">
                        <i class="fa-solid fa-user-plus"></i>
                    </button>
                </div>
            `;
            drawerContent.insertBefore(userSection, drawerContent.firstChild);
        }

        window.pluginSwitchUser = function(username) {
            currentUser = username;
            localStorage.setItem(STORAGE_KEYS.CURRENT_USER, username);
            if (typeof window.loadFiles === 'function') {
                window.loadFiles(false);
            }
        };

        window.pluginPromptAddUser = async function() {
            if (typeof window.showCustomModal === 'function') {
                const newName = await window.showCustomModal({
                    title: '登記新用戶',
                    message: '請輸入新用戶名稱（無需密碼）：',
                    type: 'confirm',
                    isPrompt: true,
                    defaultValue: '',
                    confirmText: '新增並切換'
                });

                if (!newName || !newName.trim()) return;
                const trimmed = newName.trim();

                if (trimmed === STORAGE_KEYS.DEFAULT_USER_NAME) {
                    alert('「預設用戶」為系統保留名稱！');
                    return;
                }

                if (!usersList.includes(trimmed)) {
                    usersList.push(trimmed);
                    localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(usersList));
                }
                
                refreshUserSelects();
                window.pluginSwitchUser(trimmed);
            }
        };

        function refreshUserSelects() {
            const selectEl = document.getElementById('pluginUserSelect');
            if (selectEl) {
                selectEl.innerHTML = usersList.map(u => `<option value="${u}" ${u === currentUser ? 'selected' : ''}>${u}</option>`).join('');
            }
        }

        window.pluginOpenManageModal = function() {
            let modal = document.getElementById('pluginUserManageModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'pluginUserManageModal';
                modal.className = 'fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center';
                document.body.appendChild(modal);
            }

            let usersHtml = usersList.map(u => {
                const userLikes = getUserLikesMap(u);
                const likeCount = Object.keys(userLikes).length;
                const isCurrent = u === currentUser;
                const isDefault = u === STORAGE_KEYS.DEFAULT_USER_NAME;

                return `
                    <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-3 rounded-xl">
                        <div>
                            <div class="font-semibold text-sm text-slate-200 flex items-center">
                                ${u} 
                                ${isCurrent ? '<span class="ml-2 text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded-full">當前</span>' : ''}
                                ${isDefault ? '<span class="ml-2 text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">系統預設</span>' : ''}
                            </div>
                            <div class="text-xs text-slate-400 mt-0.5">已收藏 ${likeCount} 首歌</div>
                        </div>
                        <div class="flex items-center space-x-1.5">
                            ${!isDefault ? `<button onclick="window.pluginRenameUser('${u}')" class="px-2.5 py-1 bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white rounded-lg text-xs transition">改名</button>` : ''}
                            <button onclick="window.pluginExportUser('${u}')" class="px-2.5 py-1 bg-slate-800 hover:bg-emerald-600 text-slate-300 hover:text-white rounded-lg text-xs transition">匯出</button>
                            <button onclick="window.pluginMergeUserPrompt('${u}')" class="px-2.5 py-1 bg-slate-800 hover:bg-amber-600 text-slate-300 hover:text-white rounded-lg text-xs transition">合併</button>
                            ${!isDefault && usersList.length > 1 ? `<button onclick="window.pluginDeleteUser('${u}')" class="px-2.5 py-1 bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white rounded-lg text-xs transition">刪除</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            modal.innerHTML = `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl flex flex-col max-h-[85dvh]">
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                        <h3 class="text-base font-bold text-slate-100 flex items-center">
                            <i class="fa-solid fa-users-gear text-indigo-400 mr-2"></i> 用戶管理中心
                        </h3>
                        <button onclick="document.getElementById('pluginUserManageModal').remove()" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    
                    <div class="space-y-3 overflow-y-auto flex-1 pr-1 mb-4">
                        ${usersHtml}
                    </div>

                    <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
                        <button onclick="window.pluginImportUserPrompt()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-xl transition">
                            <i class="fa-solid fa-file-import mr-1"></i> 匯入用戶資料
                        </button>
                        <button onclick="document.getElementById('pluginUserManageModal').remove()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-medium text-white rounded-xl transition">
                            關閉
                        </button>
                    </div>
                </div>
            `;
        };

        window.pluginRenameUser = async function(oldName) {
            if (oldName === STORAGE_KEYS.DEFAULT_USER_NAME) return;
            const newName = prompt(`請輸入「${oldName}」的新名稱：`, oldName);
            if (!newName || !newName.trim() || newName.trim() === oldName) return;
            const trimmed = newName.trim();

            if (trimmed === STORAGE_KEYS.DEFAULT_USER_NAME || usersList.includes(trimmed)) {
                alert('此用戶名稱無效或已存在！');
                return;
            }

            const oldKey = getStorageKeyForUser(oldName);
            const newKey = getStorageKeyForUser(trimmed);
            const data = localStorage.getItem(oldKey);
            if (data) {
                localStorage.setItem(newKey, data);
                localStorage.removeItem(oldKey);
            }

            usersList = usersList.map(u => u === oldName ? trimmed : u);
            localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(usersList));

            if (currentUser === oldName) {
                currentUser = trimmed;
                localStorage.setItem(STORAGE_KEYS.CURRENT_USER, currentUser);
            }

            refreshUserSelects();
            window.pluginOpenManageModal();
            if (typeof window.loadFiles === 'function') window.loadFiles(false);
        };

        window.pluginDeleteUser = async function(username) {
            if (username === STORAGE_KEYS.DEFAULT_USER_NAME) {
                alert('「預設用戶」不能被刪除！');
                return;
            }
            if (!confirm(`確定要刪除用戶「${username}」嗎？`)) return;

            usersList = usersList.filter(u => u !== username);
            localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(usersList));

            const key = getStorageKeyForUser(username);
            localStorage.removeItem(key);

            if (currentUser === username) {
                currentUser = STORAGE_KEYS.DEFAULT_USER_NAME;
                localStorage.setItem(STORAGE_KEYS.CURRENT_USER, currentUser);
            }

            refreshUserSelects();
            window.pluginOpenManageModal();
            if (typeof window.loadFiles === 'function') window.loadFiles(false);
        };

        window.pluginExportUser = function(username) {
            const likes = getUserLikesMap(username);
            const userData = { username, likes };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `mp3_user_${username}_liked_map.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        };

        window.pluginImportUserPrompt = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = event => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (!imported.username || !imported.likes) {
                            alert('匯入失敗：檔案格式不正確！');
                            return;
                        }

                        let targetUser = imported.username;
                        if (targetUser === STORAGE_KEYS.DEFAULT_USER_NAME || usersList.includes(targetUser)) {
                            targetUser = targetUser + '_import_' + Date.now().toString().slice(-4);
                        }

                        usersList.push(targetUser);
                        localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(usersList));
                        saveUserLikesMap(targetUser, imported.likes);

                        refreshUserSelects();
                        window.pluginOpenManageModal();
                        alert(`成功匯入用戶「${targetUser}」！`);
                        if (typeof window.loadFiles === 'function') window.loadFiles(false);
                    } catch(err) {
                        alert('解析 JSON 檔案失敗！');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        };

        window.pluginMergeUserPrompt = function(sourceUser) {
            const otherUsers = usersList.filter(u => u !== sourceUser);
            if (otherUsers.length === 0) {
                alert('沒有其他用戶可供合併！');
                return;
            }

            const targetUser = prompt(`請選擇要將「${sourceUser}」的 Like 記錄合併到哪一個用戶？\n現有其他用戶：${otherUsers.join(', ')}`);
            if (!targetUser || !otherUsers.includes(targetUser.trim())) {
                if (targetUser) alert('輸入的目標用戶不存在！');
                return;
            }

            const target = targetUser.trim();
            if (!confirm(`確定要將「${sourceUser}」的所有 Like 合併到「${target}」嗎？`)) return;

            const sourceLikes = getUserLikesMap(sourceUser);
            const targetLikes = getUserLikesMap(target);

            Object.keys(sourceLikes).forEach(songKey => {
                targetLikes[songKey] = true;
            });

            saveUserLikesMap(target, targetLikes);
            localStorage.removeItem(getStorageKeyForUser(sourceUser));

            usersList = usersList.filter(u => u !== sourceUser);
            localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(usersList));

            if (currentUser === sourceUser) {
                currentUser = target;
                localStorage.setItem(STORAGE_KEYS.CURRENT_USER, currentUser);
            }

            refreshUserSelects();
            window.pluginOpenManageModal();
            alert(`成功合併至 「${target}」！`);
            if (typeof window.loadFiles === 'function') window.loadFiles(false);
        };

        // 覆寫核心的讀寫函式，讓所有 Like 操作都指向當前用戶
        function overrideCoreFunctions() {
            window.getLikedMap = function() {
                return getUserLikesMap(currentUser);
            };

            window.saveLikedMap = function(map) {
                saveUserLikesMap(currentUser, map);
            };

            const originalRenderTable = window.renderTable;
            if (typeof originalRenderTable === 'function') {
                window.renderTable = function() {
                    originalRenderTable();
                    
                    if (window.allFiles && window.allFiles.length > 0) {
                        window.allFiles.forEach(file => {
                            const fileKey = file.relativePath || file.filename;
                            const rowId = `row-${encodeURIComponent(fileKey).replace(/[%._-]/g, '_')}`;
                            const row = document.getElementById(rowId);
                            if (row) {
                                const likedUsers = [];
                                usersList.forEach(u => {
                                    const map = getUserLikesMap(u);
                                    if (map && map[fileKey]) {
                                        likedUsers.push(u);
                                    }
                                });

                                if (likedUsers.length > 0) {
                                    const titleContainer = row.querySelector('.flex.items-center.space-x-2');
                                    if (titleContainer && !titleContainer.querySelector('.plugin-likes-badge')) {
                                        const badge = document.createElement('span');
                                        badge.className = 'plugin-likes-badge text-[10px] text-rose-400 bg-rose-950/40 border border-rose-500/30 px-1.5 py-0.5 rounded ml-2';
                                        badge.title = `按讚用戶: ${likedUsers.join(', ')}`;
                                        badge.innerHTML = `<i class="fa-solid fa-heart mr-1"></i>${likedUsers.length}`;
                                        titleContainer.appendChild(badge);
                                    }
                                }
                            }
                        });
                    }
                };
            }
        }

        // 同步執行覆寫，讓主腳本的 loadFiles fetch 回調能使用覆寫後的函式
        window.addEventListener('DOMContentLoaded', () => {
            initPluginStorage();
            injectUserUI();
            overrideCoreFunctions();
        });

    })();
    </script>
</body>
</html>
