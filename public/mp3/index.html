<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MP3 智慧管理與分類系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        * { scrollbar-width: thin; scrollbar-color: rgba(51, 65, 85, 0.6) transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.4); border-radius: 9999px; transition: background 0.2s ease; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.6); }
        footer.player-bar { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); }
        #mobileDrawer { transition: transform 0.3s ease-in-out; }
        #mobileDrawerToggle.is-open .fa-bars::before { content: "\f00d"; }
        .plugin-body:empty { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden" style="height: 100dvh;">

    <header class="border-b border-slate-800 bg-slate-900/95 backdrop-blur shrink-0 px-3 md:px-6 py-2.5 flex items-center justify-between gap-2.5 md:gap-3 z-30">
        <div class="flex items-center gap-2 md:gap-3 min-w-0">
            <button onclick="toggleMobileDrawer()" id="mobileDrawerToggle"
                class="lg:hidden p-2 rounded-xl bg-indigo-950/60 border border-indigo-500/40 text-indigo-400 hover:text-white hover:bg-indigo-600 transition shadow-md flex items-center justify-center shrink-0"
                title="開啟分類與篩選">
                <i class="fa-solid fa-bars text-base"></i>
            </button>
            <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/35 shrink-0">
                <i class="fa-solid fa-headphones-simple text-lg"></i>
            </div>
            <div class="min-w-0">
                <h1 class="text-base md:text-lg font-bold tracking-wide truncate">MP3 雲端管理</h1>
                <p class="text-[11px] text-slate-400 hidden sm:block truncate">即時串流、分類與標籤管理</p>
            </div>
        </div>
    </header>

    <div id="mobileDrawerBackdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden lg:hidden opacity-0 transition-opacity duration-300" onclick="toggleMobileDrawer(false)"></div>

    <main class="flex-1 min-h-0 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 lg:grid-rows-1 gap-6 overflow-y-auto lg:overflow-hidden">
        <div id="mobileDrawer" class="fixed inset-y-0 left-0 z-50 w-80 max-w-[85vw] bg-slate-950 border-r border-slate-800 transform -translate-x-full
                                    lg:static lg:translate-x-0 lg:col-span-1 lg:w-auto lg:bg-transparent lg:border-none lg:z-auto
                                    lg:min-h-0 lg:overflow-hidden flex flex-col shrink-0 shadow-2xl lg:shadow-none">
            <div class="lg:hidden flex items-center justify-between px-4 py-3 border-b border-slate-800 shrink-0">
                <h3 class="font-bold text-sm text-slate-200 flex items-center">
                    <i class="fa-solid fa-sliders text-indigo-400 mr-2"></i> 控制與分類
                </h3>
                <button onclick="toggleMobileDrawer(false)" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="sidebarContentWrapper" class="flex-1 min-h-0 space-y-4 flex flex-col p-4 lg:p-0 overflow-y-auto pr-1">
                <div id="pluginSlot" class="space-y-4"></div>

                <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl">
                    <div class="flex items-center justify-between mb-3 px-1">
                        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">分類標籤</h2>
                        <span id="count-badge" class="text-xs text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded-full border border-indigo-500/30">0 首</span>
                    </div>
                    <div id="categoryFilters" class="flex flex-col space-y-1.5 mb-3"></div>
                    <div class="flex items-center space-x-1.5 pt-2 border-t border-slate-800">
                        <input type="text" id="newCategoryInput" placeholder="新分類名稱..."
                            class="bg-slate-800 border border-slate-700 text-xs rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-indigo-500 flex-1 text-slate-200"
                            onkeydown="if(event.key==='Enter') addNewCategory()">
                        <button onclick="addNewCategory()" class="bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white border border-slate-700 px-3 py-1.5 rounded-xl text-xs transition">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                    <div class="flex items-center justify-between pt-2 mt-2 border-t border-slate-800">
                        <span class="text-[11px] text-slate-400 flex items-center">
                            <i class="fa-solid fa-clock text-[10px] mr-1.5 text-slate-500"></i>
                            在「我的最愛」显示收藏日期
                        </span>
                        <label class="relative inline-flex items-center cursor-pointer shrink-0">
                            <input type="checkbox" id="showLikedDateToggle" class="sr-only peer">
                            <div class="w-8 h-4 bg-slate-700 rounded-full peer peer-checked:bg-rose-600 transition"></div>
                            <span class="absolute left-0.5 top-0.5 w-3 h-3 bg-white rounded-full transition peer-checked:translate-x-4"></span>
                        </label>
                    </div>
                </div>

                <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl">
                    <div class="flex items-center justify-between mb-2.5 px-1">
                        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">標籤過濾</h2>
                        <button onclick="manageTagsPrompt()" class="text-[11px] text-indigo-400 hover:underline"><i class="fa-solid fa-gear mr-1"></i>管理</button>
                    </div>
                    <div id="tagCloudContainer" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto"></div>
                </div>

                <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2.5 px-1">快速搜尋</h2>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋歌名或目錄..."
                            class="w-full bg-slate-800/80 border border-slate-700 text-sm rounded-xl pl-9 pr-4 py-2 focus:outline-none focus:border-indigo-500 text-slate-200">
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-3 flex flex-col lg:min-h-0 lg:overflow-hidden min-w-0">
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl shadow-xl flex flex-col lg:flex-1 lg:min-h-0 overflow-hidden">
                <div class="px-4 md:px-6 py-3.5 border-b border-slate-800 flex justify-between items-center shrink-0 flex-wrap gap-2">
                    <div class="flex items-center space-x-2 min-w-0">
                        <h2 class="font-semibold text-slate-200 flex items-center text-sm md:text-base shrink-0">
                            <i class="fa-solid fa-list-music mr-2 text-indigo-400"></i> 檔案列表
                        </h2>
                        <span id="mobileFilterBadge" class="lg:hidden text-[10px] text-indigo-400 bg-indigo-950/60 border border-indigo-500/30 px-2 py-0.5 rounded-full truncate max-w-[40vw]">全部</span>
                    </div>
                    <div class="flex items-center space-x-3 flex-wrap gap-2">
                        <span id="fileCountText" class="text-xs text-slate-400">共 0 首</span>
                        <select id="sourceFilter" onchange="handleSourceFilterChange(this.value)"
                            class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2 py-1 text-slate-300 focus:outline-none">
                            <option value="all">所有來源</option>
                        </select>
                        <div id="topPaginationBtns" class="flex items-center space-x-1">
                            <button id="topPrevBtn" onclick="goToPage(currentPage - 1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-lg transition">
                                <i class="fa-solid fa-chevron-left"></i> 上一頁
                            </button>
                            <span id="topPageIndicator" class="text-xs text-slate-400 font-mono px-1">1 / 1</span>
                            <button id="topNextBtn" onclick="goToPage(currentPage + 1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-lg transition">
                                下一頁 <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                        <select id="pageSizeSelect" onchange="changePageSize(this.value)" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2 py-1 text-slate-300 focus:outline-none">
                            <option value="10">10 筆/頁</option>
                            <option value="20" selected>20 筆/頁</option>
                            <option value="50">50 筆/頁</option>
                            <option value="100">100 筆/頁</option>
                        </select>
                    </div>
                </div>

                <div id="tableContainer" class="flex-1 min-h-0 overflow-y-auto">
                    <table class="w-full text-left border-collapse table-fixed">
                        <thead class="sticky top-0 bg-slate-950/90 backdrop-blur z-10 hidden md:table-header-group">
                            <tr class="border-b border-slate-800 text-xs text-slate-400 uppercase">
                                <th class="py-3 px-4 md:px-6 w-auto">來源 / 歌名與路徑</th>
                                <th class="py-3 px-3 md:px-4 w-44">分類 / 標籤</th>
                                <th class="py-3 px-3 md:px-4 w-20 hidden lg:table-cell">大小</th>
                                <th class="py-3 px-4 md:px-6 text-right w-24">操作</th>
                            </tr>
                        </thead>
                        <tbody id="fileTableBody" class="divide-y divide-slate-800/60 text-sm">
                            <tr>
                                <td colspan="4" class="text-center py-12 text-slate-500">
                                    <i class="fa-solid fa-folder-open text-3xl mb-2 block"></i>
                                    請在「本地目錄」插件中新增目錄
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div id="paginationContainer" class="px-4 md:px-6 py-3 border-t border-slate-800/80 flex flex-col md:flex-row items-center justify-between gap-3 bg-slate-950/40 shrink-0"></div>
            </div>
        </div>
    </main>

    <footer class="shrink-0 relative z-20 bg-slate-900 border-t border-slate-800 p-3 shadow-2xl player-bar">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
            <div class="flex items-center space-x-3 w-full md:w-1/4">
                <div class="w-10 h-10 rounded-lg bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-400 flex-shrink-0">
                    <i id="playerIcon" class="fa-solid fa-music"></i>
                </div>
                <div class="overflow-hidden flex-1 min-w-0">
                    <div class="flex items-center gap-1.5">
                        <span id="currentSongSourceBadge" class="hidden"></span>
                        <div id="currentSongTitle" class="text-xs md:text-sm font-medium truncate text-slate-200">尚未選擇播放歌曲</div>
                    </div>
                    <div id="currentSongCategory" class="text-xs text-indigo-400">就緒</div>
                </div>
            </div>

            <div class="flex flex-col items-center w-full md:w-2/4 space-y-1">
                <div class="flex items-center space-x-3 md:space-x-4">
                    <button onclick="toggleAutoMode()" id="autoModeBtn" class="text-xs px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-400 transition flex items-center space-x-1">
                        <i class="fa-solid fa-bolt text-[10px]"></i><span>自動</span>
                    </button>
                    <button onclick="togglePlayMode()" id="playModeBtn" class="text-slate-400 hover:text-indigo-400 transition flex items-center justify-center p-1" title="播放模式">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>
                    <button onclick="playPrev()" class="text-slate-400 hover:text-white transition" title="上一首 (P)"><i class="fa-solid fa-backward-step"></i></button>
                    <button onclick="togglePlay()" id="playPauseBtn" class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg transition" title="播放/暫停 (空白鍵)">
                        <i class="fa-solid fa-play text-xs"></i>
                    </button>
                    <button onclick="playNext()" class="text-slate-400 hover:text-white transition" title="下一首 (N)"><i class="fa-solid fa-forward-step"></i></button>
                    <button id="playerLikeBtn" onclick="togglePlayerLike()" class="text-slate-500 hover:text-rose-400 transition hidden ml-1 text-base" title="加入最愛 (L)">
                        <i id="playerLikeIcon" class="fa-regular fa-heart"></i>
                    </button>
                    <button id="playerDislikeBtn" onclick="togglePlayerDislike()" class="text-slate-500 hover:text-amber-400 transition hidden text-base" title="隱藏此歌曲">
                        <i id="playerDislikeIcon" class="fa-regular fa-thumbs-down"></i>
                    </button>
                    <span id="modeText" class="text-[10px] text-slate-500 bg-slate-800 px-2 py-0.5 rounded ml-2">循環</span>
                </div>
                <div class="w-full flex items-center space-x-3 text-xs text-slate-400">
                    <span id="currentTime">00:00</span>
                    <input type="range" id="progressBar" value="0" max="100" step="0.1" onchange="seekAudio(this.value)"
                        class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    <span id="durationTime">00:00</span>
                    <span id="autoTimerText" class="text-[11px] text-amber-400 font-mono hidden whitespace-nowrap"></span>
                </div>
            </div>

            <div class="hidden md:flex items-center space-x-3 w-1/4 justify-end">
                <i class="fa-solid fa-volume-high text-slate-400 text-sm"></i>
                <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)"
                        class="w-24 h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>
        </div>
    </footer>

    <div id="customModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl transform scale-95 transition-transform duration-200" id="modalBox">
            <div class="flex items-center space-x-3 mb-4">
                <div id="modalIconContainer" class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">
                    <i id="modalIcon" class="fa-solid fa-circle-info text-lg"></i>
                </div>
                <div>
                    <h3 id="modalTitle" class="text-base font-bold text-slate-100">提示</h3>
                    <p id="modalSubtitle" class="text-xs text-slate-400">系統通知</p>
                </div>
            </div>
            <div id="modalBody" class="text-sm text-slate-300 mb-6 bg-slate-950/50 p-3.5 rounded-xl border border-slate-800/80"></div>
            <div class="flex items-center justify-end space-x-3">
                <button id="modalCancelBtn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition hidden">取消</button>
                <button id="modalConfirmBtn" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-medium text-white transition shadow-lg shadow-indigo-600/30">確定</button>
            </div>
        </div>
    </div>

    <video id="audioPlayer" class="sr-only" playsinline preload="auto" aria-hidden="true"
           ontimeupdate="updateProgress()" onended="onAudioEnded()" onerror="onAudioError()"></video>

    <script>
        // ==================== 安全辅助 ====================
        function encodeInlineArg(s) {
            return encodeURIComponent(String(s == null ? '' : s)).replace(/'/g, '%27');
        }
        function safeDecodeURI(s) {
            try { return decodeURIComponent(s); } catch (e) { return s; }
        }
        function escapeHtmlAttr(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ==================== 文件唯一 key ====================
        // 本地文件由插件附上 _key（fileKey + '\x00' + sourceId）；News / Drive 无 _key，退回 relativePath
        function getFileKey(f) {
            if (!f) return '';
            return f._key || f.relativePath || f.filename || '';
        }
        window.getFileKey = getFileKey;

        // ==================== 从文件上下文读取请求参数 ====================
        function getFileRequestParams(file) {
            const apiBase = (file && file._apiBase) || window.MP3GetMp3ApiBase();
            const dir = (file && file._dir) || window.MP3GetCurrentDir();
            const originalKey = (file && file._originalKey) || (file && (file.relativePath || file.filename)) || '';
            return { apiBase, dir, originalKey };
        }

        // ==================== Like 时间戳辅助 ====================
        function parseLikedAt(raw) {
            if (!raw) return null;
            if (raw === true) return null;
            if (typeof raw === 'object' && typeof raw.ts === 'number') return raw.ts;
            return null;
        }
        function formatLikedAtDate(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function formatLikedAtFull(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return `${formatLikedAtDate(ts)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        window.mp3_showLikedDate = localStorage.getItem('mp3_show_liked_date') === 'true';

        // ==================== 兜底：单源场景读取（多源场景不依赖） ====================
        window.MP3GetCurrentDir = function () {
            return localStorage.getItem('mp3_last_dir') || '';
        };
        window.MP3GetMp3ApiBase = function () {
            let base = localStorage.getItem('mp3_api_base') || '/api/mp3';
            return String(base).trim().replace(/\/+$/, '') || '/api/mp3';
        };

        // ==================== 主应用状态 ====================
        let allFiles = [];
        let categories = ['未分類', '流行', '輕音樂', '工作', '其他'];
        let currentCategory = '全部';
        let currentTagFilter = null;
        let currentPlayingFile = null; // 这里存的是 _key
        const audioPlayer = document.getElementById('audioPlayer');

        let currentPage = 1;
        let pageSize = 20;
        let playMode = 'loop';
        let isAutoMode = false;
        let autoTimer = null;
        let autoCountdownInterval = null;
        let remainingSeconds = 10;
        let pendingScrollToCurrentSong = false;
        let lastPauseTime = 0;
        const PAUSE_TO_PLAY_DELAY = 900;

        const modeIconsSVG = {
            'loop': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>`,
            'shuffle': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>`,
            'single': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><path d="M13 15h-1.5v-3.5H10V10h3v5z"/></svg>`,
            'sequence': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M5 12h11.17l-4.58-4.59L13 6l6 6-6 6-1.41-1.41L16.17 13H5v-2z"/></svg>`
        };
        const modeNames = { 'loop': '循環', 'shuffle': '隨機', 'single': '單曲', 'sequence': '順序' };

        function toggleMobileDrawer(forceOpen) {
            const drawer = document.getElementById('mobileDrawer');
            const backdrop = document.getElementById('mobileDrawerBackdrop');
            const toggleBtn = document.getElementById('mobileDrawerToggle');
            if (!drawer || !backdrop) return;
            const isCurrentlyOpen = !drawer.classList.contains('-translate-x-full');
            const shouldOpen = (typeof forceOpen === 'boolean') ? forceOpen : !isCurrentlyOpen;
            if (shouldOpen) {
                drawer.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
                requestAnimationFrame(() => backdrop.classList.remove('opacity-0'));
                if (toggleBtn) toggleBtn.classList.add('is-open');
            } else {
                drawer.classList.add('-translate-x-full');
                backdrop.classList.add('opacity-0');
                setTimeout(() => backdrop.classList.add('hidden'), 300);
                if (toggleBtn) toggleBtn.classList.remove('is-open');
            }
        }
        function closeDrawerIfMobile() {
            if (window.innerWidth < 1024) toggleMobileDrawer(false);
        }

        function getSavedCategories() {
            try {
                const saved = localStorage.getItem('mp3_custom_categories');
                return saved ? JSON.parse(saved) : ['未分類', '流行', '輕音樂', '工作', '其他'];
            } catch (e) { return ['未分類', '流行', '輕音樂', '工作', '其他']; }
        }
        function saveCategories(cats) { localStorage.setItem('mp3_custom_categories', JSON.stringify(cats)); }
        function getTagsMap() { try { return JSON.parse(localStorage.getItem('mp3_tags_map') || '{}'); } catch (e) { return {}; } }
        function saveTagsMap(map) { localStorage.setItem('mp3_tags_map', JSON.stringify(map)); }
        function getLikedMap() { try { return JSON.parse(localStorage.getItem('mp3_liked_map') || '{}'); } catch (e) { return {}; } }
        function saveLikedMap(map) { localStorage.setItem('mp3_liked_map', JSON.stringify(map)); }
        function getDislikedMap() { try { return JSON.parse(localStorage.getItem('mp3_disliked_map') || '{}'); } catch (e) { return {}; } }
        function saveDislikedMap(map) { localStorage.setItem('mp3_disliked_map', JSON.stringify(map)); }

        window.addEventListener('DOMContentLoaded', () => {
            categories = getSavedCategories();
            const params = new URLSearchParams(window.location.search);

            // 旧兼容：如果 URL 带 ?dir= 且本地还没有配置，作为第一个源导入
            const dirParam = params.get('dir');
            if (dirParam) {
                let sources = [];
                try { sources = JSON.parse(localStorage.getItem('mp3_local_sources') || '[]'); } catch (e) {}
                if (sources.length === 0) {
                    sources.push({
                        id: 'src_default',
                        name: '本地音樂',
                        apiBase: '/api/mp3',
                        dir: dirParam,
                        enabled: true
                    });
                    localStorage.setItem('mp3_local_sources', JSON.stringify(sources));
                }
            }

            const pageParam = parseInt(params.get('page'));
            if (!isNaN(pageParam) && pageParam > 0) currentPage = pageParam;

            const sizeParam = parseInt(params.get('pageSize'));
            if (!isNaN(sizeParam) && sizeParam > 0) {
                pageSize = sizeParam;
                const sizeSelectEl = document.getElementById('pageSizeSelect');
                if (sizeSelectEl) sizeSelectEl.value = pageSize;
            }

            const savedPlayMode = localStorage.getItem('mp3_last_play_mode');
            if (savedPlayMode && modeNames[savedPlayMode]) {
                playMode = savedPlayMode;
                document.getElementById('playModeBtn').innerHTML = modeIconsSVG[playMode];
                document.getElementById('modeText').innerText = modeNames[savedPlayMode];
            }

            const savedAutoMode = localStorage.getItem('mp3_last_auto_mode');
            if (savedAutoMode === 'true') {
                isAutoMode = true;
                const btn = document.getElementById('autoModeBtn');
                btn.className = 'text-xs px-2.5 py-1 rounded-lg border border-amber-500/50 bg-amber-500/20 text-amber-400 transition flex items-center space-x-1 shadow-md';
            }

            const savedVolume = localStorage.getItem('mp3_last_volume');
            if (savedVolume !== null) {
                const vol = parseFloat(savedVolume);
                audioPlayer.volume = vol;
                const volEl = document.getElementById('volumeControl');
                if (volEl) volEl.value = vol;
            }

            const showToggle = document.getElementById('showLikedDateToggle');
            if (showToggle) {
                showToggle.checked = window.mp3_showLikedDate;
                showToggle.addEventListener('change', (e) => {
                    window.mp3_showLikedDate = e.target.checked;
                    localStorage.setItem('mp3_show_liked_date', String(window.mp3_showLikedDate));
                    renderTable();
                });
            }

            initMediaSession();
            initKeyboardShortcuts();
        });

        function initMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('pause', () => {
                    lastPauseTime = Date.now();
                    if (!audioPlayer.paused) {
                        audioPlayer.pause();
                        clearAutoTimer();
                        updatePlayButton();
                    }
                });
                navigator.mediaSession.setActionHandler('play', () => {
                    const now = Date.now();
                    if (lastPauseTime > 0 && (now - lastPauseTime < PAUSE_TO_PLAY_DELAY)) {
                        lastPauseTime = 0;
                        if (currentPlayingFile) {
                            const file = allFiles.find(f => getFileKey(f) === currentPlayingFile);
                            if (file && !file.isLiked) togglePlayerLike();
                        }
                        if (audioPlayer.paused) {
                            audioPlayer.play();
                            updatePlayButton();
                            if (isAutoMode) startAutoTimer(10);
                        }
                        return;
                    }
                    lastPauseTime = 0;
                    if (audioPlayer.paused) {
                        audioPlayer.play();
                        updatePlayButton();
                        if (isAutoMode) startAutoTimer(10);
                    }
                });
                navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
                navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
            }
        }

        function initKeyboardShortcuts() {
            window.addEventListener('keydown', (e) => {
                if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                const key = e.key.toLowerCase();
                if (key === 'l') togglePlayerLike();
                else if (key === 'n') { e.preventDefault(); playNext(); }
                else if (key === 'p') { e.preventDefault(); playPrev(); }
                else if (key === 'r') { e.preventDefault(); loadFiles(false); }
                else if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
                else if (e.key === 'Escape') toggleMobileDrawer(false);
            });
        }

        function updateMediaSessionMetadata(title) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title || '未知曲目',
                    artist: 'MP3 雲端管理系統',
                    album: document.getElementById('currentSongCategory').innerText || '播放清單',
                    artwork: [
                        { src: 'https://cdn-icons-png.flaticon.com/512/3388/3388823.png', sizes: '96x96', type: 'image/png' },
                        { src: 'https://cdn-icons-png.flaticon.com/512/3388/3388823.png', sizes: '512x512', type: 'image/png' }
                    ]
                });
            }
        }

        function updateUrlParams() {
            const params = new URLSearchParams(window.location.search);
            params.delete('dir');
            params.set('page', currentPage);
            params.set('pageSize', pageSize);
            window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
        }

        // ==================== loadFiles 转发 ====================
        async function loadFiles(resetPage = false) {
            if (resetPage) currentPage = 1;
            if (window.MP3LocalPlugin && typeof window.MP3LocalPlugin.loadAllSources === 'function') {
                return window.MP3LocalPlugin.loadAllSources();
            }
            // 插件未启用：清空本地
            allFiles = allFiles.filter(f => f._source && f._source !== 'local');
            renderCategories();
            renderTagCloud();
            renderTable();
        }

        function restoreLastPlayedSong() {
            const lastKey = localStorage.getItem('mp3_last_played_key');
            const lastTitle = localStorage.getItem('mp3_last_played_title');
            const lastTime = parseFloat(sessionStorage.getItem('mp3_last_played_time') || localStorage.getItem('mp3_last_played_time') || '0');
            if (!lastKey || allFiles.length === 0) return;

            const targetFile = allFiles.find(f => getFileKey(f) === lastKey);
            if (!targetFile) return;

            currentPlayingFile = lastKey;
            pendingScrollToCurrentSong = true;
            syncPageToFile(lastKey);

            const src = targetFile._source || 'local';
            if (src === 'local') {
                const { apiBase, dir, originalKey } = getFileRequestParams(targetFile);
                if (!dir) return;
                const streamUrl = `${apiBase}?dir=${encodeURIComponent(dir)}&action=stream&filename=${encodeURIComponent(originalKey)}`;
                audioPlayer.src = streamUrl;
                audioPlayer.addEventListener('loadedmetadata', function onMeta() {
                    if (!isNaN(audioPlayer.duration) && lastTime < audioPlayer.duration) {
                        audioPlayer.currentTime = lastTime;
                    }
                    audioPlayer.removeEventListener('loadedmetadata', onMeta);
                });
            }

            const displayName = targetFile.displayName || lastTitle;
            document.getElementById('currentSongTitle').innerText = displayName;
            document.getElementById('currentSongCategory').innerText = targetFile.category || '';
            updateMediaSessionMetadata(displayName);

            if (typeof window.MP3SetPlayerSourceBadge === 'function') {
                window.MP3SetPlayerSourceBadge(targetFile);
            }

            updatePlayerLikeState();
            updatePlayerDislikeState();
            renderTable();
            updatePlayButton();
        }

        function syncPageToFile(uniqueKey) {
            const filtered = getFilteredFiles();
            const idx = filtered.findIndex(f => getFileKey(f) === uniqueKey);
            if (idx === -1) return;
            const targetPage = Math.floor(idx / pageSize) + 1;
            if (targetPage !== currentPage) {
                currentPage = targetPage;
                updateUrlParams();
            }
        }

        function addNewCategory() {
            const inputEl = document.getElementById('newCategoryInput');
            const catName = inputEl.value.trim();
            if (!catName) return;
            if (categories.includes(catName)) {
                showCustomModal({ title: '提示', message: '此分類名稱已存在！', type: 'info' });
                return;
            }
            categories.push(catName);
            saveCategories(categories);
            inputEl.value = '';
            renderCategories();
            renderTable();
        }

        async function deleteCategory(encodedCat) {
            const catName = safeDecodeURI(encodedCat);
            if (catName === '未分類' || catName === '全部' || catName === '我的最愛') return;
            const confirmed = await showCustomModal({
                title: '刪除分類',
                message: `確定要刪除分類「${catName}」嗎？\n原先屬於此分類的歌曲將自動歸為「未分類」。`,
                type: 'danger', confirmText: '確認刪除'
            });
            if (!confirmed) return;
            allFiles.forEach(f => { if (f.category === catName) f.category = '未分類'; });
            categories = categories.filter(c => c !== catName);
            saveCategories(categories);
            if (currentCategory === catName) currentCategory = '全部';
            renderCategories();
            renderTable();
        }

        function renderCategories() {
            const container = document.getElementById('categoryFilters');
            const totalLikedCount = allFiles.filter(f => f.isLiked).length;
            const totalDislikedCount = allFiles.filter(f => f.isDisliked).length;
            const validFilesCount = allFiles.filter(f => !f.isDisliked).length;

            let html = `
                <button onclick="filterCategory('全部')" class="cat-btn w-full text-left px-3.5 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center justify-between ${currentCategory === '全部' && !currentTagFilter ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'bg-slate-800/60 hover:bg-slate-800 text-slate-300'}">
                    <span>全部</span>
                    <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${validFilesCount}</span>
                </button>
                <div class="flex items-center space-x-1 w-full">
                    <button onclick="filterCategory('我的最愛')" class="cat-btn flex-1 text-left px-3.5 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center justify-between ${currentCategory === '我的最愛' && !currentTagFilter ? 'bg-rose-600/20 text-rose-400 border border-rose-500/30' : 'bg-slate-800/60 hover:bg-slate-800 text-slate-300'}">
                        <span class="flex items-center"><i class="fa-solid fa-heart text-rose-500 mr-2"></i> 我的最愛</span>
                        <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${totalLikedCount}</span>
                    </button>
                    <button onclick="copyFavoriteSongs()" class="p-2 bg-slate-800 hover:bg-rose-600/30 text-slate-400 hover:text-rose-400 border border-slate-700 rounded-xl transition text-xs flex items-center justify-center" title="複製我的最愛到指定目錄">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 1.259-.25 2.45-.71 3.518a.75.75 0 11-1.38-.586c.382-.897.59-1.91.59-2.932 0-2.112-1.748-3.75-3.937-3.75a3.98 3.98 0 00-3.322 1.77.75.75 0 01-1.238 0A3.98 3.98 0 008.437 4.5C6.248 4.5 4.5 6.138 4.5 8.25c0 3.256 2.052 6.132 4.38 8.16a23.684 23.684 0 003.882 2.871l.013.007.004.002.721 1.32-.721-1.32z"/></svg>
                    </button>
                </div>
                <button onclick="filterCategory('Dislike')" class="cat-btn w-full text-left px-3.5 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center justify-between ${currentCategory === 'Dislike' && !currentTagFilter ? 'bg-amber-600/20 text-amber-400 border border-amber-500/30' : 'bg-slate-800/60 hover:bg-slate-800 text-slate-300'}">
                    <span class="flex items-center"><i class="fa-solid fa-thumbs-down text-amber-400 mr-2"></i> 已隱藏</span>
                    <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${totalDislikedCount}</span>
                </button>
            `;

            categories.forEach(cat => {
                const count = allFiles.filter(f => f.category === cat && !f.isDisliked).length;
                const isActive = (currentCategory === cat && !currentTagFilter);
                const canDelete = (cat !== '未分類');
                const encCat = encodeInlineArg(cat);
                html += `
                    <div class="flex items-center space-x-1 w-full group">
                        <button onclick="filterCategory('${encCat}')" class="cat-btn flex-1 text-left px-3.5 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center justify-between ${isActive ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'bg-slate-800/60 hover:bg-slate-800 text-slate-300'}">
                            <span>${escapeHtmlAttr(cat)}</span>
                            <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${count}</span>
                        </button>
                        ${canDelete ? `<button onclick="deleteCategory('${encCat}')" class="opacity-0 group-hover:opacity-100 p-1.5 text-slate-500 hover:text-rose-400 text-xs transition"><i class="fa-solid fa-xmark"></i></button>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('count-badge').innerText = `${validFilesCount} 首`;
            updateMobileFilterBadge();
        }

        function updateMobileFilterBadge() {
            const badge = document.getElementById('mobileFilterBadge');
            if (!badge) return;
            badge.innerText = currentTagFilter ? '#' + currentTagFilter : currentCategory;
        }

        function filterCategory(encodedCat) {
            const cat = safeDecodeURI(encodedCat);
            currentCategory = cat;
            currentTagFilter = null;
            currentPage = 1;
            pendingScrollToCurrentSong = false;
            updateUrlParams();
            renderCategories();
            renderTagCloud();
            renderTable();
            closeDrawerIfMobile();
        }

        function renderTagCloud() {
            const container = document.getElementById('tagCloudContainer');
            const tagsMap = getTagsMap();
            const tagCounts = {};
            Object.values(tagsMap).forEach(tags => {
                tags.forEach(tag => { tagCounts[tag] = (tagCounts[tag] || 0) + 1; });
            });
            const uniqueTags = Object.keys(tagCounts);
            if (uniqueTags.length === 0) {
                container.innerHTML = `<span class="text-[11px] text-slate-500 px-1">尚無任何標籤</span>`;
                return;
            }
            let html = `<span onclick="filterByTag(null)" class="cursor-pointer px-2 py-1 rounded-lg text-[11px] transition ${!currentTagFilter ? 'bg-indigo-600 text-white font-medium' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}">全部標籤</span>`;
            uniqueTags.forEach(tag => {
                const isActive = (currentTagFilter === tag);
                const encTag = encodeInlineArg(tag);
                html += `<span onclick="filterByTag('${encTag}')" class="cursor-pointer px-2 py-1 rounded-lg text-[11px] transition flex items-center space-x-1 ${isActive ? 'bg-indigo-600 text-white font-medium' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}"><span>#${escapeHtmlAttr(tag)}</span><span class="text-[9px] opacity-70">(${tagCounts[tag]})</span></span>`;
            });
            container.innerHTML = html;
        }

        function filterByTag(encodedTag) {
            currentTagFilter = encodedTag === null ? null : safeDecodeURI(encodedTag);
            currentPage = 1;
            pendingScrollToCurrentSong = false;
            renderCategories();
            renderTagCloud();
            renderTable();
            updateMobileFilterBadge();
            closeDrawerIfMobile();
        }

        async function editSongTags(encodedKey, encodedName) {
            const uniqueKey = decodeURIComponent(encodedKey);
            const file = allFiles.find(f => getFileKey(f) === uniqueKey);
            if (!file) return;
            const displayName = decodeURIComponent(encodedName);
            const tagsMap = getTagsMap();
            const currentTags = tagsMap[uniqueKey] || [];
            const inputTags = await showCustomModal({
                title: '管理歌曲標籤',
                subtitle: displayName,
                message: '請輸入標籤（多個標籤請用半形逗號 , 隔開）：',
                type: 'confirm', isPrompt: true,
                defaultValue: currentTags.join(', '),
                confirmText: '儲存標籤'
            });
            if (inputTags === null) return;
            const newTags = inputTags.split(',').map(t => t.trim()).filter(t => t.length > 0);
            if (newTags.length > 0) tagsMap[uniqueKey] = [...new Set(newTags)];
            else delete tagsMap[uniqueKey];
            saveTagsMap(tagsMap);
            loadFiles(false);
        }

        function manageTagsPrompt() {
            showCustomModal({ title: '標籤管理提示', message: '點擊每首歌右側的「+標籤」按鈕可為該曲目新增或修改標籤，點擊左側標籤即可過濾歌曲。', type: 'info' });
        }

        function getFilteredFiles() {
            const keyword = (document.getElementById('searchInput').value || '').toLowerCase();
            const sourceFilter = window.currentSourceFilter || 'all';

            const result = allFiles.filter(f => {
                const key = getFileKey(f);
                const matchKey = (f.displayName || f.filename || '').toLowerCase().includes(keyword) ||
                                 key.toLowerCase().includes(keyword);
                const matchTag = !currentTagFilter || (f.tags && f.tags.includes(currentTagFilter));
                const matchSource = sourceFilter === 'all' || ((f._source || 'local') === sourceFilter);

                if (currentCategory === 'Dislike') return f.isDisliked && matchKey && matchTag && matchSource;
                if (f.isDisliked) return false;
                if (currentCategory === '我的最愛') return f.isLiked && matchKey && matchTag && matchSource;
                if (currentCategory !== '全部') return f.category === currentCategory && matchKey && matchTag && matchSource;
                return matchKey && matchTag && matchSource;
            });

            if (currentCategory === '我的最愛') {
                result.sort((a, b) => (b.likedAt || 0) - (a.likedAt || 0));
            }
            return result;
        }

        function toggleLike(encodedKey, event) {
            if (event) event.stopPropagation();
            const uniqueKey = decodeURIComponent(encodedKey);
            const file = allFiles.find(f => getFileKey(f) === uniqueKey);
            if (!file) return;

            file.isLiked = !file.isLiked;
            if (file.isLiked && file.isDisliked) {
                file.isDisliked = false;
                const dislikedMap = getDislikedMap();
                delete dislikedMap[uniqueKey];
                saveDislikedMap(dislikedMap);
            }

            const likedMap = getLikedMap();
            if (file.isLiked) {
                const existing = likedMap[uniqueKey];
                const existingTs = (existing && typeof existing === 'object' && typeof existing.ts === 'number') ? existing.ts : null;
                const ts = existingTs || Date.now();
                likedMap[uniqueKey] = { ts };
                file.likedAt = ts;
            } else {
                delete likedMap[uniqueKey];
                file.likedAt = null;
            }
            saveLikedMap(likedMap);

            if (currentPlayingFile === uniqueKey) {
                updatePlayerLikeState();
                updatePlayerDislikeState();
            }
            renderCategories();
            renderTable();

            if (isAutoMode && currentPlayingFile === uniqueKey && file.isLiked) {
                clearAutoTimer();
                const timerText = document.getElementById('autoTimerText');
                timerText.classList.remove('hidden');
                timerText.innerText = '[已Like，3秒後換歌...]';
                autoTimer = setTimeout(() => { if (isAutoMode) playNext(); }, 3000);
            }
        }

        function toggleFileDislike(encodedKey) {
            const uniqueKey = decodeURIComponent(encodedKey);
            const file = allFiles.find(f => getFileKey(f) === uniqueKey);
            if (!file) return;
            file.isDisliked = !file.isDisliked;
            const dislikedMap = getDislikedMap();
            if (file.isDisliked) {
                dislikedMap[uniqueKey] = true;
                if (file.isLiked) {
                    file.isLiked = false;
                    file.likedAt = null;
                    const likedMap = getLikedMap();
                    delete likedMap[uniqueKey];
                    saveLikedMap(likedMap);
                }
            } else {
                delete dislikedMap[uniqueKey];
            }
            saveDislikedMap(dislikedMap);
            if (currentPlayingFile === uniqueKey) {
                updatePlayerLikeState();
                updatePlayerDislikeState();
                if (file.isDisliked && !audioPlayer.paused) playNext();
            }
            renderCategories();
            renderTable();
        }

        function togglePlayerLike() {
            if (!currentPlayingFile) return;
            toggleLike(encodeInlineArg(currentPlayingFile));
        }
        function togglePlayerDislike() {
            if (!currentPlayingFile) return;
            toggleFileDislike(encodeInlineArg(currentPlayingFile));
        }

        function updatePlayerLikeState() {
            const btn = document.getElementById('playerLikeBtn');
            const icon = document.getElementById('playerLikeIcon');
            if (!currentPlayingFile) { btn.classList.add('hidden'); return; }
            btn.classList.remove('hidden');
            const file = allFiles.find(f => getFileKey(f) === currentPlayingFile);
            if (file && file.isLiked) {
                icon.className = 'fa-solid fa-heart text-rose-500';
                btn.title = file.likedAt ? `取消最愛（收藏于 ${formatLikedAtDate(file.likedAt)}）` : '取消最愛 (L)';
            } else {
                icon.className = 'fa-regular fa-heart text-slate-500 hover:text-slate-300';
                btn.title = '加入最愛 (L)';
            }
        }
        function updatePlayerDislikeState() {
            const btn = document.getElementById('playerDislikeBtn');
            const icon = document.getElementById('playerDislikeIcon');
            if (!currentPlayingFile) { btn.classList.add('hidden'); return; }
            btn.classList.remove('hidden');
            const file = allFiles.find(f => getFileKey(f) === currentPlayingFile);
            if (file && file.isDisliked) {
                icon.className = 'fa-solid fa-thumbs-down text-amber-400';
                btn.title = '取消隱藏';
            } else {
                icon.className = 'fa-regular fa-thumbs-down text-slate-500 hover:text-amber-400';
                btn.title = '隱藏此歌曲';
            }
        }

        function togglePlayMode() {
            const modes = ['loop', 'shuffle', 'single', 'sequence'];
            let currentIdx = modes.indexOf(playMode);
            if (currentIdx === -1) currentIdx = 0;
            playMode = modes[(currentIdx + 1) % modes.length];
            localStorage.setItem('mp3_last_play_mode', playMode);
            document.getElementById('playModeBtn').innerHTML = modeIconsSVG[playMode];
            document.getElementById('modeText').innerText = modeNames[playMode];
        }

        function toggleAutoMode() {
            isAutoMode = !isAutoMode;
            localStorage.setItem('mp3_last_auto_mode', isAutoMode);
            const btn = document.getElementById('autoModeBtn');
            if (isAutoMode) {
                btn.className = 'text-xs px-2.5 py-1 rounded-lg border border-amber-500/50 bg-amber-500/20 text-amber-400 transition flex items-center space-x-1 shadow-md';
                if (currentPlayingFile && !audioPlayer.paused) startAutoTimer(10);
            } else {
                btn.className = 'text-xs px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-400 transition flex items-center space-x-1';
                clearAutoTimer();
            }
        }

        function changeVolume(val) {
            audioPlayer.volume = val;
            localStorage.setItem('mp3_last_volume', val);
        }

        function startAutoTimer(seconds) {
            clearAutoTimer();
            if (!isAutoMode) return;
            remainingSeconds = seconds;
            updateTimerDisplay(remainingSeconds);
            autoCountdownInterval = setInterval(() => {
                remainingSeconds--;
                if (remainingSeconds > 0) updateTimerDisplay(remainingSeconds);
                else { updateTimerDisplay(0); clearInterval(autoCountdownInterval); }
            }, 1000);
            autoTimer = setTimeout(() => { if (isAutoMode) playNext(); }, seconds * 1000);
        }
        function clearAutoTimer() {
            if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
            if (autoCountdownInterval) { clearInterval(autoCountdownInterval); autoCountdownInterval = null; }
            const timerText = document.getElementById('autoTimerText');
            timerText.classList.add('hidden');
            timerText.innerText = '';
        }
        function updateTimerDisplay(sec) {
            const timerText = document.getElementById('autoTimerText');
            if (!isAutoMode) { timerText.classList.add('hidden'); return; }
            timerText.classList.remove('hidden');
            timerText.innerText = `[自動換歌: ${sec}s]`;
        }

        async function playSong(encodedKey, encodedName) {
            const uniqueKey = decodeURIComponent(encodedKey);
            const file = allFiles.find(f => getFileKey(f) === uniqueKey);

            if (window.MP3DataSourceHandlers) {
                Object.entries(window.MP3DataSourceHandlers).forEach(([k, h]) => {
                    if (h && typeof h.reset === 'function') { try { h.reset(); } catch (e) {} }
                });
            }

            if (file && file._source && file._source !== 'local'
                && window.MP3DataSourceHandlers
                && window.MP3DataSourceHandlers[file._source]) {
                try {
                    return await window.MP3DataSourceHandlers[file._source].play(file);
                } catch (e) {
                    console.error('[DataSource] play failed:', e);
                    return;
                }
            }

            const displayName = encodedName ? decodeURIComponent(encodedName) : (file && (file.displayName || file.filename)) || uniqueKey;
            if (!file) return;
            const { apiBase, dir, originalKey } = getFileRequestParams(file);
            const streamUrl = `${apiBase}?dir=${encodeURIComponent(dir)}&action=stream&filename=${encodeURIComponent(originalKey)}`;

            syncPageToFile(uniqueKey);

            if (currentPlayingFile !== uniqueKey) {
                currentPlayingFile = uniqueKey;
                pendingScrollToCurrentSong = true;
                audioPlayer.src = streamUrl;
                audioPlayer.play();
                document.getElementById('currentSongTitle').innerText = displayName;
                document.getElementById('currentSongCategory').innerText = file.category || '';
                updateMediaSessionMetadata(displayName);
                localStorage.setItem('mp3_last_played_key', uniqueKey);
                localStorage.setItem('mp3_last_played_title', displayName);

                if (typeof window.MP3SetPlayerSourceBadge === 'function') {
                    window.MP3SetPlayerSourceBadge(file);
                }
            } else {
                if (audioPlayer.paused) audioPlayer.play(); else audioPlayer.pause();
            }

            updatePlayerLikeState();
            updatePlayerDislikeState();
            renderTable();
            updatePlayButton();

            if (isAutoMode && !audioPlayer.paused) startAutoTimer(10);
            else clearAutoTimer();
        }

        function playPrev() {
            const list = getFilteredFiles();
            if (list.length === 0) return;
            const currentIndex = list.findIndex(f => getFileKey(f) === currentPlayingFile);
            let prevIndex = currentIndex - 1;
            if (prevIndex < 0) prevIndex = list.length - 1;
            const target = list[prevIndex];
            playSong(encodeInlineArg(getFileKey(target)), encodeInlineArg(target.displayName || ''));
        }

        function playNext() {
            clearAutoTimer();
            const list = getFilteredFiles();
            if (list.length === 0) return;
            if (playMode === 'shuffle') {
                let randomIndex = Math.floor(Math.random() * list.length);
                if (list.length > 1 && getFileKey(list[randomIndex]) === currentPlayingFile) {
                    randomIndex = (randomIndex + 1) % list.length;
                }
                const target = list[randomIndex];
                playSong(encodeInlineArg(getFileKey(target)), encodeInlineArg(target.displayName || ''));
                return;
            }
            const currentIndex = list.findIndex(f => getFileKey(f) === currentPlayingFile);
            let nextIndex = currentIndex + 1;
            if (nextIndex >= list.length) {
                if (playMode === 'sequence') {
                    audioPlayer.pause();
                    currentPlayingFile = null;
                    updatePlayerLikeState();
                    updatePlayerDislikeState();
                    renderTable();
                    updatePlayButton();
                    return;
                }
                nextIndex = 0;
            }
            const target = list[nextIndex];
            playSong(encodeInlineArg(getFileKey(target)), encodeInlineArg(target.displayName || ''));
        }

        function onAudioEnded() {
            if (playMode === 'single') { audioPlayer.currentTime = 0; audioPlayer.play(); return; }
            playNext();
        }
        function onAudioError() {
            const titleEl = document.getElementById('currentSongTitle');
            if (titleEl) titleEl.innerText = "⚠️ 檔案損毀或無法播放，自動跳過...";
            setTimeout(() => playNext(), 1000);
        }

        function togglePlay() {
            if (!audioPlayer.src) {
                const list = getFilteredFiles();
                if (list.length > 0) {
                    const f = list[0];
                    playSong(encodeInlineArg(getFileKey(f)), encodeInlineArg(f.displayName || ''));
                }
                return;
            }
            if (audioPlayer.paused) {
                audioPlayer.play();
                if (isAutoMode) startAutoTimer(10);
            } else {
                audioPlayer.pause();
                clearAutoTimer();
            }
            updatePlayButton();
            renderTable();
        }

        function updatePlayButton() {
            const btn = document.getElementById('playPauseBtn');
            btn.innerHTML = audioPlayer.paused ? '<i class="fa-solid fa-play text-xs"></i>' : '<i class="fa-solid fa-pause text-xs"></i>';
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = audioPlayer.paused ? 'paused' : 'playing';
            }
        }

        function updateProgress() {
            if (isNaN(audioPlayer.duration)) return;
            document.getElementById('progressBar').value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            document.getElementById('currentTime').innerText = formatTime(audioPlayer.currentTime);
            document.getElementById('durationTime').innerText = formatTime(audioPlayer.duration);
            if (currentPlayingFile && !audioPlayer.paused) {
                sessionStorage.setItem('mp3_last_played_time', audioPlayer.currentTime);
            }
        }
        function seekAudio(val) {
            if (!isNaN(audioPlayer.duration)) {
                audioPlayer.currentTime = (val / 100) * audioPlayer.duration;
                sessionStorage.setItem('mp3_last_played_time', audioPlayer.currentTime);
            }
        }
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        async function changeCategory(encodedKey, newCategory) {
            const uniqueKey = decodeURIComponent(encodedKey);
            const file = allFiles.find(f => getFileKey(f) === uniqueKey);
            if (!file) return;
            const { apiBase, dir, originalKey } = getFileRequestParams(file);
            try {
                const res = await fetch(apiBase, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dir, filename: originalKey, newCategory })
                });
                const data = await res.json();
                if (data.success) loadFiles(false);
                else showCustomModal({ title: '修改失敗', message: data.error, type: 'error' });
            } catch (e) {
                showCustomModal({ title: '連線錯誤', message: e.message, type: 'error' });
            }
        }

        async function deleteSong(encodedKey) {
            const uniqueKey = decodeURIComponent(encodedKey);
            const file = allFiles.find(f => getFileKey(f) === uniqueKey);
            if (!file) return;
            const confirmed = await showCustomModal({
                title: '刪除檔案確認',
                subtitle: '此操作無法復原',
                message: '確定要從硬碟中刪除這個 MP3 檔案嗎？',
                type: 'danger', confirmText: '確認刪除'
            });
            if (!confirmed) return;
            const { apiBase, dir, originalKey } = getFileRequestParams(file);
            try {
                const res = await fetch(`${apiBase}?dir=${encodeURIComponent(dir)}&filename=${encodeURIComponent(originalKey)}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    if (currentPlayingFile === uniqueKey) {
                        audioPlayer.pause();
                        currentPlayingFile = null;
                        localStorage.removeItem('mp3_last_played_key');
                        sessionStorage.removeItem('mp3_last_played_time');
                        updatePlayerLikeState();
                        updatePlayerDislikeState();
                        clearAutoTimer();
                    }
                    loadFiles(false);
                } else {
                    showCustomModal({ title: '刪除失敗', message: data.error, type: 'error' });
                }
            } catch (e) {
                showCustomModal({ title: '連線錯誤', message: e.message, type: 'error' });
            }
        }

        async function copyFavoriteSongs() {
            const likedMap = getLikedMap();
            const likedKeys = Object.keys(likedMap);
            if (likedKeys.length === 0) {
                showCustomModal({ title: '提示', message: '目前沒有任何「我的最愛」歌曲可供複製！', type: 'info' });
                return;
            }

            // 按 (apiBase, dir) 分组
            const groups = new Map();
            likedKeys.forEach(uniqueKey => {
                const file = allFiles.find(f => getFileKey(f) === uniqueKey);
                if (!file) return;
                const { apiBase, dir, originalKey } = getFileRequestParams(file);
                const gKey = apiBase + '\x00' + dir;
                if (!groups.has(gKey)) groups.set(gKey, { apiBase, dir, filenames: [] });
                groups.get(gKey).filenames.push(originalKey);
            });

            if (groups.size === 0) {
                showCustomModal({ title: '提示', message: '找不到對應的檔案來源。', type: 'info' });
                return;
            }

            const savedTargetDir = localStorage.getItem('mp3_copy_target_dir') || '';
            const targetDir = await showCustomModal({
                title: '複製我的最愛',
                subtitle: `共選定 ${likedKeys.length} 首，分屬 ${groups.size} 個來源`,
                message: '請輸入要複製過去的目標資料夾絕對路徑：',
                type: 'confirm', isPrompt: true,
                defaultValue: savedTargetDir, confirmText: '開始複製'
            });
            if (!targetDir || !targetDir.trim()) return;
            const trimmedTargetDir = targetDir.trim();
            localStorage.setItem('mp3_copy_target_dir', trimmedTargetDir);

            let totalSuccess = 0;
            const errors = [];
            for (const { apiBase, dir, filenames } of groups.values()) {
                try {
                    const res = await fetch(`${apiBase}/copy-favorites`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sourceDir: dir, targetDir: trimmedTargetDir, filenames })
                    });
                    const data = await res.json();
                    if (data.success) totalSuccess += data.successCount || 0;
                    else errors.push(`${dir}: ${data.error}`);
                } catch (e) {
                    errors.push(`${dir}: ${e.message}`);
                }
            }

            if (errors.length === 0) {
                showCustomModal({ title: '複製完成', message: `已成功複製 ${totalSuccess} 首到 ${trimmedTargetDir}`, type: 'success' });
            } else {
                showCustomModal({ title: '部分失敗', message: `成功 ${totalSuccess} 首\n錯誤：\n${errors.join('\n')}`, type: 'error' });
            }
        }

        function handleSearch() { currentPage = 1; pendingScrollToCurrentSong = false; updateUrlParams(); renderTable(); }
        function goToPage(p) { currentPage = p; pendingScrollToCurrentSong = false; updateUrlParams(); renderTable(); }
        function changePageSize(sz) { pageSize = parseInt(sz); currentPage = 1; pendingScrollToCurrentSong = false; updateUrlParams(); renderTable(); }

        function renderTable() {
            const tbody = document.getElementById('fileTableBody');
            let filtered = getFilteredFiles();
            document.getElementById('fileCountText').innerText = `共 ${filtered.length} 首`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-12 text-slate-500"><i class="fa-solid fa-music text-3xl mb-2 block"></i>沒有找到符合的 MP3 檔案</td></tr>`;
                document.getElementById('paginationContainer').innerHTML = '';
                document.getElementById('topPageIndicator').innerText = `1 / 1`;
                document.getElementById('topPrevBtn').disabled = true;
                document.getElementById('topNextBtn').disabled = true;
                pendingScrollToCurrentSong = false;
                if (typeof window.refreshSourceFilterOptions === 'function') window.refreshSourceFilterOptions();
                if (window.MP3NewsPlugin && typeof window.MP3NewsPlugin.maybeAutoLoad === 'function') window.MP3NewsPlugin.maybeAutoLoad();
                return;
            }

            const totalPages = Math.ceil(filtered.length / pageSize);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIdx = (currentPage - 1) * pageSize;
            const pageItems = filtered.slice(startIdx, startIdx + pageSize);

            let html = '';
            pageItems.forEach(file => {
                const uniqueKey = getFileKey(file);
                const isPlaying = currentPlayingFile === uniqueKey;
                const sizeMb = file.size ? ((file.size / (1024 * 1024)).toFixed(1) + ' MB') : '';
                const catOptions = categories.map(c => {
                    const safe = escapeHtmlAttr(c);
                    return `<option value="${safe}" ${c === file.category ? 'selected' : ''}>${safe}</option>`;
                }).join('');
                const tagsHtml = (file.tags || []).map(t => `<span class="bg-indigo-950 text-indigo-300 border border-indigo-500/30 px-1.5 py-0.5 rounded text-[10px]">#${escapeHtmlAttr(t)}</span>`).join(' ');

                const encodedKey = encodeInlineArg(uniqueKey);
                const encodedName = encodeInlineArg(file.displayName || file.filename || '');
                const rowId = `row-${encodedKey.replace(/[%._-]/g, '_')}`;
                const isExternal = (file._source && file._source !== 'local');

                const likeTitle = file.isLiked
                    ? (file.likedAt ? `取消最愛（收藏于 ${formatLikedAtDate(file.likedAt)}）` : '取消最愛')
                    : '加入最愛';

                const likedAtLine = (currentCategory === '我的最愛' && file.likedAt && window.mp3_showLikedDate)
                    ? `<div class="text-[10px] text-rose-400/80 mt-0.5 flex items-center gap-1"><i class="fa-solid fa-clock text-[9px]"></i><span>收藏于 ${formatLikedAtDate(file.likedAt)}</span></div>`
                    : '';

                html += `
                    <tr id="${rowId}" class="transition ${isPlaying ? 'bg-indigo-950/30 border-l-4 border-indigo-500' : 'hover:bg-slate-900/50'}">
                        <td class="py-3 px-4 md:px-6" colspan="4">
                            <div class="flex flex-col md:flex-row md:items-center gap-3">
                                <div class="flex items-center space-x-3 flex-1 min-w-0">
                                    <button onclick="playSong('${encodedKey}', '${encodedName}')" class="w-9 h-9 rounded-lg ${isPlaying ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-indigo-400 hover:bg-indigo-600 hover:text-white'} flex items-center justify-center transition shadow flex-shrink-0">
                                        <i class="fa-solid ${isPlaying && !audioPlayer.paused ? 'fa-pause' : 'fa-play'} text-xs"></i>
                                    </button>
                                    <div class="overflow-hidden flex-1 min-w-0">
                                        <div class="flex items-center space-x-2">
                                            ${typeof window.MP3RenderSourceBadge === 'function' ? window.MP3RenderSourceBadge(file) : ''}
                                            <span class="font-medium text-slate-200 truncate" title="${escapeHtmlAttr(file.displayName)}">${escapeHtmlAttr(file.displayName)}</span>
                                            <button onclick="toggleLike('${encodedKey}', event)" class="text-xs transition ${file.isLiked ? 'text-rose-500 hover:text-rose-400' : 'text-slate-600 hover:text-slate-400'}" title="${escapeHtmlAttr(likeTitle)}">
                                                <i class="${file.isLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i>
                                            </button>
                                        </div>
                                        ${file.relativePath && file.relativePath !== file.filename ? `<div class="text-[11px] text-slate-500 truncate">${escapeHtmlAttr(file.relativePath)}</div>` : ''}
                                        ${likedAtLine}
                                    </div>
                                </div>

                                <div class="flex flex-wrap items-center gap-2 md:w-44 md:flex-shrink-0 md:justify-end">
                                    <select onchange="changeCategory('${encodedKey}', this.value)" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2 py-1 text-slate-300 focus:outline-none focus:border-indigo-500 ${isExternal ? 'opacity-50 cursor-not-allowed' : ''}" ${isExternal ? 'disabled title="外部來源分類不可修改"' : ''}>
                                        ${catOptions}
                                    </select>
                                    ${tagsHtml}
                                    <button onclick="editSongTags('${encodedKey}', '${encodedName}')" class="text-[10px] text-slate-500 hover:text-indigo-400 px-1 border border-dashed border-slate-700 rounded ${isExternal ? 'opacity-30 cursor-not-allowed' : ''}" ${isExternal ? 'disabled' : ''}>+標籤</button>
                                </div>

                                <div class="hidden lg:block w-20 flex-shrink-0 text-xs text-slate-400 whitespace-nowrap">${sizeMb}</div>

                                <div class="flex items-center justify-end gap-1 md:w-20 flex-shrink-0">
                                    <button onclick="toggleFileDislike('${encodedKey}')" class="p-1.5 rounded-lg transition ${file.isDisliked ? 'text-amber-400 hover:text-amber-300' : 'text-slate-500 hover:text-amber-400'}" title="${file.isDisliked ? '取消隱藏' : '隱藏此歌曲'}">
                                        <i class="${file.isDisliked ? 'fa-solid' : 'fa-regular'} fa-thumbs-down text-sm"></i>
                                    </button>
                                    <button onclick="deleteSong('${encodedKey}')" class="text-slate-500 hover:text-rose-400 p-1.5 transition ${isExternal ? 'opacity-30 cursor-not-allowed' : ''}" ${isExternal ? 'disabled' : ''}>
                                        <i class="fa-solid fa-trash-can text-sm"></i>
                                    </button>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            renderPagination(totalPages, filtered.length);

            if (pendingScrollToCurrentSong && currentPlayingFile) {
                const rowId = `row-${encodeInlineArg(currentPlayingFile).replace(/[%._-]/g, '_')}`;
                const targetRow = document.getElementById(rowId);
                if (targetRow) targetRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                pendingScrollToCurrentSong = false;
            }

            if (typeof window.refreshSourceFilterOptions === 'function') window.refreshSourceFilterOptions();
            if (window.MP3NewsPlugin && typeof window.MP3NewsPlugin.maybeAutoLoad === 'function') window.MP3NewsPlugin.maybeAutoLoad();
        }

        function renderPagination(totalPages, totalItems) {
            const container = document.getElementById('paginationContainer');
            document.getElementById('topPageIndicator').innerText = `${currentPage} / ${totalPages}`;
            document.getElementById('topPrevBtn').disabled = (currentPage <= 1);
            document.getElementById('topNextBtn').disabled = (currentPage >= totalPages);

            container.innerHTML = `
                <span class="text-xs text-slate-400">顯示第 ${(currentPage - 1) * pageSize + 1} - ${Math.min(currentPage * pageSize, totalItems)} 筆，共 ${totalItems} 筆資料</span>
                <div class="flex items-center space-x-1.5">
                    <button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled class="px-2.5 py-1 bg-slate-900 text-slate-600 rounded-lg text-xs cursor-not-allowed"' : 'class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition"'}>首頁</button>
                    <button onclick="goToPage(currentPage - 1)" ${currentPage === 1 ? 'disabled class="px-2.5 py-1 bg-slate-900 text-slate-600 rounded-lg text-xs cursor-not-allowed"' : 'class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition"'}>上一頁</button>
                    <span class="text-xs text-indigo-400 font-mono px-2">${currentPage} / ${totalPages}</span>
                    <button onclick="goToPage(currentPage + 1)" ${currentPage >= totalPages ? 'disabled class="px-2.5 py-1 bg-slate-900 text-slate-600 rounded-lg text-xs cursor-not-allowed"' : 'class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition"'}>下一頁</button>
                    <button onclick="goToPage(${totalPages})" ${currentPage >= totalPages ? 'disabled class="px-2.5 py-1 bg-slate-900 text-slate-600 rounded-lg text-xs cursor-not-allowed"' : 'class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition"'}>末頁</button>
                </div>
            `;
        }

        function showCustomModal({ title, subtitle = '系統通知', message, type = 'info', isPrompt = false, defaultValue = '', confirmText = '確定' }) {
            return new Promise((resolve) => {
                const modal = document.getElementById('customModal');
                const modalBox = document.getElementById('modalBox');
                const titleEl = document.getElementById('modalTitle');
                const subtitleEl = document.getElementById('modalSubtitle');
                const bodyEl = document.getElementById('modalBody');
                const confirmBtn = document.getElementById('modalConfirmBtn');
                const cancelBtn = document.getElementById('modalCancelBtn');
                const iconEl = document.getElementById('modalIcon');
                const iconContainer = document.getElementById('modalIconContainer');

                titleEl.innerText = title;
                subtitleEl.innerText = subtitle;
                confirmBtn.innerText = confirmText;

                let iconClass = 'fa-solid fa-circle-info';
                let iconBgClass = 'bg-indigo-500/20 text-indigo-400';
                let confirmBtnClass = 'bg-indigo-600 hover:bg-indigo-500 shadow-indigo-600/30';
                if (type === 'error' || type === 'danger') {
                    iconClass = 'fa-solid fa-triangle-exclamation';
                    iconBgClass = 'bg-rose-500/20 text-rose-400';
                    confirmBtnClass = 'bg-rose-600 hover:bg-rose-500 shadow-rose-600/30';
                } else if (type === 'success') {
                    iconClass = 'fa-solid fa-circle-check';
                    iconBgClass = 'bg-emerald-500/20 text-emerald-400';
                    confirmBtnClass = 'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-600/30';
                }

                iconEl.className = iconClass;
                iconContainer.className = `w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${iconBgClass}`;
                confirmBtn.className = `px-5 py-2 rounded-xl text-xs font-medium text-white transition shadow-lg ${confirmBtnClass}`;

                const needsCancel = (type === 'confirm' || type === 'danger' || isPrompt);
                cancelBtn.classList.toggle('hidden', !needsCancel);

                if (isPrompt) {
                    bodyEl.innerHTML = `<p class="mb-2 text-slate-300">${message}</p><input type="text" id="modalPromptInput" value="${escapeHtmlAttr(defaultValue)}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">`;
                } else {
                    bodyEl.innerHTML = `<p>${message.replace(/\n/g, '<br>')}</p>`;
                }

                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalBox.classList.remove('scale-95');
                    if (isPrompt) {
                        const inputEl = document.getElementById('modalPromptInput');
                        if (inputEl) { inputEl.focus(); inputEl.select(); }
                    }
                }, 10);

                const newConfirmBtn = confirmBtn.cloneNode(true);
                const newCancelBtn = cancelBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
                cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

                const closeModal = (result) => {
                    modal.classList.add('opacity-0');
                    modalBox.classList.add('scale-95');
                    setTimeout(() => { modal.classList.add('hidden'); resolve(result); }, 200);
                };

                newConfirmBtn.addEventListener('click', () => {
                    closeModal(isPrompt ? document.getElementById('modalPromptInput').value : true);
                });
                newCancelBtn.addEventListener('click', () => {
                    closeModal(isPrompt ? null : false);
                });
                if (isPrompt) {
                    document.getElementById('modalPromptInput').addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') newConfirmBtn.click();
                    });
                }
            });
        }
    </script>

    <script>
        window.MP3AppExtension = (function () {
            const call = (name, ...args) => {
                const fn = window[name];
                if (typeof fn === 'function') return fn.apply(window, args);
            };
            return {
                version: '2.0',
                get allFiles() { return allFiles; },
                set allFiles(v) { allFiles = v; },
                get categories() { return categories; },
                set categories(v) { categories = v; },
                get currentPlayingFile() { return currentPlayingFile; },
                set currentPlayingFile(v) { currentPlayingFile = v; },
                get currentCategory() { return currentCategory; },
