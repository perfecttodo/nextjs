<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MP3 智慧管理與分類系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(51, 65, 85, 0.6) transparent;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.4); border-radius: 9999px; transition: background 0.2s ease; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.6); }

        footer.player-bar {
            padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden" style="height: 100dvh;">

    <!-- 頂部導覽列 -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur shrink-0 px-4 md:px-6 py-3 flex flex-col md:flex-row items-center justify-between gap-3 z-20">
        <div class="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-start">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/35">
                    <i class="fa-solid fa-headphones-simple text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base md:text-lg font-bold tracking-wide">MP3 雲端管理</h1>
                    <p class="text-[11px] text-slate-400">即時串流、分類與標籤管理</p>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-3 w-full md:w-auto max-w-xl">
            <input type="text" id="dirInput" placeholder="輸入資料夾絕對路徑..." 
                class="bg-slate-800 border border-slate-700 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500 flex-1 md:w-80">
            <button onclick="loadFiles(true)" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-1.5 rounded-lg text-sm font-medium transition shadow-md whitespace-nowrap" title="重新載入 (快捷鍵: R)">
                <i class="fa-solid fa-rotate mr-1.5"></i> 載入
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 min-h-0 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 overflow-y-auto lg:overflow-hidden">
        
        <!-- 左側：分類、標籤與搜尋 -->
        <div id="sidebarContentWrapper" class="lg:col-span-1 space-y-4 flex flex-col shrink-0 lg:overflow-y-auto pr-1">
            <!-- 分類區塊 -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl">
                <div class="flex items-center justify-between mb-3 px-1">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">分類標籤</h2>
                    <span id="count-badge" class="text-xs text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded-full border border-indigo-500/30">0 首</span>
                </div>
                <div id="categoryFilters" class="flex lg:flex-col space-x-2 lg:space-x-0 lg:space-y-1.5 overflow-x-auto lg:overflow-visible no-scrollbar pb-1 lg:pb-0 mb-3">
                    <!-- 動態載入分類 -->
                </div>
                <!-- 新增分類輸入框 -->
                <div class="flex items-center space-x-1.5 pt-2 border-t border-slate-800">
                    <input type="text" id="newCategoryInput" placeholder="新分類名稱..." 
                        class="bg-slate-800 border border-slate-700 text-xs rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-indigo-500 flex-1 text-slate-200"
                        onkeydown="if(event.key==='Enter') addNewCategory()">
                    <button onclick="addNewCategory()" class="bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white border border-slate-700 px-3 py-1.5 rounded-xl text-xs transition" title="新增分類">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- 標籤雲過濾區塊 -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl">
                <div class="flex items-center justify-between mb-2.5 px-1">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">標籤過濾</h2>
                    <button onclick="manageTagsPrompt()" class="text-[11px] text-indigo-400 hover:underline"><i class="fa-solid fa-gear mr-1"></i>管理</button>
                </div>
                <div id="tagCloudContainer" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto">
                    <!-- 動態標籤 -->
                </div>
            </div>

            <!-- 快速搜尋 -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2.5 px-1">快速搜尋</h2>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋歌名或目錄..." 
                        class="w-full bg-slate-800/80 border border-slate-700 text-sm rounded-xl pl-9 pr-4 py-2 focus:outline-none focus:border-indigo-500 text-slate-200">
                </div>
            </div>
        </div>

        <!-- 右側：MP3 檔案列表與分頁 -->
        <div class="lg:col-span-3 flex flex-col lg:min-h-0 lg:overflow-hidden min-w-0">
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl shadow-xl flex flex-col lg:flex-1 lg:min-h-0 overflow-hidden">
                
                <!-- 表格標題列 -->
                <div class="px-4 md:px-6 py-3.5 border-b border-slate-800 flex justify-between items-center shrink-0 flex-wrap gap-2">
                    <h2 class="font-semibold text-slate-200 flex items-center text-sm md:text-base">
                        <i class="fa-solid fa-list-music mr-2 text-indigo-400"></i> 檔案列表
                    </h2>
                    <div class="flex items-center space-x-3">
                        <span id="fileCountText" class="text-xs text-slate-400">共 0 首</span>

                        <div id="topPaginationBtns" class="flex items-center space-x-1">
                            <button id="topPrevBtn" onclick="goToPage(currentPage - 1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-lg transition">
                                <i class="fa-solid fa-chevron-left"></i> 上一頁
                            </button>
                            <span id="topPageIndicator" class="text-xs text-slate-400 font-mono px-1">1 / 1</span>
                            <button id="topNextBtn" onclick="goToPage(currentPage + 1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-lg transition">
                                下一頁 <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>

                        <select id="pageSizeSelect" onchange="changePageSize(this.value)" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2 py-1 text-slate-300 focus:outline-none">
                            <option value="10">10 筆/頁</option>
                            <option value="20" selected>20 筆/頁</option>
                            <option value="50">50 筆/頁</option>
                            <option value="100">100 筆/頁</option>
                        </select>
                    </div>
                </div>

                <!-- 表格本體 -->
                <div id="tableContainer" class="flex-1 min-h-0 overflow-y-auto">
                    <table class="w-full text-left border-collapse table-fixed">
                        <thead class="sticky top-0 bg-slate-950/90 backdrop-blur z-10 hidden md:table-header-group">
                            <tr class="border-b border-slate-800 text-xs text-slate-400 uppercase">
                                <th class="py-3 px-4 md:px-6 w-auto">狀態 / 歌名與路徑</th>
                                <th class="py-3 px-3 md:px-4 w-44">分類 / 標籤</th>
                                <th class="py-3 px-3 md:px-4 w-20 hidden lg:table-cell">大小</th>
                                <th class="py-3 px-4 md:px-6 text-right w-24">操作</th>
                            </tr>
                        </thead>
                        <tbody id="fileTableBody" class="divide-y divide-slate-800/60 text-sm">
                            <tr>
                                <td colspan="4" class="text-center py-12 text-slate-500">
                                    <i class="fa-solid fa-folder-open text-3xl mb-2 block"></i>
                                    請輸入路徑並點擊「載入」
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 底部完整分頁控制列 -->
                <div id="paginationContainer" class="px-4 md:px-6 py-3 border-t border-slate-800/80 flex flex-col md:flex-row items-center justify-between gap-3 bg-slate-950/40 shrink-0"></div>
            </div>
        </div>
    </main>

    <!-- 底部音訊播放器（常規流式佈局，永不遮擋列表） -->
    <footer class="shrink-0 relative z-30 bg-slate-900 border-t border-slate-800 p-3 shadow-2xl player-bar">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
            <div class="flex items-center space-x-3 w-full md:w-1/4">
                <div class="w-10 h-10 rounded-lg bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-400 flex-shrink-0">
                    <i id="playerIcon" class="fa-solid fa-music"></i>
                </div>
                <div class="overflow-hidden">
                    <div id="currentSongTitle" class="text-xs md:text-sm font-medium truncate text-slate-200">尚未選擇播放歌曲</div>
                    <div id="currentSongCategory" class="text-xs text-indigo-400">就緒</div>
                </div>
            </div>

            <div class="flex flex-col items-center w-full md:w-2/4 space-y-1">
                <div class="flex items-center space-x-3 md:space-x-4">
                    <button onclick="toggleAutoMode()" id="autoModeBtn" class="text-xs px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-400 transition flex items-center space-x-1" title="切換自動模式 (10秒未Like自動下一首)">
                        <i class="fa-solid fa-bolt text-[10px]"></i>
                        <span>自動</span>
                    </button>

                    <button onclick="togglePlayMode()" id="playModeBtn" class="text-slate-400 hover:text-indigo-400 transition flex items-center justify-center p-1" title="播放模式: 列表循環">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>

                    <button onclick="playPrev()" class="text-slate-400 hover:text-white transition" title="上一首 (快捷鍵: P)"><i class="fa-solid fa-backward-step"></i></button>
                    <button onclick="togglePlay()" id="playPauseBtn" class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg transition" title="播放/暫停 (快捷鍵: 空白鍵)">
                        <i class="fa-solid fa-play text-xs"></i>
                    </button>
                    <button onclick="playNext()" class="text-slate-400 hover:text-white transition" title="下一首 (快捷鍵: N)"><i class="fa-solid fa-forward-step"></i></button>
                    
                    <button id="playerLikeBtn" onclick="togglePlayerLike()" class="text-slate-500 hover:text-rose-400 transition hidden ml-1 text-base" title="加入最愛 (快捷鍵: L)">
                        <i id="playerLikeIcon" class="fa-regular fa-heart"></i>
                    </button>

                    <button id="playerDislikeBtn" onclick="togglePlayerDislike()" class="text-slate-500 hover:text-amber-400 transition hidden text-base" title="隱藏此歌曲">
                        <i id="playerDislikeIcon" class="fa-regular fa-thumbs-down"></i>
                    </button>
                    
                    <span id="modeText" class="text-[10px] text-slate-500 bg-slate-800 px-2 py-0.5 rounded ml-2">循環</span>
                </div>
                <div class="w-full flex items-center space-x-3 text-xs text-slate-400">
                    <span id="currentTime">00:00</span>
                    <input type="range" id="progressBar" value="0" max="100" step="0.1" onchange="seekAudio(this.value)"
                        class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    <span id="durationTime">00:00</span>
                    <span id="autoTimerText" class="text-[11px] text-amber-400 font-mono hidden whitespace-nowrap"></span>
                </div>
            </div>

            <div class="hidden md:flex items-center space-x-3 w-1/4 justify-end">
                <i class="fa-solid fa-volume-high text-slate-400 text-sm"></i>
                <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)"
                        class="w-24 h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>
        </div>
    </footer>

    <!-- 自訂對話框 Modal -->
    <div id="customModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl transform scale-95 transition-transform duration-200" id="modalBox">
            <div class="flex items-center space-x-3 mb-4">
                <div id="modalIconContainer" class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">
                    <i id="modalIcon" class="fa-solid fa-circle-info text-lg"></i>
                </div>
                <div>
                    <h3 id="modalTitle" class="text-base font-bold text-slate-100">提示</h3>
                    <p id="modalSubtitle" class="text-xs text-slate-400">系統通知</p>
                </div>
            </div>
            <div id="modalBody" class="text-sm text-slate-300 mb-6 bg-slate-950/50 p-3.5 rounded-xl border border-slate-800/80"></div>
            <div class="flex items-center justify-end space-x-3">
                <button id="modalCancelBtn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition hidden">取消</button>
                <button id="modalConfirmBtn" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-medium text-white transition shadow-lg shadow-indigo-600/30">確定</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" ontimeupdate="updateProgress()" onended="onAudioEnded()" onerror="onAudioError()"></audio>

    <script>
        let allFiles = [];
        let categories = ['未分類', '流行', '輕音樂', '工作', '其他'];
        let currentCategory = '全部';
        let currentTagFilter = null;
        let currentPlayingFile = null;
        const audioPlayer = document.getElementById('audioPlayer');

        let currentPage = 1;
        let pageSize = 20;
        let playMode = 'loop'; 
        let isAutoMode = false;
        let autoTimer = null;
        let autoCountdownInterval = null;
        let remainingSeconds = 10;

        // 控制「渲染後是否要滾動到當前歌曲」。只有主動切歌時才設為 true。
        let pendingScrollToCurrentSong = false;

        // 藍牙「暫停 -> 快速播放」序列檢測變數 (900ms)
        let lastPauseTime = 0;
        const PAUSE_TO_PLAY_DELAY = 900; 

        const modeIconsSVG = {
            'loop': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>`,
            'shuffle': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>`,
            'single': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><path d="M13 15h-1.5v-3.5H10V10h3v5z"/></svg>`,
            'sequence': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M5 12h11.17l-4.58-4.59L13 6l6 6-6 6-1.41-1.41L16.17 13H5v-2z"/></svg>`
        };

        const modeNames = { 'loop': '循環', 'shuffle': '隨機', 'single': '單曲', 'sequence': '順序' };

        function getSavedCategories() {
            try {
                const saved = localStorage.getItem('mp3_custom_categories');
                return saved ? JSON.parse(saved) : ['未分類', '流行', '輕音樂', '工作', '其他'];
            } catch (e) { return ['未分類', '流行', '輕音樂', '工作', '其他']; }
        }

        function saveCategories(cats) { localStorage.setItem('mp3_custom_categories', JSON.stringify(cats)); }
        function getTagsMap() { try { return JSON.parse(localStorage.getItem('mp3_tags_map') || '{}'); } catch (e) { return {}; } }
        function saveTagsMap(map) { localStorage.setItem('mp3_tags_map', JSON.stringify(map)); }
        function getLikedMap() { try { return JSON.parse(localStorage.getItem('mp3_liked_map') || '{}'); } catch (e) { return {}; } }
        function saveLikedMap(map) { localStorage.setItem('mp3_liked_map', JSON.stringify(map)); }
        function getDislikedMap() { try { return JSON.parse(localStorage.getItem('mp3_disliked_map') || '{}'); } catch (e) { return {}; } }
        function saveDislikedMap(map) { localStorage.setItem('mp3_disliked_map', JSON.stringify(map)); }

        window.addEventListener('DOMContentLoaded', () => {
            categories = getSavedCategories();
            const params = new URLSearchParams(window.location.search);
            const dirParam = params.get('dir');
            if (dirParam) document.getElementById('dirInput').value = dirParam;
            
            const pageParam = parseInt(params.get('page'));
            if (!isNaN(pageParam) && pageParam > 0) currentPage = pageParam;

            const sizeParam = parseInt(params.get('pageSize'));
            if (!isNaN(sizeParam) && sizeParam > 0) {
                pageSize = sizeParam;
                const sizeSelectEl = document.getElementById('pageSizeSelect');
                if (sizeSelectEl) sizeSelectEl.value = pageSize;
            }

            const savedPlayMode = localStorage.getItem('mp3_last_play_mode');
            if (savedPlayMode && modeNames[savedPlayMode]) {
                playMode = savedPlayMode;
                document.getElementById('playModeBtn').innerHTML = modeIconsSVG[playMode];
                document.getElementById('modeText').innerText = modeNames[savedPlayMode];
            }

            const savedAutoMode = localStorage.getItem('mp3_last_auto_mode');
            if (savedAutoMode === 'true') {
                isAutoMode = true;
                const btn = document.getElementById('autoModeBtn');
                btn.className = 'text-xs px-2.5 py-1 rounded-lg border border-amber-500/50 bg-amber-500/20 text-amber-400 transition flex items-center space-x-1 shadow-md';
            }

            const savedVolume = localStorage.getItem('mp3_last_volume');
            if (savedVolume !== null) {
                const vol = parseFloat(savedVolume);
                audioPlayer.volume = vol;
                const volEl = document.getElementById('volumeControl');
                if (volEl) volEl.value = vol;
            }

            initMediaSession();
            initKeyboardShortcuts();

            loadFiles(false);
        });

        // ==================== 藍牙 Media Session ====================
        function initMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('pause', () => {
                    lastPauseTime = Date.now();
                    if (!audioPlayer.paused) {
                        audioPlayer.pause();
                        clearAutoTimer();
                        updatePlayButton();
                    }
                });

                navigator.mediaSession.setActionHandler('play', () => {
                    const now = Date.now();
                    if (lastPauseTime > 0 && (now - lastPauseTime < PAUSE_TO_PLAY_DELAY)) {
                        lastPauseTime = 0;
                        if (currentPlayingFile) {
                            const file = allFiles.find(f => (f.relativePath || f.filename) === currentPlayingFile);
                            if (file && !file.isLiked) {
                                togglePlayerLike();
                            }
                        }
                        if (audioPlayer.paused) {
                            audioPlayer.play();
                            updatePlayButton();
                            if (isAutoMode) startAutoTimer(10);
                        }
                        return;
                    }

                    lastPauseTime = 0;
                    if (audioPlayer.paused) {
                        audioPlayer.play();
                        updatePlayButton();
                        if (isAutoMode) startAutoTimer(10);
                    }
                });

                navigator.mediaSession.setActionHandler('previoustrack', () => { playPrev(); });
                navigator.mediaSession.setActionHandler('nexttrack', () => { playNext(); });
            }
        }

        // ==================== 鍵盤快捷鍵 ====================
        function initKeyboardShortcuts() {
            window.addEventListener('keydown', (e) => {
                if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                const key = e.key.toLowerCase();
                if (key === 'l') {
                    togglePlayerLike();
                } else if (key === 'n') {
                    e.preventDefault();
                    playNext();
                } else if (key === 'p') {
                    e.preventDefault();
                    playPrev();
                } else if (key === 'r') {
                    e.preventDefault();
                    loadFiles(false);
                } else if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                }
            });
        }

        function updateMediaSessionMetadata(title) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title || '未知曲目',
                    artist: 'MP3 雲端管理系統',
                    album: document.getElementById('currentSongCategory').innerText || '播放清單',
                    artwork: [
                        { src: 'https://cdn-icons-png.flaticon.com/512/3388/3388823.png', sizes: '96x96', type: 'image/png' },
                        { src: 'https://cdn-icons-png.flaticon.com/512/3388/3388823.png', sizes: '512x512', type: 'image/png' }
                    ]
                });
            }
        }

        function updateUrlParams() {
            const dir = document.getElementById('dirInput').value.trim();
            const params = new URLSearchParams(window.location.search);
            if (dir) params.set('dir', dir);
            params.set('page', currentPage);
            params.set('pageSize', pageSize);
            window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
        }

        async function loadFiles(resetPage = false) {
            const dir = document.getElementById('dirInput').value.trim();
            if (resetPage) currentPage = 1;
            updateUrlParams();

            try {
                const res = await fetch(`/api/mp3?dir=${encodeURIComponent(dir)}`);
                const data = await res.json();
                
                if (data.success) {
                    const likedMap = getLikedMap();
                    const dislikedMap = getDislikedMap();
                    const tagsMap = getTagsMap();

                    allFiles = data.files.map(f => {
                        const key = f.relativePath || f.filename;
                        return {
                            ...f,
                            isLiked: !!likedMap[key],
                            isDisliked: !!dislikedMap[key],
                            tags: tagsMap[key] || []
                        };
                    });

                    renderCategories();
                    renderTagCloud();
                    renderTable();
                    updatePlayerLikeState();
                    updatePlayerDislikeState();
                    restoreLastPlayedSong();
                } else {
                    await showCustomModal({ title: '載入失敗', message: data.error || '未知錯誤', type: 'error' });
                }
            } catch (err) {
                await showCustomModal({ title: '連線錯誤', message: '無法連線至 API 伺服器', type: 'error' });
            }
        }

        function restoreLastPlayedSong() {
            const lastKey = localStorage.getItem('mp3_last_played_key');
            const lastTitle = localStorage.getItem('mp3_last_played_title');
            const lastTime = parseFloat(sessionStorage.getItem('mp3_last_played_time') || localStorage.getItem('mp3_last_played_time') || '0');

            if (!lastKey || allFiles.length === 0) return;

            const targetFile = allFiles.find(f => (f.relativePath || f.filename) === lastKey);
            if (targetFile) {
                currentPlayingFile = lastKey;
                pendingScrollToCurrentSong = true;
                syncPageToFile(lastKey);

                const dir = document.getElementById('dirInput').value.trim();
                const streamUrl = `/api/mp3?dir=${encodeURIComponent(dir)}&action=stream&filename=${encodeURIComponent(lastKey)}`;
                
                audioPlayer.src = streamUrl;
                const displayName = targetFile.displayName || lastTitle;
                document.getElementById('currentSongTitle').innerText = displayName;
                document.getElementById('currentSongCategory').innerText = targetFile.category || '';

                updateMediaSessionMetadata(displayName);

                audioPlayer.addEventListener('loadedmetadata', function onMeta() {
                    if (!isNaN(audioPlayer.duration) && lastTime < audioPlayer.duration) {
                        audioPlayer.currentTime = lastTime;
                    }
                    audioPlayer.removeEventListener('loadedmetadata', onMeta);
                });

                updatePlayerLikeState();
                updatePlayerDislikeState();
                renderTable();
                updatePlayButton();
            }
        }

        // 將分頁同步到指定歌曲所在頁（用於精確切歌）
        function syncPageToFile(fileKey) {
            const filtered = getFilteredFiles();
            const idx = filtered.findIndex(f => (f.relativePath || f.filename) === fileKey);
            if (idx === -1) return;
            const targetPage = Math.floor(idx / pageSize) + 1;
            if (targetPage !== currentPage) {
                currentPage = targetPage;
                updateUrlParams();
            }
        }

        // ==================== 分類與標籤管理 ====================
        function addNewCategory() {
            const inputEl = document.getElementById('newCategoryInput');
            const catName = inputEl.value.trim();
            if (!catName) return;

            if (categories.includes(catName)) {
                showCustomModal({ title: '提示', message: '此分類名稱已存在！', type: 'info' });
                return;
            }

            categories.push(catName);
            saveCategories(categories);
            inputEl.value = '';
            renderCategories();
            renderTable();
        }

        async function deleteCategory(catName) {
            if (catName === '未分類' || catName === '全部' || catName === '我的最愛') return;

            const confirmed = await showCustomModal({
                title: '刪除分類',
                message: `確定要刪除分類「${catName}」嗎？\n原先屬於此分類的歌曲將自動歸為「未分類」。`,
                type: 'danger',
                confirmText: '確認刪除'
            });

            if (!confirmed) return;

            allFiles.forEach(f => {
                if (f.category === catName) f.category = '未分類';
            });

            categories = categories.filter(c => c !== catName);
            saveCategories(categories);

            if (currentCategory === catName) currentCategory = '全部';

            renderCategories();
            renderTable();
        }

        function renderCategories() {
            const container = document.getElementById('categoryFilters');
            const totalLikedCount = allFiles.filter(f => f.isLiked).length;
            const totalDislikedCount = allFiles.filter(f => f.isDisliked).length;
            const validFilesCount = allFiles.filter(f => !f.isDisliked).length;

            let html = `
                <button onclick="filterCategory('全部')" class="cat-btn flex-shrink-0 lg:w-full text-left px-3.5 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center justify-between ${currentCategory === '全部' && !currentTagFilter ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'bg-slate-800/60 lg:bg-transparent hover:bg-slate-800 text-slate-300'}">
                    <span>全部</span>
                    <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${validFilesCount}</span>
                </button>
                <div class="flex items-center space-x-1 flex-shrink-0 lg:w-full">
                    <button onclick="filterCategory('我的最愛')" class="cat-btn flex-1 text-left px-3.5 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center justify-between ${currentCategory === '我的最愛' && !currentTagFilter ? 'bg-rose-600/20 text-rose-400 border border-rose-500/30' : 'bg-slate-800/60 lg:bg-transparent hover:bg-slate-800 text-slate-300'}">
                        <span class="flex items-center"><i class="fa-solid fa-heart text-rose-500 mr-2"></i> 我的最愛</span>
                        <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${totalLikedCount}</span>
                    </button>
                    <button onclick="copyFavoriteSongs()" class="p-2 bg-slate-800 hover:bg-rose-600/30 text-slate-400 hover:text-rose-400 border border-slate-700 rounded-xl transition text-xs flex items-center justify-center" title="複製我的最愛到指定目錄">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 1.259-.25 2.45-.71 3.518a.75.75 0 11-1.38-.586c.382-.897.59-1.91.59-2.932 0-2.112-1.748-3.75-3.937-3.75a3.98 3.98 0 00-3.322 1.77.75.75 0 01-1.238 0A3.98 3.98 0 008.437 4.5C6.248 4.5 4.5 6.138 4.5 8.25c0 3.256 2.052 6.132 4.38 8.16a23.684 23.684 0 003.882 2.871l.013.007.004.002.721 1.32-.721-1.32z"/></svg>
                    </button>
                </div>
                <button onclick="filterCategory('Dislike')" class="cat-btn flex-shrink-0 lg:w-full text-left px-3.5 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center justify-between ${currentCategory === 'Dislike' && !currentTagFilter ? 'bg-amber-600/20 text-amber-400 border border-amber-500/30' : 'bg-slate-800/60 lg:bg-transparent hover:bg-slate-800 text-slate-300'}">
                    <span class="flex items-center"><i class="fa-solid fa-thumbs-down text-amber-400 mr-2"></i> 已隱藏</span>

            categories.forEach(cat => {
                const count = allFiles.filter(f => f.category === cat && !f.isDisliked).length;
                const isActive = (currentCategory === cat && !currentTagFilter);

                html += `
                    <div class="flex items-center space-x-1 flex-shrink-0 lg:w-full group">
                        <button onclick="filterCategory('${cat}')" class="cat-btn flex-1 text-left px-3.5 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center justify-between ${isActive ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'bg-slate-800/60 lg:bg-transparent hover:bg-slate-800 text-slate-300'}">
                            <span>${cat}</span>
                            <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${count}</span>
                        </button>
                        ${canDelete ? `<button onclick="deleteCategory('${cat}')" class="opacity-0 group-hover:opacity-100 p-1.5 text-slate-500 hover:text-rose-400 text-xs transition" title="刪除分類"><i class="fa-solid fa-xmark"></i></button>` : ''}

            container.innerHTML = html;
            document.getElementById('count-badge').innerText = `${validFilesCount} 首`;
