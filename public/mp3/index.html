<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 智慧管理與分類系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(51, 65, 85, 0.6) transparent;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.4); border-radius: 9999px; transition: background 0.2s ease; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.6); }

        #mobileDrawer {
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- 頂部導覽列 -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur shrink-0 px-3 md:px-6 py-2.5 flex items-center justify-between gap-3 z-30">
        <div class="flex items-center space-x-2.5">
            <button onclick="toggleMobileDrawer(true)" class="lg:hidden p-2 rounded-xl bg-slate-800/80 text-indigo-400 hover:text-white transition" title="開啟選單與分類">
                <i class="fa-solid fa-bars text-base"></i>
            </button>
            
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 p-1.5 rounded-lg text-white shadow-lg shadow-indigo-500/35 hidden sm:flex">
                    <i class="fa-solid fa-headphones-simple text-sm"></i>
                </div>
                <div>
                    <h1 class="text-xs md:text-base font-bold tracking-wide truncate">MP3 雲端管理</h1>
                    <p class="text-[10px] text-slate-400 hidden sm:block">即時串流、分類與標籤管理</p>
                </div>
            </div>
        </div>

        <!-- 桌面端路徑輸入與載入 -->
        <div class="flex items-center space-x-2">
            <div class="hidden md:flex items-center space-x-2">
                <input type="text" id="dirInput" placeholder="輸入資料夾絕對路徑..." 
                    class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500 w-72 lg:w-96">
                <button onclick="loadFiles(true)" class="bg-indigo-600 hover:bg-indigo-500 px-3.5 py-1.5 rounded-lg text-xs font-medium transition shadow-md whitespace-nowrap">
                    <i class="fa-solid fa-rotate mr-1"></i> 載入
                </button>
            </div>
            <button onclick="loadFiles(false)" class="md:hidden bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white p-2 rounded-xl text-xs transition" title="重新載入">
                <i class="fa-solid fa-rotate"></i>
            </button>
        </div>
    </header>

    <!-- 側邊欄背景遮罩 -->
    <div id="mobileDrawerBackdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden lg:hidden opacity-0 transition-opacity duration-300" onclick="toggleMobileDrawer(false)"></div>

    <!-- 主體內容容器 -->
    <div class="flex-1 max-w-[1920px] w-full mx-auto p-2 sm:p-4 md:p-6 flex gap-4 overflow-hidden pb-20">
        
        <!-- 左側邊欄 -->
        <aside id="mobileDrawer" class="fixed inset-y-0 left-0 w-80 max-w-[85vw] bg-slate-900 border-r border-slate-800 z-50 transform -translate-x-full lg:translate-x-0 lg:static lg:w-72 xl:w-80 lg:bg-transparent lg:border-none flex flex-col h-full shadow-2xl lg:shadow-none shrink-0 overflow-y-auto">
            
            <div class="flex items-center justify-between p-4 border-b border-slate-800 lg:hidden shrink-0">
                <h3 class="font-bold text-sm text-slate-200 flex items-center">
                    <i class="fa-solid fa-sliders text-indigo-400 mr-2"></i> 控制與分類選單
                </h3>
                <button onclick="toggleMobileDrawer(false)" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div id="sidebarContentWrapper" class="flex-1 space-y-3 p-4 lg:p-0 overflow-y-auto pr-1">
                <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 shadow-xl lg:hidden">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-1">資料夾路徑</h2>
                    <div class="space-y-2">
                        <input type="text" id="dirInputMobile" placeholder="輸入資料夾絕對路徑..." 
                            class="w-full bg-slate-800 border border-slate-700 text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500 text-slate-200">
                        <button onclick="syncDirAndLoad()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-xl text-xs font-medium transition shadow-md text-white">
                            <i class="fa-solid fa-folder-open mr-1.5"></i> 載入此路徑檔案
                        </button>
                    </div>
                </div>

                <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 shadow-xl">
                    <div class="flex items-center justify-between mb-2.5 px-1">
                        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">分類標籤</h2>
                        <span id="count-badge" class="text-xs text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded-full border border-indigo-500/30">0 首</span>
                    </div>
                    <div id="categoryFilters" class="flex flex-col space-y-1.5 overflow-y-auto no-scrollbar pb-1 mb-2.5"></div>
                    <div class="flex items-center space-x-1.5 pt-2 border-t border-slate-800/80">
                        <input type="text" id="newCategoryInput" placeholder="新分類名稱..." 
                            class="bg-slate-800 border border-slate-700 text-xs rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-indigo-500 flex-1 text-slate-200"
                            onkeydown="if(event.key==='Enter') addNewCategory()">
                        <button onclick="addNewCategory()" class="bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white border border-slate-700 px-3 py-1.5 rounded-xl text-xs transition" title="新增分類">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>

                <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 shadow-xl">
                    <div class="flex items-center justify-between mb-2 px-1">
                        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">標籤過濾</h2>
                        <button onclick="manageTagsPrompt()" class="text-[11px] text-indigo-400 hover:underline"><i class="fa-solid fa-gear mr-1"></i>管理</button>
                    </div>
                    <div id="tagCloudContainer" class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto"></div>
                </div>

                <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 shadow-xl">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-1">快速搜尋</h2>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋歌名或目錄..." 
                            class="w-full bg-slate-800/80 border border-slate-700 text-xs rounded-xl pl-9 pr-3 py-2 focus:outline-none focus:border-indigo-500 text-slate-200">
                    </div>
                </div>
            </div>
        </aside>

        <!-- 檔案列表主區域 -->
        <main class="flex-1 flex flex-col h-full overflow-hidden min-w-0">
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl shadow-xl flex flex-col h-full overflow-hidden">
                
                <!-- 表格標題列 -->
                <div class="px-3 md:px-5 py-3 border-b border-slate-800 flex justify-between items-center shrink-0 flex-wrap gap-2">
                    <div class="flex items-center space-x-2">
                        <button onclick="toggleMobileDrawer(true)" class="lg:hidden text-indigo-400 bg-indigo-950/50 border border-indigo-500/30 px-2.5 py-1 rounded-lg text-xs font-medium flex items-center space-x-1">
                            <i class="fa-solid fa-filter"></i>
                            <span>分類與篩選</span>
                        </button>
                        <h2 class="font-semibold text-slate-200 hidden sm:flex items-center text-sm md:text-base">
                            <i class="fa-solid fa-list-music mr-2 text-indigo-400"></i> 檔案列表
                        </h2>
                    </div>

                    <div class="flex items-center space-x-2">
                        <span id="fileCountText" class="text-xs text-slate-400">共 0 首</span>

                        <div id="topPaginationBtns" class="flex items-center space-x-1">
                            <button id="topPrevBtn" onclick="goToPage(currentPage - 1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-lg transition disabled:opacity-40">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <span id="topPageIndicator" class="text-xs text-slate-400 font-mono px-1">1 / 1</span>
                            <button id="topNextBtn" onclick="goToPage(currentPage + 1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-lg transition disabled:opacity-40">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>

                        <select id="pageSizeSelect" onchange="changePageSize(this.value)" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2 py-1 text-slate-300 focus:outline-none">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="50">50</option>
                        </select>
                    </div>
                </div>

                <!-- 檔案列表表格 (使用 table-fixed 防止欄位被文字撐開爆版) -->
                <div id="tableContainer" class="flex-1 overflow-y-auto overflow-x-hidden">
                    <table class="w-full text-left border-collapse table-fixed">
                        <thead class="sticky top-0 bg-slate-950/95 backdrop-blur z-10">
                            <tr class="border-b border-slate-800 text-xs text-slate-400 uppercase">
                                <th class="py-2.5 px-3 md:px-5 w-auto">歌名與路徑</th>
                                <th class="py-2.5 px-2 md:px-4 hidden md:table-cell w-28">分類</th>
                                <th class="py-2.5 px-2 md:px-4 hidden lg:table-cell w-20">大小</th>
                                <th class="py-2.5 px-3 md:px-5 text-right w-24">操作</th>
                            </tr>
                        </thead>
                        <tbody id="fileTableBody" class="divide-y divide-slate-800/60 text-sm">
                            <tr>
                                <td colspan="4" class="text-center py-12 text-slate-500">
                                    <i class="fa-solid fa-folder-open text-3xl mb-2 block"></i>
                                    請輸入路徑並點擊「載入」
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 底部完整分頁控制列 -->
                <div id="paginationContainer" class="px-3 md:px-6 py-2.5 border-t border-slate-800/80 flex items-center justify-between bg-slate-950/40 shrink-0 text-xs"></div>
            </div>
        </main>
    </div>

    <!-- 底部固定音訊播放器 -->
    <footer class="fixed bottom-0 left-0 right-0 bg-slate-900/98 backdrop-blur-md border-t border-slate-800 p-2.5 md:p-3 shadow-2xl z-50">
        <div class="max-w-[1920px] mx-auto flex flex-col md:flex-row items-center justify-between gap-2 md:gap-4">
            <div class="flex items-center space-x-3 w-full md:w-1/4">
                <div class="w-9 h-9 md:w-10 md:h-10 rounded-lg bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-400 flex-shrink-0">
                    <i id="playerIcon" class="fa-solid fa-music"></i>
                </div>
                <div class="overflow-hidden">
                    <div id="currentSongTitle" class="text-xs md:text-sm font-medium truncate text-slate-200">尚未選擇播放歌曲</div>
                    <div id="currentSongCategory" class="text-[10px] md:text-xs text-indigo-400">就緒</div>
                </div>
            </div>

            <div class="flex flex-col items-center w-full md:w-2/4 space-y-1">
                <div class="flex items-center space-x-3 md:space-x-4">
                    <button onclick="toggleAutoMode()" id="autoModeBtn" class="text-[11px] px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-400 transition flex items-center space-x-1" title="自動下一首">
                        <i class="fa-solid fa-bolt text-[10px]"></i>
                        <span>自動</span>
                    </button>

                    <button onclick="togglePlayMode()" id="playModeBtn" class="text-slate-400 hover:text-indigo-400 transition p-1" title="播放模式">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>

                    <button onclick="playPrev()" class="text-slate-400 hover:text-white transition p-1" title="上一首"><i class="fa-solid fa-backward-step"></i></button>
                    <button onclick="togglePlay()" id="playPauseBtn" class="w-9 h-9 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg transition" title="播放/暫停">
                        <i class="fa-solid fa-play text-xs"></i>
                    </button>
                    <button onclick="playNext()" class="text-slate-400 hover:text-white transition p-1" title="下一首"><i class="fa-solid fa-forward-step"></i></button>
                    
                    <button id="playerLikeBtn" onclick="togglePlayerLike()" class="text-slate-500 hover:text-rose-400 transition p-1 text-base" title="加入最愛">
                        <i id="playerLikeIcon" class="fa-regular fa-heart"></i>
                    </button>

                    <button id="playerDislikeBtn" onclick="togglePlayerDislike()" class="text-slate-500 hover:text-amber-400 transition p-1 text-base" title="隱藏歌曲">
                        <i id="playerDislikeIcon" class="fa-regular fa-thumbs-down"></i>
                    </button>
                    
                    <span id="modeText" class="text-[10px] text-slate-500 bg-slate-800 px-2 py-0.5 rounded ml-1">循環</span>
                </div>
                
                <div class="w-full flex items-center space-x-2 text-[11px] text-slate-400">
                    <span id="currentTime">00:00</span>
                    <input type="range" id="progressBar" value="0" max="100" step="0.1" onchange="seekAudio(this.value)"
                        class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    <span id="durationTime">00:00</span>
                    <span id="autoTimerText" class="text-[10px] text-amber-400 font-mono hidden whitespace-nowrap"></span>
                </div>
            </div>

            <!-- 音量控制 -->
            <div class="hidden md:flex items-center space-x-3 w-1/4 justify-end">
                <i class="fa-solid fa-volume-high text-slate-400 text-sm"></i>
                <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)"
                        class="w-28 h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>
        </div>
    </footer>

    <!-- 自訂對話框 Modal -->
    <div id="customModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl transform scale-95 transition-transform duration-200" id="modalBox">
            <div class="flex items-center space-x-3 mb-4">
                <div id="modalIconContainer" class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">
                    <i id="modalIcon" class="fa-solid fa-circle-info text-lg"></i>
                </div>
                <div>
                    <h3 id="modalTitle" class="text-base font-bold text-slate-100">提示</h3>
                    <p id="modalSubtitle" class="text-xs text-slate-400">系統通知</p>
                </div>
            </div>
            <div id="modalBody" class="text-sm text-slate-300 mb-6 bg-slate-950/50 p-3.5 rounded-xl border border-slate-800/80"></div>
            <div class="flex items-center justify-end space-x-3">
                <button id="modalCancelBtn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition hidden">取消</button>
                <button id="modalConfirmBtn" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-medium text-white transition shadow-lg shadow-indigo-600/30">確定</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" ontimeupdate="updateProgress()" onended="onAudioEnded()" onerror="onAudioError()"></audio>

    <script>
        let allFiles = [];
        let categories = ['未分類', '流行', '輕音樂', '工作', '其他'];
        let currentCategory = '全部';
        let currentTagFilter = null;
        let currentPlayingFile = null;
        const audioPlayer = document.getElementById('audioPlayer');

        let currentPage = 1;
        let pageSize = 20;
        let playMode = 'loop'; 
        let isAutoMode = false;
        let autoTimer = null;
        let autoCountdownInterval = null;
        let remainingSeconds = 10;

        let lastPauseTime = 0;
        const PAUSE_TO_PLAY_DELAY = 900; 

        const modeIconsSVG = {
            'loop': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>`,
            'shuffle': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>`,
            'single': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><path d="M13 15h-1.5v-3.5H10V10h3v5z"/></svg>`,
            'sequence': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M5 12h11.17l-4.58-4.59L13 6l6 6-6 6-1.41-1.41L16.17 13H5v-2z"/></svg>`
        };

        const modeNames = { 'loop': '循環', 'shuffle': '隨機', 'single': '單曲', 'sequence': '順序' };

        function toggleMobileDrawer(open) {
            const drawer = document.getElementById('mobileDrawer');
            const backdrop = document.getElementById('mobileDrawerBackdrop');
            if (open) {
                drawer.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
                setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
            } else {
                drawer.classList.add('-translate-x-full');
                backdrop.classList.add('opacity-0');
                setTimeout(() => backdrop.classList.add('hidden'), 300);
            }
        }

        function syncDirAndLoad() {
            const mobileInput = document.getElementById('dirInputMobile').value.trim();
            if (mobileInput) {
                document.getElementById('dirInput').value = mobileInput;
            }
            toggleMobileDrawer(false);
            loadFiles(true);
        }

        function getSavedCategories() {
            try {
                const saved = localStorage.getItem('mp3_custom_categories');
                return saved ? JSON.parse(saved) : ['未分類', '流行', '輕音樂', '工作', '其他'];
            } catch (e) { return ['未分類', '流行', '輕音樂', '工作', '其他']; }
        }

        function saveCategories(cats) { localStorage.setItem('mp3_custom_categories', JSON.stringify(cats)); }
        function getTagsMap() { try { return JSON.parse(localStorage.getItem('mp3_tags_map') || '{}'); } catch (e) { return {}; } }
        function saveTagsMap(map) { localStorage.setItem('mp3_tags_map', JSON.stringify(map)); }
        function getLikedMap() { try { return JSON.parse(localStorage.getItem('mp3_liked_map') || '{}'); } catch (e) { return {}; } }
        function saveLikedMap(map) { localStorage.setItem('mp3_liked_map', JSON.stringify(map)); }
        function getDislikedMap() { try { return JSON.parse(localStorage.getItem('mp3_disliked_map') || '{}'); } catch (e) { return {}; } }
        function saveDislikedMap(map) { localStorage.setItem('mp3_disliked_map', JSON.stringify(map)); }

        window.addEventListener('DOMContentLoaded', () => {
            categories = getSavedCategories();
            const params = new URLSearchParams(window.location.search);
            const dirParam = params.get('dir');
            if (dirParam) {
                document.getElementById('dirInput').value = dirParam;
                document.getElementById('dirInputMobile').value = dirParam;
            }
            
            const pageParam = parseInt(params.get('page'));
            if (!isNaN(pageParam) && pageParam > 0) currentPage = pageParam;

            const sizeParam = parseInt(params.get('pageSize'));
            if (!isNaN(sizeParam) && sizeParam > 0) {
                pageSize = sizeParam;
                const sizeSelectEl = document.getElementById('pageSizeSelect');
                if (sizeSelectEl) sizeSelectEl.value = pageSize;
            }

            const savedPlayMode = localStorage.getItem('mp3_last_play_mode');
            if (savedPlayMode && modeNames[savedPlayMode]) {
                playMode = savedPlayMode;
                document.getElementById('playModeBtn').innerHTML = modeIconsSVG[playMode];
                document.getElementById('modeText').innerText = modeNames[savedPlayMode];
            }

            const savedAutoMode = localStorage.getItem('mp3_last_auto_mode');
            if (savedAutoMode === 'true') {
                isAutoMode = true;
                const btn = document.getElementById('autoModeBtn');
                btn.className = 'text-[11px] px-2.5 py-1 rounded-lg border border-amber-500/50 bg-amber-500/20 text-amber-400 transition flex items-center space-x-1 shadow-md';
            }

            const savedVolume = localStorage.getItem('mp3_last_volume');
            if (savedVolume !== null) {
                const vol = parseFloat(savedVolume);
                audioPlayer.volume = vol;
                const volEl = document.getElementById('volumeControl');
                if (volEl) volEl.value = vol;
            }

            initMediaSession();
            initKeyboardShortcuts();
            loadFiles(false);
        });

        function initMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('pause', () => {
                    lastPauseTime = Date.now();
                    if (!audioPlayer.paused) {
                        audioPlayer.pause();
                        clearAutoTimer();
                        updatePlayButton();
                    }
                });

                navigator.mediaSession.setActionHandler('play', () => {
                    const now = Date.now();
                    if (lastPauseTime > 0 && (now - lastPauseTime < PAUSE_TO_PLAY_DELAY)) {
                        lastPauseTime = 0;
                        if (currentPlayingFile) {
                            const file = allFiles.find(f => (f.relativePath || f.filename) === currentPlayingFile);
                            if (file && !file.isLiked) {
                                togglePlayerLike();
                            }
                        }
                        if (audioPlayer.paused) {
                            audioPlayer.play();
                            updatePlayButton();
                            if (isAutoMode) startAutoTimer(10);
                        }
                        return;
                    }

                    lastPauseTime = 0;
                    if (audioPlayer.paused) {
                        audioPlayer.play();
                        updatePlayButton();
                        if (isAutoMode) startAutoTimer(10);
                    }
                });

                navigator.mediaSession.setActionHandler('previoustrack', () => { playPrev(); });
                navigator.mediaSession.setActionHandler('nexttrack', () => { playNext(); });
            }
        }

        function initKeyboardShortcuts() {
            window.addEventListener('keydown', (e) => {
                if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                const key = e.key.toLowerCase();
                if (key === 'l') {
                    togglePlayerLike();
                } else if (key === 'n') {
                    e.preventDefault();
                    playNext();
                } else if (key === 'p') {
                    e.preventDefault();
                    playPrev();
                } else if (key === 'r') {
                    e.preventDefault();
                    loadFiles(false);
                } else if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                }
            });
        }

        function updateMediaSessionMetadata(title) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title || '未知曲目',
                    artist: 'MP3 雲端管理系統',
                    album: document.getElementById('currentSongCategory').innerText || '播放清單'
                });
            }
        }

        function updateUrlParams() {
            const dir = document.getElementById('dirInput').value.trim();
            const params = new URLSearchParams(window.location.search);
            if (dir) params.set('dir', dir);
            params.set('page', currentPage);
            params.set('pageSize', pageSize);
            window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
        }

        async function loadFiles(resetPage = false) {
            const dir = document.getElementById('dirInput').value.trim();
            document.getElementById('dirInputMobile').value = dir;
            if (resetPage) currentPage = 1;
            updateUrlParams();

            try {
                const res = await fetch(`/api/mp3?dir=${encodeURIComponent(dir)}`);
                const data = await res.json();
                
                if (data.success) {
                    const likedMap = getLikedMap();
                    const dislikedMap = getDislikedMap();
                    const tagsMap = getTagsMap();

                    allFiles = data.files.map(f => {
                        const key = f.relativePath || f.filename;
                        return {
                            ...f,
                            isLiked: !!likedMap[key],
                            isDisliked: !!dislikedMap[key],
                            tags: tagsMap[key] || []
                        };
                    });

                    renderCategories();
                    renderTagCloud();
                    renderTable();
                    updatePlayerLikeState();
                    updatePlayerDislikeState();
                    restoreLastPlayedSong();
                } else {
                    await showCustomModal({ title: '載入失敗', message: data.error || '未知錯誤', type: 'error' });
                }
            } catch (err) {
                await showCustomModal({ title: '連線錯誤', message: '無法連線至 API 伺服器', type: 'error' });
            }
        }

        function restoreLastPlayedSong() {
            const lastKey = localStorage.getItem('mp3_last_played_key');
            const lastTitle = localStorage.getItem('mp3_last_played_title');
            const lastTime = parseFloat(sessionStorage.getItem('mp3_last_played_time') || localStorage.getItem('mp3_last_played_time') || '0');

            if (!lastKey || allFiles.length === 0) return;

            const targetFile = allFiles.find(f => (f.relativePath || f.filename) === lastKey);
            if (targetFile) {
                currentPlayingFile = lastKey;
                const dir = document.getElementById('dirInput').value.trim();
                const streamUrl = `/api/mp3?dir=${encodeURIComponent(dir)}&action=stream&filename=${encodeURIComponent(lastKey)}`;
                
                audioPlayer.src = streamUrl;
                const displayName = targetFile.displayName || lastTitle;
                document.getElementById('currentSongTitle').innerText = displayName;
                document.getElementById('currentSongCategory').innerText = targetFile.category || '';

                updateMediaSessionMetadata(displayName);

                audioPlayer.addEventListener('loadedmetadata', function onMeta() {
                    if (!isNaN(audioPlayer.duration) && lastTime < audioPlayer.duration) {
                        audioPlayer.currentTime = lastTime;
                    }
                    audioPlayer.removeEventListener('loadedmetadata', onMeta);
                });

                updatePlayerLikeState();
                updatePlayerDislikeState();
                renderTable();
                updatePlayButton();
            }
        }

        function renderCategories() {
            const container = document.getElementById('categoryFilters');
            const totalLikedCount = allFiles.filter(f => f.isLiked).length;
            const totalDislikedCount = allFiles.filter(f => f.isDisliked).length;
            const validFilesCount = allFiles.filter(f => !f.isDisliked).length;

            let html = `
                <button onclick="filterCategory('全部'); toggleMobileDrawer(false);" class="cat-btn w-full text-left px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center justify-between ${currentCategory === '全部' && !currentTagFilter ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'bg-slate-800/60 hover:bg-slate-800 text-slate-300'}">
                    <span>全部</span>
                    <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${validFilesCount}</span>
                </button>
                <div class="flex items-center space-x-1 w-full">
                    <button onclick="filterCategory('我的最愛'); toggleMobileDrawer(false);" class="cat-btn flex-1 text-left px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center justify-between ${currentCategory === '我的最愛' && !currentTagFilter ? 'bg-rose-600/20 text-rose-400 border border-rose-500/30' : 'bg-slate-800/60 hover:bg-slate-800 text-slate-300'}">
                        <span class="flex items-center"><i class="fa-solid fa-heart text-rose-500 mr-2"></i> 我的最愛</span>
                        <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${totalLikedCount}</span>
                    </button>
                </div>
                <button onclick="filterCategory('Dislike'); toggleMobileDrawer(false);" class="cat-btn w-full text-left px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center justify-between ${currentCategory === 'Dislike' && !currentTagFilter ? 'bg-amber-600/20 text-amber-400 border border-amber-500/30' : 'bg-slate-800/60 hover:bg-slate-800 text-slate-300'}">
                    <span class="flex items-center"><i class="fa-solid fa-thumbs-down text-amber-400 mr-2"></i> 已隱藏 (Dislike)</span>
                    <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${totalDislikedCount}</span>
                </button>
            `;

            categories.forEach(cat => {
                const count = allFiles.filter(f => f.category === cat && !f.isDisliked).length;
                const isActive = (currentCategory === cat && !currentTagFilter);
                const canDelete = (cat !== '未分類');

                html += `
                    <div class="flex items-center space-x-1 w-full group">
                        <button onclick="filterCategory('${cat}'); toggleMobileDrawer(false);" class="cat-btn flex-1 text-left px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center justify-between ${isActive ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'bg-slate-800/60 hover:bg-slate-800 text-slate-300'}">
                            <span>${cat}</span>
                            <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${count}</span>
                        </button>
                        ${canDelete ? `<button onclick="deleteCategory('${cat}')" class="opacity-0 group-hover:opacity-100 p-1 text-slate-500 hover:text-rose-400 text-xs transition" title="刪除分類"><i class="fa-solid fa-xmark"></i></button>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('count-badge').innerText = `${validFilesCount} 首`;
        }

        function filterCategory(cat) {
            currentCategory = cat;
            currentTagFilter = null;
            currentPage = 1;
            updateUrlParams();
            renderCategories();
            renderTagCloud();
            renderTable();
        }

        function getFilteredFiles() {
            const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            return allFiles.filter(f => {
                const key = f.relativePath || f.filename;
                const matchSearch = !query || f.filename.toLowerCase().includes(query) || (f.relativePath && f.relativePath.toLowerCase().includes(query));
                const matchTag = !currentTagFilter || (f.tags && f.tags.includes(currentTagFilter));

                if (currentCategory === 'Dislike') {
                    return f.isDisliked && matchSearch && matchTag;
                }
                
                if (f.isDisliked) return false;

                if (currentCategory === '我的最愛') {
                    return f.isLiked && matchSearch && matchTag;
                }

                if (currentCategory !== '全部') {
                    return f.category === currentCategory && matchSearch && matchTag;
                }

                return matchSearch && matchTag;
            });
        }

        function handleSearch() {
            currentPage = 1;
            renderTable();
        }

        function toggleFileLike(key) {
            const file = allFiles.find(f => (f.relativePath || f.filename) === key);
            if (!file) return;

            file.isLiked = !file.isLiked;
            if (file.isLiked && file.isDisliked) {
                file.isDisliked = false;
                const dislikedMap = getDislikedMap();
                delete dislikedMap[key];
                saveDislikedMap(dislikedMap);
            }

            const likedMap = getLikedMap();
            if (file.isLiked) likedMap[key] = true;
            else delete likedMap[key];
            saveLikedMap(likedMap);

            if (currentPlayingFile === key) {
                updatePlayerLikeState();
                updatePlayerDislikeState();
            }

            renderCategories();
            renderTable();
        }

        function toggleFileDislike(key) {
            const file = allFiles.find(f => (f.relativePath || f.filename) === key);
            if (!file) return;

            file.isDisliked = !file.isDisliked;
            const dislikedMap = getDislikedMap();

            if (file.isDisliked) {
                dislikedMap[key] = true;
                if (file.isLiked) {
                    file.isLiked = false;
                    const likedMap = getLikedMap();
                    delete likedMap[key];
                    saveLikedMap(likedMap);
                }
            } else {
                delete dislikedMap[key];
            }

            saveDislikedMap(dislikedMap);

            if (currentPlayingFile === key) {
                updatePlayerLikeState();
                updatePlayerDislikeState();
                if (file.isDisliked && !audioPlayer.paused) {
                    playNext();
                }
            }

            renderCategories();
            renderTable();
        }

        function togglePlayerLike() {
            if (!currentPlayingFile) return;
            toggleFileLike(currentPlayingFile);
        }

        function togglePlayerDislike() {
            if (!currentPlayingFile) return;
            toggleFileDislike(currentPlayingFile);
        }

        function updatePlayerLikeState() {
            const btn = document.getElementById('playerLikeBtn');
            const icon = document.getElementById('playerLikeIcon');
            if (!currentPlayingFile) {
                btn.classList.add('hidden');
                return;
            }
            btn.classList.remove('hidden');
            const file = allFiles.find(f => (f.relativePath || f.filename) === currentPlayingFile);
            if (file && file.isLiked) {
                btn.className = 'text-rose-500 hover:text-rose-400 transition p-1 text-base';
                icon.className = 'fa-solid fa-heart';
            } else {
                btn.className = 'text-slate-500 hover:text-rose-400 transition p-1 text-base';
                icon.className = 'fa-regular fa-heart';
            }
        }

        function updatePlayerDislikeState() {
            const btn = document.getElementById('playerDislikeBtn');
            const icon = document.getElementById('playerDislikeIcon');
            if (!currentPlayingFile) {
                btn.classList.add('hidden');
                return;
            }
            btn.classList.remove('hidden');
            const file = allFiles.find(f => (f.relativePath || f.filename) === currentPlayingFile);
            if (file && file.isDisliked) {
                btn.className = 'text-amber-400 hover:text-amber-300 transition p-1 text-base';
                icon.className = 'fa-solid fa-thumbs-down';
            } else {
                btn.className = 'text-slate-500 hover:text-amber-400 transition p-1 text-base';
                icon.className = 'fa-regular fa-thumbs-down';
            }
        }

        function renderTable() {
            const filtered = getFilteredFiles();
            const total = filtered.length;
            const totalPages = Math.ceil(total / pageSize) || 1;

            if (currentPage > totalPages) currentPage = totalPages;

            document.getElementById('fileCountText').innerText = `共 ${total} 首`;
            document.getElementById('topPageIndicator').innerText = `${currentPage} / ${totalPages}`;
            document.getElementById('topPrevBtn').disabled = (currentPage <= 1);
            document.getElementById('topNextBtn').disabled = (currentPage >= totalPages);

            const startIdx = (currentPage - 1) * pageSize;
            const pageFiles = filtered.slice(startIdx, startIdx + pageSize);

            const tbody = document.getElementById('fileTableBody');
            if (pageFiles.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center py-12 text-slate-500">
                            <i class="fa-solid fa-compact-disc text-3xl mb-2 block"></i>
                            此分類目前沒有歌曲
                        </td>
                    </tr>`;
                renderPagination(totalPages);
                return;
            }

            let html = '';
            pageFiles.forEach(f => {
                const key = f.relativePath || f.filename;
                const safeIdKey = encodeURIComponent(key).replace(/[%._-]/g, '_');
                const isPlaying = (currentPlayingFile === key);
                const rowBg = isPlaying ? 'bg-indigo-950/40 border-l-4 border-indigo-500' : 'hover:bg-slate-800/40';

                html += `
                    <tr id="row-${safeIdKey}" class="transition ${rowBg}">
                        <!-- 歌名與路徑 (使用 truncate 嚴格限制超出寬度並隱藏分類標籤，避免撐開表格) -->
                        <td class="py-2.5 px-3 md:px-5 truncate">
                            <div class="flex items-center space-x-2.5 min-w-0">
                                <button onclick="playAudio('${encodeURIComponent(key)}')" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white flex items-center justify-center transition shrink-0">
                                    <i class="fa-solid ${isPlaying && !audioPlayer.paused ? 'fa-pause' : 'fa-play'} text-xs"></i>
                                </button>
                                <div class="min-w-0 flex-1">
                                    <div class="font-medium text-slate-200 truncate text-xs sm:text-sm" title="${f.filename}">
                                        <span>${f.displayName || f.filename}</span>
                                    </div>
                                    <div class="text-[10px] text-slate-500 truncate mt-0.5" title="${f.relativePath || ''}">${f.relativePath || ''}</div>
                                </div>
                            </div>
                        </td>
                        <!-- 分類 -->
                        <td class="py-2.5 px-2 md:px-4 hidden md:table-cell truncate">
                            <span class="text-xs bg-slate-800 px-2 py-1 rounded-md text-slate-300 truncate inline-block max-w-full">${f.category || '未分類'}</span>
                        </td>
                        <!-- 大小 -->
                        <td class="py-2.5 px-2 md:px-4 text-xs font-mono text-slate-400 hidden lg:table-cell truncate">
                            ${f.sizeFormatted || '未知'}
                        </td>
                        <!-- 操作按鈕 -->
                        <td class="py-2.5 px-3 md:px-5 text-right whitespace-nowrap">
                            <div class="flex items-center justify-end space-x-1 sm:space-x-2">
                                <button onclick="toggleFileLike('${key}')" class="p-1.5 rounded-lg transition ${f.isLiked ? 'text-rose-500 hover:text-rose-400' : 'text-slate-500 hover:text-slate-300'}" title="${f.isLiked ? '取消最愛' : '加入最愛'}">
                                    <i class="${f.isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                                </button>
                                <button onclick="toggleFileDislike('${key}')" class="p-1.5 rounded-lg transition ${f.isDisliked ? 'text-amber-400 hover:text-amber-300' : 'text-slate-500 hover:text-slate-300'}" title="${f.isDisliked ? '取消隱藏' : '隱藏此歌曲 (Dislike)'}">
                                    <i class="${f.isDisliked ? 'fa-solid' : 'fa-regular'} fa-thumbs-down"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            renderPagination(totalPages);
            
            if (currentPlayingFile) {
                const safeCurrentId = encodeURIComponent(currentPlayingFile).replace(/[%._-]/g, '_');
                const activeRow = document.getElementById(`row-${safeCurrentId}`);
                if (activeRow) {
                    activeRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('paginationContainer');
            if (!container) return;

            let html = `
                <div class="text-xs text-slate-400">第 ${currentPage} / ${totalPages} 頁</div>
                <div class="flex items-center space-x-1">
                    <button onclick="goToPage(1)" ${currentPage <= 1 ? 'disabled' : ''} class="px-2 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 rounded-lg text-xs transition">首頁</button>
                    <button onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''} class="px-2 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 rounded-lg text-xs transition">上一頁</button>
                    <span class="px-2 py-1 text-xs font-mono text-indigo-400">${currentPage}</span>
                    <button onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''} class="px-2 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 rounded-lg text-xs transition">下一頁</button>
                    <button onclick="goToPage(${totalPages})" ${currentPage >= totalPages ? 'disabled' : ''} class="px-2 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 rounded-lg text-xs transition">末頁</button>
                </div>
            `;
            container.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            updateUrlParams();
            renderTable();
        }

        function changePageSize(val) {
            pageSize = parseInt(val);
            currentPage = 1;
            updateUrlParams();
            renderTable();
        }

        function playAudio(encodedKey) {
            const key = decodeURIComponent(encodedKey);
            const dir = document.getElementById('dirInput').value.trim();
            const file = allFiles.find(f => (f.relativePath || f.filename) === key);
            if (!file) return;

            currentPlayingFile = key;
            localStorage.setItem('mp3_last_played_key', key);
            localStorage.setItem('mp3_last_played_title', file.displayName || file.filename);

            const streamUrl = `/api/mp3?dir=${encodeURIComponent(dir)}&action=stream&filename=${encodeURIComponent(key)}`;
            audioPlayer.src = streamUrl;
            audioPlayer.play();

            document.getElementById('currentSongTitle').innerText = file.displayName || file.filename;
            document.getElementById('currentSongCategory').innerText = file.category || '';
            updateMediaSessionMetadata(file.displayName || file.filename);

            updatePlayerLikeState();
            updatePlayerDislikeState();
            renderTable();
            updatePlayButton();

            if (isAutoMode) startAutoTimer(10);
        }

        function togglePlay() {
            if (!audioPlayer.src) {
                const filtered = getFilteredFiles();
                if (filtered.length > 0) {
                    const key = filtered[0].relativePath || filtered[0].filename;
                    playAudio(encodeURIComponent(key));
                }
                return;
            }

            if (audioPlayer.paused) {
                audioPlayer.play();
                if (isAutoMode) startAutoTimer(10);
            } else {
                audioPlayer.pause();
                clearAutoTimer();
            }
            updatePlayButton();
        }

        function updatePlayButton() {
            const btn = document.getElementById('playPauseBtn');
            if (audioPlayer.paused) {
                btn.innerHTML = `<i class="fa-solid fa-play text-xs"></i>`;
            } else {
                btn.innerHTML = `<i class="fa-solid fa-pause text-xs"></i>`;
            }
        }

        function playNext() {
            const filtered = getFilteredFiles();
            if (filtered.length === 0) return;

            let idx = filtered.findIndex(f => (f.relativePath || f.filename) === currentPlayingFile);
            if (playMode === 'shuffle') {
                idx = Math.floor(Math.random() * filtered.length);
            } else {
                idx = (idx + 1) % filtered.length;
            }

            const nextFile = filtered[idx];
            if (nextFile) {
                playAudio(encodeURIComponent(nextFile.relativePath || nextFile.filename));
            }
        }

        function playPrev() {
            const filtered = getFilteredFiles();
            if (filtered.length === 0) return;

            let idx = filtered.findIndex(f => (f.relativePath || f.filename) === currentPlayingFile);
            idx = (idx - 1 + filtered.length) % filtered.length;

            const prevFile = filtered[idx];
            if (prevFile) {
                playAudio(encodeURIComponent(prevFile.relativePath || prevFile.filename));
            }
        }

        function togglePlayMode() {
            const modes = ['loop', 'shuffle', 'single', 'sequence'];
            const curIdx = modes.indexOf(playMode);
            playMode = modes[(curIdx + 1) % modes.length];
            localStorage.setItem('mp3_last_play_mode', playMode);

            document.getElementById('playModeBtn').innerHTML = modeIconsSVG[playMode];
            document.getElementById('modeText').innerText = modeNames[playMode];
        }

        function toggleAutoMode() {
            isAutoMode = !isAutoMode;
            localStorage.setItem('mp3_last_auto_mode', isAutoMode);

            const btn = document.getElementById('autoModeBtn');
            if (isAutoMode) {
                btn.className = 'text-[11px] px-2.5 py-1 rounded-lg border border-amber-500/50 bg-amber-500/20 text-amber-400 transition flex items-center space-x-1 shadow-md';
                if (!audioPlayer.paused) startAutoTimer(10);
            } else {
                btn.className = 'text-[11px] px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-400 transition flex items-center space-x-1';
                clearAutoTimer();
            }
        }

        function startAutoTimer(seconds) {
            clearAutoTimer();
            remainingSeconds = seconds;
            const timerEl = document.getElementById('autoTimerText');
            timerEl.classList.remove('hidden');
            timerEl.innerText = `${remainingSeconds}s`;

            autoCountdownInterval = setInterval(() => {
                remainingSeconds--;
                if (remainingSeconds <= 0) {
                    clearAutoTimer();
                    playNext();
                } else {
                    timerEl.innerText = `${remainingSeconds}s`;
                }
            }, 1000);
        }

        function clearAutoTimer() {
            if (autoCountdownInterval) clearInterval(autoCountdownInterval);
            autoCountdownInterval = null;
            const timerEl = document.getElementById('autoTimerText');
            if (timerEl) timerEl.classList.add('hidden');
        }

        function onAudioEnded() {
            if (playMode === 'single') {
                audioPlayer.currentTime = 0;
                audioPlayer.play();
            } else {
                playNext();
            }
        }

        function onAudioError() {
            console.warn('音訊載入錯誤，自動切換至下一首...');
            clearAutoTimer();
            setTimeout(() => { playNext(); }, 500);
        }

        function updateProgress() {
            if (!isNaN(audioPlayer.currentTime)) {
                sessionStorage.setItem('mp3_last_played_time', audioPlayer.currentTime);
                const cur = audioPlayer.currentTime;
                const dur = audioPlayer.duration || 0;

                document.getElementById('currentTime').innerText = formatTime(cur);
                document.getElementById('durationTime').innerText = formatTime(dur);
                if (dur > 0) {
                    document.getElementById('progressBar').value = (cur / dur) * 100;
                }
            }
        }

        function seekAudio(percent) {
            if (!isNaN(audioPlayer.duration)) {
                audioPlayer.currentTime = (percent / 100) * audioPlayer.duration;
            }
        }

        function changeVolume(val) {
            audioPlayer.volume = parseFloat(val);
            localStorage.setItem('mp3_last_volume', val);
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function renderTagCloud() {}
        function manageTagsPrompt() {}

        function showCustomModal({ title, message, type = 'info', confirmText = '確定', cancelText = '取消' }) {
            return new Promise((resolve) => {
                const modal = document.getElementById('customModal');
                const modalBox = document.getElementById('modalBox');
                const titleEl = document.getElementById('modalTitle');
                const bodyEl = document.getElementById('modalBody');
                const confirmBtn = document.getElementById('modalConfirmBtn');
                const cancelBtn = document.getElementById('modalCancelBtn');

                titleEl.innerText = title;
                bodyEl.innerText = message;
                confirmBtn.innerText = confirmText;

                if (type === 'danger' || type === 'confirm') {
                    cancelBtn.classList.remove('hidden');
                    cancelBtn.innerText = cancelText;
                } else {
                    cancelBtn.classList.add('hidden');
                }

                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalBox.classList.remove('scale-95');
                }, 10);

                confirmBtn.onclick = () => {
                    modal.classList.add('opacity-0');
                    modalBox.classList.add('scale-95');
                    setTimeout(() => { modal.classList.add('hidden'); resolve(true); }, 200);
                };

                cancelBtn.onclick = () => {
                    modal.classList.add('opacity-0');
                    modalBox.classList.add('scale-95');
                    setTimeout(() => { modal.classList.add('hidden'); resolve(false); }, 200);
                };
            });
        }
    </script>

    <!-- ==================== 多用戶外挂 (完整整合版) ==================== -->
    <script>
    (function() {
        const STORAGE_KEYS = {
            USERS: 'mp3_plugin_users_list',
            CURRENT_USER: 'mp3_plugin_current_user',
            DEFAULT_USER_NAME: '預設用戶'
        };

        let usersList = ['預設用戶'];
        let currentUser = '預設用戶';

        function initPluginStorage() {
            const savedUsers = localStorage.getItem(STORAGE_KEYS.USERS);
            if (savedUsers) {
                try { usersList = JSON.parse(savedUsers); } catch(e) {}
            } else {
                localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(usersList));
            }

            const lastUser = localStorage.getItem(STORAGE_KEYS.CURRENT_USER);
            if (lastUser && usersList.includes(lastUser)) {
                currentUser = lastUser;
            } else {
                currentUser = usersList[0];
                localStorage.setItem(STORAGE_KEYS.CURRENT_USER, currentUser);
            }
        }

        function getStorageKeyForUser(username) {
            if (username === STORAGE_KEYS.DEFAULT_USER_NAME) {
                return 'mp3_liked_map';
            }
            return `mp3_${username}_liked_map`;
        }

        function getUserLikesMap(username) {
            const key = getStorageKeyForUser(username);
            try {
                return JSON.parse(localStorage.getItem(key) || '{}');
            } catch(e) { return {}; }
        }

        function saveUserLikesMap(username, map) {
            const key = getStorageKeyForUser(username);
            localStorage.setItem(key, JSON.stringify(map));
        }

        function injectUserUI() {
            const drawerContent = document.getElementById('sidebarContentWrapper');
            if (!drawerContent) return;

            const userSection = document.createElement('div');
            userSection.className = 'bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 shadow-xl mb-3';
            userSection.innerHTML = `
                <div class="flex items-center justify-between mb-2 px-1">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center">
                        <i class="fa-solid fa-user-shield text-indigo-400 mr-1.5"></i> 多用戶管理
                    </h2>
                    <button onclick="window.pluginOpenManageModal()" class="text-[11px] text-indigo-400 hover:underline"><i class="fa-solid fa-gear mr-1"></i>管理</button>
                </div>
                <div class="flex items-center space-x-2">
                    <select id="pluginUserSelect" onchange="window.pluginSwitchUser(this.value)" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-xl px-3 py-1.5 focus:outline-none focus:border-indigo-500 font-medium flex-1">
                        ${usersList.map(u => `<option value="${u}" ${u === currentUser ? 'selected' : ''}>${u}</option>`).join('')}
                    </select>
                    <button onclick="window.pluginPromptAddUser()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1.5 rounded-xl text-xs transition shadow" title="新增用戶">
                        <i class="fa-solid fa-user-plus"></i>
                    </button>
                </div>
            `;
            drawerContent.insertBefore(userSection, drawerContent.firstChild);
        }

        window.pluginSwitchUser = function(username) {
            currentUser = username;
            localStorage.setItem(STORAGE_KEYS.CURRENT_USER, username);
            if (typeof window.loadFiles === 'function') {
                window.loadFiles(false);
            }
        };

        window.pluginPromptAddUser = async function() {
            if (typeof window.showCustomModal === 'function') {
                const newName = await window.showCustomModal({
                    title: '登記新用戶',
                    message: '請輸入新用戶名稱（無需密碼）：',
                    type: 'confirm',
                    isPrompt: true,
                    defaultValue: '',
                    confirmText: '新增並切換'
                });

                if (!newName || !newName.trim()) return;
                const trimmed = newName.trim();

                if (trimmed === STORAGE_KEYS.DEFAULT_USER_NAME) {
                    alert('「預設用戶」為系統保留名稱！');
                    return;
                }

                if (!usersList.includes(trimmed)) {
                    usersList.push(trimmed);
                    localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(usersList));
                }
                
                refreshUserSelects();
                window.pluginSwitchUser(trimmed);
            }
        };

        function refreshUserSelects() {
            const selectEl = document.getElementById('pluginUserSelect');
            if (selectEl) {
                selectEl.innerHTML = usersList.map(u => `<option value="${u}" ${u === currentUser ? 'selected' : ''}>${u}</option>`).join('');
            }
        }

        window.pluginOpenManageModal = function() {
            let modal = document.getElementById('pluginUserManageModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'pluginUserManageModal';
                modal.className = 'fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center';
                document.body.appendChild(modal);
            }

            let usersHtml = usersList.map(u => {
                const userLikes = getUserLikesMap(u);
                const likeCount = Object.keys(userLikes).length;
                const isCurrent = u === currentUser;
                const isDefault = u === STORAGE_KEYS.DEFAULT_USER_NAME;

                return `
                    <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-3 rounded-xl">
                        <div>
                            <div class="font-semibold text-sm text-slate-200 flex items-center">
                                ${u} 
                                ${isCurrent ? '<span class="ml-2 text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded-full">當前</span>' : ''}
                                ${isDefault ? '<span class="ml-2 text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">系統預設</span>' : ''}
                            </div>
                            <div class="text-xs text-slate-400 mt-0.5">已收藏 ${likeCount} 首歌</div>
                        </div>
                        <div class="flex items-center space-x-1.5">
                            ${!isDefault ? `<button onclick="window.pluginRenameUser('${u}')" class="px-2.5 py-1 bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white rounded-lg text-xs transition">改名</button>` : ''}
                            <button onclick="window.pluginExportUser('${u}')" class="px-2.5 py-1 bg-slate-800 hover:bg-emerald-600 text-slate-300 hover:text-white rounded-lg text-xs transition">匯出</button>
                            <button onclick="window.pluginMergeUserPrompt('${u}')" class="px-2.5 py-1 bg-slate-800 hover:bg-amber-600 text-slate-300 hover:text-white rounded-lg text-xs transition">合併</button>
                            ${!isDefault && usersList.length > 1 ? `<button onclick="window.pluginDeleteUser('${u}')" class="px-2.5 py-1 bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white rounded-lg text-xs transition">刪除</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            modal.innerHTML = `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl flex flex-col max-h-[85vh]">
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                        <h3 class="text-base font-bold text-slate-100 flex items-center">
                            <i class="fa-solid fa-users-gear text-indigo-400 mr-2"></i> 用戶管理中心
                        </h3>
                        <button onclick="document.getElementById('pluginUserManageModal').remove()" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    
                    <div class="space-y-3 overflow-y-auto flex-1 pr-1 mb-4">
                        ${usersHtml}
                    </div>

                    <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
                        <button onclick="window.pluginImportUserPrompt()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-xl transition">
                            <i class="fa-solid fa-file-import mr-1"></i> 匯入用戶資料
                        </button>
                        <button onclick="document.getElementById('pluginUserManageModal').remove()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-medium text-white rounded-xl transition">
                            關閉
                        </button>
                    </div>
                </div>
            `;
        };

        window.pluginRenameUser = async function(oldName) {
            if (oldName === STORAGE_KEYS.DEFAULT_USER_NAME) return;
            const newName = prompt(`請輸入「${oldName}」的新名稱：`, oldName);
            if (!newName || !newName.trim() || newName.trim() === oldName) return;
            const trimmed = newName.trim();

            if (trimmed === STORAGE_KEYS.DEFAULT_USER_NAME || usersList.includes(trimmed)) {
                alert('此用戶名稱無效或已存在！');
                return;
            }

            const oldKey = getStorageKeyForUser(oldName);
            const newKey = getStorageKeyForUser(trimmed);
            const data = localStorage.getItem(oldKey);
            if (data) {
                localStorage.setItem(newKey, data);
                localStorage.removeItem(oldKey);
            }

            usersList = usersList.map(u => u === oldName ? trimmed : u);
            localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(usersList));

            if (currentUser === oldName) {
                currentUser = trimmed;
                localStorage.setItem(STORAGE_KEYS.CURRENT_USER, currentUser);
            }

            refreshUserSelects();
            window.pluginOpenManageModal();
            if (typeof window.loadFiles === 'function') window.loadFiles(false);
        };

        window.pluginDeleteUser = async function(username) {
            if (username === STORAGE_KEYS.DEFAULT_USER_NAME) {
                alert('「預設用戶」不能被刪除！');
                return;
            }
            if (!confirm(`確定要刪除用戶「${username}」嗎？`)) return;

            usersList = usersList.filter(u => u !== username);
            localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(usersList));

            const key = getStorageKeyForUser(username);
            localStorage.removeItem(key);

            if (currentUser === username) {
                currentUser = STORAGE_KEYS.DEFAULT_USER_NAME;
                localStorage.setItem(STORAGE_KEYS.CURRENT_USER, currentUser);
            }

            refreshUserSelects();
            window.pluginOpenManageModal();
            if (typeof window.loadFiles === 'function') window.loadFiles(false);
        };

        window.pluginExportUser = function(username) {
            const likes = getUserLikesMap(username);
            const userData = { username, likes };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `mp3_user_${username}_liked_map.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        };

        window.pluginImportUserPrompt = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = event => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (!imported.username || !imported.likes) {
                            alert('匯入失敗：檔案格式不正確！');
                            return;
                        }

                        let targetUser = imported.username;
                        if (targetUser === STORAGE_KEYS.DEFAULT_USER_NAME || usersList.includes(targetUser)) {
                            targetUser = targetUser + '_import_' + Date.now().toString().slice(-4);
                        }

                        usersList.push(targetUser);
                        localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(usersList));
                        saveUserLikesMap(targetUser, imported.likes);

                        refreshUserSelects();
                        window.pluginOpenManageModal();
                        alert(`成功匯入用戶「${targetUser}」！`);
                        if (typeof window.loadFiles === 'function') window.loadFiles(false);
                    } catch(err) {
                        alert('解析 JSON 檔案失敗！');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        };

        window.pluginMergeUserPrompt = function(sourceUser) {
            const otherUsers = usersList.filter(u => u !== sourceUser);
            if (otherUsers.length === 0) {
                alert('沒有其他用戶可供合併！');
                return;
            }

            const targetUser = prompt(`請選擇要將「${sourceUser}」的 Like 記錄合併到哪一個用戶？\n現有其他用戶：${otherUsers.join(', ')}`);
            if (!targetUser || !otherUsers.includes(targetUser.trim())) {
                if (targetUser) alert('輸入的目標用戶不存在！');
                return;
            }

            const target = targetUser.trim();
            if (!confirm(`確定要將「${sourceUser}」的所有 Like 合併到「${target}」嗎？`)) return;

            const sourceLikes = getUserLikesMap(sourceUser);
            const targetLikes = getUserLikesMap(target);

            Object.keys(sourceLikes).forEach(songKey => {
                targetLikes[songKey] = true;
            });

            saveUserLikesMap(target, targetLikes);
            localStorage.removeItem(getStorageKeyForUser(sourceUser));

            usersList = usersList.filter(u => u !== sourceUser);
            localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(usersList));

            if (currentUser === sourceUser) {
                currentUser = target;
                localStorage.setItem(STORAGE_KEYS.CURRENT_USER, currentUser);
            }

            refreshUserSelects();
            window.pluginOpenManageModal();
            alert(`成功合併至 「${target}」！`);
            if (typeof window.loadFiles === 'function') window.loadFiles(false);
        };

        function overrideCoreFunctions() {
            window.getLikedMap = function() {
                return getUserLikesMap(currentUser);
            };

            const originalRenderTable = window.renderTable;
            if (typeof originalRenderTable === 'function') {
                window.renderTable = function() {
                    originalRenderTable();
                    
                    if (window.allFiles && window.allFiles.length > 0) {
                        window.allFiles.forEach(file => {
                            const fileKey = file.relativePath || file.filename;
                            const safeIdKey = encodeURIComponent(fileKey).replace(/[%._-]/g, '_');
                            const row = document.getElementById(`row-${safeIdKey}`);
                            if (row) {
                                const likedUsers = [];
                                usersList.forEach(u => {
                                    const map = getUserLikesMap(u);
                                    if (map && map[fileKey]) {
                                        likedUsers.push(u);
                                    }
                                });

                                if (likedUsers.length > 0) {
                                    const titleContainer = row.querySelector('.flex.items-center.space-x-2.5');
                                    if (titleContainer && !titleContainer.querySelector('.plugin-likes-badge')) {
                                        const badge = document.createElement('span');
                                        badge.className = 'plugin-likes-badge text-[10px] text-rose-400 bg-rose-950/40 border border-rose-500/30 px-1.5 py-0.5 rounded ml-2';
                                        badge.title = `按讚用戶: ${likedUsers.join(', ')}`;
                                        badge.innerHTML = `<i class="fa-solid fa-heart mr-1"></i>${likedUsers.length}`;
                                        titleContainer.appendChild(badge);
                                    }
                                }
                            }
                        });
                    }
                };
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initPluginStorage();
            injectUserUI();
            setTimeout(overrideCoreFunctions, 100);
        });

    })();
    </script>
