                set currentCategory(v) { currentCategory = v; },
                get currentPage() { return currentPage; },
                set currentPage(v) { currentPage = v; },
                get pageSize() { return pageSize; },
                get audioPlayer() { return audioPlayer; },

                renderAll() {
                    call('renderCategories');
                    call('renderTagCloud');
                    call('renderTable');
                },
                renderTable: (...a) => call('renderTable', ...a),
                renderCategories: (...a) => call('renderCategories', ...a),
                renderTagCloud: (...a) => call('renderTagCloud', ...a),
                updatePlayButton: (...a) => call('updatePlayButton', ...a),
                updatePlayerLikeState: (...a) => call('updatePlayerLikeState', ...a),
                updatePlayerDislikeState: (...a) => call('updatePlayerDislikeState', ...a),

                saveCategories: (...a) => call('saveCategories', ...a),
                getLikedMap: () => (typeof getLikedMap === 'function' ? getLikedMap() : {}),
                getDislikedMap: () => (typeof getDislikedMap === 'function' ? getDislikedMap() : {}),
                saveLikedMap: (...a) => call('saveLikedMap', ...a),
                saveDislikedMap: (...a) => call('saveDislikedMap', ...a),
                saveTagsMap: (...a) => call('saveTagsMap', ...a),

                parseLikedAt,
                formatLikedAtDate,
                formatLikedAtFull,
                getFileKey,
                getFileRequestParams,
                getCurrentDir: window.MP3GetCurrentDir,
                getMp3ApiBase: window.MP3GetMp3ApiBase
            };
        })();
        console.log('[MP3AppExtension] ready v' + window.MP3AppExtension.version);
    </script>

    <script>
        window.MP3SourceRegistry = window.MP3SourceRegistry || {
            local: { label: '本地', icon: 'fa-solid fa-hard-drive', badgeClass: 'bg-slate-800/80 text-slate-300 border-slate-600/60', dotClass: 'bg-slate-400' },
            gdrive: { label: 'Drive', icon: 'fa-brands fa-google-drive', badgeClass: 'bg-emerald-950/50 text-emerald-300 border-emerald-500/30', dotClass: 'bg-emerald-400' },
            news: { label: 'News', icon: 'fa-solid fa-newspaper', badgeClass: 'bg-amber-950/50 text-amber-300 border-amber-500/30', dotClass: 'bg-amber-400' }
        };

        window.MP3GetSourceMeta = function(file) {
            const key = (file && file._source) || 'local';
            const meta = window.MP3SourceRegistry[key];
            if (meta) return Object.assign({ key }, meta);
            return { key, label: key, icon: 'fa-solid fa-cloud', badgeClass: 'bg-indigo-950/50 text-indigo-300 border-indigo-500/30', dotClass: 'bg-indigo-400' };
        };

        window.MP3RenderSourceBadge = function(file) {
            const meta = window.MP3GetSourceMeta(file);
            return `<span class="source-badge inline-flex items-center gap-1 px-1.5 py-0.5 rounded border text-[10px] font-medium shrink-0 ${meta.badgeClass}" title="来源：${escapeHtmlAttr(meta.label)}">
                <i class="${meta.icon} text-[9px]"></i><span>${escapeHtmlAttr(meta.label)}</span>
            </span>`;
        };

        window.MP3SetPlayerSourceBadge = function(file) {
            const el = document.getElementById('currentSongSourceBadge');
            if (!el) return;
            if (!file) { el.classList.add('hidden'); return; }
            const meta = window.MP3GetSourceMeta(file);
            el.className = `inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded border text-[10px] font-medium shrink-0 ${meta.badgeClass}`;
            el.innerHTML = `<i class="${meta.icon} text-[9px]"></i>${escapeHtmlAttr(meta.label)}`;
            el.classList.remove('hidden');
        };

        window.currentSourceFilter = 'all';

        window.refreshSourceFilterOptions = function() {
            const sel = document.getElementById('sourceFilter');
            if (!sel) return;
            const files = (window.MP3AppExtension && window.MP3AppExtension.allFiles) || [];
            const present = new Set();
            if (files.length === 0) present.add('local');
            else files.forEach(f => present.add(f._source || 'local'));

            while (sel.options.length > 1) sel.remove(1);
            const orderedKeys = Object.keys(window.MP3SourceRegistry || {});
            const presentArr = [...present].sort((a, b) => {
                const ia = orderedKeys.indexOf(a);
                const ib = orderedKeys.indexOf(b);
                return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
            });
            presentArr.forEach(key => {
                const meta = window.MP3GetSourceMeta({ _source: key });
                const opt = document.createElement('option');
                opt.value = key; opt.textContent = meta.label;
                sel.appendChild(opt);
            });
            if (window.currentSourceFilter !== 'all' && !present.has(window.currentSourceFilter)) {
                window.currentSourceFilter = 'all';
                sel.value = 'all';
            } else sel.value = window.currentSourceFilter;
        };

        window.handleSourceFilterChange = function(value) {
            window.currentSourceFilter = value;
            currentPage = 1;
            renderTable();
        };
    </script>

    <script>
    (function() {
        'use strict';

        const REGISTRY = {
            local: {
                id: 'local',
                name: '本地目錄',
                description: '支援多個 API 端點與多個目錄',
                icon: 'fa-solid fa-folder-open',
                iconClass: 'text-slate-400',
                scriptSrc: 'local-plugin.js',
                globalVar: 'MP3LocalPlugin',
                autoEnable: true
            },
            multiUser: {
                id: 'multiUser',
                name: '多用戶',
                description: '每個用戶獨立的 Like 記憶，支持切換、導入導出',
                icon: 'fa-solid fa-user-shield',
                iconClass: 'text-indigo-400',
                scriptSrc: 'multi-user-plugin.js',
                globalVar: 'MP3MultiUserPlugin',
                autoEnable: true
            },
            news: {
                id: 'news',
                name: 'News 播放列表',
                description: '通過 /api/mp3/news 加載新聞音頻（m3u8）',
                icon: 'fa-solid fa-newspaper',
                iconClass: 'text-amber-400',
                scriptSrc: 'news-plugin.js',
                globalVar: 'MP3NewsPlugin'
            },
            gdrive: {
                id: 'gdrive',
                name: 'Google Drive 音樂',
                description: '從 Drive 的 music/fav 加載音樂、備份數據',
                icon: 'fa-brands fa-google-drive',
                iconClass: 'text-emerald-400',
                scriptSrc: 'google-drive-plugin.js',
                globalVar: 'MP3GoogleDrivePlugin'
            }
        };

        const STORAGE_KEY = 'mp3_enabled_dynamic_plugins';
        const enabled = new Set();
        const storedRaw = localStorage.getItem(STORAGE_KEY);

        if (storedRaw === null) {
            Object.values(REGISTRY).forEach(meta => { if (meta.autoEnable) enabled.add(meta.id); });
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...enabled])); } catch (e) {}
        } else {
            try {
                const parsed = JSON.parse(storedRaw);
                if (Array.isArray(parsed)) parsed.forEach(id => { if (REGISTRY[id]) enabled.add(id); });
            } catch (e) {}
        }

        const loadedPlugins = {};
        const loadedScripts = new Set();
        let uiRoot = null;

        function persist() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...enabled])); } catch(e) {}
        }
        function loadScriptOnce(src) {
            if (loadedScripts.has(src)) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.dataset.pluginSrc = src;
                s.onload = () => { loadedScripts.add(src); resolve(); };
                s.onerror = () => reject(new Error('無法加載插件腳本：' + src));
                document.head.appendChild(s);
            });
        }
        async function enablePlugin(id) {
            const meta = REGISTRY[id];
            if (!meta) throw new Error('未知插件：' + id);
            if (loadedPlugins[id]) return loadedPlugins[id];
            await loadScriptOnce(meta.scriptSrc);
            const plugin = window[meta.globalVar];
            if (!plugin) throw new Error('插件未暴露全局變量：' + meta.globalVar);
            if (typeof plugin.init !== 'function') {
                const v = plugin.version || '未知';
                throw new Error(`插件「${meta.name}」版本 ${v} 缺少 init() 方法。請檢查 ${meta.scriptSrc} 是否為最新版本。`);
            }
            await plugin.init();
            loadedPlugins[id] = plugin;
            enabled.add(id);
            persist();
            return plugin;
        }
        async function disablePlugin(id) {
            const plugin = loadedPlugins[id];
            if (plugin && typeof plugin.unload === 'function') {
                try { await plugin.unload(); } catch(e) { console.error('[PluginManager] unload error:', e); }
            }
            delete loadedPlugins[id];
            enabled.delete(id);
            persist();
        }

        function injectUI() {
            const slot = document.getElementById('pluginSlot');
            if (!slot) { setTimeout(injectUI, 200); return; }
            if (uiRoot) return;

            uiRoot = document.createElement('div');
            uiRoot.id = 'pluginManagerCard';
            uiRoot.className = 'bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl';

            const itemsHtml = Object.values(REGISTRY).map(meta => `
                <div class="plugin-item py-2 border-b border-slate-800/60 last:border-none">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <i class="${meta.icon} ${meta.iconClass || 'text-indigo-400'} text-sm shrink-0"></i>
                            <div class="min-w-0">
                                <div class="text-xs text-slate-200 font-medium truncate">${escapeHtmlAttr(meta.name)}</div>
                                <div class="text-[10px] text-slate-500 truncate">${escapeHtmlAttr(meta.description)}</div>
                            </div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer shrink-0">
                            <input type="checkbox" class="plugin-toggle sr-only peer" data-plugin-id="${meta.id}" ${enabled.has(meta.id) ? 'checked' : ''}>
                            <div class="w-9 h-5 bg-slate-700 rounded-full peer peer-checked:bg-indigo-600 transition"></div>
                            <span class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full transition peer-checked:translate-x-4"></span>
                        </label>
                    </div>
                    <div class="plugin-body mt-2" data-plugin-id="${meta.id}"></div>
                </div>
            `).join('');

            uiRoot.innerHTML = `
                <div class="flex items-center justify-between mb-1 px-1">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center">
                        <i class="fa-solid fa-puzzle-piece text-indigo-400 mr-1.5"></i> 插件中心
                    </h2>
                    <span class="text-[10px] text-slate-600">按需加載</span>
                </div>
                ${itemsHtml}
            `;
            slot.appendChild(uiRoot);

            uiRoot.querySelectorAll('.plugin-toggle').forEach(toggle => {
                toggle.addEventListener('change', async (e) => {
                    const id = e.target.dataset.pluginId;
                    const on = e.target.checked;
                    try {
                        if (on) await enablePlugin(id);
                        else await disablePlugin(id);
                        if (typeof window.refreshSourceFilterOptions === 'function') window.refreshSourceFilterOptions();
                    } catch (err) {
                        console.error('[PluginManager] toggle failed:', id, err);
                        e.target.checked = !on;
                    }
                });
            });
        }

        async function restoreAll() {
            const order = Object.keys(REGISTRY).sort((a, b) => {
                const rank = id => id === 'multiUser' ? 0 : id === 'local' ? 1 : 2;
                return rank(a) - rank(b);
            });
            for (const id of order) {
                if (!enabled.has(id)) continue;
                try { await enablePlugin(id); }
                catch (e) { console.error('[PluginManager] restore failed:', id, e); enabled.delete(id); }
            }
            persist();
        }

        window.MP3PluginManager = {
            REGISTRY,
            enable: enablePlugin,
            disable: disablePlugin,
            isEnabled: (id) => enabled.has(id),
            isLoaded: (id) => !!loadedPlugins[id],
            getBodyContainer(id) {
                return uiRoot ? uiRoot.querySelector(`.plugin-body[data-plugin-id="${id}"]`) : null;
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(async () => {
                injectUI();
                await restoreAll();
                if (typeof window.refreshSourceFilterOptions === 'function') window.refreshSourceFilterOptions();
            }, 400);
        });
    })();
    </script>

</body>
