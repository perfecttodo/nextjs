<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>SparkFlow 灵流 — 随手记灵感，一步转目标</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '"Noto Sans SC"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }

    /* ==================== 核心修复：应用外壳固定视口，内部容器各自滚动 ==================== */
    html {
      height: 100%;
      max-width: 100vw;
      overflow: hidden;              /* 关闭文档级滚动，消除多层 overflow 冲突 */
      -webkit-text-size-adjust: 100%;
    }
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;              /* 与 html 一致，杜绝“滚动容器错位” */
      overscroll-behavior: none;
    }

    /* 右侧主区域：撑满视口高度，纵向 flex 布局 */
    #rightContainer {
      height: 100vh;
      height: 100dvh;                /* 移动端地址栏动态变化时更准确 */
      min-height: 0;
      overflow: hidden;
    }

    /* 主内容滚动容器（关键） */
    #appMain {
      flex: 1 1 auto;
      min-height: 0;                 /* flex 子项必须归零，否则永远不会滚动 */
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding-bottom: calc(104px + env(safe-area-inset-bottom)); /* 为悬浮底栏留出空间 */
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, .55) transparent;
    }
    /* 桌面端显示细滚动条，让用户明确感知“这里有更多内容” */
    #appMain::-webkit-scrollbar { width: 8px; height: 8px; }
    #appMain::-webkit-scrollbar-track { background: transparent; }
    #appMain::-webkit-scrollbar-thumb {
      background-color: rgba(148, 163, 184, .45);
      border-radius: 9999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    #appMain::-webkit-scrollbar-thumb:hover {
      background-color: rgba(100, 116, 139, .65);
      background-clip: content-box;
    }
    @media (min-width: 768px) {
      #appMain { padding-bottom: 100px; }
    }
    /* 触摸设备上隐藏滚动条视觉，但仍可流畅滚动 */
    @media (hover: none) and (pointer: coarse) {
      #appMain { scrollbar-width: none; }
      #appMain::-webkit-scrollbar { display: none; }
    }

    .pb-safe { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes voiceWave {
      0%, 100% { transform: scaleY(0.28); }
      50% { transform: scaleY(1); }
    }
    .wave-active { animation: voiceWave 0.7s ease-in-out infinite; transform-origin: center; }

    @keyframes sheetSlideUp {
      from { transform: translateY(100%); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-sheet-up { animation: sheetSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes popIn {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .animate-pop-in { animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .swipe-card-inner {
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: transform;
    }
    .swipe-card-inner.dragging { transition: none; }

    /* 侧栏：独立高度与滚动 */
    #sidebar {
      height: 100vh;
      height: 100dvh;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #sidebarPluginsList {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    .right-container, nav.fixed {
      transition: margin-left 0.3s cubic-bezier(0.16, 1, 0.3, 1), left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-[#07090F] dark:text-slate-100 antialiased selection:bg-indigo-500/20">

  <div id="sidebarBackdrop" class="fixed inset-0 z-40 hidden bg-slate-950/50 backdrop-blur-xs md:hidden transition-opacity" onclick="closeSidebar()"></div>

  <aside id="sidebar" class="fixed top-0 left-0 z-50 h-full w-72 bg-white dark:bg-[#0F1320] border-r border-slate-200 dark:border-slate-800 transform -translate-x-full md:translate-x-0 flex flex-col shadow-2xl md:shadow-none">
    <div class="h-16 flex items-center justify-between px-4 border-b border-slate-200 dark:border-slate-800 shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-sm">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
        </div>
        <span class="font-bold text-base tracking-tight">插件与设置</span>
      </div>
      <div class="flex items-center gap-1">
        <button id="collapseSidebarBtn" class="hidden md:flex w-8 h-8 rounded-lg items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="收起侧栏">
          <i data-lucide="panel-left-close" class="w-4 h-4"></i>
        </button>
        <button id="closeSidebarBtn" class="md:hidden w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <div class="p-3 space-y-1 shrink-0">
      <button onclick="switchNav('clues'); closeSidebar()" class="nav-sidebar-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-nav="clues">
        <i data-lucide="inbox" class="w-4 h-4"></i> 线索库
      </button>
      <button onclick="switchNav('goals'); closeSidebar()" class="nav-sidebar-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" data-nav="goals">
        <i data-lucide="target" class="w-4 h-4"></i> 工作目标
      </button>
    </div>

    <div class="px-4 py-2 border-t border-slate-200 dark:border-slate-800 shrink-0 mt-1">
      <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
        <i data-lucide="blocks" class="w-3.5 h-3.5"></i> 插件管理
      </span>
    </div>

    <div class="flex-1 overflow-y-auto p-3 space-y-2.5 no-scrollbar" id="sidebarPluginsList"></div>

    <div class="p-3 border-t border-slate-200 dark:border-slate-800 shrink-0 bg-slate-50/80 dark:bg-[#0B0E14]/80">
      <details class="group">
        <summary class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 cursor-pointer flex items-center gap-1.5 select-none hover:text-indigo-700 dark:hover:text-indigo-300 transition-colors">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> 创建自定义动作插件
        </summary>
        <div class="mt-3 space-y-2.5 animate-pop-in">
          <div class="flex gap-2">
            <input id="customPluginEmoji" type="text" value="🚀" maxlength="2" class="w-12 h-9 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-center text-base focus:outline-none focus:border-indigo-500" />
            <input id="customPluginName" type="text" placeholder="插件名称" class="flex-1 h-9 px-2.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:border-indigo-500" />
          </div>
          <div class="flex gap-2">
            <select id="customPluginType" class="flex-1 h-9 px-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-[11px] font-semibold focus:outline-none focus:border-indigo-500">
              <option value="tag">🏷️ 追加标签</option>
              <option value="pin">📌 置顶</option>
              <option value="advance">⚡ 推进阶段</option>
              <option value="toast">💬 弹出提示</option>
            </select>
            <input id="customPluginActionText" type="text" placeholder="参数/提示语" class="flex-1 h-9 px-2.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:border-indigo-500" />
          </div>
          <button type="button" id="addCustomPluginBtn" class="w-full h-9 rounded-lg bg-slate-900 dark:bg-indigo-600 hover:bg-slate-800 dark:hover:bg-indigo-500 text-white text-xs font-bold active:scale-[0.98] transition-all">
            + 安装到卡片
          </button>
        </div>
      </details>
    </div>
  </aside>

  <div id="rightContainer" class="right-container md:ml-72 flex flex-col overflow-hidden">

    <header class="shrink-0 z-20 bg-white/95 dark:bg-[#0F1320]/95 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 shadow-sm">
      <div class="w-full px-4 md:px-8 h-14 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <button id="openSidebarBtn" class="md:hidden w-9 h-9 rounded-xl flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800 active:scale-95 transition-all">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <button id="expandSidebarBtn" class="hidden w-9 h-9 rounded-xl items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800 active:scale-95 transition-all" title="展开侧栏">
            <i data-lucide="panel-left-open" class="w-5 h-5"></i>
          </button>
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-sm">
              <i data-lucide="sparkles" class="w-4 h-4"></i>
            </div>
            <div>
              <h1 class="font-bold text-base leading-tight tracking-tight">SparkFlow <span class="text-indigo-600 dark:text-indigo-400">灵流</span></h1>
            </div>
          </div>
        </div>

        <div id="topPluginSlot" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>

        <div class="flex items-center gap-1 shrink-0">
          <button id="toggleSearchBtn" aria-label="搜索与标签" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800 active:scale-95 transition-all">
            <i data-lucide="search" class="w-4 h-4"></i>
          </button>
          <button id="openDataMenuBtn" aria-label="数据与引导" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800 active:scale-95 transition-all">
            <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
          </button>
          <button id="themeToggleBtn" aria-label="切换主题" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800 active:scale-95 transition-all">
            <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
            <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
          </button>
        </div>
      </div>

      <div id="mobileSearchBar" class="hidden w-full px-4 md:px-8 pb-3 space-y-2.5">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input id="searchInput" type="search" placeholder="搜索灵感、核心价值、行动项..." class="w-full h-10 pl-10 pr-9 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm focus:outline-none focus:border-indigo-500" />
          <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 p-1">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="tagFilterBar" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
      </div>
    </header>

    <!-- 主滚动容器：唯一的内容滚动区 -->
    <main id="appMain" class="w-full px-4 md:px-8 pt-4 space-y-4">

      <div id="onboardingBanner" class="rounded-2xl bg-gradient-to-r from-indigo-50 via-violet-50 to-indigo-50 dark:from-indigo-950/40 dark:via-violet-950/30 dark:to-indigo-950/40 border border-indigo-200/70 dark:border-indigo-500/20 p-3 flex items-center justify-between gap-2.5">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-sm shrink-0">👋</span>
          <div class="min-w-0">
            <p class="text-xs font-bold text-slate-800 dark:text-slate-100 truncate">右滑卡片快速推进 · 点底部「+」随手记</p>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate">支持真实语音/视频录制及插件扩展</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button type="button" id="seedDemoBtn" class="h-8 px-2.5 rounded-lg bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-300 border border-indigo-200/80 dark:border-slate-700 text-[11px] font-bold active:scale-95">+ 演练样本</button>
          <button type="button" id="dismissOnboardingBtn" class="w-7 h-7 rounded-lg text-slate-400 hover:text-slate-600 flex items-center justify-center">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <section id="stageFilterSection" class="space-y-4">
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5" id="stageTabsContainer">
          <button data-stage="all" class="stage-tab shrink-0 h-9 px-3.5 rounded-full text-xs font-semibold bg-slate-900 text-white dark:bg-indigo-600 shadow-xs transition-all">全部 <span class="ml-1 opacity-80" id="countAll">0</span></button>
          <button data-stage="clue" class="stage-tab shrink-0 h-9 px-3.5 rounded-full text-xs font-semibold bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-800 transition-all">💡 线索 <span class="ml-1 text-amber-600 dark:text-amber-400" id="countClue">0</span></button>
          <button data-stage="thinking" class="stage-tab shrink-0 h-9 px-3.5 rounded-full text-xs font-semibold bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-800 transition-all">🧠 思考中 <span class="ml-1 text-indigo-600 dark:text-indigo-400" id="countThinking">0</span></button>
          <button data-stage="goal" class="stage-tab shrink-0 h-9 px-3.5 rounded-full text-xs font-semibold bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-800 transition-all">🎯 工作目标 <span class="ml-1 text-emerald-600 dark:text-emerald-400" id="countGoal">0</span></button>
        </div>

        <div id="goalProgressOverview" class="hidden rounded-3xl bg-white dark:bg-[#131824] border border-slate-200/80 dark:border-slate-800 p-4 flex items-center justify-between gap-4 shadow-xs">
          <div class="space-y-1">
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 text-[11px] font-bold"><span>🎯</span><span>本周目标推进看板</span></div>
            <h3 class="text-base font-bold text-slate-900 dark:text-slate-100" id="goalOverviewTitle">已完成 0 / 0 项关键行动</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400" id="goalOverviewSub">持续将碎片灵感转化为可执行结果</p>
          </div>
          <div class="relative w-16 h-16 shrink-0 flex items-center justify-center">
            <svg class="w-16 h-16 -rotate-90" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="26" stroke-width="6" fill="none" class="stroke-slate-100 dark:stroke-slate-800" />
              <circle id="goalRingCircle" cx="32" cy="32" r="26" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="163.36" class="stroke-emerald-500 transition-all duration-500" />
            </svg>
            <span id="goalRingPercent" class="absolute text-xs font-extrabold text-slate-800 dark:text-slate-100">0%</span>
          </div>
        </div>

        <div id="cardsFeed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-4">
        </div>
      </section>

    </main>
  </div>

  <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 dark:bg-[#0F1320]/95 backdrop-blur-md border-t border-slate-200/80 dark:border-slate-800 pb-safe md:left-72 md:right-0 md:bottom-3 md:mx-4 md:rounded-2xl md:border md:shadow-lg md:pb-0">
    <div class="w-full px-6 h-16 flex items-center justify-between relative">
      <button type="button" data-nav="clues" class="nav-tab-btn flex flex-col items-center justify-center w-20 h-12 rounded-xl text-indigo-600 dark:text-indigo-400 transition-colors">
        <i data-lucide="inbox" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px] font-semibold">线索库</span>
      </button>

      <div class="relative -top-4">
        <button type="button" id="openQuickCaptureFab" aria-label="极速记录灵感" class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-indigo-500 text-white shadow-lg shadow-indigo-500/35 flex items-center justify-center active:scale-90 transition-transform">
          <i data-lucide="plus" class="w-7 h-7 stroke-[2.5]"></i>
        </button>
      </div>

      <button type="button" data-nav="goals" class="nav-tab-btn flex flex-col items-center justify-center w-20 h-12 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-colors">
        <i data-lucide="target" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px] font-semibold">工作目标</span>
      </button>
    </div>
  </nav>

  <!-- 底部抽屉 1：极速多模态捕获面板 -->
  <div id="captureSheetBackdrop" class="fixed inset-0 z-40 hidden bg-slate-950/50 backdrop-blur-xs transition-opacity">
    <div id="captureSheetPanel" onclick="event.stopPropagation()" class="fixed bottom-0 inset-x-0 md:inset-x-auto md:left-1/2 md:-translate-x-1/2 md:w-full md:max-w-2xl bg-white dark:bg-[#141926] rounded-t-3xl md:rounded-3xl shadow-2xl border-t md:border border-slate-200 dark:border-slate-800 p-5 pb-safe animate-sheet-up max-h-[92vh] overflow-y-auto">
      <div class="w-10 h-1.5 rounded-full bg-slate-300 dark:bg-slate-700 mx-auto mb-3.5 md:hidden"></div>
      <div class="grid grid-cols-3 gap-2 p-1 rounded-2xl bg-slate-100 dark:bg-slate-900 mb-4">
        <button type="button" data-mode="text" class="cap-mode-btn h-10 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-300 shadow-xs transition-all"><span>📝</span><span>文字</span></button>
        <button type="button" data-mode="voice" class="cap-mode-btn h-10 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 text-slate-500 dark:text-slate-400 transition-all"><span>🎙️</span><span>语音</span></button>
        <button type="button" data-mode="video" class="cap-mode-btn h-10 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 text-slate-500 dark:text-slate-400 transition-all"><span>🎬</span><span>视频</span></button>
      </div>
      <div id="sheetTextMode" class="space-y-2">
        <textarea id="quickTextInput" rows="3" placeholder="此刻想到了什么？输入 #标签 可自动归类..." class="w-full rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3.5 text-base focus:outline-none focus:border-indigo-500 resize-none"></textarea>
      </div>
      <div id="sheetVoiceMode" class="hidden space-y-3">
        <div class="rounded-2xl bg-violet-50/80 dark:bg-violet-950/30 border border-violet-200/70 dark:border-violet-500/20 p-4 flex flex-col items-center text-center gap-2.5">
          <div class="flex items-center justify-between w-full text-[11px]">
            <span id="voiceEngineBadge" class="px-2 py-0.5 rounded-md bg-violet-100 dark:bg-violet-900/50 text-violet-700 dark:text-violet-300 font-semibold">🎙️ 准备就绪</span>
            <span class="font-mono font-bold text-violet-700 dark:text-violet-300" id="sheetVoiceTimer">00:00</span>

    const INITIAL_PLUGINS = [

    function init() {
      try {
        const rawItems = localStorage.getItem(STORAGE_ITEMS), rawPlugins = localStorage.getItem(STORAGE_PLUGINS), theme = localStorage.getItem(STORAGE_THEME), dismissed = localStorage.getItem(STORAGE_ONBOARDING), sidebarState = localStorage.getItem(STORAGE_SIDEBAR);

        appState.plugins = rawPlugins ? JSON.parse(rawPlugins) : INITIAL_PLUGINS;

    function toast(msg) {
      const box = document.getElementById('toastBox'), el = document.createElement('div');

        nav.style.left = '0';

      const slot = document.getElementById('topPluginSlot'); let html = '';

        html += `<button type="button" onclick="toggleFocusTimer('${itemId}')" class="h-8 px-2.5 rounded-full bg-rose-500 text-white text-[11px] font-mono font-bold flex items-center gap-1 shadow-xs animate-pulse shrink-0"><span>🍅</span><span>${String(Math.floor(t.sec / 60)).padStart(2, '0')}:${String(t.sec % 60).padStart(2, '0')}</span></button>`;

    function bindSwipeGestures() {
      document.querySelectorAll('.swipe-card-inner').forEach(card => {
        let startX = 0, startY = 0, currentX = 0, isSwiping = false;
        card.addEventListener('touchstart', (e) => { if (e.touches.length !== 1) return; startX = e.touches[0].clientX; startY = e.touches[0].clientY; currentX = 0; isSwiping = false; }, { passive: true });
        card.addEventListener('touchmove', (e) => {
          if (e.touches.length !== 1) return;
          const dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
          if (!isSwiping && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3) { isSwiping = true; card.classList.add('dragging'); }
          if (isSwiping && dx > 0) { currentX = Math.min(dx, 120); card.style.transform = `translateX(${currentX}px)`; }
        }, { passive: true });
        card.addEventListener('touchend', () => {
          card.classList.remove('dragging'); card.style.transform = '';
          if (isSwiping && currentX > 82) {
            const id = card.dataset.cardId, item = appState.items.find(i => i.id === id);
            if (item) {
              if (item.stage === 'clue') quickAdvance(id, 'thinking');
              else if (item.stage === 'thinking') quickAdvance(id, 'goal');
              else { item.pinned = !item.pinned; persist(); renderAll(); toast(item.pinned ? '📌 已置顶该目标' : '已取消置顶'); }
            }
          }
          isSwiping = false;
        });
      });
    }

    function quickAdvance(id, nextStage) {
      const item = appState.items.find(i => i.id === id); if (!item) return;
      item.stage = nextStage;
      if (nextStage === 'goal' && (!item.goal.tasks || item.goal.tasks.length === 0)) item.goal.tasks = [{ id: 't-' + Date.now(), text: item.thinking?.nextStep || '完成第一步最小可行性验证', done: false }];
      persist(); renderAll(); toast(nextStage === 'thinking' ? '🧠 已移入「思考中」' : '🎯 已转化为「工作目标」');
    }

    function toggleInlineTask(itemId, taskId) {
      const item = appState.items.find(i => i.id === itemId); if (!item) return;
      const task = item.goal.tasks.find(t => t.id === taskId); if (task) task.done = !task.done;
      persist(); renderAll();
    }

    function triggerAiSummary(id) {
      const item = appState.items.find(i => i.id === id); if (!item) return;
      const snippet = item.content.replace(/^语音速记：/, '').slice(0, 20);
      item.aiSummary = `核心诉求为「${snippet}...」，已自动为你补充 1 条下一步验证建议。`;
      if (!item.thinking.nextStep) item.thinking.nextStep = `围绕「${snippet}」制作最小可用草图并收集 3 条反馈`;
      persist(); renderAll(); toast('✨ AI 已提炼核心要点与行动建议');
    }

    function runCustomPlugin(pluginId, itemId) {
      const plugin = appState.plugins.find(p => p.id === pluginId), item = appState.items.find(i => i.id === itemId);
      if (!plugin || !item) return;
      if (plugin.actionType === 'tag') {
        const tag = plugin.actionText.replace(/^#/, '').trim() || plugin.name;
        if (!item.tags.includes(tag)) item.tags.push(tag);
        persist(); renderAll(); toast(`${plugin.emoji} 已添加标签 #${tag}`);
      } else if (plugin.actionType === 'pin') {
        item.pinned = true; persist(); renderAll(); toast(`${plugin.emoji} 已置顶该灵感`);
      } else if (plugin.actionType === 'advance') {
        if (item.stage === 'clue') quickAdvance(itemId, 'thinking');
        else if (item.stage === 'thinking') quickAdvance(itemId, 'goal');
        else toast(`${plugin.emoji} 该目标已在推进中`);
      } else { toast(`${plugin.emoji} ${plugin.actionText}`); }
    }

    function toggleFocusTimer(id) {
      if (!appState.timers[id]) appState.timers[id] = { sec: 1500, running: false };
      const nextState = !appState.timers[id].running;
      Object.values(appState.timers).forEach(t => { t.running = false; });
      appState.timers[id].running = nextState; renderAll();
      if (nextState) toast('🍅 专注计时已开始（25分钟）');
    }

    function startTimerLoop() {
      setInterval(() => {
        let updated = false;
        Object.keys(appState.timers).forEach(id => {
          const t = appState.timers[id];
          if (t.running && t.sec > 0) { t.sec--; updated = true; if (t.sec === 0) { t.running = false; toast('🍅 25分钟专注完成！休息一下吧'); } }
        });
        if (updated) { renderTopPluginSlot(); renderFeed(); lucide.createIcons(); }
      }, 1000);
    }

    function togglePluginState(id) {
      const p = appState.plugins.find(x => x.id === id); if (!p) return;
      p.enabled = !p.enabled; persist(); renderAll(); toast(`${p.enabled ? '已开启' : '已关闭'}「${p.name}」`);
    }

    function deleteCustomPlugin(id) {
      appState.plugins = appState.plugins.filter(p => p.id !== id); persist(); renderAll(); toast('已移除自定义插件');
    }

    function buildVoiceWaveBars() {
      const wrap = document.getElementById('sheetVoiceWaves');
      wrap.innerHTML = Array.from({ length: 18 }).map((_, i) => `<span class="w-1.5 rounded-full bg-violet-400/50 transition-all duration-100" style="height:32%; animation-delay:${(i % 5) * 0.1}s"></span>`).join('');
    }

    function stopAllMediaStreams() {
      if (appState.animFrameId) { cancelAnimationFrame(appState.animFrameId); appState.animFrameId = null; }
      if (appState.speechRec) { try { appState.speechRec.stop(); } catch (e) {} appState.speechRec = null; }
      if (appState.mediaRecorder && appState.mediaRecorder.state !== 'inactive') { try { appState.mediaRecorder.stop(); } catch (e) {} }
      if (appState.mediaStream) { appState.mediaStream.getTracks().forEach(t => t.stop()); appState.mediaStream = null; }
      if (appState.audioCtx) { try { appState.audioCtx.close(); } catch (e) {} appState.audioCtx = null; }
    }

    function openCaptureSheet() {
      const backdrop = document.getElementById('captureSheetBackdrop'); backdrop.classList.remove('hidden');
      if (appState.captureMode === 'text') setTimeout(() => document.getElementById('quickTextInput').focus(), 100);
      lucide.createIcons({ nodes: [backdrop] });
    }

    function closeCaptureSheet() {
      if (appState.isRecordingVoice) toggleSheetVoice();
      if (appState.isRecordingVideo) toggleSheetVideo();
      stopAllMediaStreams(); document.getElementById('captureSheetBackdrop').classList.add('hidden');
    }

    async function toggleSheetVoice() {
      appState.isRecordingVoice = !appState.isRecordingVoice;
      const btn = document.getElementById('sheetRecordVoiceBtn'), hint = document.getElementById('sheetVoiceHint'), badge = document.getElementById('voiceEngineBadge'), bars = document.querySelectorAll('#sheetVoiceWaves span'), previewAudio = document.getElementById('sheetVoicePreviewAudio');
      if (appState.isRecordingVoice) {
        appState.recordedAudioUrl = ''; previewAudio.classList.add('hidden'); btn.classList.add('animate-pulse', 'scale-105');
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {

        } catch (err) { toast('解析 JSON 文件失败'); }
      };
      reader.readAsText(file);

          document.querySelectorAll('.sheet-tag-btn').forEach(b => {
            const active = b.dataset.tag === appState.captureTag;
            b.className = active ? 'sheet-tag-btn h-9 px-3 rounded-xl text-xs font-semibold bg-indigo-50 text-indigo-600 dark:bg-indigo-500/20 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-500/30 shrink-0' : 'sheet-tag-btn h-9 px-3 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400 shrink-0';
          });
        });
      });
      document.getElementById('sheetRecordVoiceBtn').addEventListener('click', toggleSheetVoice);
      document.getElementById('sheetRecordVideoBtn').addEventListener('click', toggleSheetVideo);
      document.getElementById('switchCameraBtn').addEventListener('click', () => {
        appState.videoFacingMode = appState.videoFacingMode === 'environment' ? 'user' : 'environment';
        toast(appState.videoFacingMode === 'environment' ? '已切换至后置摄像头' : '已切换至前置摄像头');
        if (appState.isRecordingVideo) { toggleSheetVideo(); setTimeout(toggleSheetVideo, 150); }
      });
      document.getElementById('submitCaptureBtn').addEventListener('click', saveCapturedSpark);
      document.getElementById('detailSheetBackdrop').addEventListener('click', () => { document.getElementById('detailSheetBackdrop').classList.add('hidden'); });
      document.getElementById('closeDetailSheetBtn').addEventListener('click', () => { document.getElementById('detailSheetBackdrop').classList.add('hidden'); });
      document.getElementById('detailPinBtn').addEventListener('click', () => {
        const item = appState.items.find(i => i.id === appState.editingItemId); if (!item) return;
        item.pinned = !item.pinned; const pinBtn = document.getElementById('detailPinBtn');
        pinBtn.classList.toggle('text-indigo-600', item.pinned); pinBtn.classList.toggle('bg-indigo-50', item.pinned);
        toast(item.pinned ? '📌 已设为置顶' : '已取消置顶');
      });
      document.getElementById('toggleGoalSwitch').addEventListener('click', () => { appState.editingIsGoal = !appState.editingIsGoal; syncGoalSwitchUI(); });
      document.getElementById('detailAddKrBtn').addEventListener('click', () => {
        const input = document.getElementById('detailNewKrInput'), text = input.value.trim(), item = appState.items.find(i => i.id === appState.editingItemId);
        if (!text || !item) return; item.goal.tasks.push({ id: 't-' + Date.now(), text, done: false }); input.value = ''; renderDetailKrList(item);
      });
      document.getElementById('detailDeleteBtn').addEventListener('click', () => {
        if (!appState.editingItemId) return; appState.items = appState.items.filter(i => i.id !== appState.editingItemId);
        persist(); document.getElementById('detailSheetBackdrop').classList.add('hidden'); renderAll(); toast('已删除该条记录');
      });
      document.getElementById('saveDetailBtn').addEventListener('click', saveDetailSheet);
      document.getElementById('addCustomPluginBtn').addEventListener('click', () => {
        const emoji = document.getElementById('customPluginEmoji').value.trim() || '⚡', name = document.getElementById('customPluginName').value.trim();
        const actionType = document.getElementById('customPluginType').value, actionText = document.getElementById('customPluginActionText').value.trim() || `已触发「${name}」`;
        if (!name) { toast('请输入插件按钮名称'); return; }
        window.SparkFlowSDK.register({ emoji, name, actionType, actionText });
        document.getElementById('customPluginName').value = ''; document.getElementById('customPluginActionText').value = '';
        toast(`已安装「${name}」按钮到所有卡片！`);
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
