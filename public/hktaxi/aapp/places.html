<body>

<header class="bg-amber-500 text-slate-900 shadow-md sticky top-0 z-50" style="padding-top:var(--safe-area-top)">
  <div class="max-w-md mx-auto px-4 py-2.5 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <span class="ico w-7 h-7" data-icon="map-pin"></span>
      <h1 class="text-lg font-bold tracking-tight">收藏地點</h1>
    </div>
    <button type="button" onclick="location.href='./index.html'" class="flex items-center gap-1 bg-amber-600 hover:bg-amber-700 active:scale-[0.98] text-white px-3 py-1.5 rounded-xl shadow-inner transition text-xs font-bold">
      <span class="ico w-3.5 h-3.5" data-icon="home"></span> 返回
    </button>
  </div>
</header>

<main class="flex-1 max-w-md w-full mx-auto p-4 space-y-3">
  <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
    <div class="relative">
      <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><span class="ico w-4 h-4" data-icon="search"></span></span>
      <input type="text" id="place-search-keyword" oninput="renderPlacesList()" placeholder="搜尋地點名稱、地址、備注..." autocomplete="off" class="w-full pl-9 pr-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
    </div>
    <div>
      <div class="flex justify-between items-center mb-1.5">
        <label class="block text-xs font-semibold text-slate-500">類型</label>
        <button type="button" id="place-type-toggle" onclick="togglePlaceTypeExpanded()" class="text-[11px] text-amber-700 hover:text-amber-800 font-semibold transition flex items-center gap-1 hidden">
          <span id="place-type-toggle-text">更多</span>
          <svg id="place-type-toggle-chevron" style="width:10px;height:10px;transition:transform .2s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <div id="place-type-tabs" class="flex flex-wrap gap-1.5"></div>
    </div>
    <div class="flex gap-2 pt-2 border-t border-slate-100">
      <button type="button" id="nearby-btn" onclick="toggleNearbyPlaces()" class="flex-1 py-2.5 bg-blue-50 hover:bg-blue-100 active:scale-[0.98] text-blue-700 font-bold rounded-xl text-xs transition flex items-center justify-center gap-1.5 border border-blue-200">
        <span class="ico w-3.5 h-3.5" data-icon="navigation"></span><span id="nearby-btn-text">附近地點</span>
      </button>
      <button type="button" onclick="openAddPlaceModal()" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-slate-900 font-bold rounded-xl text-xs transition flex items-center justify-center gap-1.5">
        <span class="ico w-4 h-4" data-icon="plus"></span> 新增地點
      </button>
    </div>
    <div class="flex justify-between items-center pt-2 border-t border-slate-100 text-xs gap-2">
      <span id="nearby-status" class="text-blue-600 font-medium hidden truncate"></span>
      <span id="place-count-badge" class="text-slate-400 font-medium ml-auto shrink-0">共 0 個</span>
    </div>
  </div>
  <div id="places-list-container" class="space-y-2.5"></div>
</main>

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-50">
  <div class="max-w-md mx-auto grid grid-cols-4 h-16">
    <button onclick="location.href='./index.html'" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition">
      <span class="ico w-5 h-5" data-icon="plus-circle"></span><span class="text-[11px] font-medium mt-1">記帳</span>
    </button>
    <button onclick="location.href='./index.html?tab=list'" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition">
      <span class="ico w-5 h-5" data-icon="list-bullet"></span><span class="text-[11px] font-medium mt-1">行程</span>
    </button>
    <button class="flex flex-col items-center justify-center text-amber-500 transition">
      <span class="ico w-5 h-5" data-icon="map-pin"></span><span class="text-[11px] font-bold mt-1">地點</span>
    </button>
    <button onclick="location.href='./index.html?tab=stats'" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition">
      <span class="ico w-5 h-5" data-icon="pie-chart"></span><span class="text-[11px] font-medium mt-1">統計</span>
    </button>
  </div>
</nav>

<div id="trip-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-xl animate-in">
    <div class="bg-slate-900 text-white px-4 py-3 flex justify-between items-center gap-2">
      <h3 id="modal-title" class="font-bold text-sm truncate flex-1 min-w-0">詳情</h3>
      <div class="flex items-center gap-0.5 shrink-0">
        <button type="button" id="header-paste-btn" onclick="quickPasteAndParse()" class="text-slate-300 hover:text-white p-1.5 rounded-lg hover:bg-white/10 transition" title="一鍵貼上並解析" aria-label="一鍵貼上並解析">
          <span class="ico w-4 h-4" data-icon="clipboard"></span>
        </button>
        <button type="button" id="header-locate-btn" onclick="autoFillPlaceByLocation()" class="text-slate-300 hover:text-white p-1.5 rounded-lg hover:bg-white/10 transition" title="使用當前位置自動填寫" aria-label="使用當前位置自動填寫">
          <span class="ico w-4 h-4" data-icon="crosshair"></span>
        </button>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-white/10 transition" title="關閉" aria-label="關閉">
          <span class="ico w-4 h-4" data-icon="x"></span>
        </button>
      </div>
    </div>
    <div id="modal-body" class="p-4 space-y-3 max-h-80 overflow-y-auto"></div>
    <div id="modal-footer" class="bg-slate-50 px-4 py-3 border-t flex justify-end gap-2"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite" class="fixed top-16 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-medium shadow-lg z-50 transition-all duration-300 opacity-0 pointer-events-none" style="opacity:0"></div>

<script>

/* ---------- 距離工具 ---------- */
function getDistance(lat1, lon1, lat2, lon2){
  var R = 6371000;
  var f1 = lat1 * Math.PI / 180;
  var f2 = lat2 * Math.PI / 180;
  var df = (lat2 - lat1) * Math.PI / 180;
  var dl = (lon2 - lon1) * Math.PI / 180;
  var a = Math.sin(df/2) * Math.sin(df/2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl/2) * Math.sin(dl/2);
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function formatDistance(meters){
  if (meters === null || meters === undefined) return '--';
  if (meters < 1000) return Math.round(meters) + ' m';
  return (meters / 1000).toFixed(1) + ' km';
}

/* =========================================================
   地點列表 —— 已優化
   =========================================================
   要點：
   1. 先用 for 迴圈過濾（只掃 places 一次），得到 filtered。
   2. 距離計算只發生在：
      - 附近模式已開啟 (placeNearbyMode === true)
      - 且已有使用者座標 (userLat / userLng 皆非 null)
   3. 距離計算只對「已過濾後的 filtered」進行，絕不掃描全部 places。
   4. 非附近模式：完全不計算距離，直接按 timestamp 排序。
   5. 用 showDistance 旗標控制徽章顯示，避免切換模式後殘留舊值。
   ========================================================= */
function renderPlacesList(){
  var container = document.getElementById('places-list-container');
  if (!container) return;

  var searchEl = document.getElementById('place-search-keyword');
  var keyword = searchEl ? (searchEl.value || '').toLowerCase().trim() : '';

  /* ---------- 步驟 1：過濾（一次性掃描 places） ---------- */
  var filtered = [];
  for (var i = 0; i < places.length; i++){
    var p = places[i];

    if (keyword){
      var hay = (p.name || '') + ' ' + (p.address || '') + ' ' + (p.note || '') + ' ' + (p.type || '');
      if (hay.toLowerCase().indexOf(keyword) === -1) continue;
    }

    var pType = (p.type == null ? '' : String(p.type)).trim();
    if (placeFilterType && pType !== placeFilterType) continue;

    filtered.push(p);
  }

  /* ---------- 步驟 2：距離計算 & 排序（只對 filtered 做） ---------- */
  var hasUserLoc = (userLat !== null && userLng !== null);
  var showDistance = (placeNearbyMode && hasUserLoc);

  if (showDistance){
    /* 只在附近模式 + 有座標時，對已過濾的地點計算距離 */
    for (var k = 0; k < filtered.length; k++){
      var item = filtered[k];
      item._distance = (typeof item.lat === 'number' && typeof item.lng === 'number')
        ? getDistance(userLat, userLng, item.lat, item.lng)
        : null;
    }
    filtered.sort(function(a, b){
      if (a._distance === null && b._distance === null) return b.timestamp - a.timestamp;
      if (a._distance === null) return 1;
      if (b._distance === null) return -1;
      return a._distance - b._distance;
    });
  } else {
    /* 非附近模式：不碰距離計算，直接按時間排序 */
    filtered.sort(function(a, b){ return b.timestamp - a.timestamp; });
  }

  /* ---------- 步驟 3：更新計數與狀態提示 ---------- */
  var countEl = document.getElementById('place-count-badge');
  if (countEl) countEl.innerText = '共 ' + filtered.length + ' 個';

  var statusEl = document.getElementById('nearby-status');
  if (statusEl){
    if (showDistance){
      statusEl.classList.remove('hidden');
      statusEl.innerHTML = ico('navigation','w-3 h-3') + ' 已按距離排序';
    } else {
      statusEl.classList.add('hidden');
    }
  }

  /* ---------- 步驟 4：空狀態 ---------- */
  if (filtered.length === 0){
    container.innerHTML =
      '<div class="bg-white rounded-2xl p-8 text-center border border-slate-100 text-slate-400 space-y-2">' +
        '<div class="ico w-10 h-10 mx-auto text-slate-300">' + ico('map-pin','w-10 h-10') + '</div>' +
        '<p class="text-sm font-medium">' + (places.length === 0 ? '尚無收藏地點' : '沒有符合條件的地點') + '</p>' +
        '<p class="text-[11px] text-slate-400">' + (places.length === 0 ? '點「新增地點」開始收藏常用位置' : '試試切換其他篩選條件') + '</p>' +
      '</div>';
    return;
  }

  /* ---------- 步驟 5：渲染列表 ---------- */
  var htmlBuf = [];
  for (var m = 0; m < filtered.length; m++){
    var pl = filtered[m];
    var plType = (pl.type == null ? '' : String(pl.type)).trim();
    var style = getPlaceTypeStyle(plType);
    var hasCoords = (typeof pl.lat === 'number' && typeof pl.lng === 'number');

    var distanceBadge = '';
    if (showDistance && pl._distance !== null){
      distanceBadge = '<span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 font-bold flex items-center gap-1 shrink-0">' + ico('navigation','w-3 h-3') + formatDistance(pl._distance) + '</span>';
    }

    htmlBuf.push(
      '<div class="bg-white rounded-2xl p-3.5 border border-slate-100 shadow-sm">' +
        '<div class="flex items-start justify-between gap-3">' +
          '<div class="flex items-start space-x-3 min-w-0 flex-1">' +
            '<div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 border ' + style.cls + '">' + ico(style.icon, 'w-5 h-5') + '</div>' +
            '<div class="min-w-0 flex-1">' +
              '<div class="flex items-center gap-2 flex-wrap">' +
                '<span class="text-sm font-bold text-slate-900 truncate">' + escapeHtml(pl.name) + '</span>' +
                distanceBadge +
              '</div>' +
              '<div class="flex items-center gap-1.5 flex-wrap mt-1">' +
                '<span class="text-[10px] px-2 py-0.5 rounded-full border font-semibold ' + style.cls + '">' + escapeHtml(plType || '未分類') + '</span>' +
              '</div>' +
              (pl.address ? '<p class="text-xs text-slate-500 mt-1 truncate flex items-center gap-1"><span class="ico w-3 h-3 text-slate-400 shrink-0">' + ico('map-pin','w-3 h-3') + '</span>' + escapeHtml(pl.address) + '</p>' : '') +
              (pl.note ? '<p class="text-xs text-slate-400 mt-0.5 truncate">' + escapeHtml(pl.note) + '</p>' : '') +
            '</div>' +
          '</div>' +
          '<div class="flex items-center gap-0.5 shrink-0">' +
            (hasCoords ? '<button onclick="openPlaceInMaps(\'' + pl.id + '\')" class="p-2 text-slate-400 hover:text-blue-500 transition" title="用高德 App 導航">' + ico('navigation','w-4 h-4') + '</button>' : '') +
            '<button onclick="openEditPlaceModal(\'' + pl.id + '\')" class="p-2 text-slate-400 hover:text-amber-500 transition" title="編輯">' + ico('edit-3','w-4 h-4') + '</button>' +
            '<button onclick="deletePlace(\'' + pl.id + '\')" class="p-2 text-slate-400 hover:text-rose-500 transition" title="刪除">' + ico('trash-2','w-4 h-4') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }
  container.innerHTML = htmlBuf.join('');
}

/* ---------- 高德導航 ---------- */
function openPlaceInMaps(id){
  var p = places.find(function(x){ return x.id === id; });
  if (!p || typeof p.lat !== 'number' || typeof p.lng !== 'number') return;

  var name = encodeURIComponent(p.name || '目的地');
  
  // 1. 網頁版降級地址
  var webUrl = 'https://uri.amap.com/navigation?to=' + p.lng + ',' + p.lat + ',' + name + '&mode=car&policy=1&src=hk-taxi-helper&coordinate=wgs84&callnative=1';

  var ua = navigator.userAgent || '';
  var isMobile = /iPhone|iPad|iPod|Android|HarmonyOS|Mobile|Windows Phone/i.test(ua);

  // 桌面端：直接開網頁
  if (!isMobile){ 
    window.open(webUrl, '_blank'); 
    return; 
  }

  // 2. 手機端高德 App 導航 Scheme（dev=0 配合香港 WGS84 坐標）
  var appScheme = 'amapuri://route/plan/?sourceApplication=hk-taxi-helper&lat=' + p.lat + '&lon=' + p.lng + '&poiname=' + name + '&dev=0&t=0';

  var startTime = Date.now();
  var fallbackTriggered = false;

  function cleanup(){
    clearTimeout(fallbackTimer);
    document.removeEventListener('visibilitychange', onVisibilityChange);
    window.removeEventListener('pagehide', onPageHide);
  }

  // 3. 啟動 2 秒降級計時器
  var fallbackTimer = setTimeout(function(){
    if (fallbackTriggered) return;
    if (!document.hidden && (Date.now() - startTime) < 3000){
      fallbackTriggered = true;
      cleanup();
      window.location.href = webUrl;
    }
  }, 2000);

  function onVisibilityChange(){
    if (document.hidden){
      fallbackTriggered = true;
      cleanup();
    }
  }

  function onPageHide(){
    if (fallbackTriggered) return;
    fallbackTriggered = true;
    cleanup();
  }

  document.addEventListener('visibilitychange', onVisibilityChange);
  window.addEventListener('pagehide', onPageHide, { once: true });

  // 4. 嘗試喚起高德 App
  try { 
    window.location.href = appScheme; 
  } catch (err){ 
    if (!fallbackTriggered){
      fallbackTriggered = true;
      cleanup();
      window.location.href = webUrl; 
    }
  }
}
/* ---------- 附近排序 ---------- */
function toggleNearbyPlaces(){
  var btnText = document.getElementById('nearby-btn-text');
  var btn = document.getElementById('nearby-btn');

  if (placeNearbyMode){
    placeNearbyMode = false;
    userLat = null;
    userLng = null;
    if (btnText) btnText.innerText = '附近地點';
    if (btn){ btn.className = 'flex-1 py-2.5 bg-blue-50 hover:bg-blue-100 active:scale-[0.98] text-blue-700 font-bold rounded-xl text-xs transition flex items-center justify-center gap-1.5 border border-blue-200'; }
    renderPlacesList();
    showToast('已取消附近排序');
    return;
  }

  if (!navigator.geolocation){ showToast('此瀏覽器不支援定位功能'); return; }

  showToast('正在取得位置...');
  navigator.geolocation.getCurrentPosition(
    function(pos){
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      placeNearbyMode = true;
      if (btnText) btnText.innerText = '清除附近';
      if (btn){ btn.className = 'flex-1 py-2.5 bg-blue-500 hover:bg-blue-600 active:scale-[0.98] text-white font-bold rounded-xl text-xs transition flex items-center justify-center gap-1.5 border border-blue-600'; }
      renderPlacesList();
      showToast('已按距離排序（誤差約 ' + Math.round(pos.coords.accuracy || 0) + ' m）');
    },
    function(err){ showToast('定位失敗：' + (err.message || '請檢查定位權限')); },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

/* ---------- 高德短連結／地名解析 ---------- */
async function resolveAmapPlace(input){
  var res = await fetch('/api/amap-place', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ input: input })
  });

  var data;
  try { data = await res.json(); }
  catch (e){ throw new Error('後端回傳非 JSON'); }

  if (!res.ok || !data.success){
    throw new Error(data.error || ('HTTP ' + res.status));
  }
  return data;
}

async function quickPasteAndParse(){
  var btn = document.getElementById('header-paste-btn');

  if (!window.isSecureContext || !navigator.clipboard || typeof navigator.clipboard.readText !== 'function'){
    toggleManualInput(true);
    showPasteFallback(document.getElementById('amap-paste-input'));
    showToast('此瀏覽器不支援自動讀取，請長按下方輸入框粘貼');
    return;
  }

  if (btn){ btn.disabled = true; btn.classList.add('opacity-50'); }

  try {
    var text = await navigator.clipboard.readText();
    text = (text || '').trim();
    if (!text){
      showToast('剪貼板為空，請先複製高德連結或地名');
      return;
    }

    hidePasteFallback();
    var input = document.getElementById('amap-paste-input');
    if (input) input.value = text;

    await applyAmapPaste(text);
  } catch (err) {
    console.warn('[clipboard] readText failed:', err);
    var msg = (err && err.name === 'NotAllowedError')
      ? '剪貼板權限被拒，請手動粘貼'
      : '無法讀取剪貼板，請手動粘貼';
    showToast(msg);
    toggleManualInput(true);
    showPasteFallback(document.getElementById('amap-paste-input'));
  } finally {
    if (btn){ btn.disabled = false; btn.classList.remove('opacity-50'); }
  }
}

function toggleManualInput(show){
  var wrap = document.getElementById('manual-input-wrap');
  if (!wrap) return;
  if (show === undefined) show = wrap.classList.contains('hidden');
  if (show){
    wrap.classList.remove('hidden');
    setTimeout(function(){
      var input = document.getElementById('amap-paste-input');
      if (input) input.focus();
    }, 50);
  } else {
    wrap.classList.add('hidden');
    hidePasteFallback();
  }
}

function showPasteFallback(input){
  var wrap = document.getElementById('paste-fallback-wrap');
  var ta   = document.getElementById('paste-fallback');
  if (!wrap || !ta) return;

  wrap.classList.remove('hidden');
  ta.value = '';
  setTimeout(function(){ ta.focus(); }, 50);

  if (!ta._bound){
    ta._bound = true;
    ta.addEventListener('paste', function(){
      setTimeout(function(){ consumeFallback(input, ta, wrap); }, 10);
    });
    ta.addEventListener('input', function(){
      consumeFallback(input, ta, wrap);
    });
  }
}

function consumeFallback(input, ta, wrap){
  var v = ta.value.trim();
  if (!v) return;
  input.value = v;
  ta.value = '';
  wrap.classList.add('hidden');
  applyAmapPaste();
}

function hidePasteFallback(){
  var wrap = document.getElementById('paste-fallback-wrap');
  var ta   = document.getElementById('paste-fallback');
  if (wrap) wrap.classList.add('hidden');
  if (ta) ta.value = '';
}

async function applyAmapPaste(rawText){
  var input = document.getElementById('amap-paste-input');
  var raw = rawText !== undefined
    ? String(rawText).trim()
    : (input ? input.value.trim() : '');

  if (!raw){
    showToast('請先貼上連結、座標，或輸入地名');
    if (input) input.focus();
    return;
  }

  showToast('正在解析...');

  try {
    var result = await resolveAmapPlace(raw);

    var latEl = document.getElementById('place-lat');
    var lngEl = document.getElementById('place-lng');
    if (latEl) latEl.value = result.lat.toFixed(6);
    if (lngEl) lngEl.value = result.lng.toFixed(6);

    var nameEl = document.getElementById('place-name');
    var nameFilled = false;
    if (nameEl && result.name && !nameEl.value.trim()){
      nameEl.value = result.name;
      nameFilled = true;
    }

    var addrEl = document.getElementById('place-address');
    var addrFilled = false;
    if (addrEl && result.address && !addrEl.value.trim()){
      addrEl.value = result.address;
      addrFilled = true;
    }

    var sourceText = { geocode: '地理編碼', expand: '短連結展開', shortlink: '連結解析', direct: '連結解析' }[result.source] || result.source;

    var parts = ['座標'];
    if (nameFilled) parts.push('名稱');
    if (addrFilled) parts.push('地址');
    showToast('已透過' + sourceText + '填入：' + parts.join('、'));

    if (addrEl && !addrEl.value.trim()){
      reverseGeocode(result.lat, result.lng, function(err, data){
        if (err) return;
        applyGeocodeResult(data);
      });
    }
  } catch (e) {
    showToast('解析失敗：' + (e.message || '未知錯誤'));
  }
}

/* ---------- 定位与反向地理编码 ---------- */
function useCurrentLocationForPlace(){
  if (!navigator.geolocation){ showToast('此瀏覽器不支援定位功能'); return; }
  showToast('正在取得位置...');
  navigator.geolocation.getCurrentPosition(
    function(pos){
      var latEl = document.getElementById('place-lat');
      var lngEl = document.getElementById('place-lng');
      if (latEl) latEl.value = pos.coords.latitude.toFixed(6);
      if (lngEl) lngEl.value = pos.coords.longitude.toFixed(6);
      showToast('已填入當前位置座標');
    },
    function(err){ showToast('定位失敗：' + (err.message || '請檢查定位權限')); },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

function autoFillPlaceByLocation(){
  var btn = document.getElementById('header-locate-btn');
  if (!navigator.geolocation){ showToast('此瀏覽器不支援定位功能'); return; }

  if (btn){ btn.disabled = true; btn.classList.add('opacity-50','cursor-wait'); }

  showToast('正在取得位置...');

  navigator.geolocation.getCurrentPosition(
    function(pos){
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      var accuracy = pos.coords.accuracy || 0;

      var latEl = document.getElementById('place-lat');
      var lngEl = document.getElementById('place-lng');
      if (latEl) latEl.value = lat.toFixed(6);
      if (lngEl) lngEl.value = lng.toFixed(6);

      reverseGeocode(lat, lng, function(err, data){
        resetAutoFillButton();
        if (err){ showToast('已填入座標，但地址解析失敗：' + err); return; }
        var filled = applyGeocodeResult(data);
        if (filled) showToast('已自動填寫位置資訊（誤差約 ' + Math.round(accuracy) + ' m）');
        else showToast('已填入座標（誤差約 ' + Math.round(accuracy) + ' m）');
      });
    },
    function(err){ resetAutoFillButton(); showToast('定位失敗：' + (err.message || '請檢查定位權限')); },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function resetAutoFillButton(){
  var btn = document.getElementById('header-locate-btn');
  if (!btn) return;
  btn.disabled = false;
  btn.classList.remove('opacity-50','cursor-wait');
}

function reverseGeocode(lat, lng, callback) {
  function fetchNominatimFallback(reasonMsg) {
    var nominatimUrl = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lng + '&accept-language=zh-HK,zh-TW,zh,en&zoom=18&addressdetails=1';
    var nomFinished = false;
    var nomTimer = setTimeout(function() {
      if (!nomFinished) {
        nomFinished = true;
        callback('所有地圖服務均失敗 (高德失敗: ' + reasonMsg + '，且 Nominatim 逾時)');
      }
    }, 10000);

    fetch(nominatimUrl, { method: 'GET', headers: { 'Accept': 'application/json' } })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data) {
        if (nomFinished) return;
        nomFinished = true;
        clearTimeout(nomTimer);
        if (!data || !data.address) {
          callback('高德與 Nominatim 後備均無法解析地址');
          return;
        }
        var addr = data.address || {};
        var building = addr.building || addr.amenity || addr.building_name || addr.house_name || addr.office || '';
        data.provider = 'nominatim';
        data.extracted_building = building;
        callback(null, data);
      })
      .catch(function(err) {
        if (nomFinished) return;
        nomFinished = true;
        clearTimeout(nomTimer);
        callback('高德失敗 (' + reasonMsg + ') 且 Nominatim 後備失敗: ' + (err && err.message ? err.message : '網絡錯誤'));
      });
  }

  var amapApiUrl = '/api/amap-regeo?lat=' + lat + '&lng=' + lng;
  var amapFinished = false;
  var amapTimer = setTimeout(function() {
    if (!amapFinished) {
      amapFinished = true;
      fetchNominatimFallback('高德請求逾時');
    }
  }, 10000);

  fetch(amapApiUrl, { method: 'GET', headers: { 'Accept': 'application/json' } })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      if (amapFinished) return;
      if (!data || !data.success) {
        amapFinished = true;
        clearTimeout(amapTimer);
        fetchNominatimFallback(data && data.error ? data.error : '高德解析失敗');
        return;
      }
      amapFinished = true;
      clearTimeout(amapTimer);
      var normalizedData = {
        provider: 'amap',
        display_name: data.formatted_address,
        address: {
          building: data.building,
          road: data.road,
          formatted_address: data.formatted_address
        },
        raw: data.raw
      };
      callback(null, normalizedData);
    })
    .catch(function(err) {
      if (amapFinished) return;
      amapFinished = true;
      clearTimeout(amapTimer);
      fetchNominatimFallback(err && err.message ? err.message : '高德網絡錯誤');
    });
}

function pickAddressText(data){
  if (!data) return '';
  var addr = data.address || {};
  return data.display_name
      || addr.formatted_address
      || [addr.road, addr.building, addr.district].filter(Boolean).join(' ')
      || '';
}

function fillPlaceAddressFromGeocode(data, opts){
  opts = opts || {};
  var filled = false;
  var addr = data.address || {};

  var addrEl = document.getElementById('place-address');
  var text = pickAddressText(data);
  if (addrEl && text && (opts.overwrite || !addrEl.value.trim())){
    addrEl.value = text;
    filled = true;
  }

  var nameEl = document.getElementById('place-name');
  if (nameEl && (opts.overwriteName || !nameEl.value.trim())){
    var autoName = addr.amenity || addr.shop || addr.building || addr.tourism
                || addr.office || addr.road || '';
    if (autoName){ nameEl.value = autoName; filled = true; }
  }
  return filled;
}

function setPlaceRegeoBtnLoading(btn, loading){
  if (!btn) return;
  if (loading){
    if (!btn.dataset.origHtml) btn.dataset.origHtml = btn.innerHTML;
    btn.disabled = true;
    btn.classList.add('opacity-60','cursor-wait');
    btn.innerHTML = '<span class="inline-flex items-center gap-1"><span class="ico w-3 h-3 animate-spin">' + ico('loader','w-3 h-3') + '</span>解析中…</span>';
  } else {
    if (btn.dataset.origHtml){
      btn.innerHTML = btn.dataset.origHtml;
      delete btn.dataset.origHtml;
    }
    btn.disabled = false;
    btn.classList.remove('opacity-60','cursor-wait');
    btn.querySelectorAll('[data-icon]').forEach(function(el){ delete el.dataset.done; });
    hydrateIcons(btn);
  }
}

function reverseGeocodePlaceCoords(opts){
  opts = opts || {};
  var latEl  = document.getElementById('place-lat');
  var lngEl  = document.getElementById('place-lng');
  var addrEl = document.getElementById('place-address');
  if (!latEl || !lngEl) return;

  var lat = parseFloat(latEl.value);
  var lng = parseFloat(lngEl.value);

  if (isNaN(lat) || isNaN(lng)){
    if (!opts.silent) showToast('請先填入有效的緯度與經度');
    return;
  }
  if (lat < -90 || lat > 90 || lng < -180 || lng > 180){
    if (!opts.silent) showToast('座標超出有效範圍');
    return;
  }

  var reqLat = lat, reqLng = lng;
  var btn = document.getElementById('place-regeo-btn');
  setPlaceRegeoBtnLoading(btn, true);
  if (!opts.silent) showToast('正在依座標解析地址...');

  reverseGeocode(lat, lng, function(err, data){
    setPlaceRegeoBtnLoading(btn, false);

    if (err){
      if (!opts.silent) showToast('地址解析失敗：' + err);
      return;
    }

    var nowLat = parseFloat(latEl.value);
    var nowLng = parseFloat(lngEl.value);
    if (nowLat !== reqLat || nowLng !== reqLng){
      if (!opts.silent) showToast('座標已變更，請重新解析');
      return;
    }

    var text = pickAddressText(data);
    if (!text){
      if (!opts.silent) showToast('解析成功，但沒有可用的地址資訊');
      return;
    }

    var isEmpty = !(addrEl && addrEl.value.trim());

    if (isEmpty){
      if (addrEl) addrEl.value = text;
      if (!opts.silent) showToast('已填入地址');
      return;
    }

    if (opts.silent) return;

    if (opts.overwrite){
      if (addrEl) addrEl.value = text;
      showToast('已更新地址');
      return;
    }

    showPlaceAddressPreview(text);
  });
}

function showPlaceAddressPreview(text){
  _pendingPlaceAddr = text;
  var wrap = document.getElementById('place-address-preview');
  if (!wrap) return;
  wrap.innerHTML =
    '<div class="bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-2">' +
      '<div class="text-[11px] text-amber-800 font-semibold mb-1">解析到的新地址（可選擇是否套用）</div>' +
      '<div class="text-[11px] text-slate-700 mb-1.5 break-all leading-relaxed">' + escapeHtml(text) + '</div>' +
      '<div class="flex gap-1.5">' +
        '<button type="button" onclick="applyPendingPlaceAddr()" class="flex-1 py-1 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-md text-[11px] transition">套用</button>' +
        '<button type="button" onclick="cancelPendingPlaceAddr()" class="flex-1 py-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-md text-[11px] transition">取消</button>' +
      '</div>' +
    '</div>';
}

function applyPendingPlaceAddr(){
  if (_pendingPlaceAddr){
    var addrEl = document.getElementById('place-address');
    if (addrEl) addrEl.value = _pendingPlaceAddr;
    showToast('已更新地址');
  }
  cancelPendingPlaceAddr();
}

function cancelPendingPlaceAddr(){
  _pendingPlaceAddr = null;
  var wrap = document.getElementById('place-address-preview');
  if (wrap) wrap.innerHTML = '';
}

function matchDistrictFromAddress(addr){
  var hay = [
    addr.state || '', addr.state_district || '', addr.region || '',
    addr.city || '', addr.city_district || '', addr.county || '',
    addr.district || '', addr.suburb || '', addr.quarter || '',
    addr.neighbourhood || '', addr.road || '', addr.display_name || ''
  ].join(' ').toLowerCase();

  for (var district in DISTRICT_KEYWORDS){
    var keys = DISTRICT_KEYWORDS[district];
    for (var i = 0; i < keys.length; i++){
      if (hay.indexOf(keys[i].toLowerCase()) !== -1) return district;
    }
  }
  return null;
}

function applyGeocodeResult(data){
  return fillPlaceAddressFromGeocode(data, { overwrite: false, overwriteName: false });
}

/* ---------- 保存 / 编辑 / 删除 ---------- */
function savePlace(){
  var nameEl     = document.getElementById('place-name');
  var typeEl     = document.getElementById('place-type');
  var addressEl  = document.getElementById('place-address');
  var noteEl     = document.getElementById('place-note');
  var latEl      = document.getElementById('place-lat');
  var lngEl      = document.getElementById('place-lng');

  var name = nameEl ? nameEl.value.trim() : '';
  var type = typeEl ? typeEl.value : '';
  var address = addressEl ? addressEl.value.trim() : '';
  var note = noteEl ? noteEl.value.trim() : '';
  var latVal = latEl ? latEl.value.trim() : '';
  var lngVal = lngEl ? lngEl.value.trim() : '';

  if (!name){ showToast('請輸入地點名稱'); return; }
  if (!type){ showToast('請選擇類型'); return; }

  var lat = latVal === '' ? null : parseFloat(latVal);
  var lng = lngVal === '' ? null : parseFloat(lngVal);
  if (lat !== null && isNaN(lat)) lat = null;
  if (lng !== null && isNaN(lng)) lng = null;

  var editId = currentEditingPlaceId;
  var editIndex = editId ? places.findIndex(function(p){ return p.id === editId; }) : -1;

  if (editId && editIndex !== -1){
    places[editIndex].name = name;
    places[editIndex].type = type;
    places[editIndex].address = address;
    places[editIndex].note = note;
    places[editIndex].lat = lat;
    places[editIndex].lng = lng;
    places[editIndex].updatedAt = Date.now();
    showToast('地點已更新');
  } else {
    places.unshift({
      id: 'place_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
      name: name, type: type,
      address: address, note: note, lat: lat, lng: lng,
      timestamp: Date.now()
    });
    showToast('地點已保存');
  }

  localStorage.setItem('taxi_places', JSON.stringify(places));
  currentEditingPlaceId = null;
  closeModal();
  renderPlacesList();
}

function openEditPlaceModal(id){
  var p = places.find(function(x){ return x.id === id; });
  if (!p){ showToast('找不到此地點'); return; }

  openAddPlaceModal();
  currentEditingPlaceId = id;

  document.getElementById('modal-title').innerText = '修改收藏地點';
  document.getElementById('place-name').value = p.name || '';
  document.getElementById('place-type').value = p.type || PLACE_TYPES[0];
  document.getElementById('place-address').value = p.address || '';
  document.getElementById('place-note').value = p.note || '';
  document.getElementById('place-lat').value = (typeof p.lat === 'number') ? p.lat : '';
  document.getElementById('place-lng').value = (typeof p.lng === 'number') ? p.lng : '';

  if (typeof p.lat === 'number' && typeof p.lng === 'number' && !(p.address || '').trim()){
    reverseGeocodePlaceCoords({ silent: true });
  }
}

function deletePlace(id){
  if (!confirm('確定要刪除此收藏地點嗎？')) return;
  places = places.filter(function(p){ return p.id !== id; });
  localStorage.setItem('taxi_places', JSON.stringify(places));
  renderPlacesList();
  showToast('地點已刪除');
}

/* ---------- 触摸 / 键盘处理 ---------- */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, { passive:false });
var lastTouchEnd = 0;
document.addEventListener('touchend', function(e){
  if (e.target && e.target.closest &&
      e.target.closest('button, a, input, select, textarea, label')){
    return;
  }
  var now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive:false });

(function setupTapToDismiss(){
  function isFormField(el){ if (!el) return false; var tag = el.tagName; return tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA'; }
  function dismissKeyboard(e){
    var target = e.target;
    if (target.closest && target.closest('input, select, textarea, button, a, label')) return;
    var active = document.activeElement;
    if (isFormField(active)) active.blur();
  }
  document.addEventListener('touchstart', dismissKeyboard, { passive: true });
  document.addEventListener('mousedown', dismissKeyboard);
})();

document.addEventListener('touchmove', function(e){
  var tripModal = document.getElementById('trip-modal');
  if (tripModal && !tripModal.classList.contains('hidden')){
    if (!tripModal.contains(e.target)) e.preventDefault();
  }
}, { passive:false });

/* ---------- 初始化 ---------- */
window.addEventListener('DOMContentLoaded', function(){
  hydrateIcons();
  renderPlaceFilters();
  renderPlacesList();
});
</script>
