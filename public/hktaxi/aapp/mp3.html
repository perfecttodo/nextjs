<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 智慧管理與分類系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(51, 65, 85, 0.6) transparent;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.4); border-radius: 9999px; transition: background 0.2s ease; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.6); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- 頂部導覽列 -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur shrink-0 px-4 md:px-6 py-3 flex flex-col md:flex-row items-center justify-between gap-3 z-20">
        <div class="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-start">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/35">
                    <i class="fa-solid fa-headphones-simple text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base md:text-lg font-bold tracking-wide">MP3 雲端管理</h1>
                    <p class="text-[11px] text-slate-400">即時串流、分類與標籤管理</p>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-3 w-full md:w-auto max-w-xl">
            <input type="text" id="dirInput" placeholder="輸入資料夾絕對路徑..." 
                class="bg-slate-800 border border-slate-700 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500 flex-1 md:w-80">
            <button onclick="loadFiles(true)" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-1.5 rounded-lg text-sm font-medium transition shadow-md whitespace-nowrap">
                <i class="fa-solid fa-rotate mr-1.5"></i> 載入
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 overflow-hidden pb-24">
        
        <!-- 左側：分類、標籤與搜尋 -->
        <div class="lg:col-span-1 space-y-4 flex flex-col shrink-0 overflow-y-auto pr-1">
            <!-- 分類區塊 -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl">
                <div class="flex items-center justify-between mb-3 px-1">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">分類標籤</h2>
                    <span id="count-badge" class="text-xs text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded-full border border-indigo-500/30">0 首</span>
                </div>
                <div id="categoryFilters" class="flex lg:flex-col space-x-2 lg:space-x-0 lg:space-y-1.5 overflow-x-auto lg:overflow-visible no-scrollbar pb-1 lg:pb-0 mb-3">
                    <!-- 動態載入分類 -->
                </div>
                <!-- 新增分類輸入框 -->
                <div class="flex items-center space-x-1.5 pt-2 border-t border-slate-800">
                    <input type="text" id="newCategoryInput" placeholder="新分類名稱..." 
                        class="bg-slate-800 border border-slate-700 text-xs rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-indigo-500 flex-1 text-slate-200"
                        onkeydown="if(event.key==='Enter') addNewCategory()">
                    <button onclick="addNewCategory()" class="bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white border border-slate-700 px-3 py-1.5 rounded-xl text-xs transition" title="新增分類">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- 標籤雲過濾區塊 -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl">
                <div class="flex items-center justify-between mb-2.5 px-1">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">標籤過濾</h2>
                    <button onclick="manageTagsPrompt()" class="text-[11px] text-indigo-400 hover:underline"><i class="fa-solid fa-gear mr-1"></i>管理</button>
                </div>
                <div id="tagCloudContainer" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto">
                    <!-- 動態標籤 -->
                </div>
            </div>

            <!-- 快速搜尋 -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2.5 px-1">快速搜尋</h2>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋歌名或目錄..." 
                        class="w-full bg-slate-800/80 border border-slate-700 text-sm rounded-xl pl-9 pr-4 py-2 focus:outline-none focus:border-indigo-500 text-slate-200">
                </div>
            </div>
        </div>

        <!-- 右側：MP3 檔案列表與分頁 -->
        <div class="lg:col-span-3 flex flex-col h-full overflow-hidden">
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl shadow-xl flex flex-col h-full overflow-hidden">
                
                <!-- 表格標題列 -->
                <div class="px-4 md:px-6 py-3.5 border-b border-slate-800 flex justify-between items-center shrink-0 flex-wrap gap-2">
                    <h2 class="font-semibold text-slate-200 flex items-center text-sm md:text-base">
                        <i class="fa-solid fa-list-music mr-2 text-indigo-400"></i> 檔案列表
                    </h2>
                    <div class="flex items-center space-x-3">
                        <span id="fileCountText" class="text-xs text-slate-400">共 0 首</span>

                        <div id="topPaginationBtns" class="flex items-center space-x-1">
                            <button id="topPrevBtn" onclick="goToPage(currentPage - 1)" disabled class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed transition">
                                <i class="fa-solid fa-chevron-left"></i> 上一頁
                            </button>
                            <span id="topPageIndicator" class="text-xs text-slate-400 font-mono px-1">1 / 1</span>
                            <button id="topNextBtn" onclick="goToPage(currentPage + 1)" disabled class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed transition">
                                下一頁 <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>

                        <select id="pageSizeSelect" onchange="changePageSize(this.value)" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2 py-1 text-slate-300 focus:outline-none">
                            <option value="10">10 筆/頁</option>
                            <option value="20" selected>20 筆/頁</option>
                            <option value="50">50 筆/頁</option>
                            <option value="100">100 筆/頁</option>
                        </select>
                    </div>
                </div>

                <!-- 表格本體 -->
                <div id="tableContainer" class="flex-1 overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-slate-950/90 backdrop-blur z-10">
                            <tr class="border-b border-slate-800 text-xs text-slate-400 uppercase">
                                <th class="py-3 px-4 md:px-6">狀態 / 歌名與路徑</th>
                                <th class="py-3 px-3 md:px-4">分類 / 標籤</th>
                                <th class="py-3 px-3 md:px-4">大小</th>
                                <th class="py-3 px-4 md:px-6 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="fileTableBody" class="divide-y divide-slate-800/60 text-sm">
                            <tr>
                                <td colspan="4" class="text-center py-12 text-slate-500">
                                    <i class="fa-solid fa-folder-open text-3xl mb-2 block"></i>
                                    請輸入路徑並點擊「載入」
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div id="paginationContainer" class="px-4 md:px-6 py-3 border-t border-slate-800/80 flex flex-col md:flex-row items-center justify-between gap-3 bg-slate-950/40 shrink-0"></div>
            </div>
        </div>
    </main>

    <!-- 底部固定音訊播放器 -->
    <footer class="fixed bottom-0 left-0 right-0 bg-slate-900/98 backdrop-blur-md border-t border-slate-800 p-3 shadow-2xl z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
            <div class="flex items-center space-x-3 w-full md:w-1/4">
                <div class="w-10 h-10 rounded-lg bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-400 flex-shrink-0">
                    <i id="playerIcon" class="fa-solid fa-music"></i>
                </div>
                <div class="overflow-hidden">
                    <div id="currentSongTitle" class="text-xs md:text-sm font-medium truncate text-slate-200">尚未選擇播放歌曲</div>
                    <div id="currentSongCategory" class="text-xs text-indigo-400">就緒</div>
                </div>
            </div>

            <div class="flex flex-col items-center w-full md:w-2/4 space-y-1">
                <div class="flex items-center space-x-4">
                    <button onclick="toggleAutoMode()" id="autoModeBtn" class="text-xs px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-400 transition flex items-center space-x-1" title="切換自動模式 (10秒未Like自動下一首)">
                        <i class="fa-solid fa-bolt text-[10px]"></i>
                        <span>自動</span>
                    </button>

                    <!-- 使用內嵌 SVG 之播放模式按鈕 -->
                    <button onclick="togglePlayMode()" id="playModeBtn" class="text-slate-400 hover:text-indigo-400 transition flex items-center justify-center p-1" title="播放模式: 列表循環">
                        <!-- 預設為列表循環 SVG -->
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>

                    <button onclick="playPrev()" class="text-slate-400 hover:text-white transition" title="上一首"><i class="fa-solid fa-backward-step"></i></button>
                    <button onclick="togglePlay()" id="playPauseBtn" class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg transition">
                        <i class="fa-solid fa-play text-xs"></i>
                    </button>
                    <button onclick="playNext()" class="text-slate-400 hover:text-white transition" title="下一首"><i class="fa-solid fa-forward-step"></i></button>
                    
                    <button id="playerLikeBtn" onclick="togglePlayerLike()" class="text-slate-500 hover:text-rose-400 transition hidden ml-1 text-base" title="加入最愛">
                        <i id="playerLikeIcon" class="fa-regular fa-heart"></i>
                    </button>
                    
                    <span id="modeText" class="text-[10px] text-slate-500 bg-slate-800 px-2 py-0.5 rounded ml-2">循環</span>
                </div>
                <div class="w-full flex items-center space-x-3 text-xs text-slate-400">
                    <span id="currentTime">00:00</span>
                    <input type="range" id="progressBar" value="0" max="100" step="0.1" onchange="seekAudio(this.value)"
                        class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    <span id="durationTime">00:00</span>
                    <span id="autoTimerText" class="text-[11px] text-amber-400 font-mono hidden whitespace-nowrap"></span>
                </div>
            </div>

            <div class="hidden md:flex items-center space-x-3 w-1/4 justify-end">
                <i class="fa-solid fa-volume-high text-slate-400 text-sm"></i>
                <input type="range" min="0" max="1" step="0.05" value="1" oninput="audioPlayer.volume = this.value"
                        class="w-24 h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>
        </div>
    </footer>

    <!-- 自訂對話框 Modal -->
    <div id="customModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl transform scale-95 transition-transform duration-200" id="modalBox">
            <div class="flex items-center space-x-3 mb-4">
                <div id="modalIconContainer" class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">
                    <i id="modalIcon" class="fa-solid fa-circle-info text-lg"></i>
                </div>
                <div>
                    <h3 id="modalTitle" class="text-base font-bold text-slate-100">提示</h3>
                    <p id="modalSubtitle" class="text-xs text-slate-400">系統通知</p>
                </div>
            </div>
            <div id="modalBody" class="text-sm text-slate-300 mb-6 bg-slate-950/50 p-3.5 rounded-xl border border-slate-800/80"></div>
            <div class="flex items-center justify-end space-x-3">
                <button id="modalCancelBtn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition hidden">取消</button>
                <button id="modalConfirmBtn" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-medium text-white transition shadow-lg shadow-indigo-600/30">確定</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" ontimeupdate="updateProgress()" onended="onAudioEnded()" onerror="onAudioError()"></audio>

    <script>
        let allFiles = [];
        let categories = ['未分類', '流行', '輕音樂', '工作', '其他'];
        let currentCategory = '全部';
        let currentTagFilter = null;
        let currentPlayingFile = null;
        const audioPlayer = document.getElementById('audioPlayer');

        let currentPage = 1;
        let pageSize = 20;
        let playMode = 'loop'; // 'loop', 'shuffle', 'single', 'sequence'
        let isAutoMode = false;
        let autoTimer = null;
        let autoCountdownInterval = null;
        let remainingSeconds = 10;

        // 全域 SVG 圖標庫字典（防止 FontAwesome 圖標缺漏）
        const modeIconsSVG = {
            'loop': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>`,
            'shuffle': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>`,
            'single': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><path d="M13 15h-1.5v-3.5H10V10h3v5z"/></svg>`,
            'sequence': `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M5 12h11.17l-4.58-4.59L13 6l6 6-6 6-1.41-1.41L16.17 13H5v-2z"/></svg>`
        };

        function getSavedCategories() {
            try {
                const saved = localStorage.getItem('mp3_custom_categories');
                return saved ? JSON.parse(saved) : ['未分類', '流行', '輕音樂', '工作', '其他'];
            } catch (e) { return ['未分類', '流行', '輕音樂', '工作', '其他']; }
        }

        function saveCategories(cats) {
            localStorage.setItem('mp3_custom_categories', JSON.stringify(cats));
        }

        function getTagsMap() {
            try { return JSON.parse(localStorage.getItem('mp3_tags_map') || '{}'); } catch (e) { return {}; }
        }

        function saveTagsMap(map) {
            localStorage.setItem('mp3_tags_map', JSON.stringify(map));
        }

        function getLikedMap() {
            try { return JSON.parse(localStorage.getItem('mp3_liked_map') || '{}'); } catch (e) { return {}; }
        }

        function saveLikedMap(map) {
            localStorage.setItem('mp3_liked_map', JSON.stringify(map));
        }

        window.addEventListener('DOMContentLoaded', () => {
            categories = getSavedCategories();
            const params = new URLSearchParams(window.location.search);
            const dirParam = params.get('dir');
            if (dirParam) document.getElementById('dirInput').value = dirParam;
            
            const pageParam = parseInt(params.get('page'));
            if (!isNaN(pageParam) && pageParam > 0) currentPage = pageParam;

            const sizeParam = parseInt(params.get('pageSize'));
            if (!isNaN(sizeParam) && sizeParam > 0) {
                pageSize = sizeParam;
                const sizeSelectEl = document.getElementById('pageSizeSelect');
                if (sizeSelectEl) sizeSelectEl.value = pageSize;
            }

            loadFiles(false);
        });

        function updateUrlParams() {
            const dir = document.getElementById('dirInput').value.trim();
            const params = new URLSearchParams(window.location.search);
            if (dir) params.set('dir', dir);
            params.set('page', currentPage);
            params.set('pageSize', pageSize);
            window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
        }

        async function loadFiles(resetPage = false) {
            const dir = document.getElementById('dirInput').value.trim();
            if (resetPage) currentPage = 1;
            updateUrlParams();

            try {
                const res = await fetch(`/api/mp3?dir=${encodeURIComponent(dir)}`);
                const data = await res.json();
                
                if (data.success) {
                    const likedMap = getLikedMap();
                    const tagsMap = getTagsMap();

                    allFiles = data.files.map(f => {
                        const key = f.relativePath || f.filename;
                        return {
                            ...f,
                            isLiked: !!likedMap[key],
                            tags: tagsMap[key] || []
                        };
                    });

                    renderCategories();
                    renderTagCloud();
                    renderTable();
                    updatePlayerLikeState();
                } else {
                    await showCustomModal({ title: '載入失敗', message: data.error || '未知錯誤', type: 'error' });
                }
            } catch (err) {
                await showCustomModal({ title: '連線錯誤', message: '無法連線至 API 伺服器', type: 'error' });
            }
        }

        // ==================== 分類與標籤管理 ====================
        function addNewCategory() {
            const inputEl = document.getElementById('newCategoryInput');
            const catName = inputEl.value.trim();
            if (!catName) return;

            if (categories.includes(catName)) {
                showCustomModal({ title: '提示', message: '此分類名稱已存在！', type: 'info' });
                return;
            }

            categories.push(catName);
            saveCategories(categories);
            inputEl.value = '';
            renderCategories();
            renderTable();
        }

        async function deleteCategory(catName) {
            if (catName === '未分類' || catName === '全部' || catName === '我的最愛') return;

            const confirmed = await showCustomModal({
                title: '刪除分類',
                message: `確定要刪除分類「${catName}」嗎？\n原先屬於此分類的歌曲將自動歸為「未分類」。`,
                type: 'danger',
                confirmText: '確認刪除'
            });

            if (!confirmed) return;

            allFiles.forEach(f => {
                if (f.category === catName) f.category = '未分類';
            });

            categories = categories.filter(c => c !== catName);
            saveCategories(categories);

            if (currentCategory === catName) currentCategory = '全部';

            renderCategories();
            renderTable();
        }

        function renderCategories() {
            const container = document.getElementById('categoryFilters');
            const totalLikedCount = allFiles.filter(f => f.isLiked).length;

            let html = `
                <button onclick="filterCategory('全部')" class="cat-btn flex-shrink-0 lg:w-full text-left px-3.5 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center justify-between ${currentCategory === '全部' && !currentTagFilter ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'bg-slate-800/60 lg:bg-transparent hover:bg-slate-800 text-slate-300'}">
                    <span>全部</span>
                    <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${allFiles.length}</span>
                </button>
                <div class="flex items-center space-x-1 flex-shrink-0 lg:w-full">
                    <button onclick="filterCategory('我的最愛')" class="cat-btn flex-1 text-left px-3.5 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center justify-between ${currentCategory === '我的最愛' && !currentTagFilter ? 'bg-rose-600/20 text-rose-400 border border-rose-500/30' : 'bg-slate-800/60 lg:bg-transparent hover:bg-slate-800 text-slate-300'}">
                        <span class="flex items-center"><i class="fa-solid fa-heart text-rose-500 mr-2"></i> 我的最愛</span>
                        <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${totalLikedCount}</span>
                    </button>
                    <button onclick="copyFavoriteSongs()" class="p-2 bg-slate-800 hover:bg-rose-600/30 text-slate-400 hover:text-rose-400 border border-slate-700 rounded-xl transition text-xs flex items-center justify-center" title="複製我的最愛到指定目錄">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 1.259-.25 2.45-.71 3.518a.75.75 0 11-1.38-.586c.382-.897.59-1.91.59-2.932 0-2.112-1.748-3.75-3.937-3.75a3.98 3.98 0 00-3.322 1.77.75.75 0 01-1.238 0A3.98 3.98 0 008.437 4.5C6.248 4.5 4.5 6.138 4.5 8.25c0 3.256 2.052 6.132 4.38 8.16a23.684 23.684 0 003.882 2.871l.013.007.004.002.721 1.32-.721-1.32z"/></svg>
                    </button>
                </div>
            `;

            categories.forEach(cat => {
                const count = allFiles.filter(f => f.category === cat).length;
                const isActive = (currentCategory === cat && !currentTagFilter);
                const canDelete = (cat !== '未分類');

                html += `
                    <div class="flex items-center space-x-1 flex-shrink-0 lg:w-full group">
                        <button onclick="filterCategory('${cat}')" class="cat-btn flex-1 text-left px-3.5 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center justify-between ${isActive ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'bg-slate-800/60 lg:bg-transparent hover:bg-slate-800 text-slate-300'}">
                            <span>${cat}</span>
                            <span class="ml-2 text-[10px] bg-slate-800 px-1.5 py-0.5 rounded-full">${count}</span>
                        </button>
                        ${canDelete ? `<button onclick="deleteCategory('${cat}')" class="opacity-0 group-hover:opacity-100 p-1.5 text-slate-500 hover:text-rose-400 text-xs transition" title="刪除分類"><i class="fa-solid fa-xmark"></i></button>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('count-badge').innerText = `${allFiles.length} 首`;
        }

        function filterCategory(cat) {
            currentCategory = cat;
            currentTagFilter = null;
            currentPage = 1;
            updateUrlParams();
            renderCategories();
            renderTagCloud();
            renderTable();
        }

        function renderTagCloud() {
            const container = document.getElementById('tagCloudContainer');
            const tagsMap = getTagsMap();
            const tagCounts = {};

            Object.values(tagsMap).forEach(tags => {
                tags.forEach(tag => { tagCounts[tag] = (tagCounts[tag] || 0) + 1; });
            });

            const uniqueTags = Object.keys(tagCounts);
            if (uniqueTags.length === 0) {
                container.innerHTML = `<span class="text-[11px] text-slate-500 px-1">尚無任何標籤</span>`;
                return;
            }

            let html = `<span onclick="filterByTag(null)" class="cursor-pointer px-2 py-1 rounded-lg text-[11px] transition ${!currentTagFilter ? 'bg-indigo-600 text-white font-medium' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}">全部標籤</span>`;
            uniqueTags.forEach(tag => {
                const isActive = (currentTagFilter === tag);
                html += `<span onclick="filterByTag('${tag}')" class="cursor-pointer px-2 py-1 rounded-lg text-[11px] transition flex items-center space-x-1 ${isActive ? 'bg-indigo-600 text-white font-medium' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}"><span>#${tag}</span><span class="text-[9px] opacity-70">(${tagCounts[tag]})</span></span>`;
            });
            container.innerHTML = html;
        }

        function filterByTag(tag) {
            currentTagFilter = tag;
            currentPage = 1;
            renderCategories();
            renderTagCloud();
            renderTable();
        }

        async function editSongTags(fileKey, displayName) {
            const tagsMap = getTagsMap();
            const currentTags = tagsMap[fileKey] || [];
            const inputTags = await showCustomModal({
                title: '管理歌曲標籤',
                subtitle: displayName,
                message: '請輸入標籤（多個標籤請用半形逗號 , 隔開）：',
                type: 'confirm',
                isPrompt: true,
                defaultValue: currentTags.join(', '),
                confirmText: '儲存標籤'
            });

            if (inputTags === null) return;
            const newTags = inputTags.split(',').map(t => t.trim()).filter(t => t.length > 0);
            if (newTags.length > 0) tagsMap[fileKey] = [...new Set(newTags)];
            else delete tagsMap[fileKey];

            saveTagsMap(tagsMap);
            loadFiles(false);
        }

        function manageTagsPrompt() {
            showCustomModal({ title: '標籤管理提示', message: '點擊每首歌右側的「+標籤」按鈕可為該曲目新增或修改標籤，點擊左側標籤即可過濾歌曲。', type: 'info' });
        }

        // ==================== 播放控制與核心邏輯 ====================
        function getFilteredFiles() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            return allFiles.filter(f => {
                let matchCat = true;
                if (currentTagFilter) {
                    matchCat = f.tags && f.tags.includes(currentTagFilter);
                } else if (currentCategory === '我的最愛') {
                    matchCat = f.isLiked;
                } else if (currentCategory !== '全部') {
                    matchCat = (f.category === currentCategory);
                }

                const targetKey = f.relativePath || f.filename;
                const matchKey = (f.displayName || f.filename).toLowerCase().includes(keyword) || 
                                 targetKey.toLowerCase().includes(keyword);
                return matchCat && matchKey;
            });
        }

        // 使用 SVG 重構的播放模式切換
        function togglePlayMode() {
            const modes = ['loop', 'shuffle', 'single', 'sequence'];
            const modeNames = {
                'loop': '循環',
                'shuffle': '隨機',
                'single': '單曲',
                'sequence': '順序'
            };

            let currentIdx = modes.indexOf(playMode);
            if (currentIdx === -1) currentIdx = 0;
            let nextIdx = (currentIdx + 1) % modes.length;
            playMode = modes[nextIdx];

            const btn = document.getElementById('playModeBtn');
            const modeText = document.getElementById('modeText');
            btn.innerHTML = modeIconsSVG[playMode];
            modeText.innerText = modeNames[playMode];
            btn.title = `播放模式: ${modeNames[playMode]}`;
        }

        function toggleAutoMode() {
            isAutoMode = !isAutoMode;
            const btn = document.getElementById('autoModeBtn');
            if (isAutoMode) {
                btn.className = 'text-xs px-2.5 py-1 rounded-lg border border-amber-500/50 bg-amber-500/20 text-amber-400 transition flex items-center space-x-1 shadow-md';
                if (currentPlayingFile && !audioPlayer.paused) startAutoTimer(10);
            } else {
                btn.className = 'text-xs px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-400 transition flex items-center space-x-1';
                clearAutoTimer();
            }
        }

        function startAutoTimer(seconds) {
            clearAutoTimer();
            if (!isAutoMode) return;
            remainingSeconds = seconds;
            updateTimerDisplay(remainingSeconds);

            autoCountdownInterval = setInterval(() => {
                remainingSeconds--;
                if (remainingSeconds > 0) updateTimerDisplay(remainingSeconds);
                else { updateTimerDisplay(0); clearInterval(autoCountdownInterval); }
            }, 1000);

            autoTimer = setTimeout(() => { if (isAutoMode) playNext(); }, seconds * 1000);
        }

        function clearAutoTimer() {
            if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
            if (autoCountdownInterval) { clearInterval(autoCountdownInterval); autoCountdownInterval = null; }
            const timerText = document.getElementById('autoTimerText');
            timerText.classList.add('hidden');
            timerText.innerText = '';
        }

        function updateTimerDisplay(sec) {
            const timerText = document.getElementById('autoTimerText');
            if (!isAutoMode) { timerText.classList.add('hidden'); return; }
            timerText.classList.remove('hidden');
            timerText.innerText = `[自動換歌: ${sec}s]`;
        }

        function toggleLike(fileKey, event) {
            if (event) event.stopPropagation();
            const file = allFiles.find(f => (f.relativePath || f.filename) === fileKey);
            if (!file) return;

            file.isLiked = !file.isLiked;
            const likedMap = getLikedMap();
            if (file.isLiked) likedMap[fileKey] = true; else delete likedMap[fileKey];
            saveLikedMap(likedMap);

            renderCategories();
            renderTable();
            if (currentPlayingFile === fileKey) updatePlayerLikeState();

            if (isAutoMode && currentPlayingFile === fileKey && file.isLiked) {
                clearAutoTimer();
                const timerText = document.getElementById('autoTimerText');
                timerText.classList.remove('hidden');
                timerText.innerText = '[已Like，3秒後換歌...]';
                autoTimer = setTimeout(() => { if (isAutoMode) playNext(); }, 3000);
            }
        }

        function togglePlayerLike() {
            if (!currentPlayingFile) return;
            toggleLike(currentPlayingFile);
        }

        function updatePlayerLikeState() {
            const btn = document.getElementById('playerLikeBtn');
            const icon = document.getElementById('playerLikeIcon');
            if (!currentPlayingFile) { btn.classList.add('hidden'); clearAutoTimer(); return; }

            btn.classList.remove('hidden');
            const file = allFiles.find(f => (f.relativePath || f.filename) === currentPlayingFile);
            if (file && file.isLiked) {
                icon.className = 'fa-solid fa-heart text-rose-500';
                btn.title = '取消最愛';
            } else {
                icon.className = 'fa-regular fa-heart text-slate-500 hover:text-slate-300';
                btn.title = '加入最愛';
            }
        }

        function playSong(fileKey, displayName) {
            const dir = document.getElementById('dirInput').value.trim();
            const streamUrl = `/api/mp3?dir=${encodeURIComponent(dir)}&action=stream&filename=${encodeURIComponent(fileKey)}`;
            
            const filtered = getFilteredFiles();
            const songIndex = filtered.findIndex(f => (f.relativePath || f.filename) === fileKey);
            if (songIndex !== -1) {
                const targetPage = Math.floor(songIndex / pageSize) + 1;
                if (targetPage !== currentPage) { currentPage = targetPage; renderTable(); }
            }

            if (currentPlayingFile !== fileKey) {
                currentPlayingFile = fileKey;
                audioPlayer.src = streamUrl;
                audioPlayer.play();
                document.getElementById('currentSongTitle').innerText = displayName;
                const fileObj = allFiles.find(f => (f.relativePath || f.filename) === fileKey);
                document.getElementById('currentSongCategory').innerText = fileObj ? fileObj.category : '';
            } else {
                if (audioPlayer.paused) audioPlayer.play(); else audioPlayer.pause();
            }

            updatePlayerLikeState();
            renderTable();
            updatePlayButton();
            setTimeout(() => scrollToCurrentSong(fileKey), 50);

            if (isAutoMode && !audioPlayer.paused) startAutoTimer(10);
            else clearAutoTimer();
        }

        function scrollToCurrentSong(fileKey) {
            const rowId = `row-${encodeURIComponent(fileKey).replace(/[%._-]/g, '_')}`;
            const targetRow = document.getElementById(rowId);
            if (targetRow) targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function playPrev() {
            const list = getFilteredFiles();
            if (list.length === 0) return;
            const currentIndex = list.findIndex(f => (f.relativePath || f.filename) === currentPlayingFile);
            let prevIndex = currentIndex - 1;
            if (prevIndex < 0) prevIndex = list.length - 1;
            const target = list[prevIndex];
            playSong(target.relativePath || target.filename, target.displayName);
        }

        function playNext() {
            clearAutoTimer();
            const list = getFilteredFiles();
            if (list.length === 0) return;

            if (playMode === 'shuffle') {
                let randomIndex = Math.floor(Math.random() * list.length);
                if (list.length > 1 && (list[randomIndex].relativePath || list[randomIndex].filename) === currentPlayingFile) {
                    randomIndex = (randomIndex + 1) % list.length;
                }
                const target = list[randomIndex];
                playSong(target.relativePath || target.filename, target.displayName);
                return;
            }

            const currentIndex = list.findIndex(f => (f.relativePath || f.filename) === currentPlayingFile);
            let nextIndex = currentIndex + 1;
            if (nextIndex >= list.length) {
                if (playMode === 'sequence') {
                    audioPlayer.pause();
                    currentPlayingFile = null;
                    updatePlayerLikeState();
                    renderTable();
                    updatePlayButton();
                    return;
                }
                nextIndex = 0;
            }
            const target = list[nextIndex];
            playSong(target.relativePath || target.filename, target.displayName);
        }

        function onAudioEnded() {
            if (playMode === 'single') { 
                audioPlayer.currentTime = 0; 
                audioPlayer.play(); 
                return; 
            }
            playNext();
        }

        function onAudioError() {
            const titleEl = document.getElementById('currentSongTitle');
            if (titleEl) titleEl.innerText = "⚠️ 檔案損毀或無法播放，自動跳過...";
            setTimeout(() => playNext(), 1000);
        }

        function togglePlay() {
            if (!audioPlayer.src) {
                const list = getFilteredFiles();
                if (list.length > 0) playSong(list[0].relativePath || list[0].filename, list[0].displayName);
                return;
            }
            if (audioPlayer.paused) { audioPlayer.play(); if (isAutoMode) startAutoTimer(10); }
            else { audioPlayer.pause(); clearAutoTimer(); }
            updatePlayButton();
            renderTable();
        }

        function updatePlayButton() {
            const btn = document.getElementById('playPauseBtn');
            btn.innerHTML = audioPlayer.paused ? '<i class="fa-solid fa-play text-xs"></i>' : '<i class="fa-solid fa-pause text-xs"></i>';
        }

        function updateProgress() {
            if (isNaN(audioPlayer.duration)) return;
            document.getElementById('progressBar').value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            document.getElementById('currentTime').innerText = formatTime(audioPlayer.currentTime);
            document.getElementById('durationTime').innerText = formatTime(audioPlayer.duration);
        }

        function seekAudio(val) {
            if (!isNaN(audioPlayer.duration)) audioPlayer.currentTime = (val / 100) * audioPlayer.duration;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        async function changeCategory(fileKey, newCategory) {
            const dir = document.getElementById('dirInput').value.trim();
            const res = await fetch('/api/mp3', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dir, filename: fileKey, newCategory })
            });
            const data = await res.json();
            if (data.success) loadFiles(false);
            else showCustomModal({ title: '修改失敗', message: data.error, type: 'error' });
        }

        async function deleteSong(fileKey) {
            const confirmed = await showCustomModal({
                title: '刪除檔案確認',
                subtitle: '此操作無法復原',
                message: '確定要從硬碟中刪除這個 MP3 檔案嗎？',
                type: 'danger',
                confirmText: '確認刪除'
            });

            if (!confirmed) return;
            const dir = document.getElementById('dirInput').value.trim();
            const res = await fetch(`/api/mp3?dir=${encodeURIComponent(dir)}&filename=${encodeURIComponent(fileKey)}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                if (currentPlayingFile === fileKey) {
                    audioPlayer.pause();
                    currentPlayingFile = null;
                    updatePlayerLikeState();
                    clearAutoTimer();
                }
                loadFiles(false);
            } else {
                showCustomModal({ title: '刪除失敗', message: data.error, type: 'error' });
            }
        }

        async function copyFavoriteSongs() {
            const likedMap = getLikedMap();
            const likedKeys = Object.keys(likedMap);
            if (likedKeys.length === 0) {
                showCustomModal({ title: '提示', message: '目前沒有任何「我的最愛」歌曲可供複製！', type: 'info' });
                return;
            }

            const savedTargetDir = localStorage.getItem('mp3_copy_target_dir') || '';
            const targetDir = await showCustomModal({
                title: '複製我的最愛',
                subtitle: `共選定 ${likedKeys.length} 首收藏歌曲`,
                message: '請輸入要複製過去的目標資料夾絕對路徑：',
                type: 'confirm',
                isPrompt: true,
                defaultValue: savedTargetDir,
                confirmText: '開始複製'
            });

            if (!targetDir || !targetDir.trim()) return;
            const trimmedTargetDir = targetDir.trim();
            localStorage.setItem('mp3_copy_target_dir', trimmedTargetDir);
            const currentSourceDir = document.getElementById('dirInput').value.trim();

            const res = await fetch('/api/mp3/copy-favorites', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sourceDir: currentSourceDir, targetDir: trimmedTargetDir, filenames: likedKeys })
            });
            const data = await res.json();
            if (data.success) {
                showCustomModal({ title: '複製完成', message: `已成功將最愛歌曲複製。\n成功：${data.successCount} 首`, type: 'success' });
            } else {
                showCustomModal({ title: '複製失敗', message: data.error, type: 'error' });
            }
        }

        function handleSearch() { currentPage = 1; updateUrlParams(); renderTable(); }
        function goToPage(p) { currentPage = p; updateUrlParams(); renderTable(); }
        function changePageSize(sz) { pageSize = parseInt(sz); currentPage = 1; updateUrlParams(); renderTable(); }

        function renderTable() {
            const tbody = document.getElementById('fileTableBody');
            let filtered = getFilteredFiles();
            document.getElementById('fileCountText').innerText = `共 ${filtered.length} 首`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-12 text-slate-500"><i class="fa-solid fa-music text-3xl mb-2 block"></i>沒有找到符合的 MP3 檔案</td></tr>`;
                document.getElementById('paginationContainer').innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(filtered.length / pageSize);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIdx = (currentPage - 1) * pageSize;
            const pageItems = filtered.slice(startIdx, startIdx + pageSize);

            let html = '';
            pageItems.forEach(file => {
                const fileKey = file.relativePath || file.filename;
                const isPlaying = currentPlayingFile === fileKey;
                const sizeMb = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
                let catOptions = categories.map(c => `<option value="${c}" ${c === file.category ? 'selected' : ''}>${c}</option>`).join('');

                const safeKey = fileKey.replace(/'/g, "\\'");
                const safeDisplayName = (file.displayName || file.filename).replace(/'/g, "\\'");
                const rowId = `row-${encodeURIComponent(fileKey).replace(/[%._-]/g, '_')}`;
                let tagsHtml = (file.tags || []).map(t => `<span class="bg-indigo-950 text-indigo-300 border border-indigo-500/30 px-1.5 py-0.5 rounded text-[10px]">#${t}</span>`).join(' ');

                html += `
                    <tr id="${rowId}" class="hover:bg-slate-900/50 transition ${isPlaying ? 'bg-indigo-950/20 border-l-4 border-indigo-500' : ''}">
                        <td class="py-3 px-4 md:px-6 flex items-center space-x-3">
                            <button onclick="playSong('${safeKey}', '${safeDisplayName}')" class="w-9 h-9 rounded-lg ${isPlaying ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-indigo-400 hover:bg-indigo-600 hover:text-white'} flex items-center justify-center transition shadow flex-shrink-0">
                                <i class="fa-solid ${isPlaying && !audioPlayer.paused ? 'fa-pause' : 'fa-play'} text-xs"></i>
                            </button>
                            <div class="overflow-hidden flex-1">
                                <div class="flex items-center space-x-2">
                                    <span class="font-medium text-slate-200 truncate max-w-[180px] md:max-w-md" title="${safeDisplayName}">${file.displayName}</span>
                                    <button onclick="toggleLike('${safeKey}', event)" class="text-xs transition ${file.isLiked ? 'text-rose-500 hover:text-rose-400' : 'text-slate-600 hover:text-slate-400'}" title="最愛">
                                        <i class="${file.isLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i>
                                    </button>
                                </div>
                                ${file.relativePath && file.relativePath !== file.filename ? `<div class="text-[11px] text-slate-500 truncate max-w-[200px] md:max-w-md">${file.relativePath}</div>` : ''}
                            </div>
                        </td>
                        <td class="py-3 px-3 md:px-4 space-y-1.5">
                            <select onchange="changeCategory('${safeKey}', this.value)" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2 py-1 text-slate-300 focus:outline-none focus:border-indigo-500 block">
                                ${catOptions}
                            </select>
                            <div class="flex flex-wrap gap-1 items-center">
                                ${tagsHtml}
                                <button onclick="editSongTags('${safeKey}', '${safeDisplayName}')" class="text-[10px] text-slate-500 hover:text-indigo-400 px-1 border border-dashed border-slate-700 rounded" title="編輯標籤">+標籤</button>
                            </div>
                        </td>
                        <td class="py-3 px-3 md:px-4 text-xs text-slate-400 whitespace-nowrap">${sizeMb}</td>
                        <td class="py-3 px-4 md:px-6 text-right">
                            <button onclick="deleteSong('${safeKey}')" class="text-slate-500 hover:text-rose-400 p-1.5 transition" title="刪除檔案">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            renderPagination(totalPages, filtered.length);
        }

        function renderPagination(totalPages, totalItems) {
            const container = document.getElementById('paginationContainer');
            if (totalPages <= 1) {
                container.innerHTML = `<span class="text-xs text-slate-400">顯示全部 ${totalItems} 筆資料</span>`;
                return;
            }
            container.innerHTML = `<span class="text-xs text-slate-400">頁次 ${currentPage} / ${totalPages} (共 ${totalItems} 筆)</span>`;
        }

        // Modal 封裝
        function showCustomModal({ title, subtitle = '系統通知', message, type = 'info', isPrompt = false, defaultValue = '', confirmText = '確定' }) {
            return new Promise((resolve) => {
                const modal = document.getElementById('customModal');
                const modalBox = document.getElementById('modalBox');
                const titleEl = document.getElementById('modalTitle');
                const subtitleEl = document.getElementById('modalSubtitle');
                const bodyEl = document.getElementById('modalBody');
                const confirmBtn = document.getElementById('modalConfirmBtn');
                const cancelBtn = document.getElementById('modalCancelBtn');
                const iconEl = document.getElementById('modalIcon');
                const iconContainer = document.getElementById('modalIconContainer');

                titleEl.innerText = title;
                subtitleEl.innerText = subtitle;
                confirmBtn.innerText = confirmText;

                let iconClass = 'fa-solid fa-circle-info';
                let iconBgClass = 'bg-indigo-500/20 text-indigo-400';
                let confirmBtnClass = 'bg-indigo-600 hover:bg-indigo-500 shadow-indigo-600/30';

                if (type === 'error' || type === 'danger') {
                    iconClass = 'fa-solid fa-triangle-exclamation';
                    iconBgClass = 'bg-rose-500/20 text-rose-400';
                    confirmBtnClass = 'bg-rose-600 hover:bg-rose-500 shadow-rose-600/30';
                } else if (type === 'success') {
                    iconClass = 'fa-solid fa-circle-check';
                    iconBgClass = 'bg-emerald-500/20 text-emerald-400';
                    confirmBtnClass = 'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-600/30';
                }

                iconEl.className = iconClass;
                iconContainer.className = `w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${iconBgClass}`;
                confirmBtn.className = `px-5 py-2 rounded-xl text-xs font-medium text-white transition shadow-lg ${confirmBtnClass}`;

                const needsCancel = (type === 'confirm' || type === 'danger' || isPrompt);
                cancelBtn.classList.toggle('hidden', !needsCancel);

                if (isPrompt) {
                    bodyEl.innerHTML = `<p class="mb-2 text-slate-300">${message}</p><input type="text" id="modalPromptInput" value="${defaultValue}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">`;
                } else {
                    bodyEl.innerHTML = `<p>${message.replace(/\n/g, '<br>')}</p>`;
                }

                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalBox.classList.remove('scale-95');
                    if (isPrompt) {
                        const inputEl = document.getElementById('modalPromptInput');
                        if (inputEl) { inputEl.focus(); inputEl.select(); }
                    }
                }, 10);

                const newConfirmBtn = confirmBtn.cloneNode(true);
                const newCancelBtn = cancelBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
                cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

                const closeModal = (result) => {
                    modal.classList.add('opacity-0');
                    modalBox.classList.add('scale-95');
                    setTimeout(() => { modal.classList.add('hidden'); resolve(result); }, 200);
                };

                newConfirmBtn.addEventListener('click', () => {
                    closeModal(isPrompt ? document.getElementById('modalPromptInput').value : true);
                });
                newCancelBtn.addEventListener('click', () => {
                    closeModal(isPrompt ? null : false);
                });
                if (isPrompt) {
                    document.getElementById('modalPromptInput').addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') newConfirmBtn.click();
                    });
                }
            });
        }
    </script>
</body>
</html>
