<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>的士助手</title>
<meta name="theme-color" content="#f59e0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="的士助手">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="bg-amber-500 text-slate-900 shadow-md sticky top-0 z-50" style="padding-top:var(--safe-area-top)">
  <div class="max-w-md mx-auto px-4 py-2.5 flex justify-between items-center gap-2">
    <div id="header-logo-btn" class="flex items-center space-x-2 cursor-pointer active:scale-[0.98] transition select-none min-w-0">
      <span class="ico w-7 h-7 shrink-0" data-icon="car-taxi-front"></span>
      <h1 class="text-lg font-bold tracking-tight truncate">香港的士助手</h1>
      <span class="ico w-4 h-4 text-amber-700 opacity-70 shrink-0" data-icon="chevron-down"></span>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <button type="button" id="header-trip-session-btn" onclick="openTripDrawer()" title="行程記錄（開始 / 停靠 / 終點）"
              class="relative flex items-center justify-center w-9 h-9 bg-amber-600 hover:bg-amber-700 active:scale-[0.98] text-white rounded-xl shadow-inner transition">
        <span class="ico w-5 h-5" data-icon="navigation"></span>
        <span id="header-trip-session-dot" class="hidden absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-400 border-2 border-amber-500"></span>
      </button>
      <button type="button" id="header-shift-badge" onclick="openShiftTimeModal()" title="點擊開工/收工" class="flex flex-col items-end bg-amber-600 hover:bg-amber-700 active:scale-[0.98] text-white px-2.5 py-1 rounded-xl shadow-inner transition">
        <span id="header-current-time" class="font-mono font-bold text-xs leading-none">--:--:--</span>
        <span id="header-worked" class="font-mono text-[9px] opacity-90 leading-none mt-0.5">未開工</span>
      </button>
    </div>
  </div>
</header>

<main id="main-tab-content" class="flex-1 max-w-md w-full mx-auto p-4">
  <section id="tab-trip" class="space-y-4">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4">
      <div class="flex justify-between items-center border-b pb-3 gap-2">
        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2 shrink-0">
          <span class="ico w-5 h-5 text-amber-500" data-icon="receipt"></span> 新增記錄
        </h2>
        <button type="button" id="pending-trip-duration-btn" onclick="openPendingTripPreview()" title="查看行程軌跡"
                class="hidden items-center gap-1 px-2 py-0.5 rounded-full border font-bold text-[11px] transition bg-amber-100 text-amber-800 border-amber-300 hover:bg-amber-200 active:scale-[0.98] shrink-0">
          <span class="ico w-3 h-3" data-icon="navigation"></span>
          <span id="pending-trip-duration-text">--</span>
        </button>
        <span id="current-date-time-preview" onclick="openShiftPickerModal()" class="text-xs text-slate-400 font-medium text-right leading-tight cursor-pointer select-none hover:text-slate-600 transition ml-auto"></span>
      </div>
      <div>
        <div class="flex justify-between items-center mb-1 gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <label class="block text-sm font-semibold text-slate-700 shrink-0">車資金額 (HKD)</label>
            <button type="button" id="trip-time-chip" onclick="openTripTimeModal()" class="text-[11px] px-2 py-0.5 rounded-full border font-medium transition bg-white text-slate-600 border-slate-200 hover:bg-slate-100 flex items-center gap-1 shrink-0">
              <span class="ico w-3 h-3" data-icon="clock"></span>
              <span id="trip-time-chip-text">--:--</span>
            </button>
            <button type="button" id="trip-location-chip" onclick="refreshLocationManual()" title="位置狀態（點擊刷新）" class="w-6 h-6 rounded-full border flex items-center justify-center transition shrink-0 bg-slate-50 text-slate-300 border-slate-200">
              <span class="ico w-3 h-3" data-icon="map-pin"></span>
            </button>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button type="button" id="fare-clear-btn" onclick="clearFare()" class="text-[11px] px-2.5 py-1 rounded-full border font-medium transition bg-white text-rose-600 border-rose-200 hover:bg-rose-50 hidden">清除</button>
            <button type="button" id="fare-sign-toggle" onclick="toggleFareSign()" class="text-[11px] px-2.5 py-1 rounded-full border font-bold transition bg-emerald-50 text-emerald-700 border-emerald-200">收入</button>
          </div>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-bold">$</span>
          <input type="number" id="trip-fare" step="0.5" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0.0" oninput="calculateChange()" onblur="confirmFareInput()" class="w-full pl-8 pr-4 py-3 text-2xl font-bold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none">
        </div>
        <p class="text-[11px] text-slate-400 mt-1.5 flex items-center gap-1">
          <span class="ico w-3 h-3" data-icon="info"></span>
          可直接輸入負數（如 -50），或點「收入」切換為「支出」
        </p>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">類型</label>
        <div id="trip-type-buttons" class="grid grid-cols-3 gap-2"></div>
        <button type="button" id="trip-type-toggle" onclick="toggleTripTypeExpanded()" class="mt-2 w-full py-1.5 text-[11px] bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-slate-600 font-semibold transition flex items-center justify-center gap-1">
          <span id="trip-type-toggle-text">更多網約車平台</span>
          <svg id="trip-type-toggle-chevron" style="width:11px;height:11px;transition:transform .2s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <div id="payment-block" class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80 space-y-3">
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-semibold text-slate-600">收到客戶付款 (HKD)</label>
            <button type="button" onclick="clearReceived()" class="text-xs text-rose-600 hover:text-rose-700 font-medium px-2 py-0.5 bg-rose-50 hover:bg-rose-100 rounded transition">清除付款</button>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-bold">$</span>
            <input type="number" id="trip-received" step="0.5" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="留空代表付剛好" oninput="calculateChange()" onblur="confirmReceivedInput()" class="w-full pl-8 pr-4 py-2.5 text-lg font-bold bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
          </div>
          <div class="grid grid-cols-4 gap-2 mt-2">
            <button type="button" onclick="setReceived(50)" class="py-1.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-medium rounded-md text-xs shadow-xs transition">$50</button>
            <button type="button" onclick="setReceived(100)" class="py-1.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-medium rounded-md text-xs shadow-xs transition">$100</button>
            <button type="button" onclick="setReceived(500)" class="py-1.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-medium rounded-md text-xs shadow-xs transition">$500</button>
            <button type="button" onclick="setReceived(1000)" class="py-1.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-medium rounded-md text-xs shadow-xs transition">$1000</button>
          </div>
        </div>
        <div id="change-box" class="flex justify-between items-center bg-gradient-to-r px-3.5 py-3 rounded-xl border-2 border-amber-400 shadow-sm transition">
          <span class="text-sm font-bold text-amber-900 flex items-center gap-1.5">
            <span id="change-icon" class="ico w-5 h-5 text-amber-700" data-icon="coins"></span>
            <span id="change-label">應找零錢</span>
          </span>
          <span id="change-display" class="text-3xl font-black text-emerald-800 font-mono tracking-tight change-shadow">$0.0</span>
        </div>
      </div>
      <div id="advanced-settings" class="space-y-4 pt-1">
        <div id="payment-method-block">
          <div class="flex justify-between items-center mb-1.5">
            <label class="block text-sm font-semibold text-slate-700">付款方式</label>
            <span class="text-[11px] text-slate-400">用於統計現金／八達通收入</span>
          </div>
          <div id="trip-payment-buttons" class="grid grid-cols-3 gap-2"></div>
        </div>
        <div id="note-block">
          <div class="flex justify-between items-center mb-1">
            <label class="block text-sm font-semibold text-slate-700">備注 (選填)</label>
            <div class="flex items-center gap-1.5">
              <button type="button" id="note-clear-btn" onclick="clearNote()" class="text-[11px] px-2 py-0.5 rounded-full border font-medium transition bg-white text-rose-600 border-rose-200 hover:bg-rose-50 hidden">清除</button>
              <button type="button" id="note-tags-toggle" onclick="toggleNoteTagsPanel()" class="text-[11px] px-2 py-0.5 rounded-full border font-medium transition bg-white text-slate-600 border-slate-200 hover:bg-slate-100 flex items-center gap-1">
                <svg style="width:11px;height:11px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                <span id="note-tags-toggle-text">快速標籤</span>
              </button>
            </div>
          </div>
          <input type="text" id="trip-note" placeholder="例如：過海、機場、隧道口等..." autocomplete="off" enterkeyhint="done" oninput="renderNoteTags()" class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none">
          <div id="note-quick-tags" class="flex-wrap gap-1.5 mt-2 p-2 bg-slate-50 border border-slate-200 rounded-xl" style="display:none"></div>
        </div>
      </div>
      <button type="button" onclick="saveTrip()" class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 active:scale-[0.99] text-slate-900 font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 text-base">
        <span class="ico w-5 h-5" data-icon="check-circle"></span> 完成保存記錄
      </button>
    </div>
  </section>

  <section id="tab-list" class="space-y-3 hidden">
    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><span class="ico w-4 h-4" data-icon="search"></span></span>
        <input type="text" id="search-keyword" oninput="renderTripList()" placeholder="搜尋備注..." autocomplete="off" class="w-full pl-9 pr-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">類型篩選（多選）</label>
        <div class="grid grid-cols-4 gap-1.5 bg-slate-50 p-2 rounded-xl border border-slate-200/80">
          <label class="flex items-center space-x-1 cursor-pointer text-xs font-bold text-amber-700 select-none"><input type="checkbox" id="chk-type-all" checked onchange="toggleAllTripTypes(this.checked)"><span>全部</span></label>
          <label class="flex items-center space-x-1 cursor-pointer text-xs font-medium text-slate-700 select-none"><input type="checkbox" id="chk-type-street" checked onchange="onTripTypeFilterChange()"><span>街客</span></label>
          <label class="flex items-center space-x-1 cursor-pointer text-xs font-medium text-slate-700 select-none"><input type="checkbox" id="chk-type-uber" checked onchange="onTripTypeFilterChange()"><span>Uber</span></label>
          <label class="flex items-center space-x-1 cursor-pointer text-xs font-medium text-slate-700 select-none"><input type="checkbox" id="chk-type-other" checked onchange="onTripTypeFilterChange()"><span>網約車</span></label>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">付款方式篩選</label>
        <div class="grid grid-cols-4 gap-1.5 bg-slate-50 p-2 rounded-xl border border-slate-200/80">
          <label class="flex items-center space-x-1 cursor-pointer text-xs font-bold text-amber-700 select-none"><input type="checkbox" id="chk-pay-all" checked onchange="toggleAllPaymentMethods(this.checked)"><span>全部</span></label>
          <label class="flex items-center space-x-1 cursor-pointer text-xs font-medium text-slate-700 select-none"><input type="checkbox" id="chk-pay-cash" checked onchange="onPaymentFilterChange()"><span>現金</span></label>
          <label class="flex items-center space-x-1 cursor-pointer text-xs font-medium text-slate-700 select-none"><input type="checkbox" id="chk-pay-octopus" checked onchange="onPaymentFilterChange()"><span>八達通</span></label>
          <label class="flex items-center space-x-1 cursor-pointer text-xs font-medium text-slate-700 select-none"><input type="checkbox" id="chk-pay-other" checked onchange="onPaymentFilterChange()"><span>其他</span></label>
        </div>
      </div>
      <div class="flex justify-between items-center pt-2 border-t border-slate-100 text-xs flex-wrap gap-x-2 gap-y-1.5">
        <div class="flex items-center gap-1.5 flex-wrap">
          <label class="flex items-center space-x-1.5 cursor-pointer select-none"><input type="checkbox" id="filter-last-shift" checked onchange="renderTripList()"><span class="font-medium text-slate-700">只顯示最後一更</span></label>
          <span class="text-slate-300 select-none">·</span>
          <label class="flex items-center space-x-1 cursor-pointer select-none"><input type="checkbox" id="chk-flow-income" checked onchange="renderTripList()"><span class="font-medium text-emerald-700">收入</span></label>
          <label class="flex items-center space-x-1 cursor-pointer select-none"><input type="checkbox" id="chk-flow-expense" checked onchange="renderTripList()"><span class="font-medium text-rose-600">支出</span></label>
        </div>
        <span id="trip-count-badge" class="text-slate-400 font-medium">共 0 筆</span>
      </div>
    </div>
    <div id="trip-list-container" class="space-y-2"></div>
  </section>
</main>

<div id="sub-page-container" class="hidden w-full"></div>

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-50">
  <div class="max-w-md mx-auto grid grid-cols-4 h-16">
    <button onclick="switchTab('trip')" id="nav-trip" class="flex flex-col items-center justify-center text-amber-500 transition">
      <span class="ico w-5 h-5" data-icon="plus-circle"></span><span class="text-[11px] font-bold mt-1">記帳</span>
    </button>
    <button onclick="switchTab('list')" id="nav-list" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition">
      <span class="ico w-5 h-5" data-icon="list-bullet"></span><span class="text-[11px] font-medium mt-1">行程</span>
    </button>
    <button onclick="handleDrawerItem('places')" id="nav-places" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition">
      <span class="ico w-5 h-5" data-icon="map-pin"></span><span class="text-[11px] font-medium mt-1">地點</span>
    </button>
    <button onclick="handleDrawerItem('stats')" id="nav-stats" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition">
      <span class="ico w-5 h-5" data-icon="pie-chart"></span><span class="text-[11px] font-medium mt-1">統計</span>
    </button>
  </div>
</nav>

<div id="drawer-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-60" onclick="closeDrawer()"></div>
<aside id="side-drawer" class="fixed top-0 right-0 h-full w-[75vw] max-w-xs bg-white z-70 flex flex-col">
  <div class="bg-amber-500 px-4 py-3 flex justify-between items-center shrink-0">
    <span class="font-bold text-slate-900 flex items-center gap-2"><span class="ico w-5 h-5" data-icon="car-taxi-front"></span> 功能選單</span>
    <button type="button" onclick="closeDrawer()" class="p-1 text-slate-700 hover:text-slate-900 active:scale-[0.95] transition"><span class="ico w-5 h-5" data-icon="x"></span></button>
  </div>
  <div class="flex-1 overflow-y-auto p-3 space-y-2" id="drawer-content"></div>
  <div class="border-t border-slate-100 px-3 py-2.5 text-[10px] text-slate-400 leading-relaxed shrink-0">
    <div class="flex items-center gap-1.5"><span class="ico w-3 h-3" data-icon="info"></span><span>香港的士助手 v1.0</span></div>
  </div>
</aside>

<div id="trip-drawer-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-60" onclick="closeTripDrawer()"></div>
<aside id="trip-drawer" class="fixed top-0 left-0 h-full w-[80vw] max-w-sm bg-white z-70 flex flex-col">
  <div class="bg-slate-900 text-white px-4 py-3 flex justify-between items-center shrink-0" style="padding-top:calc(var(--safe-area-top) + 0.75rem)">
    <span class="font-bold flex items-center gap-2">
      <span class="ico w-5 h-5 text-amber-400" data-icon="navigation"></span>
      行程記錄
    </span>
    <button type="button" onclick="closeTripDrawer()" class="p-1 text-slate-300 hover:text-white active:scale-[0.95] transition">
      <span class="ico w-5 h-5" data-icon="x"></span>
    </button>
  </div>
  <div class="flex-1 overflow-y-auto p-4 space-y-3" id="trip-drawer-content"></div>
</aside>

<div id="trip-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-xl animate-in">
    <div class="bg-slate-900 text-white px-4 py-3 flex justify-between items-center">
      <h3 id="modal-title" class="font-bold text-sm">行程詳細</h3>
      <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1"><span class="ico w-5 h-5" data-icon="x"></span></button>
    </div>
    <div id="modal-body" class="p-4 space-y-3 max-h-80 overflow-y-auto"></div>
    <div id="modal-footer" class="bg-slate-50 px-4 py-3 border-t flex justify-end gap-2"></div>
  </div>
</div>

<div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-medium shadow-lg z-50 transition-all duration-300 opacity-0 pointer-events-none">
  提示訊息
</div>

<script>
const ICONS = {
  'car-taxi-front':'<path d="M5 17h14M3.5 13.5l1.4-4.2A2.2 2.2 0 0 1 7 7.8h10a2.2 2.2 0 0 1 2.1 1.5l1.4 4.2v3.5h-2M3.5 17v-3.5H21"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/>',
  'receipt':'<path d="M5 3h14v18l-2.3-1.6L14.4 21l-2.4-1.6L9.6 21 7.3 19.4 5 21V3z"/><path d="M9 8h6M9 12h6"/>',
  'flag':'<path d="M5 21V4M5 5h11l-2 4 2 4H5"/>',
  'smartphone':'<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>',
  'layers':'<path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  'coins':'<circle cx="9" cy="9" r="6"/><path d="M15.6 4.4A6 6 0 0 1 15 16M7 19h10"/>',
  'alert-triangle':'<path d="m10.3 3.6-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3.4l-8-14a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  'check-circle':'<circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.3 2.3 4.7-5"/>',
  'search':'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  'settings':'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>',
  'wallet':'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16.5 14.5h1"/>',
  'credit-card':'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  'bar-chart-3':'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  'trending-up':'<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  'database':'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  'calendar-x':'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M10 14l4 4M14 14l-4 4"/>',
  'calendar-minus':'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15h6"/>',
  'calendar-clock':'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v3l2 1.5"/>',
  'trash-2':'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/>',
  'history':'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4M12 8v5l3.5 2"/>',

function ico(name, cls){
  cls = cls || 'w-4 h-4';
  return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
       + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
       + (ICONS[name] || '') + '</svg>';
}

function hydrateIcons(root){
  (root || document).querySelectorAll('[data-icon]').forEach(function(el){
    if (el.dataset.done) return;
    el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
                 + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" '
                 + 'style="width:100%;height:100%">' + (ICONS[el.dataset.icon] || '') + '</svg>';
    el.dataset.done = '1';
  });
}

function pad2(n){ return String(n).padStart(2, '0'); }
function localDateStr(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

function toLocalISOString(d){
  var tzOffset = -d.getTimezoneOffset();
  var sign     = tzOffset >= 0 ? '+' : '-';
  var abs      = Math.abs(tzOffset);
  var tzHH     = pad2(Math.floor(abs / 60));
  var tzMM     = pad2(abs % 60);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
         'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) +
         '.' + String(d.getMilliseconds()).padStart(3, '0') + sign + tzHH + ':' + tzMM;
}

function calcShiftDate(timestamp, cfg){
  var activeKey = getActiveShiftKey();
  if (activeKey) return activeKey;
  return localDateStr(new Date(timestamp));
}

function getActiveShiftKey(){
  var keys = Object.keys(shiftSettings).sort().reverse();
  for (var i = 0; i < keys.length; i++){
    var k = keys[i];
    var c = shiftSettings[k];
    if (c && c.startedAt && !c.endedAt) return k;
  }
  return null;
}

function getLastShiftKey(){
  var keysWithStart = Object.keys(shiftSettings).filter(function(k){
    var c = shiftSettings[k];
    return c && c.startedAt;
  }).sort().reverse();
  if (keysWithStart.length) return keysWithStart[0];

  var latestTrip = null;
  trips.forEach(function(t){
    if (t.shiftDate && (!latestTrip || t.shiftDate > latestTrip)) latestTrip = t.shiftDate;
  });
  if (latestTrip) return latestTrip;

  return localDateStr(new Date());
}

function getCurrentShiftKey(){
  var activeKey = getActiveShiftKey();
  if (activeKey) return activeKey;
  return localDateStr(new Date());
}

function getShiftStatus(){
  var activeKey = getActiveShiftKey();
  if (activeKey) return 'working';

  var lastKey = getLastShiftKey();
  if (lastKey && shiftSettings[lastKey] && shiftSettings[lastKey].startedAt){
    if (shiftSettings[lastKey].endedAt) return 'ended';
  }
  return 'idle';
}

function ensureShiftFields(cfg){
  if (!cfg) return;
  if (cfg.startedAt === undefined) cfg.startedAt = null;
  if (cfg.endedAt   === undefined) cfg.endedAt   = null;
  if (cfg.startTime === undefined) cfg.startTime = '';
  if (cfg.endTime   === undefined) cfg.endTime   = '';
  if (cfg.note      === undefined) cfg.note      = '';

  if (!Array.isArray(cfg.fuelEntries)){
    var oldFuel = parseFloat(cfg.fuel) || 0;
    cfg.fuelEntries = oldFuel > 0
      ? [{ id: 'fuel_legacy_' + Date.now(), amount: oldFuel, unitPrice: null, liters: null, station: '', timestamp: Date.now() }]
      : [];
    delete cfg.fuel;
  }
  cfg.fuelEntries.forEach(function(e){
    if (e.unitPrice === undefined) e.unitPrice = null;
    if (e.liters    === undefined) e.liters    = null;
    if (e.station   === undefined) e.station   = '';
  });
  if (!cfg.mileage || typeof cfg.mileage !== 'object'){
    cfg.mileage = { start: null, end: null };
  } else {
    if (cfg.mileage.start === undefined) cfg.mileage.start = null;
    if (cfg.mileage.end   === undefined) cfg.mileage.end   = null;
  }
}

function getFuelTotal(cfg){
  if (!cfg) return 0;
  if (Array.isArray(cfg.fuelEntries)){
    return cfg.fuelEntries.reduce(function(s, e){ return s + (parseFloat(e.amount) || 0); }, 0);
  }
  return parseFloat(cfg.fuel) || 0;
}

function getShiftMileage(cfg){
  if (!cfg || !cfg.mileage) return null;
  var s = cfg.mileage.start;
  var e = cfg.mileage.end;
  if (s === null || s === undefined || s === '' || e === null || e === undefined || e === '') return null;
  var sv = parseFloat(s);
  var ev = parseFloat(e);
  if (isNaN(sv) || isNaN(ev)) return null;
  var diff = ev - sv;
  return diff >= 0 ? diff : null;
}

function getShiftDuration(cfg){
  if (!cfg || !cfg.startedAt) return null;
  var end = cfg.endedAt || Date.now();
  var diff = end - cfg.startedAt;
  if (diff < 0) return null;
  return diff / 3600000;
}

function getWorkedMs(cfg){
  if (!cfg || !cfg.startedAt) return null;
  var end = cfg.endedAt || Date.now();
  var diff = end - cfg.startedAt;
  return diff >= 0 ? diff : null;
}

function formatDuration(ms){
  if (ms === null || ms === undefined || ms < 0) return '--';
  var totalMin = Math.floor(ms / 60000);
  var h = Math.floor(totalMin / 60);
  var m = totalMin % 60;
  if (h >= 100) return h + 'h';
  return h + 'h' + pad2(m) + 'm';
}

function getShiftFinance(key){
  var cfg = shiftSettings[key];
  if (cfg) ensureShiftFields(cfg);

  var list = trips.filter(function(t){ return t.shiftDate === key; });
  var gross = 0, expenseTrip = 0;
  var incomeCount = 0, expenseCount = 0;
  list.forEach(function(t){
    var v = parseFloat(t.fare) || 0;
    if (v < 0){ expenseTrip += -v; expenseCount++; }
    else { gross += v; incomeCount++; }
  });

  var rental = cfg ? (parseFloat(cfg.rental) || 0) : 0;
  var fuel   = cfg ? getFuelTotal(cfg) : 0;
  var totalCost = rental + fuel + expenseTrip;
  var profit    = gross - totalCost;

  return {
    list: list, gross: gross,
    incomeCount: incomeCount, expenseTrip: expenseTrip, expenseCount: expenseCount,
    rental: rental, fuel: fuel, totalCost: totalCost, profit: profit
  };
}

function getSettingsByKey(key, createIfMissing){
  if (createIfMissing === undefined) createIfMissing = true;
  if (!key) return null;

  if (!shiftSettings[key]){
    if (!createIfMissing) return null;
    var keys = Object.keys(shiftSettings).sort().reverse();
    var base = keys.length ? shiftSettings[keys[0]] : DEFAULT_SHIFT;
    shiftSettings[key] = {
      startedAt: null, endedAt: null, startTime: '', endTime: '',
      rental:      parseFloat(base.rental) || 0,
      fuelEntries: [],
      mileage:     { start: null, end: null },
      note:        ''
    };
    localStorage.setItem('taxi_shift_settings', JSON.stringify(shiftSettings));
  }
  ensureShiftFields(shiftSettings[key]);
  return shiftSettings[key];
}

(function migrateLegacy(){
  var legacy = JSON.parse(localStorage.getItem('taxi_settings'));
  if (legacy && Object.keys(shiftSettings).length === 0){
    var oldFuel = parseFloat(legacy.fuel) || 0;
    shiftSettings[localDateStr(new Date())] = {
      startedAt: null, endedAt: null, startTime: '', endTime: '',
      rental:      parseFloat(legacy.rental) || 0,
      fuelEntries: oldFuel > 0
        ? [{ id: 'fuel_legacy_' + Date.now(), amount: oldFuel, unitPrice: null, liters: null, station: '', timestamp: Date.now() }]
        : [],
      mileage:   { start: null, end: null },
      note:      ''
    };
    localStorage.setItem('taxi_shift_settings', JSON.stringify(shiftSettings));
  }
  var settingsChanged = false;
  Object.keys(shiftSettings).forEach(function(k){
    var before = JSON.stringify(shiftSettings[k]);
    ensureShiftFields(shiftSettings[k]);
    if (JSON.stringify(shiftSettings[k]) !== before) settingsChanged = true;
  });
  if (settingsChanged) localStorage.setItem('taxi_shift_settings', JSON.stringify(shiftSettings));

  var tripsChanged = false;
  trips.forEach(function(t){
    if (t.payment === undefined || t.payment === null || t.payment === ''){ t.payment = '現金'; tripsChanged = true; }
    if (!t.shiftDate){ t.shiftDate = localDateStr(new Date(t.timestamp)); tripsChanged = true; }
    if (t.dateStr && typeof t.dateStr === 'string' && /Z$/.test(t.dateStr)){
      var d = new Date(t.dateStr);
      if (!isNaN(d.getTime())){ t.dateStr = toLocalISOString(d); tripsChanged = true; }
    }
    if (!t.dateStr && t.timestamp){ t.dateStr = toLocalISOString(new Date(t.timestamp)); tripsChanged = true; }
    if (t.locationName === undefined) { t.locationName = ''; tripsChanged = true; }
  });
  if (tripsChanged) localStorage.setItem('taxi_trips', JSON.stringify(trips));
})();

function initLocationTracking(){
  if (!navigator.geolocation) return;
  if (navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({ name: 'geolocation' }).then(function(result){
      if (result.state === 'granted') refreshLocation();
      result.onchange = function(){ if (result.state === 'granted') refreshLocation(); };
    }).catch(function(){});
  }
  if (locationTrackTimer) clearInterval(locationTrackTimer);
  locationTrackTimer = setInterval(function(){
    if (!document.hidden && cachedLocation) refreshLocation();
  }, 120000);
}

function refreshLocationManual(){ refreshLocation(true); }

function refreshLocation(manual){
  if (!navigator.geolocation){ if (manual) showToast('此瀏覽器不支援定位功能'); return; }

  var chip = document.getElementById('trip-location-chip');
  if (chip && manual){
    chip.className = 'w-6 h-6 rounded-full border flex items-center justify-center transition shrink-0 bg-blue-50 text-blue-500 border-blue-200 animate-pulse';
  }

  navigator.geolocation.getCurrentPosition(
    function(pos){
      cachedLocation = {
        lat: pos.coords.latitude, lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy || 0, timestamp: Date.now()
      };
      updateLocationChip();
      if (manual) showToast('已取得位置（誤差約 ' + Math.round(cachedLocation.accuracy) + ' m）');
    },
    function(err){
      updateLocationChip();
      if (manual){
        var msg = err && err.code === 1 ? '定位權限被拒絕（可在瀏覽器設定開啟）' : ('定位失敗：' + (err.message || '未知錯誤'));
        showToast(msg);
      }
    },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
  );
}

function updateLocationChip(){
  var chip = document.getElementById('trip-location-chip');
  if (!chip) return;

  if (cachedLocation){
    chip.className = 'w-6 h-6 rounded-full border flex items-center justify-center transition shrink-0 bg-emerald-50 text-emerald-600 border-emerald-200';
    chip.title = '位置已記錄（點擊刷新）';
  } else {
    chip.className = 'w-6 h-6 rounded-full border flex items-center justify-center transition shrink-0 bg-slate-50 text-slate-300 border-slate-200';
    chip.title = '未取得位置（點擊重試）';
  }

  chip.querySelectorAll('[data-icon]').forEach(function(el){ el.dataset.done = ''; });
  hydrateIcons(chip);
}

function getFreshLocation(opts){
  opts = opts || {};
  var timeoutMs    = opts.timeoutMs    || 6000;
  var highAccuracy = !!opts.highAccuracy;

  return new Promise(function(resolve, reject){
    if (!navigator.geolocation){ reject(new Error('NO_GEOLOCATION')); return; }
    if (!window.isSecureContext){ reject(new Error('INSECURE_CONTEXT')); return; }

    var done = false;
    var timer = setTimeout(function(){
      if (done) return;
      done = true;
      reject(new Error('TIMEOUT'));
    }, timeoutMs);

    navigator.geolocation.getCurrentPosition(
      function(pos){
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy || 0,
          timestamp: Date.now()
        });
      },
      function(err){
        if (done) return;
        done = true;
        clearTimeout(timer);
        reject(new Error(err && err.code === 1 ? 'PERMISSION_DENIED' : 'POSITION_UNAVAILABLE'));
      },
      { enableHighAccuracy: highAccuracy, timeout: timeoutMs, maximumAge: 0 }
    );
  });
}

async function getLocationBestEffort(){
  try {
    return await getFreshLocation({ timeoutMs: 3500, highAccuracy: true });
  } catch (e1){
    return await getFreshLocation({ timeoutMs: 3500, highAccuracy: false });
  }
}

function locationErrorText(e){
  var m = e && e.message;
  if (m === 'TIMEOUT')            return '定位逾時';
  if (m === 'PERMISSION_DENIED')  return '定位權限被拒';
  if (m === 'NO_GEOLOCATION')     return '此瀏覽器不支援定位';
  if (m === 'INSECURE_CONTEXT')   return '非安全連線（需 HTTPS）';
  return '定位失敗';
}

function setSaveBtnLoading(btn, loading){
  if (!btn) return;
  if (loading){
    if (!btn.dataset.origHtml){
      btn.dataset.origHtml     = btn.innerHTML;
      btn.dataset.origDisabled = btn.disabled ? '1' : '0';
    }
    btn.disabled = true;
    btn.classList.add('opacity-60','cursor-wait');
    btn.innerHTML =
      '<span class="inline-flex items-center gap-1.5">' +
        '<span class="ico w-4 h-4 animate-spin">' + ico('loader','w-4 h-4') + '</span>定位中…' +
      '</span>';
  } else {
    if (btn.dataset.origHtml){
      btn.innerHTML = btn.dataset.origHtml;
      delete btn.dataset.origHtml;
    }
    btn.disabled = btn.dataset.origDisabled === '1';
    delete btn.dataset.origDisabled;
    btn.classList.remove('opacity-60','cursor-wait');
    btn.querySelectorAll('[data-icon]').forEach(function(el){ delete el.dataset.done; });
    hydrateIcons(btn);
  }
}

function buildTripLocation(){
  if (!cachedLocation) return null;
  return {
    lat: cachedLocation.lat,
    lng: cachedLocation.lng,
    accuracy: cachedLocation.accuracy,
    timestamp: cachedLocation.timestamp || null
  };
}

function openTripLocationInMaps(tripId){
  var t = trips.find(function(x){ return x.id === tripId; });
  if (!t || !t.location || typeof t.location.lat !== 'number') return;

  var lat = t.location.lat;
  var lng = t.location.lng;
  var d = new Date(t.timestamp);
  var label = d.toLocaleString('zh-HK', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit',hour12: false });
  var pointName = t.locationName || ('行程 ' + label);
  var encName = encodeURIComponent(pointName);

  var webUrl = 'https://uri.amap.com/marker' +
               '?position=' + lng + ',' + lat +
               '&name=' + encName +
               '&coordinate=wgs84&src=hk-taxi-helper&callnative=1';

  var ua = navigator.userAgent || '';
  var isMobile = /iPhone|iPad|iPod|Android|HarmonyOS|Mobile|Windows Phone/i.test(ua);

  if (!isMobile){
    window.open(webUrl, '_blank');
    return;
  }

  var appScheme = 'amapuri://viewMap' +
                  '?sourceApplication=hk-taxi-helper' +
                  '&poiname=' + encName +
                  '&lat=' + lat +
                  '&lon=' + lng +
                  '&dev=0';

  var startTime = Date.now();
  var fallbackTriggered = false;

  var fallbackTimer = setTimeout(function(){
    if (fallbackTriggered) return;
    if (!document.hidden && (Date.now() - startTime) < 3000){
      fallbackTriggered = true;
      window.location.href = webUrl;
    }
    document.removeEventListener('visibilitychange', onVisibilityChange);
    document.removeEventListener('pagehide', onPageHide);
  }, 2000);

  function onVisibilityChange(){
    if (document.hidden){
      fallbackTriggered = true;
      clearTimeout(fallbackTimer);
      document.removeEventListener('visibilitychange', onVisibilityChange);
      document.removeEventListener('pagehide', onPageHide);
    }
  }
  function onPageHide(){
    fallbackTriggered = true;
    clearTimeout(fallbackTimer);
  }
  document.addEventListener('visibilitychange', onVisibilityChange);
  window.addEventListener('pagehide', onPageHide, { once: true });

  try {
    window.location.href = appScheme;
  } catch (err){
    fallbackTriggered = true;
    clearTimeout(fallbackTimer);
    window.location.href = webUrl;
  }
}

var _geoNameCache      = new Map();
var _geoNameFailStreak = 0;
var _geoNameDisabled   = false;
var GEO_NAME_TTL       = 10 * 60 * 1000;
var GEO_NAME_TIMEOUT   = 4000;
var GEO_NAME_MAX_POINTS= 6;
var GEO_NAME_TOTAL_WAIT= 8000;

function extractShortLocationName(data){
  if (!data) return '';
  var a = data.address || {};
  var name = a.building || a.amenity || a.shop || a.office ||
             a.tourism  || a.road    || a.pedestrian || a.neighbourhood || '';
  if (name) return String(name).trim().slice(0, 24);

  var dn = data.display_name || a.formatted_address || '';
  if (!dn) return '';
  return dn.split(/[,，]/).slice(0, 2).join(' ').trim().slice(0, 24);
}

function reverseGeocodeAsync(lat, lng){
  return new Promise(function(resolve){
    var done = false;
    var timer = setTimeout(function(){
      if (done) return;
      done = true; resolve('');
    }, GEO_NAME_TIMEOUT);

    reverseGeocode(lat, lng, function(err, data){
      if (done) return;
      done = true; clearTimeout(timer);
      if (err || !data){ resolve(''); return; }
      resolve(extractShortLocationName(data));
    });
  });
}

function _geoKey(lat, lng){ return lat.toFixed(5) + ',' + lng.toFixed(5); }

async function resolvePlaceName(lat, lng){
  if (_geoNameDisabled) return '';
  var k = _geoKey(lat, lng);
  var hit = _geoNameCache.get(k);
  if (hit && Date.now() - hit.ts < GEO_NAME_TTL) return hit.name;

  var name = await reverseGeocodeAsync(lat, lng);
  if (name){
    _geoNameFailStreak = 0;
    _geoNameCache.set(k, { name: name, ts: Date.now() });
  } else {
    _geoNameFailStreak++;
    if (_geoNameFailStreak >= 3){
      _geoNameDisabled = true;
      console.warn('[geoName] 連續失敗，本次工作階段暫停地名解析');
    }
  }
  return name;
}

async function resolveRouteNames(route){
  if (!route) return route;

  var points = [];
  if (route.startLocation && typeof route.startLocation.lat === 'number' && !route.startName){
    points.push({ lat: route.startLocation.lat, lng: route.startLocation.lng,
                  set: function(n){ route.startName = n; } });
  }
  (route.stops || []).forEach(function(s){
    if (s.location && typeof s.location.lat === 'number' && !s.name){
      points.push({ lat: s.location.lat, lng: s.location.lng,
                    set: function(n){ s.name = n; } });
    }
  });
  if (route.endLocation && typeof route.endLocation.lat === 'number' && !route.endName){
    points.push({ lat: route.endLocation.lat, lng: route.endLocation.lng,
                  set: function(n){ route.endName = n; } });
  }

  points = points.slice(0, GEO_NAME_MAX_POINTS);
  if (!points.length) return route;

  var CONCURRENCY = 2;
  var i = 0;
  async function worker(){
    while (i < points.length){
      var p = points[i++];
      try {
        var n = await resolvePlaceName(p.lat, p.lng);
        if (n) p.set(n);
      } catch (e) { /* 靜默 */ }
    }
  }
  var workers = [];
  for (var w = 0; w < Math.min(CONCURRENCY, points.length); w++) workers.push(worker());
  await Promise.all(workers);
  return route;
}

function openTripRouteNavigation(tripId){
  var t = trips.find(function(x){ return x.id === tripId; });
  if (!t){ return; }

  var route   = t.route;
  var fromLoc = null, toLoc = null;
  var fromName = '', toName = '';
  var vias = [];

  if (route && route.startLocation && route.endLocation &&
      typeof route.startLocation.lat === 'number' && typeof route.endLocation.lat === 'number'){
    fromLoc  = route.startLocation;  fromName = route.startName || '起點';
    toLoc    = route.endLocation;    toName   = route.endName || t.locationName || '終點';
    (route.stops || []).forEach(function(s, i){
      if (s.location && typeof s.location.lat === 'number'){
        vias.push({ loc: s.location, name: s.name || ('途經' + (i + 1)) });
      }
    });
  } else if (t.location && typeof t.location.lat === 'number'){
    toLoc = t.location; toName = t.locationName || '目的地';
  }

  if (!toLoc){ showToast('此行程沒有可用的位置記錄'); return; }

  var VIA_LIMIT = 3;
  var dropped = 0;
  if (vias.length > VIA_LIMIT){ dropped = vias.length - VIA_LIMIT; vias = vias.slice(0, VIA_LIMIT); }

  function pt(loc, name){
    return loc.lng.toFixed(6) + ',' + loc.lat.toFixed(6) + ',' + encodeURIComponent(name || '');
  }

  var qs = [];
  if (fromLoc) qs.push('from=' + pt(fromLoc, fromName));
  qs.push('to=' + pt(toLoc, toName));
  if (vias.length){
    qs.push('via=' + vias.map(function(v){ return pt(v.loc, v.name); }).join(';'));
  }
  qs.push('mode=car', 'policy=1', 'src=hk-taxi-helper',
          'coordinate=wgs84', 'callnative=1');

  var url = 'https://uri.amap.com/navigation?' + qs.join('&');

  if (dropped > 0) showToast('導航僅帶前 ' + VIA_LIMIT + ' 個途經點（共 ' + (dropped + VIA_LIMIT) + ' 個）');

  window.open(url, '_blank');
}

function getFuelPrefs(){
  var prefs;
  try { prefs = JSON.parse(localStorage.getItem('taxi_fuel_prefs')) || {}; }
  catch(e){ prefs = {}; }
  if (!Array.isArray(prefs.stationHistory)) prefs.stationHistory = [];
  if (!Array.isArray(prefs.priceHistory))   prefs.priceHistory   = [];
  if (prefs.lastUnitPrice === undefined)    prefs.lastUnitPrice  = null;
  if (prefs.lastStation   === undefined)    prefs.lastStation    = '';
  return prefs;
}
function saveFuelPrefs(prefs){ localStorage.setItem('taxi_fuel_prefs', JSON.stringify(prefs)); }

function rebuildFuelPrefsFromHistory(){
  var prefs = getFuelPrefs();
  var stationMap = {};
  var priceMap   = {};

  Object.keys(shiftSettings).forEach(function(k){
    var cfg = shiftSettings[k];
    (cfg.fuelEntries || []).forEach(function(e){
      if (e.station && String(e.station).trim()){
        var s = String(e.station).trim();
        stationMap[s] = (stationMap[s] || 0) + 1;
      }
      var p = parseFloat(e.unitPrice);
      if (!isNaN(p) && p > 0){
        var key = p.toFixed(2);
        priceMap[key] = (priceMap[key] || 0) + 1;
      }
    });
  });

  var stations = Object.keys(stationMap).sort(function(a,b){
    if (stationMap[b] !== stationMap[a]) return stationMap[b] - stationMap[a];
    return a.localeCompare(b);
  });
  var prices = Object.keys(priceMap).sort(function(a,b){
    if (priceMap[b] !== priceMap[a]) return priceMap[b] - priceMap[a];
    return parseFloat(b) - parseFloat(a);
  });

  prefs.stationHistory = stations.slice(0, 8);
  prefs.priceHistory   = prices.slice(0, 6);
  saveFuelPrefs(prefs);
  return prefs;
}

function applyCustomShiftDate(){
  var input = document.getElementById('shift-picker-date');
  if (!input || !input.value) return;
  selectManualShift(input.value);
}

function selectManualShift(key){
  manualShiftKey = key;
  manualTripTime = null;

  if (key && !shiftSettings[key]){
    var keys = Object.keys(shiftSettings).sort().reverse();
    var base = keys.length ? shiftSettings[keys[0]] : DEFAULT_SHIFT;
    shiftSettings[key] = {
      startedAt: null, endedAt: null, startTime: '', endTime: '',
      rental:      parseFloat(base.rental) || 0,
      fuelEntries: [],
      mileage:     { start: null, end: null },
      note:        ''
    };
    localStorage.setItem('taxi_shift_settings', JSON.stringify(shiftSettings));
  }

  closeModal();
  updateDateTimePreview();
  updateTripTimeChip();
  renderTripList();

  if (key) showToast('已切換至補錄模式：' + key);
  else showToast('已回復自動模式');
}

function startShift(){
  var activeKey = getActiveShiftKey();
  if (activeKey){ showToast('已在工作中，請先收工'); return; }

  var now = new Date();
  var today = localDateStr(now);

  if (shiftSettings[today] && shiftSettings[today].startedAt && shiftSettings[today].endedAt){
    if (!confirm('今日已收工，是否要重新開工？\n\n將覆蓋今日的開工/收工時間（行程紀錄與成本保留）。')) return;
  }

  var cfg = getSettingsByKey(today, true);
  cfg.startedAt = now.getTime();
  cfg.endedAt   = null;
  cfg.startTime = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  cfg.endTime   = '';

  shiftSettings[today] = cfg;
  localStorage.setItem('taxi_shift_settings', JSON.stringify(shiftSettings));

  closeModal();
  updateDateTimePreview();
  updateTripTimeChip();
  renderTripList();
  updateHeaderWorked();

  showToast('已開工：' + cfg.startTime);
}

function endShift(){
  var activeKey = getActiveShiftKey();
  if (!activeKey){ showToast('尚未開工'); return; }

  var now = new Date();
  var cfg = shiftSettings[activeKey];
  cfg.endedAt = now.getTime();
  cfg.endTime = pad2(now.getHours()) + ':' + pad2(now.getMinutes());

  shiftSettings[activeKey] = cfg;
  localStorage.setItem('taxi_shift_settings', JSON.stringify(shiftSettings));

  closeModal();
  updateDateTimePreview();
  updateTripTimeChip();
  renderTripList();
  updateHeaderWorked();

  var duration = (cfg.endedAt - cfg.startedAt) / 3600000;
  showToast('已收工：' + cfg.endTime + '（工時 ' + duration.toFixed(1) + 'h）');
}

        '<span class="ico w-5 h-5">' + ico('play','w-5 h-5') + '</span> ' + btnText +

    var endStr = cfg.endedAt

function onManualDateChange(){
  var dateEl = document.getElementById('manual-shift-date');
  if (!dateEl) return;
  var key = dateEl.value;
  var cfg = shiftSettings[key];

  var startEl = document.getElementById('manual-shift-start');
  var endEl   = document.getElementById('manual-shift-end');
  var noteEl  = document.getElementById('manual-shift-note');

  if (cfg && cfg.startedAt){ var s = new Date(cfg.startedAt); startEl.value = pad2(s.getHours()) + ':' + pad2(s.getMinutes()); }
  else { startEl.value = ''; }
  if (cfg && cfg.endedAt){ var e = new Date(cfg.endedAt); endEl.value = pad2(e.getHours()) + ':' + pad2(e.getMinutes()); }
  else { endEl.value = ''; }
  if (noteEl){ noteEl.value = (cfg && cfg.note) ? cfg.note : ''; }
  updateManualPreview();
}

function setManualTimeNow(which){
  var id = which === 'start' ? 'manual-shift-start' : 'manual-shift-end';
  var el = document.getElementById(id);
  if (!el) return;
  var now = new Date();
  el.value = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  updateManualPreview();
}

function fillManualOnlyStart(){
  var startEl = document.getElementById('manual-shift-start');
  var endEl   = document.getElementById('manual-shift-end');
  if (!startEl || !endEl) return;
  if (!startEl.value){ var now = new Date(); startEl.value = pad2(now.getHours()) + ':' + pad2(now.getMinutes()); }
  endEl.value = '';
  updateManualPreview();
}

function clearManualEnd(){
  var endEl = document.getElementById('manual-shift-end');
  if (endEl) endEl.value = '';
  updateManualPreview();
}

function updateManualPreview(){
  var previewEl = document.getElementById('manual-preview');
  var dateEl    = document.getElementById('manual-shift-date');
  var startEl   = document.getElementById('manual-shift-start');
  var endEl     = document.getElementById('manual-shift-end');
  if (!previewEl || !dateEl || !startEl || !endEl) return;

  var dateVal = dateEl.value;
  var s = startEl.value;
  var e = endEl.value;

  if (!dateVal || !s){
    previewEl.innerHTML = '<div class="text-slate-400 text-center text-[11px]">請填入日期與開工時間</div>';
    return;
  }

  var base = new Date(dateVal + 'T00:00:00');
  var sD = new Date(base);
  var sParts = s.split(':');
  sD.setHours(parseInt(sParts[0], 10), parseInt(sParts[1], 10), 0, 0);

  var eD = null;
  if (e){
    eD = new Date(base);
    var eParts = e.split(':');
    eD.setHours(parseInt(eParts[0], 10), parseInt(eParts[1], 10), 0, 0);
    if (eD.getTime() <= sD.getTime()) eD.setDate(eD.getDate() + 1);
  }

  var now = new Date();
  var endMs = eD ? eD.getTime() : now.getTime();
  var durationMs = endMs - sD.getTime();

  var modeText = !eD ? '工作中' : (sD.toDateString() === eD.toDateString() ? '同日更次' : '跨午夜更次');
  var modeColor = !eD ? 'text-emerald-700 bg-emerald-50 border-emerald-200'
                  : (sD.toDateString() === eD.toDateString() ? 'text-blue-700 bg-blue-50 border-blue-200' : 'text-purple-700 bg-purple-50 border-purple-200');

  previewEl.innerHTML =
    '<div class="flex items-center justify-between gap-2">' +
      '<span class="font-mono text-slate-700 text-[11px]">' + s + ' → ' + (e || '工作中') + '</span>' +
      '<span class="px-2 py-0.5 rounded-full border text-[11px] font-bold ' + modeColor + '">' + modeText + '</span>' +
    '</div>' +
    '<div class="text-[11px] text-slate-500 mt-1.5">時長：<span class="font-bold text-slate-700 font-mono">' + formatDuration(durationMs) + '</span></div>';
}

function saveManualShiftTime(){
  var dateEl  = document.getElementById('manual-shift-date');
  var startEl = document.getElementById('manual-shift-start');
  var endEl   = document.getElementById('manual-shift-end');
  var noteEl  = document.getElementById('manual-shift-note');
  if (!dateEl || !startEl || !endEl) return;

  var dateVal = dateEl.value;
  var s = startEl.value;
  var e = endEl.value;

  if (!dateVal){ showToast('請選擇日期'); return; }
  if (!s){ showToast('請填入開工時間'); return; }

  var activeKey = getActiveShiftKey();
  if (activeKey && activeKey !== dateVal && !e){
    if (!confirm('你目前在「' + activeKey + '」更次工作中。\n\n確定要在 ' + dateVal + ' 開啟新更次（不填收工時間）嗎？\n這會讓 ' + activeKey + ' 變為進行中狀態，並同時存在兩個進行中更次。')) return;
  }

  var cfg = getSettingsByKey(dateVal, true);
  var base = new Date(dateVal + 'T00:00:00');
  var sD = new Date(base);
  var sParts = s.split(':');
  sD.setHours(parseInt(sParts[0], 10), parseInt(sParts[1], 10), 0, 0);
  cfg.startedAt = sD.getTime();
  cfg.startTime = s;

  if (e){
    var eD = new Date(base);
    var eParts = e.split(':');
    eD.setHours(parseInt(eParts[0], 10), parseInt(eParts[1], 10), 0, 0);
    if (eD.getTime() <= sD.getTime()) eD.setDate(eD.getDate() + 1);
    cfg.endedAt = eD.getTime();
    cfg.endTime = e;
  } else {
    cfg.endedAt = null;
    cfg.endTime = '';
  }

  if (noteEl) cfg.note = noteEl.value.trim();

  shiftSettings[dateVal] = cfg;
  localStorage.setItem('taxi_shift_settings', JSON.stringify(shiftSettings));

  closeModal();
  updateDateTimePreview();
  updateTripTimeChip();
  renderTripList();
  updateHeaderWorked();

  var msg = '已設定 ' + dateVal + '：' + s;
  if (e) msg += ' - ' + e;
  else   msg += '（工作中）';
  showToast(msg);
}

}, { passive:false });

(function setupTapToDismiss(){
  function isFormField(el){ if (!el) return false; var tag = el.tagName; return tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA'; }
  function dismissKeyboard(e){
    var target = e.target;
    if (target.closest && target.closest('input, select, textarea, button, a, label')) return;
    var active = document.activeElement;
    if (isFormField(active)) active.blur();
  }
  document.addEventListener('touchstart', dismissKeyboard, { passive: true });
  document.addEventListener('mousedown', dismissKeyboard);
})();

function updateDateTimePreview(){
  var now = new Date();
  var dateStr = now.toLocaleDateString('zh-HK', { month:'2-digit', day:'2-digit' });
  var weekStr = now.toLocaleDateString('zh-HK', { weekday:'long' });
  var el = document.getElementById('current-date-time-preview');
  if (el){
    if (manualShiftKey){
      el.className = 'text-xs font-bold text-right leading-tight text-amber-700 bg-amber-100 border border-amber-300 px-2.5 py-1 rounded-lg cursor-pointer select-none transition ml-auto';
      el.innerHTML = '<span class="block">📌 補錄模式</span><span class="block text-[10px] text-amber-600 font-mono">' + manualShiftKey + '</span>';
    } else {
      var status = getShiftStatus();
      var rangeText;
      if (status === 'working')   rangeText = '工作中';
      else if (status === 'ended') rangeText = '已收工';
      else                         rangeText = '未開工';

      el.className = 'text-xs text-slate-400 font-medium text-right leading-tight cursor-pointer select-none hover:text-slate-600 transition ml-auto';
      el.innerHTML = '<span class="block">' + dateStr + ' ' + weekStr + '</span><span class="block text-[10px] text-slate-400">' + rangeText + '</span>';
    }
  }
  updateTripTimeChip();
}

function updateHeaderTime(){
  var now = new Date();
  var timeStr = now.toLocaleTimeString('zh-HK', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false });
  var timeEl = document.getElementById('header-current-time');
  if (timeEl) timeEl.innerText = timeStr;
  updateHeaderWorked();
}

function updateHeaderWorked(){
  var el = document.getElementById('header-worked');
  if (!el) return;

  var status = getShiftStatus();
  if (status === 'idle'){ el.innerText = '未開工'; return; }

  var activeKey = getActiveShiftKey();
  var lastKey   = getLastShiftKey();
  var cfg       = shiftSettings[activeKey || lastKey];
  if (!cfg || !cfg.startedAt){ el.innerText = '未開工'; return; }

  var workedMs = getWorkedMs(cfg);
  if (status === 'working'){ el.innerText = '工作 ' + formatDuration(workedMs); }
  else { var totalMs = cfg.endedAt - cfg.startedAt; el.innerText = '已收工 ' + formatDuration(totalMs); }
}

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

var TAB_NAMES = ['trip','list','places','stats'];

function switchTab(tabName){
  currentTab = tabName;

  TAB_NAMES.forEach(function(t){
    var tabEl = document.getElementById('tab-' + t);
    if (tabEl) tabEl.classList.add('hidden');

    var btn = document.getElementById('nav-' + t);
    if (btn){
      btn.className = 'flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 transition';
      var label = btn.querySelector('span:last-child');
      if (label) label.className = 'text-[11px] font-medium mt-1';
    }
  });

  var targetTab = document.getElementById('tab-' + tabName);
  if (targetTab) targetTab.classList.remove('hidden');

  var activeNav = document.getElementById('nav-' + tabName);
  if (activeNav){
    activeNav.className = 'flex flex-col items-center justify-center text-amber-500 transition';
    var activeLabel = activeNav.querySelector('span:last-child');
    if (activeLabel) activeLabel.className = 'text-[11px] font-bold mt-1';
  }

  if (tabName === 'list')  renderTripList();
  if (tabName === 'places'){ renderPlaceFilters(); renderPlacesList(); }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

      ico(t.icon, 'w-3.5 h-3.5 shrink-0') + '<span class="truncate">' + escapeHtml(t.name) + '</span>' +

function calculateChange(){
  var fareEl     = document.getElementById('trip-fare');
  var receivedEl = document.getElementById('trip-received');
  var box        = document.getElementById('change-box');
  var labelEl    = document.getElementById('change-label');
  var iconEl     = document.getElementById('change-icon');
  var display    = document.getElementById('change-display');
  var payBlock   = document.getElementById('payment-block');
  var fareClearBtn = document.getElementById('fare-clear-btn');

  if (fareClearBtn){
    if (fareEl.value.trim()) fareClearBtn.classList.remove('hidden');
    else fareClearBtn.classList.add('hidden');
  }

  var rawFareVal = parseFloat(fareEl.value);
  if (!isNaN(rawFareVal) && rawFareVal < 0 && fareSign !== -1){ fareSign = -1; updateFareSignUI(); }

  var fare        = getFareValue();
  var receivedRaw = receivedEl.value;
  var received    = parseFloat(receivedRaw) || 0;

  if (fare < 0){
    if (payBlock) payBlock.style.opacity = '0.45';
    receivedEl.disabled = true;
    box.className = 'flex justify-between items-center bg-rose-50 px-3.5 py-3 rounded-xl border-2 border-rose-400 shadow-sm transition';
    labelEl.innerText = '支出記錄';
    labelEl.className = 'text-sm font-bold text-rose-700 flex items-center gap-1.5';
    iconEl.className = 'ico w-5 h-5 text-rose-600';
    iconEl.dataset.icon = 'alert-triangle';
    iconEl.dataset.done = '';
    hydrateIcons(iconEl.parentElement);
    display.innerText = '-$' + Math.abs(fare).toFixed(1);
    display.className = 'text-3xl font-black text-rose-600 font-mono tracking-tight debt-shadow';
    return;
  }

  if (payBlock) payBlock.style.opacity = '1';
  receivedEl.disabled = false;
  if (iconEl.dataset.icon !== 'coins'){
    iconEl.dataset.icon = 'coins';
    iconEl.dataset.done = '';
    hydrateIcons(iconEl.parentElement);
  }
  iconEl.className = 'ico w-5 h-5 text-amber-700';

  if (receivedRaw === '' || received <= 0){
    box.className = 'flex justify-between items-center bg-gradient-to-r px-3.5 py-3 rounded-xl border-2 border-amber-400 shadow-sm transition';
    labelEl.innerText = '應找零錢';
    labelEl.className = 'text-sm font-bold text-amber-900 flex items-center gap-1.5';
    display.innerText = '$0.0';
    display.className = 'text-3xl font-black text-emerald-800 font-mono tracking-tight change-shadow';
    return;
  }

  if (fare > 0 && received < fare){
    var debt = fare - received;
    box.className = 'flex justify-between items-center bg-rose-50 px-3.5 py-3 rounded-xl border-2 border-rose-400 shadow-sm transition';
    labelEl.innerText = '還欠車資';
    labelEl.className = 'text-sm font-bold text-rose-700 flex items-center gap-1.5';
    display.innerText = '$' + debt.toFixed(1);
    display.className = 'text-3xl font-black text-rose-600 font-mono tracking-tight debt-shadow';
  } else {
    var change = received - fare;
    box.className = 'flex justify-between items-center bg-gradient-to-r px-3.5 py-3 rounded-xl border-2 border-amber-400 shadow-sm transition';
    labelEl.innerText = '應找零錢';
    labelEl.className = 'text-sm font-bold text-amber-900 flex items-center gap-1.5';
    display.innerText = '$' + change.toFixed(1);
    display.className = 'text-3xl font-black text-emerald-800 font-mono tracking-tight change-shadow';
  }
}

function resolveTripTimestamp(hh, mm){
  var shiftKey = getTargetShiftKey();
  var cfg = shiftSettings[shiftKey];
  if (cfg) ensureShiftFields(cfg);

  var base = new Date(shiftKey + 'T00:00:00');
  if (isNaN(base.getTime())) return null;

  var d = new Date(base);
  d.setHours(hh, mm, 0, 0);
  var ts = d.getTime();

  if (!cfg || !cfg.startedAt) return ts;

  var start = cfg.startedAt;
  var end   = cfg.endedAt || Date.now();

  if (ts >= start && ts <= end) return ts;

  var d2 = new Date(base);
  d2.setDate(d2.getDate() + 1);
  d2.setHours(hh, mm, 0, 0);
  var ts2 = d2.getTime();
  if (ts2 >= start && ts2 <= end) return ts2;

  return null;
}

function setTripTimeQuick(deltaMin){
  var input = document.getElementById('trip-time-input');
  if (!input) return;
  var base;
  if (input.value){
    var parts = input.value.split(':');
    base = new Date();
    base.setHours(parseInt(parts[0], 10) || 0, parseInt(parts[1], 10) || 0, 0, 0);
  } else { base = new Date(); }
  base.setMinutes(base.getMinutes() + deltaMin);
  input.value = pad2(base.getHours()) + ':' + pad2(base.getMinutes());
  hideTripTimeError();
}

function saveTripTime(){
  var input = document.getElementById('trip-time-input');
  if (!input || !input.value){ showTripTimeError('請選擇時間'); return; }

  var parts = input.value.split(':');
  var hh = parseInt(parts[0], 10);
  var mm = parseInt(parts[1], 10);
  if (isNaN(hh) || isNaN(mm) || hh < 0 || hh > 23 || mm < 0 || mm > 59){
    showTripTimeError('時間格式不正確');
    return;
  }

  var resolved = resolveTripTimestamp(hh, mm);
  if (resolved === null){
    var sk = getTargetShiftKey();
    var cfg = shiftSettings[sk];
    var rangeStr = '';
    if (cfg && cfg.startTime){ rangeStr = cfg.startTime + ' - ' + (cfg.endTime || '工作中'); }
    showTripTimeError('所選時間不在更次範圍內' + (rangeStr ? '（' + rangeStr + '）' : '') + '，請重新選擇。');
    return;
  }

  var now = new Date();
  if (hh === now.getHours() && mm === now.getMinutes()) manualTripTime = null;
  else manualTripTime = pad2(hh) + ':' + pad2(mm);

  closeModal();
  updateTripTimeChip();
  showToast(manualTripTime ? '行程時間已設為 ' + manualTripTime : '行程時間已重置為現在');
}
