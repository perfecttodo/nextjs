async function saveTrip(){
  if (tripSaving) return;

  var fareInput     = document.getElementById('trip-fare');
  var receivedInput = document.getElementById('trip-received');
  var noteInput     = document.getElementById('trip-note');

  var clickNow        = new Date();
  var snapFare        = getFareValue();
  var snapReceivedRaw = receivedInput.value;
  var snapNote        = noteInput.value.trim();
  var snapManualTime  = manualTripTime;
  var snapRoute = pendingTripSession
    ? JSON.parse(JSON.stringify(pendingTripSession))
    : null;

  if (isNaN(snapFare) || snapFare === 0){
    showToast('請輸入有效的車資金額！');
    fareInput.focus();
    return;
  }

  tripSaving = true;
  var saveBtn = document.getElementById('save-trip-btn') ||
                document.querySelector('[onclick="saveTrip()"]');
  setSaveBtnLoading(saveBtn, true);

  try {
    var tripLocation = null;
    showToast('正在取得位置...');

    try {
      tripLocation = await getLocationBestEffort();
      cachedLocation = {
        lat: tripLocation.lat, lng: tripLocation.lng,
        accuracy: tripLocation.accuracy, timestamp: tripLocation.timestamp
      };
      updateLocationChip();
    } catch (locErr){
      var reason = locationErrorText(locErr);
      var cached = buildTripLocation();

      if (cached){
        var ageSec = cached.timestamp
          ? Math.round((Date.now() - cached.timestamp) / 1000)
          : null;
        var useCached = confirm(
          '未能取得當下位置（' + reason + '）。\n\n' +
          '是否改用最近一次記錄的位置' +
          (ageSec !== null ? '（約 ' + ageSec + ' 秒前）' : '') + '？'
        );
        if (!useCached){ showToast('已取消保存'); return; }
        tripLocation = cached;
      } else {
        var saveAnyway = confirm(
          '未能取得位置（' + reason + '）。\n\n' +
          '仍要保存這筆記錄（不帶位置）嗎？'
        );
        if (!saveAnyway){ showToast('已取消保存'); return; }
      }
    }

    var tripLocationName = '';
    if (!_geoNameDisabled){
      showToast('正在解析位置名稱...');
      try {
        var nameJobs = [];
        if (tripLocation){
          nameJobs.push(resolvePlaceName(tripLocation.lat, tripLocation.lng).then(function(n){
            tripLocationName = n || '';
          }));
        }
        if (snapRoute){
          nameJobs.push(resolveRouteNames(snapRoute));
        }
        if (nameJobs.length){
          await Promise.race([
            Promise.all(nameJobs),
            new Promise(function(r){ setTimeout(r, GEO_NAME_TOTAL_WAIT); })
          ]);
        }
      } catch (e) { /* 靜默 */ }
    }

    var isExpense = snapFare < 0;
    var received  = isExpense ? snapFare : (parseFloat(snapReceivedRaw) || snapFare);
    var changeVal = isExpense ? 0 : (received - snapFare);

    var cfg      = getCurrentSettings();
    var isManual = !!manualShiftKey;

    var tripTimestamp = clickNow.getTime();
    if (snapManualTime){
      var tp = snapManualTime.split(':');
      var hh = parseInt(tp[0], 10);
      var mm = parseInt(tp[1], 10);
      var resolved = resolveTripTimestamp(hh, mm);
      if (resolved !== null) tripTimestamp = resolved;
    }

    var tripDateObj = new Date(tripTimestamp);
    var shiftDate   = isManual ? manualShiftKey : calcShiftDate(tripTimestamp, cfg);

    var newTrip = {
      id: 'trip_' + tripTimestamp + '_' + Math.floor(Math.random() * 1000),
      timestamp:  tripTimestamp,
      shiftDate:  shiftDate,
      dateStr:    toLocalISOString(tripDateObj),
      fare:       snapFare,
      type:       activeTripType,
      payment:    activePaymentMethod,
      received:   received,
      change:     changeVal,
      note:       snapNote,
      isExpense:  isExpense,
      location:   tripLocation,
      locationName: tripLocationName || '',
      route:      snapRoute
    };

    trips.push(newTrip);
    trips.sort(function(a, b){ return b.timestamp - a.timestamp; });
    localStorage.setItem('taxi_trips', JSON.stringify(trips));

    if (snapRoute) { pendingTripSession = null; }
    updatePendingTripDurationBadge();

    fareInput.value     = '';
    receivedInput.value = '';
    noteInput.value     = '';
    fareSign = 1;
    manualTripTime = null;
    updateTripTimeChip();
    updateFareSignUI();
    collapseNoteTags();
    calculateChange();

    var prefix = isManual ? '【補錄 ' + shiftDate + '】' : '';
    var payTag = isExpense ? '' : '[' + activePaymentMethod + '] ';
    var locTag = tripLocation ? '📍 ' : '';
    var nameTag = tripLocationName ? (tripLocationName + ' ') : '';
    var routeTag = snapRoute ? '🧭 ' : '';

    if (isExpense){
      showToast(prefix + locTag + nameTag + '支出記錄已保存：-$' + Math.abs(snapFare).toFixed(1));
    } else if (changeVal < 0){
      showToast(prefix + locTag + nameTag + routeTag + payTag + '行程已保存，客戶尚欠 $' + Math.abs(changeVal).toFixed(1));
    } else {
      showToast(prefix + locTag + nameTag + routeTag + payTag + '行程已成功保存！');
    }

    scheduleShowSavedTrip(newTrip);

  } finally {
    tripSaving = false;
    setSaveBtnLoading(saveBtn, false);
  }
}
function formatDurationMinutes(ms){
  if (ms === null || ms === undefined || ms < 0) return '--';
  return Math.round(ms / 60000) + 'm';
}

// 記錄每個更期收起狀態的物件 (key: shiftKey, value: boolean 為 true 代表收起)
var collapsedShifts = {};

function toggleShiftCollapse(shiftKey){
  collapsedShifts[shiftKey] = !collapsedShifts[shiftKey];
  renderTripList();
}

function renderTripList(){
  var keyword = (document.getElementById('search-keyword').value || '').trim().toLowerCase();
  var filterLastShift = document.getElementById('filter-last-shift').checked;
  var lastShiftKey = getLastShiftKey();

  // 1. 取得勾選的類型
  var types = [];
  if (document.getElementById('chk-type-street').checked) types.push('街客');
  if (document.getElementById('chk-type-uber').checked) types.push('Uber');
  if (document.getElementById('chk-type-other').checked){
    getAllTripTypes().forEach(function(t){
      if (t !== '街客' && t !== 'Uber') types.push(t);
    });
  }

  // 2. 取得勾選的付款方式
  var pays = [];
  if (document.getElementById('chk-pay-cash').checked) pays.push('現金');
  if (document.getElementById('chk-pay-octopus').checked) pays.push('八達通');
  if (document.getElementById('chk-pay-other').checked){
    getAllPaymentMethods().forEach(function(p){
      if (p !== '現金' && p !== '八達通') pays.push(p);
    });
  }

  var flowIncome = document.getElementById('chk-flow-income').checked;
  var flowExpense = document.getElementById('chk-flow-expense').checked;

  // 3. 過濾符合條件的行程
  var filtered = trips.filter(function(t){
    if (filterLastShift){
      var tShift = t.shiftDate || calcShiftDate(t.timestamp, shiftSettings[t.shiftDate]);
      if (tShift !== lastShiftKey) return false;
    }

    if (keyword && !(t.note && t.note.toLowerCase().indexOf(keyword) !== -1)) return false;

    var isExpense = (parseFloat(t.fare) || 0) < 0;
    if (isExpense && !flowExpense) return false;
    if (!isExpense && !flowIncome) return false;

    var tType = t.type || '街客';
    var matchedType = types.indexOf(tType) !== -1 || (types.length > 2 && TRIP_TYPE_CONFIG.map(function(c){return c.name;}).indexOf(tType) === -1);
    if (!matchedType) return false;

    var tPay = t.paymentMethod || '現金';
    var matchedPay = pays.indexOf(tPay) !== -1 || (pays.length > 2 && PAYMENT_METHOD_CONFIG.map(function(c){return c.name;}).indexOf(tPay) === -1);
    if (!matchedPay) return false;

    return true;
  });

  document.getElementById('trip-count-badge').textContent = '共 ' + filtered.length + ' 筆';

  var container = document.getElementById('trip-list-container');
  if (!container) return;

  if (filtered.length === 0){
    container.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm bg-white rounded-2xl border border-slate-100 shadow-sm">' +
                          '<div class="w-10 h-10 mx-auto mb-2 text-slate-300">' + ico('file-question', 'w-full h-full') + '</div>' +
                          '沒有找到符合條件的行程記錄</div>';
    return;
  }

  // ==========================================
  // 4. 按更期 (shiftDate) 進行分組
  // ==========================================
  var groupedByShift = {};
  filtered.forEach(function(t){
    var shiftKey = t.shiftDate || calcShiftDate(t.timestamp, shiftSettings[t.shiftDate]);
    if (!groupedByShift[shiftKey]){
      groupedByShift[shiftKey] = [];
    }
    groupedByShift[shiftKey].push(t);
  });

  var sortedShiftKeys = Object.keys(groupedByShift).sort().reverse();

  var html = '';
  sortedShiftKeys.forEach(function(shiftKey){
    var shiftTrips = groupedByShift[shiftKey];
    var isCollapsed = !!collapsedShifts[shiftKey];
    
    var shiftTotal = 0;
    shiftTrips.forEach(function(t){
      shiftTotal += (parseFloat(t.fare) || 0);
    });

    var shiftCfg = shiftSettings[shiftKey];
    var shiftLabelText = shiftKey;
    if (shiftCfg && shiftCfg.startTime && shiftCfg.endTime){
      shiftLabelText += ' (' + shiftCfg.startTime + ' - ' + shiftCfg.endTime + ')';
    } else if (shiftKey === lastShiftKey) {
      shiftLabelText += ' (當前更期)';
    }

    html += '<div class="space-y-2 mb-4">';
    
    // 點擊標題列即可觸發收起/展開
    html += '<div onclick="toggleShiftCollapse(\'' + shiftKey + '\')" class="flex justify-between items-center bg-slate-100 px-3 py-2 rounded-xl border border-slate-200/80 text-xs font-bold text-slate-700 select-none cursor-pointer hover:bg-slate-200/70 transition">';
    html += '<span class="flex items-center gap-1.5">';
    html += '<span class="ico w-4 h-4 text-amber-600 transition-transform duration-200 ' + (isCollapsed ? '-rotate-90' : '') + '" data-icon="chevron-down"></span>';
    html += shiftLabelText;
    html += '</span>';
    html += '<span class="flex items-center gap-2">';
    html += '<span class="text-slate-500 font-medium">' + shiftTrips.length + '筆</span>';
    html += '<span class="font-mono ' + (shiftTotal >= 0 ? 'text-emerald-700' : 'text-rose-600') + '">$' + shiftTotal.toFixed(1) + '</span>';
    html += '</span>';
    html += '</div>';

    // 若未收起，才渲染底下的行程清單
    if (!isCollapsed) {
      html += '<div class="space-y-2 pl-1">';
      shiftTrips.forEach(function(t){
        var fareVal = parseFloat(t.fare) || 0;
        var isExp = fareVal < 0;
        var typeCfg = getTripTypeConfig(t.type);
        var payCfg = getPaymentMethodConfig(t.paymentMethod);
        var theme = TRIP_TYPE_THEME[typeCfg.color] || TRIP_TYPE_THEME['purple'];
        var timeStr = t.time || (t.timestamp ? new Date(t.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--');

        html += '<div onclick="openTripDetail(\'' + t.id + '\')" class="bg-white p-3 rounded-xl border border-slate-100 shadow-xs hover:border-amber-300 active:scale-[0.99] transition cursor-pointer flex justify-between items-center gap-3">' +
                  '<div class="flex items-center gap-3 min-w-0">' +
                    '<div class="w-10 h-10 rounded-xl border flex items-center justify-center shrink-0 ' + theme.card + ' ' + theme.text + '">' +
                      ico(typeCfg.icon, 'w-5 h-5') +
                    '</div>' +
                    '<div class="min-w-0">' +
                      '<div class="flex items-center gap-1.5 flex-wrap">' +
                        '<span class="text-xs font-bold text-slate-800">' + (t.type || '街客') + '</span>' +
                        '<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-medium">' + (t.paymentMethod || '現金') + '</span>' +
                        '<span class="text-[10px] text-slate-400 font-mono">' + timeStr + '</span>' +
                      '</div>' +
                      '<p class="text-xs text-slate-500 truncate mt-0.5">' + (t.note || '無備注') + '</p>' +
                    '</div>' +
                  '</div>' +
                  '<div class="text-right shrink-0 font-mono">' +
                    '<span class="text-base font-bold ' + (isExp ? 'text-rose-600' : 'text-emerald-700') + '">' +
                      (isExp ? '-$' + Math.abs(fareVal).toFixed(1) : '$' + fareVal.toFixed(1)) +
                    '</span>' +
                  '</div>' +
                '</div>';
      });
      html += '</div>';
    }

    html += '</div>'; // 結束更期群組
  });

  container.innerHTML = html;
  hydrateIcons(container);
}

async function resolveAmapPlace(input){
  var res = await fetch('/api/amap-place', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ input: input })
  });

  var data;
  try { data = await res.json(); }
  catch (e){ throw new Error('後端回傳非 JSON'); }

  if (!res.ok || !data.success){
    throw new Error(data.error || ('HTTP ' + res.status));
  }
  return data;
}

async function quickPasteAndParse(){
  var btn = document.getElementById('quick-paste-btn');
  var btnText = document.getElementById('quick-paste-btn-text');

  if (!window.isSecureContext || !navigator.clipboard || typeof navigator.clipboard.readText !== 'function'){
    toggleManualInput(true);
    showPasteFallback(document.getElementById('amap-paste-input'));
    showToast('此瀏覽器不支援自動讀取，請長按下方輸入框粘貼');
    return;
  }

  if (btn) btn.disabled = true;
  if (btnText) btnText.innerText = '讀取剪貼板中...';

  try {
    var text = await navigator.clipboard.readText();
    text = (text || '').trim();
    if (!text){
      showToast('剪貼板為空，請先複製高德連結或地名');
      if (btn) btn.disabled = false;
      if (btnText) btnText.innerText = '一鍵貼上並解析';
      return;
    }

    hidePasteFallback();
    var input = document.getElementById('amap-paste-input');
    if (input) input.value = text;

    await applyAmapPaste(text);
  } catch (err) {
    console.warn('[clipboard] readText failed:', err);
    var msg = (err && err.name === 'NotAllowedError')
      ? '剪貼板權限被拒，請手動粘貼'
      : '無法讀取剪貼板，請手動粘貼';
    showToast(msg);
    toggleManualInput(true);
    showPasteFallback(document.getElementById('amap-paste-input'));
  } finally {
    if (btn) btn.disabled = false;
    if (btnText) btnText.innerText = '一鍵貼上並解析';
  }
}

function toggleManualInput(show){
  var wrap = document.getElementById('manual-input-wrap');
  if (!wrap) return;
  if (show === undefined) show = wrap.classList.contains('hidden');
  if (show){
    wrap.classList.remove('hidden');
    setTimeout(function(){
      var input = document.getElementById('amap-paste-input');
      if (input) input.focus();
    }, 50);
  } else {
    wrap.classList.add('hidden');
    hidePasteFallback();
  }
}

function showPasteFallback(input){
  var wrap = document.getElementById('paste-fallback-wrap');
  var ta   = document.getElementById('paste-fallback');
  if (!wrap || !ta) return;

  wrap.classList.remove('hidden');
  ta.value = '';
  setTimeout(function(){ ta.focus(); }, 50);

  if (!ta._bound){
    ta._bound = true;
    ta.addEventListener('paste', function(){
      setTimeout(function(){ consumeFallback(input, ta, wrap); }, 10);
    });
    ta.addEventListener('input', function(){
      consumeFallback(input, ta, wrap);
    });
  }
}

function consumeFallback(input, ta, wrap){
  var v = ta.value.trim();
  if (!v) return;
  input.value = v;
  ta.value = '';
  wrap.classList.add('hidden');
  applyAmapPaste();
}

function hidePasteFallback(){
  var wrap = document.getElementById('paste-fallback-wrap');
  var ta   = document.getElementById('paste-fallback');
  if (wrap) wrap.classList.add('hidden');
  if (ta) ta.value = '';
}

async function applyAmapPaste(rawText){
  var input = document.getElementById('amap-paste-input');
  var raw = rawText !== undefined
    ? String(rawText).trim()
    : (input ? input.value.trim() : '');

  if (!raw){
    showToast('請先貼上連結、座標，或輸入地名');
    if (input) input.focus();
    return;
  }

  showToast('正在解析...');

  try {
    var result = await resolveAmapPlace(raw);

    var latEl = document.getElementById('place-lat');
    var lngEl = document.getElementById('place-lng');
    if (latEl) latEl.value = result.lat.toFixed(6);
    if (lngEl) lngEl.value = result.lng.toFixed(6);

    var nameEl = document.getElementById('place-name');
    var nameFilled = false;
    if (nameEl && result.name && !nameEl.value.trim()){
      nameEl.value = result.name;
      nameFilled = true;
    }

    var addrEl = document.getElementById('place-address');
    var addrFilled = false;
    if (addrEl && result.address && !addrEl.value.trim()){
      addrEl.value = result.address;
      addrFilled = true;
    }

    var sourceText = { geocode: '地理編碼', expand: '短連結展開', shortlink: '連結解析', direct: '連結解析' }[result.source] || result.source;

    var parts = ['座標'];
    if (nameFilled) parts.push('名稱');
    if (addrFilled) parts.push('地址');
    showToast('已透過' + sourceText + '填入：' + parts.join('、'));

    if (addrEl && !addrEl.value.trim()){
      reverseGeocode(result.lat, result.lng, function(err, data){
        if (err) return;
        applyGeocodeResult(data);
      });
    }
  } catch (e) {
    showToast('解析失敗：' + (e.message || '未知錯誤'));
  }
}


function reverseGeocode(lat, lng, callback) {
  function fetchNominatimFallback(reasonMsg) {
    var nominatimUrl = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lng + '&accept-language=zh-HK,zh-TW,zh,en&zoom=18&addressdetails=1';
    var nomFinished = false;
    var nomTimer = setTimeout(function() {
      if (!nomFinished) {
        nomFinished = true;
        callback('所有地圖服務均失敗 (高德失敗: ' + reasonMsg + '，且 Nominatim 逾時)');
      }
    }, 10000);

    fetch(nominatimUrl, { method: 'GET', headers: { 'Accept': 'application/json' } })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data) {
        if (nomFinished) return;
        nomFinished = true;
        clearTimeout(nomTimer);
        if (!data || !data.address) {
          callback('高德與 Nominatim 後備均無法解析地址');
          return;
        }
        var addr = data.address || {};
        var building = addr.building || addr.amenity || addr.building_name || addr.house_name || addr.office || '';
        var road = addr.road || addr.pedestrian || addr.footway || '';
        data.provider = 'nominatim';
        data.extracted_building = building;
        data.display_name = data.display_name;
        callback(null, data);
      })
      .catch(function(err) {
        if (nomFinished) return;
        nomFinished = true;
        clearTimeout(nomTimer);
        callback('高德失敗 (' + reasonMsg + ') 且 Nominatim 後備失敗: ' + (err && err.message ? err.message : '網絡錯誤'));
      });
  }

  var amapApiUrl = '/api/amap-regeo?lat=' + lat + '&lng=' + lng;
  var amapFinished = false;
  var amapTimer = setTimeout(function() {
    if (!amapFinished) {
      amapFinished = true;
      fetchNominatimFallback('高德請求逾時');
    }
  }, 10000);

  fetch(amapApiUrl, { method: 'GET', headers: { 'Accept': 'application/json' } })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      if (amapFinished) return;
      if (!data || !data.success) {
        amapFinished = true;
        clearTimeout(amapTimer);
        fetchNominatimFallback(data && data.error ? data.error : '高德解析失敗');
        return;
      }
      amapFinished = true;
      clearTimeout(amapTimer);
      var normalizedData = {
        provider: 'amap',
        display_name: data.formatted_address,
        address: {
          building: data.building,
          road: data.road,
          formatted_address: data.formatted_address
        },
        raw: data.raw
      };
      callback(null, normalizedData);
    })
    .catch(function(err) {
      if (amapFinished) return;
      amapFinished = true;
      clearTimeout(amapTimer);
      fetchNominatimFallback(err && err.message ? err.message : '高德網絡錯誤');
    });
}

function pickAddressText(data){
  if (!data) return '';
  var addr = data.address || {};
  return data.display_name
      || addr.formatted_address
      || [addr.road, addr.building, addr.district].filter(Boolean).join(' ')
      || '';
}

function fillPlaceAddressFromGeocode(data, opts){
  opts = opts || {};
  var filled = false;
  var addr = data.address || {};

  var addrEl = document.getElementById('place-address');
  var text = pickAddressText(data);
  if (addrEl && text && (opts.overwrite || !addrEl.value.trim())){
    addrEl.value = text;
    filled = true;
  }

  var nameEl = document.getElementById('place-name');
  if (nameEl && (opts.overwriteName || !nameEl.value.trim())){
    var autoName = addr.amenity || addr.shop || addr.building || addr.tourism
                || addr.office || addr.road || '';
    if (autoName){ nameEl.value = autoName; filled = true; }
  }
  return filled;
}

function setPlaceRegeoBtnLoading(btn, loading){
  if (!btn) return;
  if (loading){
    if (!btn.dataset.origHtml) btn.dataset.origHtml = btn.innerHTML;
    btn.disabled = true;
    btn.classList.add('opacity-60','cursor-wait');
    btn.innerHTML = '<span class="inline-flex items-center gap-1"><span class="ico w-3 h-3 animate-spin">' + ico('loader','w-3 h-3') + '</span>解析中…</span>';
  } else {
    if (btn.dataset.origHtml){
      btn.innerHTML = btn.dataset.origHtml;
      delete btn.dataset.origHtml;
    }
    btn.disabled = false;
    btn.classList.remove('opacity-60','cursor-wait');
    btn.querySelectorAll('[data-icon]').forEach(function(el){ delete el.dataset.done; });
    hydrateIcons(btn);
  }
}

function reverseGeocodePlaceCoords(opts){
  opts = opts || {};
  var latEl  = document.getElementById('place-lat');
  var lngEl  = document.getElementById('place-lng');
  var addrEl = document.getElementById('place-address');
  if (!latEl || !lngEl) return;

  var lat = parseFloat(latEl.value);
  var lng = parseFloat(lngEl.value);

  if (isNaN(lat) || isNaN(lng)){
    if (!opts.silent) showToast('請先填入有效的緯度與經度');
    return;
  }
  if (lat < -90 || lat > 90 || lng < -180 || lng > 180){
    if (!opts.silent) showToast('座標超出有效範圍');
    return;
  }

  var reqLat = lat, reqLng = lng;
  var btn = document.getElementById('place-regeo-btn');
  setPlaceRegeoBtnLoading(btn, true);
  if (!opts.silent) showToast('正在依座標解析地址...');

  reverseGeocode(lat, lng, function(err, data){
    setPlaceRegeoBtnLoading(btn, false);

    if (err){
      if (!opts.silent) showToast('地址解析失敗：' + err);
      return;
    }

    var nowLat = parseFloat(latEl.value);
    var nowLng = parseFloat(lngEl.value);
    if (nowLat !== reqLat || nowLng !== reqLng){
      if (!opts.silent) showToast('座標已變更，請重新解析');
      return;
    }

    var text = pickAddressText(data);
    if (!text){
      if (!opts.silent) showToast('解析成功，但沒有可用的地址資訊');
      return;
    }

    var isEmpty = !(addrEl && addrEl.value.trim());

    if (isEmpty){
      if (addrEl) addrEl.value = text;
      if (!opts.silent) showToast('已填入地址');
      return;
    }

    if (opts.silent) return;

    if (opts.overwrite){
      if (addrEl) addrEl.value = text;
      showToast('已更新地址');
      return;
    }

    showPlaceAddressPreview(text);
  });
}

function matchDistrictFromAddress(addr){
  var hay = [
    addr.state || '', addr.state_district || '', addr.region || '',
    addr.city || '', addr.city_district || '', addr.county || '',
    addr.district || '', addr.suburb || '', addr.quarter || '',
    addr.neighbourhood || '', addr.road || '', addr.display_name || ''
  ].join(' ').toLowerCase();

  for (var district in DISTRICT_KEYWORDS){
    var keys = DISTRICT_KEYWORDS[district];
    for (var i = 0; i < keys.length; i++){
      if (hay.indexOf(keys[i].toLowerCase()) !== -1) return district;
    }
  }
  return null;
}

function applyGeocodeResult(data){
  return fillPlaceAddressFromGeocode(data, { overwrite: false, overwriteName: false });
}

function clearTripLocation(id){
  var idx = trips.findIndex(function(item){ return item.id === id; });
  if (idx === -1) return;
  trips[idx].location = null;
  trips[idx].locationName = '';
  localStorage.setItem('taxi_trips', JSON.stringify(trips));
  showToast('已清除位置');
  openEditModal(id);
}

function attachTripLocation(id){
  var idx = trips.findIndex(function(item){ return item.id === id; });
  if (idx === -1) return;
  if (!navigator.geolocation){ showToast('此瀏覽器不支援定位功能'); return; }
  showToast('正在取得位置...');
  navigator.geolocation.getCurrentPosition(
    function(pos){
      trips[idx].location = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy || 0 };
      localStorage.setItem('taxi_trips', JSON.stringify(trips));
      showToast('已加上當前位置');
      openEditModal(id);
    },
    function(err){ showToast('定位失敗：' + (err.message || '請檢查定位權限')); },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

function saveEditedTrip(){
  var fareRaw = document.getElementById('edit-fare').value;
  var fare = parseFloat(fareRaw);
  var type = document.getElementById('edit-type').value;
  var payment = document.getElementById('edit-payment').value;
  var note = document.getElementById('edit-note').value.trim();
  var timeInput = document.getElementById('edit-trip-time');

  if (isNaN(fare) || fare === 0){ showToast('請輸入有效車資（可為負數）！'); return; }

  var index = trips.findIndex(function(item){ return item.id === currentEditingId; });
  if (index === -1) return;

  var targetTrip = trips[index];

  if (timeInput && timeInput.value){
    var tp = timeInput.value.split(':');
    var hh = parseInt(tp[0], 10);
    var mm = parseInt(tp[1], 10);
    if (!isNaN(hh) && !isNaN(mm)){
      var shiftKey = targetTrip.shiftDate || getLastShiftKey();
      var cfgS = shiftSettings[shiftKey];
      if (cfgS) ensureShiftFields(cfgS);

      var base = new Date(shiftKey + 'T00:00:00');
      if (!isNaN(base.getTime())){
        var d = new Date(base);
        d.setHours(hh, mm, 0, 0);
        var ts = d.getTime();

        var valid = true;
        if (cfgS && cfgS.startedAt){
          var endMs = cfgS.endedAt || Date.now();
          if (ts < cfgS.startedAt || ts > endMs){
            var d2 = new Date(base);
            d2.setDate(d2.getDate() + 1);
            d2.setHours(hh, mm, 0, 0);
            var ts2 = d2.getTime();
            if (ts2 >= cfgS.startedAt && ts2 <= endMs) ts = ts2;
            else valid = false;
          }
        }
        if (!valid){ showToast('所選時間不在該更次範圍內，請重新選擇'); return; }
        targetTrip.timestamp = ts;
        targetTrip.dateStr = toLocalISOString(new Date(ts));
      }
    }
  }

  var isExpense = fare < 0;
  targetTrip.fare      = fare;
  targetTrip.type      = type;
  targetTrip.payment   = payment;
  targetTrip.note      = note;
  targetTrip.isExpense = isExpense;

  if (isExpense){
    targetTrip.received = fare;
    targetTrip.change   = 0;
  } else {
    var rec = parseFloat(targetTrip.received);
    if (isNaN(rec) || rec === 0) rec = fare;
    targetTrip.received = rec;
    targetTrip.change   = rec - fare;
  }

  trips.sort(function(a, b){ return b.timestamp - a.timestamp; });
  localStorage.setItem('taxi_trips', JSON.stringify(trips));
  closeModal();
  renderTripList();
  showToast('行程已更新！');
}

function deleteTrip(id){
  if (confirm('確定要刪除這筆記錄嗎？')){
    trips = trips.filter(function(item){ return item.id !== id; });
    localStorage.setItem('taxi_trips', JSON.stringify(trips));
    renderTripList();
    showToast('記錄已刪除');
  }
}

function closeModal(){
  var m = document.getElementById('trip-modal');

  m.classList.remove('flex');
  currentEditingId = null;

  shiftTimeMode    = 'quick';
  hidePasteFallback();
}

function readShiftEditForm(key){
  var cfg = shiftSettings[key];
  if (!cfg) return null;

  var startEl = document.getElementById('edit-shift-start');
  var endEl   = document.getElementById('edit-shift-end');
  var rentEl  = document.getElementById('edit-shift-rental');
  var noteEl  = document.getElementById('edit-shift-note');
  var msEl    = document.getElementById('edit-shift-mileage-start');
  var meEl    = document.getElementById('edit-shift-mileage-end');

  if (!startEl) return cfg;

  var baseDate = new Date(key + 'T00:00:00');

  var sVal = startEl.value;
  if (sVal){
    var sParts = sVal.split(':');
    var sD = new Date(baseDate);
    sD.setHours(parseInt(sParts[0], 10), parseInt(sParts[1], 10), 0, 0);
    cfg.startedAt = sD.getTime();
    cfg.startTime = sVal;
  } else { cfg.startedAt = null; cfg.startTime = ''; }

  var eVal = endEl.value;
  if (eVal){
    var eParts = eVal.split(':');
    var eD = new Date(baseDate);
    eD.setHours(parseInt(eParts[0], 10), parseInt(eParts[1], 10), 0, 0);
    if (cfg.startedAt && eD.getTime() <= cfg.startedAt) eD.setDate(eD.getDate() + 1);
    cfg.endedAt = eD.getTime();
    cfg.endTime = eVal;
  } else { cfg.endedAt = null; cfg.endTime = ''; }

  cfg.rental = parseFloat(rentEl.value) || 0;
  if (noteEl) cfg.note = noteEl.value.trim();

  var msVal = msEl.value === '' ? null : parseFloat(msEl.value);
  var meVal = meEl.value === '' ? null : parseFloat(meEl.value);
  cfg.mileage = {
    start: (msVal === null || isNaN(msVal)) ? null : msVal,
    end:   (meVal === null || isNaN(meVal)) ? null : meVal
  };

  return cfg;
}

function saveShiftEdit(key){
  var cfg = readShiftEditForm(key);
  if (!cfg){ showToast('更次不存在'); return; }

  shiftSettings[key] = cfg;
  localStorage.setItem('taxi_shift_settings', JSON.stringify(shiftSettings));

  renderTripList();
  updateHeaderWorked();

  showToast('更次 ' + key + ' 已更新');
  openShiftHistoryModal();
}

function hideAddFuelInline(){
  var panel = document.getElementById('add-fuel-inline-panel');
  if (!panel) return;
  panel.classList.add('hidden');
  var amountEl  = document.getElementById('inline-fuel-amount');
  var priceEl   = document.getElementById('inline-fuel-price');

function confirmAddFuelInline(key){
  var amountEl  = document.getElementById('inline-fuel-amount');
  var priceEl   = document.getElementById('inline-fuel-price');
  var stationEl = document.getElementById('inline-fuel-station');
  if (!amountEl) return;

  var amount = parseFloat(amountEl.value);
  if (isNaN(amount) || amount <= 0){ showToast('請輸入有效金額'); amountEl.focus(); return; }

  var cfg = readShiftEditForm(key);
  if (!cfg){ showToast('更次不存在'); return; }

  var unitPrice = priceEl.value.trim() ? parseFloat(priceEl.value) : null;
  if (isNaN(unitPrice) || unitPrice <= 0) unitPrice = null;

  var station = stationEl.value.trim();
  var liters  = (unitPrice !== null) ? (amount / unitPrice) : null;

  if (!Array.isArray(cfg.fuelEntries)) cfg.fuelEntries = [];
  cfg.fuelEntries.push({
    id: 'fuel_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    amount: amount, unitPrice: unitPrice, liters: liters,
    station: station, timestamp: Date.now()
  });

  shiftSettings[key] = cfg;
  localStorage.setItem('taxi_shift_settings', JSON.stringify(shiftSettings));

  renderTripList();

  var msg = '已加入加油 $' + amount;
  if (unitPrice !== null && liters !== null) msg += '（' + liters.toFixed(2) + ' L）';
  showToast(msg);
  openShiftEditModal(key);
}

function deleteFuelInline(key, id){
  var cfg = shiftSettings[key];
  if (!cfg){ showToast('更次不存在'); return; }
  if (!confirm('確定要刪除這筆加油記錄嗎？')) return;

  readShiftEditForm(key);
  cfg.fuelEntries = (cfg.fuelEntries || []).filter(function(e){ return e.id !== id; });
  shiftSettings[key] = cfg;
  localStorage.setItem('taxi_shift_settings', JSON.stringify(shiftSettings));

  renderTripList();

  showToast('已刪除加油記錄');
  openShiftEditModal(key);
}

function deleteShift(key){
  var cfg  = shiftSettings[key];
  var list = trips.filter(function(t){ return t.shiftDate === key; });
  var isActive = (key === getActiveShiftKey());
  var warnActive = isActive ? '⚠️ 這是「進行中」的更次（尚未收工）。\n\n' : '';

  var confirmMsg =
    warnActive + '確定要刪除更次「' + key + '」嗎？\n\n' +
    '將一併刪除：\n' +
    '• ' + list.length + ' 筆行程紀錄\n' +
    '• 該更次設定（含租車費、油費、里程、時間、備註）\n\n' +
    '此操作可於「數據管理」按「撤銷」還原。';

  if (!confirm(confirmMsg)) return;

  lastDeletedTrips = list.slice();
  lastDeletedShiftSettings = {};
  if (cfg) lastDeletedShiftSettings[key] = JSON.parse(JSON.stringify(cfg));

  var tripIdSet = {};
  list.forEach(function(t){ tripIdSet[t.id] = true; });
  trips = trips.filter(function(t){ return !tripIdSet[t.id]; });

  delete shiftSettings[key];

  if (manualShiftKey === key){ manualShiftKey = null; manualTripTime = null; }

  localStorage.setItem('taxi_trips', JSON.stringify(trips));
  localStorage.setItem('taxi_shift_settings', JSON.stringify(shiftSettings));

  renderTripList();
  updateHeaderWorked();
  updateTripTimeChip();

  var bannerText = '已刪除更次 ' + key + '（' + list.length + ' 筆）';
  showUndoBanner(bannerText);
  showToast(bannerText);

  var remaining = Object.keys(shiftSettings);
  if (remaining.length > 0) openShiftHistoryModal();
  else closeModal();
}

function calcFuelLiters(){
  var amountEl = document.getElementById('fuel-add-amount');
  var priceEl  = document.getElementById('fuel-add-price');
  var el       = document.getElementById('fuel-add-liters');
  if (!el || !amountEl || !priceEl) return;

  var amount = parseFloat(amountEl.value) || 0;
  var price  = parseFloat(priceEl.value)  || 0;

  if (amount > 0 && price > 0){
    el.innerText = (amount / price).toFixed(2) + ' L';
    el.className = 'font-bold text-emerald-700 font-mono';
  } else {
    el.innerText = '-- L';
    el.className = 'font-bold text-slate-400 font-mono';
  }
}

function addFuelEntry(){
  var amountEl  = document.getElementById('fuel-add-amount');
  var priceEl   = document.getElementById('fuel-add-price');
  var stationEl = document.getElementById('fuel-add-station');

  var amount = parseFloat(amountEl.value);
  if (!amount || isNaN(amount) || amount <= 0){ showToast('請輸入有效金額！'); amountEl.focus(); return; }

  var unitPrice = priceEl ? parseFloat(priceEl.value) : NaN;
  if (isNaN(unitPrice) || unitPrice <= 0) unitPrice = null;

  var station = stationEl ? stationEl.value.trim() : '';
  var liters  = (unitPrice !== null) ? (amount / unitPrice) : null;

  var key = getLastShiftKey();
  var cfg = getLastSettings();

var DELETE_PERIODS = {
  day:   { daysBack: 1,  label: '一天前',   desc: '昨天及之前的更次' },
  week:  { daysBack: 7,  label: '一星期前', desc: '7 天前的更次' },
  month: { daysBack: 30, label: '一個月前', desc: '30 天前的更次' }
};

function deleteOldTrips(period){
  var keysToDelete = [];

  if (period === 'all'){
    keysToDelete = Object.keys(shiftSettings);
  } else {
    var conf = DELETE_PERIODS[period];
    if (!conf) return;

    var cutoffDate = new Date();
    cutoffDate.setDate(cutoffDate.getDate() - conf.daysBack);
    cutoffDate.setHours(0, 0, 0, 0);
    var cutoffKey = localDateStr(cutoffDate);

    keysToDelete = Object.keys(shiftSettings).filter(function(k){ return k <= cutoffKey; });
  }

  var keySet = {};
  keysToDelete.forEach(function(k){ keySet[k] = true; });

  var tripTargets;
  if (period === 'all') tripTargets = trips.slice();
  else tripTargets = trips.filter(function(t){ return keySet[t.shiftDate]; });

  var totalCount = tripTargets.length + keysToDelete.length;
  if (totalCount === 0){
    showToast(period === 'all' ? '目前沒有任何數據可刪除' : '沒有 ' + DELETE_PERIODS[period].label + ' 的數據');
    return;
  }

  var periodDesc = period === 'all' ? '全部' : DELETE_PERIODS[period].label + '（' + DELETE_PERIODS[period].desc + '）';
  var confirmMsg = period === 'all'
    ? '⚠️ 確定要刪除「全部」數據嗎？\n\n將一併刪除：\n• ' + tripTargets.length + ' 筆行程紀錄\n• ' + keysToDelete.length + ' 個更次設定（含成本、油費、里程）\n\n此操作無法復原！'
    : '確定要刪除「' + periodDesc + '」的數據嗎？\n\n將一併刪除：\n• ' + tripTargets.length + ' 筆行程紀錄\n• ' + keysToDelete.length + ' 個更次設定（含成本、油費、里程）\n\n此操作無法復原！';

  if (!confirm(confirmMsg)) return;

  lastDeletedTrips = tripTargets.slice();
  lastDeletedShiftSettings = {};
  keysToDelete.forEach(function(k){
    if (shiftSettings[k]) lastDeletedShiftSettings[k] = JSON.parse(JSON.stringify(shiftSettings[k]));
  });

  var tripIdSet = {};
  tripTargets.forEach(function(t){ tripIdSet[t.id] = true; });
  trips = trips.filter(function(t){ return !tripIdSet[t.id]; });

  keysToDelete.forEach(function(k){ delete shiftSettings[k]; });

  localStorage.setItem('taxi_trips', JSON.stringify(trips));
  localStorage.setItem('taxi_shift_settings', JSON.stringify(shiftSettings));

  renderTripList();

  var bannerText = '已刪除 ' + tripTargets.length + ' 筆紀錄、' + keysToDelete.length + ' 個更次';
  showUndoBanner(bannerText);
  showToast(bannerText);
}

function showUndoBanner(text){
  var banner = document.getElementById('undo-banner');
  document.getElementById('undo-text').innerText = text;
  banner.classList.remove('hidden');
}
function hideUndoBanner(){ document.getElementById('undo-banner').classList.add('hidden'); }

function undoDelete(){
  var hasTrips  = lastDeletedTrips && lastDeletedTrips.length > 0;
  var hasShifts = lastDeletedShiftSettings && Object.keys(lastDeletedShiftSettings).length > 0;
  if (!hasTrips && !hasShifts) return;

  var existingTripIds = {};
  trips.forEach(function(t){ existingTripIds[t.id] = true; });
  var restoredTrips = (lastDeletedTrips || []).filter(function(t){ return !existingTripIds[t.id]; });
  trips = trips.concat(restoredTrips).sort(function(a,b){ return b.timestamp - a.timestamp; });

  var restoredShiftCount = 0;
  if (lastDeletedShiftSettings){
    Object.keys(lastDeletedShiftSettings).forEach(function(k){
      if (!shiftSettings[k]){ shiftSettings[k] = lastDeletedShiftSettings[k]; restoredShiftCount++; }
    });
  }

  localStorage.setItem('taxi_trips', JSON.stringify(trips));
  localStorage.setItem('taxi_shift_settings', JSON.stringify(shiftSettings));

  var restoredTripCount = restoredTrips.length;
  lastDeletedTrips = null;
  lastDeletedShiftSettings = null;

  hideUndoBanner();
  renderTripList();

  var msg = '已復原 ' + restoredTripCount + ' 筆紀錄';
  if (restoredShiftCount > 0) msg += '、' + restoredShiftCount + ' 個更次';
  showToast(msg);
}

function shiftKeyInPeriod(key, period, now, currentShiftKey){
  if (!key) return false;
  var d = new Date(key + 'T12:00:00');
  if (isNaN(d.getTime())) return false;

  if (currentShiftKey === undefined) currentShiftKey = getLastShiftKey();
  var endRef = new Date(currentShiftKey + 'T12:00:00');
  if (isNaN(endRef.getTime())) return false;

  if (period === 'day') return key === currentShiftKey;
  else if (period === 'week'){
    var start = new Date(endRef);
    start.setDate(start.getDate() - 6);
    return d >= start && d <= endRef;
  } else if (period === 'month'){
    var start2 = new Date(endRef);
    start2.setDate(start2.getDate() - 29);
    return d >= start2 && d <= endRef;
  }
  return false;
}

function renderTypeBreakdown(typeRev){
  var container = document.getElementById('stats-type-breakdown');
  if (!container) return;

  var entries = Object.keys(typeRev).filter(function(k){ return typeRev[k] > 0.001; });

  var orderMap = {};
  TRIP_TYPE_CONFIG.forEach(function(t, i){ orderMap[t.name] = i; });
  entries.sort(function(a, b){
    var ia = (orderMap[a] === undefined) ? 999 : orderMap[a];
    var ib = (orderMap[b] === undefined) ? 999 : orderMap[b];
    return ia - ib;
  });

  if (entries.length === 0){
    container.style.gridTemplateColumns = '';
    container.innerHTML = '<div class="col-span-3 text-slate-400 text-[11px] py-1">暫無收入記錄</div>';
    return;
  }

  var cols = Math.min(entries.length, 3);
  container.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0,1fr))';

  container.innerHTML = entries.map(function(name){
    var cfg = getTripTypeConfig(name);
    var theme = TRIP_TYPE_THEME[cfg.color] || TRIP_TYPE_THEME.slate;
    return '<div class="rounded-lg py-2 border ' + theme.card + '">' +
      '<div class="' + theme.text + ' font-medium truncate px-1">' + escapeHtml(name) + '</div>' +
      '<div class="' + theme.text + ' font-bold font-mono mt-0.5">$' + typeRev[name].toFixed(1) + '</div>' +
    '</div>';
  }).join('');
}

        '</div>';
      }).join('') + '</div>'
    : '<div class="text-center text-[11px] text-slate-400 py-3 bg-slate-50 rounded-xl">沒有停靠點</div>';

  var html =
    '<div class="space-y-3">' +
      '<div class="bg-amber-50 border border-amber-200 rounded-xl px-3 py-2.5 space-y-1">' +
        '<div class="flex justify-between items-center">' +
          '<span class="text-[11px] font-semibold text-amber-800">總時長</span>' +
          '<span class="font-bold text-amber-900 font-mono text-base">' + formatDuration(durationMs) + '</span>' +
        '</div>' +
        '<div class="flex justify-between items-center pt-1 border-t border-amber-200/60 text-[11px]">' +
          '<span class="text-amber-700">時間範圍</span>' +
          '<span class="text-amber-900 font-mono font-semibold">' + formatClock(r.startedAt) + ' → ' + formatClock(r.endedAt) + '</span>' +
        '</div>' +
      '</div>' +

      '<div class="bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-2 space-y-1 text-[11px]">' +
        '<div class="flex items-center gap-1.5 font-bold text-emerald-700 mb-0.5">' +
          '<span class="ico w-3 h-3">' + ico('play','w-3 h-3') + '</span>起點' +
        '</div>' +
        '<div class="flex justify-between"><span class="text-slate-600">時間</span><span class="font-mono font-bold text-slate-800">' + formatClock(r.startedAt) + '</span></div>' +
        (startLoc
          ? '<div class="flex justify-between gap-2"><span class="text-slate-600">位置</span><span class="font-mono truncate text-slate-800">' + startLoc.lat.toFixed(6) + ', ' + startLoc.lng.toFixed(6) + '</span></div>'
          : '<div class="text-slate-400">未記錄位置</div>') +
      '</div>' +

      '<div>' +
        '<div class="flex justify-between items-center mb-1.5"><span class="text-xs font-bold text-slate-700">停靠點</span><span class="text-[11px] text-slate-400">' + stops.length + ' 個</span></div>' +
        stopsHtml +
      '</div>' +

      '<div class="bg-rose-50 border border-rose-200 rounded-xl px-3 py-2 space-y-1 text-[11px]">' +
        '<div class="flex items-center gap-1.5 font-bold text-rose-700 mb-0.5">' +
          '<span class="ico w-3 h-3">' + ico('square','w-3 h-3') + '</span>終點' +
        '</div>' +
        '<div class="flex justify-between"><span class="text-slate-600">時間</span><span class="font-mono font-bold text-slate-800">' + formatClock(r.endedAt) + '</span></div>' +
        (endLoc
          ? '<div class="flex justify-between gap-2"><span class="text-slate-600">位置</span><span class="font-mono truncate text-slate-800">' + endLoc.lat.toFixed(6) + ', ' + endLoc.lng.toFixed(6) + '</span></div>'
          : '<div class="text-slate-400">未記錄位置</div>') +
      '</div>' +
    '</div>';

  document.getElementById('modal-title').innerText = '行程軌跡預覽';
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-footer').innerHTML =
    '<button onclick="discardPendingTripRoute()" class="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded-xl text-xs transition border border-rose-200">捨棄軌跡</button>' +
    '<button onclick="closeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl text-xs transition">關閉</button>';

  var m = document.getElementById('trip-modal');
  m.classList.remove('hidden');
  m.classList.add('flex');
  hydrateIcons();
}

function discardPendingTripRoute() {
  if (!pendingTripSession) return;
  if (!confirm('確定要捨棄此次行程的軌跡記錄嗎？\n\n（不影響已填入備注的文字，你可手動清除）')) return;
  pendingTripSession = null;
  updatePendingTripDurationBadge();
  closeModal();
  showToast('已捨棄行程軌跡');
}

function openTripDrawer() {
  closeDrawer();
  var overlay = document.getElementById('trip-drawer-overlay');
  var drawer  = document.getElementById('trip-drawer');
  if (!overlay || !drawer) return;
  renderTripDrawer();
  void overlay.offsetWidth;
  overlay.classList.add('visible');
  drawer.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeTripDrawer() {
  var overlay = document.getElementById('trip-drawer-overlay');
  var drawer  = document.getElementById('trip-drawer');
  if (!overlay || !drawer) return;
  overlay.classList.remove('visible');
  drawer.classList.remove('open');
  document.body.style.overflow = '';
}

function renderTripDrawer() {
  var content = document.getElementById('trip-drawer-content');
  if (!content) return;

  if (tripSession && !tripSession.active) {
    tripSession = null;
    localStorage.removeItem('taxi_trip_session');
  }

  if (!tripSession || !tripSession.startedAt) {
    content.innerHTML =
      '<div class="bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-6 text-center space-y-3">' +
        '<div class="ico w-12 h-12 mx-auto text-amber-500">' + ico('navigation','w-12 h-12') + '</div>' +
        '<p class="text-sm font-bold text-slate-700">尚未開始行程</p>' +
        '<p class="text-[11px] text-slate-400 leading-relaxed">點擊下方按鈕開始記錄，會自動記錄起點時間與位置。</p>' +
      '</div>' +
      '<button type="button" onclick="startTripSession()" ' +
        'class="w-full py-4 bg-emerald-500 hover:bg-emerald-700 active:scale-[0.98] text-white font-black rounded-xl shadow-md transition flex items-center justify-center gap-2 text-base">' +
        '<span class="ico w-5 h-5">' + ico('play','w-5 h-5') + '</span> 開始行程' +
      '</button>';
    hydrateIcons(content);
    updateTripSessionIndicator();
    return;
  }

  var startLoc = tripSession.startLocation;
  var stops    = tripSession.stops || [];

  var stopListHtml = stops.length
    ? '<div class="space-y-1.5">' + stops.map(function (s, i) {
        var locText = s.location
          ? (s.location.lat.toFixed(6) + ', ' + s.location.lng.toFixed(6))
          : '無位置';
        return '<div class="flex items-start gap-2 bg-white border border-slate-200 rounded-xl px-3 py-2">' +
          '<span class="w-6 h-6 rounded-full bg-amber-100 text-amber-700 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">' + (i + 1) + '</span>' +
          '<div class="min-w-0 flex-1">' +
            '<div class="text-xs font-bold text-slate-800 font-mono">' + formatClock(s.timestamp) + '</div>' +
            '<div class="text-[11px] text-slate-500 font-mono truncate">' + locText + '</div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>'
    : '<div class="text-center text-[11px] text-slate-400 py-3 bg-slate-50 rounded-xl">尚無停靠點</div>';

  content.innerHTML =
    '<div class="bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-4 space-y-2">' +
      '<div class="flex items-center gap-2">' +
        '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>' +
        '<span class="text-[11px] font-bold text-emerald-700">行程進行中</span>' +
      '</div>' +
      '<div class="text-[11px] text-slate-600 space-y-0.5">' +
        '<div class="flex justify-between"><span>開始時間</span><span class="font-bold font-mono">' + formatClock(tripSession.startedAt) + '</span></div>' +
        (startLoc
          ? '<div class="flex justify-between gap-2"><span>開始位置</span><span class="font-mono text-[10px] truncate">' + startLoc.lat.toFixed(6) + ', ' + startLoc.lng.toFixed(6) + '</span></div>'
          : '') +
      '</div>' +
    '</div>' +

    '<div>' +
      '<div class="flex justify-between items-center mb-1.5">' +
        '<span class="text-xs font-bold text-slate-700">停靠點記錄</span>' +
        '<span class="text-[11px] text-slate-400">' + stops.length + ' 個</span>' +
      '</div>' +
      stopListHtml +
    '</div>' +

    '<div class="space-y-2 pt-2">' +
      '<button type="button" onclick="addTripStop()" ' +
        'class="w-full py-3 bg-blue-500 hover:bg-blue-600 active:scale-[0.98] text-white font-bold rounded-xl transition flex items-center justify-center gap-2 text-sm">' +
        '<span class="ico w-4 h-4">' + ico('plus-circle','w-4 h-4') + '</span> 下一停靠點' +
      '</button>' +
      '<button type="button" onclick="endTripSession()" ' +
        'class="w-full py-3 bg-rose-500 hover:bg-rose-700 active:scale-[0.98] text-white font-bold rounded-xl transition flex items-center justify-center gap-2 text-sm">' +
        '<span class="ico w-4 h-4">' + ico('square','w-4 h-4') + '</span> 結束行程（終點）' +
      '</button>' +
      '<button type="button" onclick="cancelTripSession()" ' +
        'class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl transition text-xs">' +
        '放棄此次行程' +
      '</button>' +
    '</div>';

  hydrateIcons(content);
  updateTripSessionIndicator();
}

async function startTripSession() {
  if (tripSessionBusy) return;
  if (tripSession && tripSession.startedAt) {
    if (!confirm('目前已有進行中的行程，是否放棄並重新開始？')) return;
  }
  tripSessionBusy = true;
  showToast('正在取得位置...');
  try {
    var loc = null;
    try { loc = await getLocationBestEffort(); }
    catch (e) { showToast('定位失敗，仍會開始行程（無位置）'); }

    tripSession = {
      startedAt: Date.now(),
      startLocation: loc,
      stops: [],
      active: true
    };
    saveTripSession();
    renderTripDrawer();
    showToast('行程已開始');
  } finally {
    tripSessionBusy = false;
  }
}

async function addTripStop() {
  if (tripSessionBusy) return;
  if (!tripSession || !tripSession.active) return;
  tripSessionBusy = true;
  showToast('正在記錄停靠點...');
  try {
    var loc = null;
    try { loc = await getLocationBestEffort(); }
    catch (e) { showToast('定位失敗，仍記錄停靠點（無位置）'); }

    tripSession.stops = tripSession.stops || [];
    tripSession.stops.push({ timestamp: Date.now(), location: loc });
    saveTripSession();
    renderTripDrawer();
    showToast('已記錄停靠點 #' + tripSession.stops.length);
  } finally {
    tripSessionBusy = false;
  }
}

async function endTripSession() {
  if (tripSessionBusy) return;
  if (!tripSession || !tripSession.active) return;
  if (!confirm('確定要結束行程並記錄終點嗎？')) return;

  tripSessionBusy = true;
  showToast('正在記錄終點...');
  try {
    var loc = null;
    try { loc = await getLocationBestEffort(); }
    catch (e) { showToast('定位失敗，仍會記錄終點（無位置）'); }

    tripSession.endedAt = Date.now();
    tripSession.endLocation = loc;
    tripSession.active = false;
    saveTripSession();

    pendingTripSession = JSON.parse(JSON.stringify(tripSession));
    tripSession = null;
    localStorage.removeItem('taxi_trip_session');

    closeTripDrawer();
    switchTab('trip');
    applyPendingTripToNote();
    updateTripSessionIndicator();
    updatePendingTripDurationBadge();
    showToast('行程已結束，請填寫車資完成記錄');

    focusFareInputAfterTrip();
  } finally {
    tripSessionBusy = false;
  }
}

function cancelTripSession() {
  if (!confirm('確定要放棄此次行程嗎？所有已記錄的時間與位置將丟失。')) return;
  tripSession = null;
  localStorage.removeItem('taxi_trip_session');
  renderTripDrawer();
  updateTripSessionIndicator();
  showToast('已放棄此次行程');
}

function applyPendingTripToNote() {
  if (!pendingTripSession) return;
  var noteEl = document.getElementById('trip-note');
  if (!noteEl) return;

  var parts = ['起 ' + formatClock(pendingTripSession.startedAt)];
  (pendingTripSession.stops || []).forEach(function (s, i) {
    parts.push('停' + (i + 1) + ' ' + formatClock(s.timestamp));
  });
  parts.push('終 ' + formatClock(pendingTripSession.endedAt));

  var summary = parts.join(' → ');
  noteEl.value = noteEl.value.trim()
    ? (noteEl.value.trim() + ' | ' + summary)
    : summary;

  if (typeof renderNoteTags === 'function') renderNoteTags();
  updatePendingTripDurationBadge();
}

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js')
      .then(function(reg){ console.log('[PWA] Service Worker 已註冊：', reg.scope); })
      .catch(function(err){ console.warn('[PWA] Service Worker 註冊失敗：', err); });
  });
}

document.addEventListener('touchmove', function(e){
  var tripModal  = document.getElementById('trip-modal');
  var drawer     = document.getElementById('side-drawer');
  var tripDrawer = document.getElementById('trip-drawer');

  if (tripModal && !tripModal.classList.contains('hidden')){
    if (!tripModal.contains(e.target)) e.preventDefault();
    return;
  }
  if (drawer && drawer.classList.contains('open')){
    if (!drawer.contains(e.target)) e.preventDefault();
    return;
  }
  if (tripDrawer && tripDrawer.classList.contains('open')){
    if (!tripDrawer.contains(e.target)) e.preventDefault();
  }
}, { passive:false });
</script>
