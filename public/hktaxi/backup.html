<body>

<!-- Header -->
<header class="bg-amber-500 text-slate-900 shadow-md" style="position:sticky;top:0;z-index:50">
  <div class="max-w-md mx-auto px-4 py-2.5 flex justify-between items-center">

        class="p-1.5 rounded-lg bg-amber-600 hover:bg-amber-700 active:scale-[0.95] transition text-white">
        <span class="ico w-4 h-4" data-icon="arrow-left"></span>
      </button>
      <h1 class="text-lg font-bold">Google Drive 備份</h1>
    </div>
    <span class="ico w-5 h-5" data-icon="database"></span>
  </div>
</header>

<main class="max-w-md w-full mx-auto p-4 space-y-3">

  <!-- 主操作面板 -->
  <div id="main-panel" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 space-y-3">

    <!-- 状态 -->
    <div id="status-box" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-center">
      <span id="status-text" class="text-xs text-slate-500">請使用 Google 帳戶登入以啟用備份</span>
    </div>

    <!-- Google 原生登入按鈕容器 -->
    <div id="google-signin-container"></div>

    <!-- 上传/下载 -->
    <button type="button" id="upload-btn" onclick="upload()" disabled
      class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-700 disabled:bg-slate-200 disabled:text-slate-400 active:scale-[0.99] text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
      <span class="ico w-5 h-5" data-icon="database"></span>
      <span id="upload-text">一鍵上傳到 Google Drive</span>
    </button>

    <button type="button" id="download-btn" onclick="download()" disabled
      class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 disabled:bg-slate-200 disabled:text-slate-400 active:scale-[0.99] text-slate-900 font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
      <span class="ico w-5 h-5" data-icon="rotate-cw"></span>
      <span id="download-text">從 Google Drive 下載還原</span>
    </button>

    <!-- 文件信息 -->
    <div id="file-info" class="hidden bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 space-y-1.5 text-xs">
      <div class="flex justify-between">
        <span class="text-slate-500">最後備份時間</span>
        <span id="file-time" class="font-bold font-mono text-slate-800">--</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500">備份檔案大小</span>
        <span id="file-size" class="font-bold font-mono text-slate-800">--</span>
      </div>
    </div>

    <!-- 本地数据统计 -->
    <div class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 space-y-1.5 text-xs">
      <div class="text-[11px] font-semibold text-slate-600 mb-1 flex items-center gap-1">
        <span class="ico w-3 h-3" data-icon="info"></span>本地目前數據
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500">行程紀錄</span>
        <span id="stat-trips" class="font-bold font-mono text-slate-800">0 筆</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500">更次設定</span>
        <span id="stat-shifts" class="font-bold font-mono text-slate-800">0 個</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500">收藏地點</span>
        <span id="stat-places" class="font-bold font-mono text-slate-800">0 個</span>
      </div>
    </div>

    <!-- 登出按鈕 -->
    <button type="button" id="logout-btn" onclick="logout()" class="w-full text-[11px] text-slate-400 hover:text-rose-500 underline transition py-1 hidden">
      登出 Google 帳戶
    </button>
  </div>

  <!-- 加载中 -->
  <div id="loading" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 py-8 text-center">
    <span class="ico w-8 h-8 mx-auto text-amber-500 animate-spin" data-icon="loader"></span>
    <p id="loading-text" class="text-xs text-slate-500 mt-2">處理中...</p>
  </div>

  <!-- 说明 -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
    <p class="text-[11px] text-slate-400 leading-relaxed space-y-1">
      ※ 備份包含：行程、更次設定、收藏地點、加油記錄、偏好設定。<br>
      ※ 檔案儲存在 Google Drive「應用程式資料」資料夾，只保留最近一份（覆蓋式）。<br>
      ※ Access Token 只存在記憶體中，重新整理或關閉頁面後需重新登入。<br>
      ※ 下載還原會覆蓋目前所有本地數據，操作前會有二次確認。
    </p>
  </div>

</main>

<!-- Toast -->
<div id="toast" class="fixed bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-medium shadow-lg transition-all duration-300"

<script>
/* ═══════════════════════════════════════════════════════════
   ⚠️ 請將下方的 Client ID 替換為你自己的
   ═══════════════════════════════════════════════════════════ */
var CLIENT_ID = '802199089900-5n676d4hansnab5c66igukb1mch5m7m1.apps.googleusercontent.com';
var FILE_NAME = 'hk-taxi-helper-backup.json';
var SCOPE = 'https://www.googleapis.com/auth/drive.file';

/* ═══════════════════════════════════════════════════════════
   圖示
   ═══════════════════════════════════════════════════════════ */
var ICONS = {
  'arrow-left':'<path d="M19 12H5M12 19l-7-7 7-7"/>',
  'database':'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  'rotate-cw':'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  'info':'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  'external-link':'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/>',
  'loader':'<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  'check-circle':'<circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.3 2.3 4.7-5"/>',
  'alert-triangle':'<path d="m10.3 3.6-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3.4l-8-14a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  'home':'<path d="M3 12 12 3l9 9v9a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2v-9z"/>'
};

function hydrateIcons(root){
  (root || document).querySelectorAll('[data-icon]').forEach(function(el){
    if (el.dataset.done) return;
    el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
                   'stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%">' +
                   (ICONS[el.dataset.icon] || '') + '</svg>';
    el.dataset.done = '1';
  });
}

function ico(name, cls){
  cls = cls || 'w-4 h-4';
  return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
         'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
         (ICONS[name] || '') + '</svg>';
}

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showToast(msg){
  var toast = document.getElementById('toast');
  toast.innerText = msg;
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function(){ toast.style.opacity = '0'; }, 2800);
}

/* ═══════════════════════════════════════════════════════════
   返回主页
   ═══════════════════════════════════════════════════════════ */
function goHome(){
  window.location.href = './index.html';
}

/* ═══════════════════════════════════════════════════════════
   GIS 授权流程
   ═══════════════════════════════════════════════════════════ */
var token = null;
var tokenClient = null;
var gisLoaded = false;

function loadGISScript(){
  return new Promise(function(resolve, reject){
    if (gisLoaded && window.google && window.google.accounts){ resolve(); return; }
    var existing = document.querySelector('script[src="https://accounts.google.com/gsi/client"]');
    if (existing){
      existing.addEventListener('load', function(){ gisLoaded = true; resolve(); });
      if (window.google && window.google.accounts){ gisLoaded = true; resolve(); }
      return;
    }
    var script = document.createElement('script');
    script.src = 'https://accounts.google.com/gsi/client';
    script.async = true;
    script.defer = true;
    script.onload = function(){ gisLoaded = true; resolve(); };
    script.onerror = function(){ reject(new Error('無法載入 Google Identity Services')); };
    document.head.appendChild(script);
  });
}

/* 初始化並渲染 Google 登入按鈕 */
function initGoogleButton(){
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: function(response) {
      // 這個 callback 在使用 Token Model 時不會被觸發，
      // 但 initialize 仍然是必要的前置步驟。
      console.log('[GIS] ID token response (unused):', response);
    }
  });

  google.accounts.id.renderButton(
    document.getElementById('google-signin-container'),
    {
      type: 'standard',
      theme: 'filled_blue',
      size: 'large',
      text: 'signin_with',
      shape: 'rectangular',
      logo_alignment: 'left',
      width: '280'
    }
  );
}

/* 點擊後觸發的授權流程（獲取 Access Token） */
async function authorize(){
  if (!CLIENT_ID || CLIENT_ID.indexOf('YOUR_GOOGLE_CLIENT_ID') !== -1) {
    showToast('請先在代碼中設定你的 Google Client ID');
    return;
  }

  try {
    await loadGISScript();
  } catch (e) {
    showToast(e.message);
    return;
  }

  if (!tokenClient) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: function(response) {
        if (response.error) {
          console.warn('[gdrive] auth error:', response);
          showToast('授權失敗：' + (response.error_description || response.error));
          return;
        }
        token = response.access_token;
        updateUI();
        showToast('已成功登入 Google 帳戶');
      }
    });
  }

  tokenClient.requestAccessToken();
}

/* 登出 */
function logout(){
  if (!token) return;
  // 撤銷 token（可選）
  google.accounts.oauth2.revoke(token, function() {
    console.log('[gdrive] token revoked');
  });
  token = null;
  updateUI();
  showToast('已登出 Google 帳戶');
}

/* ═══════════════════════════════════════════════════════════
   UI 更新
   ═══════════════════════════════════════════════════════════ */
function updateUI(){
  var statusBox = document.getElementById('status-box');
  var statusText = document.getElementById('status-text');
  var googleContainer = document.getElementById('google-signin-container');
  var uploadBtn = document.getElementById('upload-btn');
  var downloadBtn = document.getElementById('download-btn');
  var fileInfo = document.getElementById('file-info');
  var logoutBtn = document.getElementById('logout-btn');

  if (token){
    statusBox.className = 'bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-2.5 text-center';
    statusText.innerHTML = '<span class="text-xs text-emerald-700 font-bold flex items-center justify-center gap-1">' +
                           ico('check-circle','w-3.5 h-3.5') + '已登入 Google 帳戶</span>';
    googleContainer.classList.add('hidden');
    uploadBtn.disabled = false;
    downloadBtn.disabled = false;
    fileInfo.classList.remove('hidden');
    logoutBtn.classList.remove('hidden');
    refreshFileInfo();
  } else {
    statusBox.className = 'bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-center';
    statusText.innerHTML = '<span class="text-xs text-slate-500">請使用 Google 帳戶登入以啟用備份</span>';
    googleContainer.classList.remove('hidden');
    uploadBtn.disabled = true;
    downloadBtn.disabled = true;
    fileInfo.classList.add('hidden');
    logoutBtn.classList.add('hidden');
  }

  updateLocalStats();
}

function updateLocalStats(){
  var trips = JSON.parse(localStorage.getItem('taxi_trips')) || [];
  var shifts = JSON.parse(localStorage.getItem('taxi_shift_settings')) || {};
  var places = JSON.parse(localStorage.getItem('taxi_places')) || [];
  var shiftCount = Object.keys(shifts).length;

  document.getElementById('stat-trips').innerText = trips.length + ' 筆';
  document.getElementById('stat-shifts').innerText = shiftCount + ' 個';
  document.getElementById('stat-places').innerText = places.length + ' 個';
}

/* ═══════════════════════════════════════════════════════════
   Drive API 封装
   ═══════════════════════════════════════════════════════════ */
async function api(url, options){
  options = options || {};
  options.headers = Object.assign({}, options.headers, {
    'Authorization': 'Bearer ' + token
  });

  var resp = await fetch(url, options);
  if (resp.status === 401){
    token = null;
    updateUI();
    throw new Error('登入已過期，請重新登入');
  }
  if (!resp.ok){
    var errText = '';
    try { errText = await resp.text(); } catch(e){}
    throw new Error('Drive API ' + resp.status + '：' + (errText || resp.statusText));
  }
  return resp;
}

async function findBackupFile(){
  var q = encodeURIComponent("name = '" + FILE_NAME + "' and trashed = false");
  var url = 'https://www.googleapis.com/drive/v3/files' +
    '?q=' + q +
    '&fields=files(id,name,modifiedTime,size)' +
    '&orderBy=modifiedTime desc' +
    '&pageSize=1';
  var resp = await api(url);
  var data = await resp.json();
  return (data.files && data.files.length) ? data.files[0] : null;
}

async function refreshFileInfo(){
  if (!token) return;
  var timeEl = document.getElementById('file-time');
  var sizeEl = document.getElementById('file-size');
  if (!timeEl || !sizeEl) return;

  try {
    var file = await findBackupFile();
    if (file){
      var d = new Date(file.modifiedTime);
      timeEl.innerText = d.toLocaleString('zh-HK');
      var bytes = parseInt(file.size || '0', 10);
      sizeEl.innerText = bytes > 1024 * 1024
        ? (bytes / 1024 / 1024).toFixed(2) + ' MB'
        : (bytes / 1024).toFixed(1) + ' KB';
    } else {
      timeEl.innerText = '尚無備份';
      sizeEl.innerText = '--';
    }
  } catch (e) {
    console.warn('[gdrive] refresh info failed:', e);
  }
}

/* ═══════════════════════════════════════════════════════════
   构建备份数据
   ═══════════════════════════════════════════════════════════ */
function buildBackupPayload(){
  var trips = JSON.parse(localStorage.getItem('taxi_trips')) || [];
  var shiftSettings = JSON.parse(localStorage.getItem('taxi_shift_settings')) || {};
  var places = JSON.parse(localStorage.getItem('taxi_places')) || [];
  var fuelPrefs;
  try { fuelPrefs = JSON.parse(localStorage.getItem('taxi_fuel_prefs')) || {}; }
  catch(e){ fuelPrefs = {}; }
  var cardStates;
  try { cardStates = JSON.parse(localStorage.getItem('taxi_card_states')) || {}; }
  catch(e){ cardStates = {}; }

  return {
    _meta: {
      app: 'hk-taxi-helper',
      version: 1,
      exportedAt: new Date().toISOString()
    },
    trips: trips,
    shiftSettings: shiftSettings,
    places: places,
    fuelPrefs: fuelPrefs,
    lastType: localStorage.getItem('taxi_last_type') || '',
    lastPayment: localStorage.getItem('taxi_last_payment') || '',
    cardStates: cardStates
  };
}

/* ═══════════════════════════════════════════════════════════
   一键上传
   ═══════════════════════════════════════════════════════════ */
async function upload(){
  if (!token){ showToast('請先登入 Google 帳戶'); return; }

  var uploadBtn = document.getElementById('upload-btn');
  var uploadText = document.getElementById('upload-text');
  var loading = document.getElementById('loading');
  var loadingText = document.getElementById('loading-text');

  try {
    uploadBtn.disabled = true;
    uploadText.innerText = '上傳中...';
    loading.classList.remove('hidden');
    loadingText.innerText = '正在上傳備份到 Google Drive...';

    var payload = buildBackupPayload();
    var jsonStr = JSON.stringify(payload, null, 2);
    var blob = new Blob([jsonStr], { type: 'application/json' });
    var file = new File([blob], FILE_NAME, { type: 'application/json' });

    var existing = await findBackupFile();
    var uploadUrl;
    if (existing){
      uploadUrl = 'https://www.googleapis.com/upload/drive/v3/files/' +
        encodeURIComponent(existing.id) + '?uploadType=multipart';
    } else {
      uploadUrl = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    }

    var metadata = { name: FILE_NAME, mimeType: 'application/json' };
    var form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', file);

    await api(uploadUrl, { method: existing ? 'PATCH' : 'POST', body: form });

    showToast(existing ? '備份已更新到 Google Drive' : '備份已上傳到 Google Drive');
    refreshFileInfo();
  } catch (e) {
    console.error('[gdrive] upload failed:', e);
    showToast('上傳失敗：' + e.message);
  } finally {
    uploadBtn.disabled = false;
    uploadText.innerText = '一鍵上傳到 Google Drive';
    loading.classList.add('hidden');
  }
}

/* ═══════════════════════════════════════════════════════════
   从 Drive 下载还原
   ═══════════════════════════════════════════════════════════ */
async function download(){
  if (!token){ showToast('請先登入 Google 帳戶'); return; }

  var downloadBtn = document.getElementById('download-btn');
  var downloadText = document.getElementById('download-text');
  var loading = document.getElementById('loading');
  var loadingText = document.getElementById('loading-text');

  try {
    downloadBtn.disabled = true;
    downloadText.innerText = '下載中...';
    loading.classList.remove('hidden');
    loadingText.innerText = '正在從 Google Drive 讀取備份...';

    var file = await findBackupFile();
    if (!file){
      showToast('Drive 上沒有找到備份檔案');
      return;
    }

    var d = new Date(file.modifiedTime);
    var confirmMsg = '找到備份：\n\n' +
      '• 時間：' + d.toLocaleString('zh-HK') + '\n' +
      '• 大小：' + (parseInt(file.size || '0', 10) / 1024).toFixed(1) + ' KB\n\n' +
      '下載還原會【覆蓋】目前所有本地數據，確定繼續嗎？';
    if (!confirm(confirmMsg)) return;

    var downloadUrl = 'https://www.googleapis.com/drive/v3/files/' +
      encodeURIComponent(file.id) + '?alt=media';
    var resp = await api(downloadUrl);
    var text = await resp.text();
    var data = JSON.parse(text);

    if (!data || !data._meta || data._meta.app !== 'hk-taxi-helper'){
      showToast('備份格式不正確，已取消還原');
      return;
    }

    // 写入 localStorage
    if (Array.isArray(data.trips)){
      localStorage.setItem('taxi_trips', JSON.stringify(data.trips));
    }
    if (data.shiftSettings && typeof data.shiftSettings === 'object'){
      localStorage.setItem('taxi_shift_settings', JSON.stringify(data.shiftSettings));
    }
    if (Array.isArray(data.places)){
      localStorage.setItem('taxi_places', JSON.stringify(data.places));
    }
    if (data.fuelPrefs){
      localStorage.setItem('taxi_fuel_prefs', JSON.stringify(data.fuelPrefs));
    }
    if (data.lastType) localStorage.setItem('taxi_last_type', data.lastType);
    if (data.lastPayment) localStorage.setItem('taxi_last_payment', data.lastPayment);
    if (data.cardStates) localStorage.setItem('taxi_card_states', JSON.stringify(data.cardStates));

    updateLocalStats();
    showToast('備份已還原！請點左上角返回主頁查看');

  } catch (e) {
    console.error('[gdrive] download failed:', e);
    showToast('下載失敗：' + e.message);
  } finally {
    downloadBtn.disabled = false;
    downloadText.innerText = '從 Google Drive 下載還原';
    loading.classList.add('hidden');
  }
}

/* ═══════════════════════════════════════════════════════════
   初始化
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', async function(){
  hydrateIcons();

  // 預先載入 GIS 並渲染 Google 按鈕
  try {
    await loadGISScript();
    initGoogleButton();
  } catch (e) {
    console.warn('[gdrive] GIS 載入失敗:', e);
    showToast('無法載入 Google 登入服務，請檢查網絡');
  }

  // 點擊 Google 按鈕時觸發授權流程
  // 由於 renderButton 本身不直接觸發 Token Client，
  // 我們在按鈕渲染後對其父容器添加點擊監聽。
  var container = document.getElementById('google-signin-container');
  container.addEventListener('click', function(e){
    // 檢查點擊是否發生在 Google 按鈕內部
    if (e.target.closest('div[role="button"]')) {
      authorize();
    }
  });

  updateUI();
});
</script>
