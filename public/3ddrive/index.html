<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 現代轎車停車模擬器 (方向盤互動優化版)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* 左上角控制面板 */
    #ui-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      color: #f8fafc;
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      max-width: 330px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
    }
    h1 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .controls-list {
      font-size: 13px;
      line-height: 1.75;
      color: #cbd5e1;
      margin-bottom: 14px;
    }
    .key {
      display: inline-block;
      background: #334155;
      color: #fff;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-family: monospace;
      border-bottom: 2px solid #0f172a;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover {
      background: #0369a1;
    }
    button:active {
      transform: scale(0.97);
    }
    button.secondary {
      background: #475569;
    }
    button.secondary:hover {
      background: #334155;
    }
    button.muted {
      background: #991b1b;
    }
    /* 儀表板資訊 */
    #telemetry {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
    }
    .highlight {
      color: #facc15;
      font-weight: bold;
    }
    /* 倒車雷達距離條 */
    #radar-bar-wrap {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #94a3b8;
    }
    #radar-bar-bg {
      flex: 1;
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
    }
    #radar-bar-fill {
      width: 0%;
      height: 100%;
      background: #22c55e;
      transition: width 0.1s, background-color 0.1s;
    }
    /* 成功提示橫幅 */
    #success-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(6, 78, 59, 0.94);
      border: 2px solid #34d399;
      color: #ecfdf5;
      padding: 24px 36px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #success-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }
    #success-banner h2 {
      font-size: 26px;
      color: #34d399;
      margin-bottom: 8px;
    }
    #success-banner p {
      font-size: 15px;
      margin-bottom: 16px;
      color: #d1fae5;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- 控制與狀態面板 -->
  <div id="ui-panel">
    <h1>
      <span>🚘 3D 現代轎車停車模擬</span>
    </h1>
    <div class="controls-list">
      <div><span class="key">W</span> / <span class="key">S</span> ：前進 / 倒車</div>
      <div><span class="key">A</span> / <span class="key">D</span> ：向左 / 向右轉向（方向盤保持角度）</div>
      <div><span class="key">Space</span> ：手煞車 (急減速)</div>
      <div><span class="key">C</span> ：切換視角 <span class="key">M</span> ：靜音 <span class="key">R</span> ：重置</div>
    </div>
    <div class="btn-group">
      <button id="btn-camera">視角：第三人稱尾部</button>
      <button id="btn-sound" class="secondary">🔊 音效開</button>
      <button id="btn-reset" class="secondary">重置</button>
    </div>
    <div id="telemetry">
      <span>檔位: <span id="gear-display" class="highlight">P</span></span>
      <span>方向盤: <span id="steer-display" class="highlight">0°</span></span>
      <span>速度: <span id="speed-display" class="highlight">0 km/h</span></span>
    </div>
    <div id="radar-bar-wrap">
      <span>倒車雷達:</span>
      <div id="radar-bar-bg"><div id="radar-bar-fill"></div></div>
      <span id="radar-dist">--</span>
    </div>
  </div>

  <!-- 停車成功提示 -->
  <div id="success-banner">
    <h2 id="success-title">🎉 停車成功！</h2>
    <p id="success-desc">車輛已完美停入車位內。</p>
    <button onclick="resetCar()">再試一次 (R)</button>
  </div>

  <script>
    // ==========================================
    // 0. Web Audio API 程序生成音效引擎
    // ==========================================
    class CarSoundEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.isInitialized = false;
        this.engineOsc1 = null;
        this.engineOsc2 = null;
        this.engineGain = null;
        this.engineFilter = null;
        this.radarTimer = 0;
      }

      init() {
        if (this.isInitialized) {
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          return;
        }
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        this.ctx = new AudioCtx();
        this.isInitialized = true;

        this.engineOsc1 = this.ctx.createOscillator();
        this.engineOsc2 = this.ctx.createOscillator();
        this.engineFilter = this.ctx.createBiquadFilter();
        this.engineGain = this.ctx.createGain();

        this.engineOsc1.type = 'sawtooth';
        this.engineOsc2.type = 'triangle';
        this.engineOsc1.frequency.value = 38;
        this.engineOsc2.frequency.value = 76;

        this.engineFilter.type = 'lowpass';
        this.engineFilter.frequency.value = 140;
        this.engineGain.gain.value = 0.04;

        this.engineOsc1.connect(this.engineFilter);
        this.engineOsc2.connect(this.engineFilter);
        this.engineFilter.connect(this.engineGain);
        this.engineGain.connect(this.ctx.destination);

        this.engineOsc1.start();
        this.engineOsc2.start();
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.engineGain && this.ctx) {
          this.engineGain.gain.setTargetAtTime(this.isMuted ? 0 : 0.04, this.ctx.currentTime, 0.05);
        }
        return this.isMuted;
      }

      update(dt, speed, isReversing, isBraking, rearDistance) {
        if (!this.isInitialized || this.isMuted) return;
        const now = this.ctx.currentTime;

        const speedRatio = Math.min(Math.abs(speed) / 9.0, 1.0);
        const baseFreq = 36 + speedRatio * 68;
        this.engineOsc1.frequency.setTargetAtTime(baseFreq, now, 0.06);
        this.engineOsc2.frequency.setTargetAtTime(baseFreq * 2.02, now, 0.06);
        this.engineFilter.frequency.setTargetAtTime(130 + speedRatio * 340, now, 0.06);
        this.engineGain.gain.setTargetAtTime(0.035 + speedRatio * 0.055, now, 0.06);

        if (isReversing) {
          let interval = 0.75;
          let pitch = 980;
          if (rearDistance < 4.5) {
            const closeness = Math.max(0, Math.min(1, (4.5 - rearDistance) / 4.0));
            interval = 0.7 - closeness * 0.61;
            pitch = 980 + closeness * 420;
          }

          this.radarTimer += dt;
          if (this.radarTimer >= interval) {
            this.radarTimer = 0;
            this.playBeep(pitch, Math.min(0.08, interval * 0.6), 0.05);
          }
        } else {
          this.radarTimer = 0.5;
        }
      }

      playBeep(freq = 1000, duration = 0.07, volume = 0.05) {
        if (!this.isInitialized || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      playSuccessChime() {
        if (!this.isInitialized || this.isMuted) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playBeep(freq, 0.25, 0.08), idx * 90);
        });
      }
    }

    const soundEngine = new CarSoundEngine();

    // ==========================================
    // 1. 初始化場景、渲染器與燈光
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 45, 150);

    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 250);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.75);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
    dirLight.position.set(25, 45, 25);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 5;
    dirLight.shadow.camera.far = 120;
    const d = 35;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // ==========================================
    // 2. 建立地面、停車位與路障
    // ==========================================
    const groundGeo = new THREE.PlaneGeometry(200, 200);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x333842, roughness: 0.85 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const gridHelper = new THREE.GridHelper(200, 100, 0x475569, 0x3f4756);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    const parkingSpots = [
      { id: 'bay', name: '倒車入庫停車位', x: 6.5, z: -4.0, width: 2.8, length: 5.6 },
      { id: 'parallel', name: '側方停車位', x: -7.5, z: 4.0, width: 2.7, length: 6.5 }
    ];

    function createParkingSpotMesh(spot) {
      const group = new THREE.Group();
      group.position.set(spot.x, 0.02, spot.z);

      const lineThickness = 0.14;
      const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

      const leftLine = new THREE.Mesh(new THREE.PlaneGeometry(lineThickness, spot.length), lineMat);
      leftLine.rotation.x = -Math.PI / 2;
      leftLine.position.set(-spot.width / 2, 0, 0);
      group.add(leftLine);

      const rightLine = new THREE.Mesh(new THREE.PlaneGeometry(lineThickness, spot.length), lineMat);
      rightLine.rotation.x = -Math.PI / 2;
      rightLine.position.set(spot.width / 2, 0, 0);
      group.add(rightLine);

      const backLine = new THREE.Mesh(new THREE.PlaneGeometry(spot.width + lineThickness, lineThickness), lineMat);
      backLine.rotation.x = -Math.PI / 2;
      backLine.position.set(0, 0, -spot.length / 2);
      group.add(backLine);

      if (spot.id === 'parallel') {
        const frontLine = new THREE.Mesh(new THREE.PlaneGeometry(spot.width + lineThickness, lineThickness), lineMat);
        frontLine.rotation.x = -Math.PI / 2;
        frontLine.position.set(0, 0, spot.length / 2);
        group.add(frontLine);
      }

      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.font = 'bold 46px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(spot.name, 256, 128);

      const textTex = new THREE.CanvasTexture(canvas);
      const textPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(spot.width * 0.85, spot.width * 0.42),
        new THREE.MeshBasicMaterial({ map: textTex, transparent: true })
      );
      textPlane.rotation.x = -Math.PI / 2;
      textPlane.position.y = 0.01;
      group.add(textPlane);

      scene.add(group);
    }

    parkingSpots.forEach(createParkingSpotMesh);

    const obstacles = [];
    function addCone(x, z) {
      const coneGroup = new THREE.Group();
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.06, 0.4),
        new THREE.MeshStandardMaterial({ color: 0x1e293b })
      );
      base.position.y = 0.03;
      const body = new THREE.Mesh(
        new THREE.ConeGeometry(0.16, 0.55, 16),
        new THREE.MeshStandardMaterial({ color: 0xf97316 })
      );
      body.position.y = 0.3;
      body.castShadow = true;
      coneGroup.add(base, body);
      coneGroup.position.set(x, 0, z);
      scene.add(coneGroup);
      obstacles.push(new THREE.Vector3(x, 0, z));
    }

    addCone(6.5 - 1.5, -6.9);
    addCone(6.5, -6.9);
    addCone(6.5 + 1.5, -6.9);
    addCone(-7.5, 4.0 - 3.6);
    addCone(-7.5, 4.0 + 3.6);

    // ==========================================
    // 3. 建立 3D 現代轎車模型（含方向盤與後視鏡）
    // ==========================================
    const carGroup = new THREE.Group();
    scene.add(carGroup);

    const carWidth = 1.84;
    const carLength = 4.55;
    const wheelBase = 2.72;

    const bodyPaintMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, metalness: 0.55, roughness: 0.25 });
    const darkTrimMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.6 });
    const windowGlassMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.08 });
    const mirrorGlassMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.98, roughness: 0.05 });

    const bodyWidth = carWidth * 0.92;
    const profile = new THREE.Shape();
    profile.moveTo(-2.25, 0.28);
    profile.lineTo(-2.28, 0.55);
    profile.quadraticCurveTo(-2.22, 0.76, -1.95, 0.80);
    profile.lineTo(-1.12, 0.90);
    profile.lineTo(-0.48, 1.42);
    profile.quadraticCurveTo(0.05, 1.48, 0.58, 1.41);
    profile.lineTo(1.38, 0.96);
    profile.lineTo(2.12, 0.92);
    profile.quadraticCurveTo(2.26, 0.85, 2.27, 0.55);
    profile.lineTo(2.22, 0.28);
    profile.lineTo(-2.25, 0.28);

    const carBodyGeo = new THREE.ExtrudeGeometry(profile, { steps: 1, depth: bodyWidth, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.06, bevelSegments: 4 });
    carBodyGeo.translate(0, 0, -bodyWidth / 2);
    carBodyGeo.rotateY(-Math.PI / 2);

    const carBodyMesh = new THREE.Mesh(carBodyGeo, bodyPaintMat);
    carBodyMesh.castShadow = true;
    carBodyMesh.receiveShadow = true;
    carGroup.add(carBodyMesh);

    // 擋風玻璃與側窗
    const frontWindshield = new THREE.Mesh(new THREE.PlaneGeometry(bodyWidth * 0.88, 0.84), windowGlassMat);
    frontWindshield.position.set(0, 1.17, -0.81);
    frontWindshield.rotation.x = -Math.PI * 0.285;
    carGroup.add(frontWindshield);

    const rearWindshield = new THREE.Mesh(new THREE.PlaneGeometry(bodyWidth * 0.86, 0.92), windowGlassMat);
    rearWindshield.position.set(0, 1.19, 0.99);
    rearWindshield.rotation.x = Math.PI * 0.34;
    carGroup.add(rearWindshield);

    const sideWindowShape = new THREE.Shape();
    sideWindowShape.moveTo(-0.98, 0.93);
    sideWindowShape.lineTo(-0.46, 1.37);
    sideWindowShape.quadraticCurveTo(0.05, 1.42, 0.54, 1.36);
    sideWindowShape.lineTo(1.26, 0.98);
    sideWindowShape.lineTo(-0.98, 0.93);

    const sideWinGeo = new THREE.ShapeGeometry(sideWindowShape);
    sideWinGeo.rotateY(-Math.PI / 2);

    const leftSideWin = new THREE.Mesh(sideWinGeo, windowGlassMat);
    leftSideWin.position.x = -bodyWidth / 2 - 0.062;
    carGroup.add(leftSideWin);

    const rightSideWin = leftSideWin.clone();
    rightSideWin.rotation.y = Math.PI;
    rightSideWin.position.x = bodyWidth / 2 + 0.062;
    carGroup.add(rightSideWin);

    // ==========================================
    // 新增：車內 3D 方向盤 (Steering Wheel)
    // ==========================================
    const steeringWheelGroup = new THREE.Group();
    // 放置於駕駛座前方 (左駕位置: X = -0.38, Y = 1.02, Z = -0.45)
    steeringWheelGroup.position.set(-0.38, 1.02, -0.45);
    // 讓方向盤朝向駕駛艙傾斜約 35 度
    steeringWheelGroup.rotation.x = THREE.MathUtils.degToRad(35);

    const wheelRimMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
    const wheelCenterMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4 });
    const chromeMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9, roughness: 0.1 });

    // 方向盤外環
    const rimGeo = new THREE.TorusGeometry(0.18, 0.022, 16, 32);
    const steeringRim = new THREE.Mesh(rimGeo, wheelRimMat);
    steeringWheelGroup.add(steeringRim);

    // 方向盤中心中央飾蓋 (喇叭按鈕)
    const centerPad = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.03, 16), wheelCenterMat);
    centerPad.rotation.x = Math.PI / 2;
    steeringWheelGroup.add(centerPad);

    // 三幅式輻條
    for (let i = 0; i < 3; i++) {
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.026, 0.16, 0.015), chromeMat);
      spoke.position.y = 0.08;
      spoke.rotation.z = (i * Math.PI * 2) / 3;
      steeringWheelGroup.add(spoke);
    }
    carGroup.add(steeringWheelGroup);

    // 燈光與後視鏡
    const grille = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.28, 0.08), darkTrimMat);
    grille.position.set(0, 0.54, -2.31);
    carGroup.add(grille);

    const headLightMat = new THREE.MeshBasicMaterial({ color: 0xe0f2fe });
    const drlMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    [-0.68, 0.68].forEach(xPos => {
      const hl = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.11, 0.12), headLightMat);
      hl.position.set(xPos, 0.71, -2.26);
      hl.rotation.y = xPos < 0 ? 0.18 : -0.18;
      carGroup.add(hl);
      const drl = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.035, 0.10), drlMat);
      drl.position.set(xPos * 1.05, 0.45, -2.28);
      carGroup.add(drl);
    });

    const tailLightBarMat = new THREE.MeshBasicMaterial({ color: 0xb91c1c });
    const tailLightBar = new THREE.Mesh(new THREE.BoxGeometry(bodyWidth * 0.92, 0.07, 0.08), tailLightBarMat);
    tailLightBar.position.set(0, 0.83, 2.28);
    carGroup.add(tailLightBar);

    const reverseLightMat = new THREE.MeshBasicMaterial({ color: 0x334155 });
    const revLightL = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.06, 0.09), reverseLightMat);
    revLightL.position.set(-0.58, 0.76, 2.28);
    const revLightR = revLightL.clone();
    revLightR.position.x = 0.58;
    carGroup.add(revLightL, revLightR);

    const rearDiffuser = new THREE.Mesh(new THREE.BoxGeometry(bodyWidth * 0.85, 0.14, 0.08), darkTrimMat);
    rearDiffuser.position.set(0, 0.33, 2.26);
    carGroup.add(rearDiffuser);

    function createSideMirror(isLeft) {
      const side = isLeft ? -1 : 1;
      const mirrorGroup = new THREE.Group();
      mirrorGroup.position.set(side * (bodyWidth / 2 + 0.04), 0.96, -0.82);

      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.04, 0.06), darkTrimMat);
      arm.position.set(side * 0.06, 0, 0);
      mirrorGroup.add(arm);

      const housing = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.12, 0.11), bodyPaintMat);
      housing.position.set(side * 0.16, 0.02, 0.02);
      housing.rotation.y = side * -0.15;
      housing.castShadow = true;
      mirrorGroup.add(housing);

      const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.19, 0.095), mirrorGlassMat);
      glass.position.set(side * 0.16, 0.02, 0.077);
      glass.rotation.y = side * -0.15;
      mirrorGroup.add(glass);

      const turnStrip = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.018, 0.02), new THREE.MeshBasicMaterial({ color: 0xfbbf24 }));
      turnStrip.position.set(side * 0.16, 0.02, -0.036);
      turnStrip.rotation.y = side * -0.15;
      mirrorGroup.add(turnStrip);

      carGroup.add(mirrorGroup);
    }
    createSideMirror(true);
    createSideMirror(false);

    const interiorMirrorGroup = new THREE.Group();
    interiorMirrorGroup.position.set(0, 1.34, -0.58);
    const intMirrorBody = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.065, 0.03), darkTrimMat);
    const intMirrorGlass = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.055), mirrorGlassMat);
    intMirrorGlass.position.z = 0.016;
    interiorMirrorGroup.add(intMirrorBody, intMirrorGlass);
    carGroup.add(interiorMirrorGroup);

    // 輪胎與輪圈組
    const tireGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.24, 24);
    tireGeo.rotateZ(Math.PI / 2);
    const tireMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.85 });

    const rimGeo = new THREE.CylinderGeometry(0.23, 0.23, 0.25, 16);
    rimGeo.rotateZ(Math.PI / 2);
    const rimMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.85, roughness: 0.2 });

    function createWheel(x, z) {
      const steerPivot = new THREE.Group();
      steerPivot.position.set(x, 0.35, z);
      const spinGroup = new THREE.Group();
      const tire = new THREE.Mesh(tireGeo, tireMat);
      tire.castShadow = true;
      const rim = new THREE.Mesh(rimGeo, rimMat);
      spinGroup.add(tire, rim);
      steerPivot.add(spinGroup);
      carGroup.add(steerPivot);
      return { steerPivot, spinGroup };
    }

    const wheelFL = createWheel(-carWidth / 2 + 0.06, -wheelBase / 2);
    const wheelFR = createWheel(carWidth / 2 - 0.06, -wheelBase / 2);
    const wheelRL = createWheel(-carWidth / 2 + 0.06, wheelBase / 2);
    const wheelRR = createWheel(carWidth / 2 - 0.06, wheelBase / 2);
    const allWheels = [wheelFL, wheelFR, wheelRL, wheelRR];

    const guideGroup = new THREE.Group();
    const guideMat = new THREE.LineBasicMaterial({ color: 0x34d399, linewidth: 2 });
    const guideLeftGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-carWidth / 2, 0.05, carLength / 2), new THREE.Vector3(-carWidth / 2, 0.05, carLength / 2 + 2.6)]);
    const guideRightGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(carWidth / 2, 0.05, carLength / 2), new THREE.Vector3(carWidth / 2, 0.05, carLength / 2 + 2.6)]);
    guideGroup.add(new THREE.Line(guideLeftGeo, guideMat), new THREE.Line(guideRightGeo, guideMat));
    guideGroup.visible = false;
    carGroup.add(guideGroup);

    // ==========================================
    // 4. 車輛物理狀態與控制 (取消自動回正)
    // ==========================================
    const state = {
      x: 0,
      z: 8,
      heading: 0,
      speed: 0,
      steerAngle: 0,
      cameraMode: 'chase',
      isParkedSuccess: false
    };

    const MAX_SPEED = 9.0;
    const MAX_REVERSE_SPEED = -4.5;
    const ACCEL = 9.0;
    const BRAKE_DECEL = 16.5;
    const FRICTION = 3.5;
    const MAX_STEER = THREE.MathUtils.degToRad(36);
    const STEER_SPEED = 2.4; // 轉向靈敏度

    const keys = { w: false, a: false, s: false, d: false, space: false };

    window.addEventListener('keydown', (e) => {
      soundEngine.init();
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
      if (k === 's' || e.key === 'ArrowDown') keys.s = true;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
      if (e.code === 'Space') keys.space = true;
      if (k === 'c') toggleCamera();
      if (k === 'r') resetCar();
      if (k === 'm') toggleSound();
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (k === 's' || e.key === 'ArrowDown') keys.s = false;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
      if (e.code === 'Space') keys.space = false;
    });

    const btnCamera = document.getElementById('btn-camera');
    const btnSound = document.getElementById('btn-sound');
    const btnReset = document.getElementById('btn-reset');
    const successBanner = document.getElementById('success-banner');
    const successTitle = document.getElementById('success-title');
    const successDesc = document.getElementById('success-desc');

    function toggleCamera() {
      soundEngine.init();
      state.cameraMode = state.cameraMode === 'chase' ? 'topdown' : 'chase';
      btnCamera.textContent = state.cameraMode === 'chase' ? '視角：第三人稱尾部' : '視角：俯瞰倒車影像';
    }

    function toggleSound() {
      soundEngine.init();
      const muted = soundEngine.toggleMute();
      btnSound.textContent = muted ? '🔇 已靜音' : '🔊 音效開';
      btnSound.classList.toggle('muted', muted);
    }

    function resetCar() {
      soundEngine.init();
      state.x = 0;
      state.z = 8;
      state.heading = 0;
      state.speed = 0;
      state.steerAngle = 0;
      state.isParkedSuccess = false;
      successBanner.classList.remove('show');
    }

    btnCamera.addEventListener('click', toggleCamera);
    btnSound.addEventListener('click', toggleSound);
    btnReset.addEventListener('click', resetCar);

    function getRearObstacleDistance() {
      const rearCenter = new THREE.Vector3(0, 0, carLength / 2);
      rearCenter.applyAxisAngle(new THREE.Vector3(0, 1, 0), state.heading);
      rearCenter.x += state.x;
      rearCenter.z += state.z;

      let minDist = 99;
      for (const obs of obstacles) {
        const dist = rearCenter.distanceTo(obs);
        if (dist < minDist) minDist = dist;
      }
      return minDist;
    }

    function updatePhysics(dt) {
      // 1. 方向盤轉向控制 (放開 A/D 時方向盤保持不動，不會自動回正)
      if (keys.a) {
        state.steerAngle = Math.min(MAX_STEER, state.steerAngle + STEER_SPEED * dt);
      } else if (keys.d) {
        state.steerAngle = Math.max(-MAX_STEER, state.steerAngle - STEER_SPEED * dt);
      }

      // 2. 加減速控制
      if (keys.space) {
        if (Math.abs(state.speed) < BRAKE_DECEL * dt) {
          state.speed = 0;
        } else {
          state.speed -= Math.sign(state.speed) * BRAKE_DECEL * dt;
        }
      } else if (keys.w) {
        if (state.speed < 0) {
          state.speed += BRAKE_DECEL * dt;
        } else {
          state.speed = Math.min(MAX_SPEED, state.speed + ACCEL * dt);
        }
      } else if (keys.s) {
        if (state.speed > 0) {
          state.speed -= BRAKE_DECEL * dt;
        } else {
          state.speed = Math.max(MAX_REVERSE_SPEED, state.speed - ACCEL * 0.75 * dt);
        }
      } else {
        if (Math.abs(state.speed) < FRICTION * dt) {
          state.speed = 0;
        } else {
          state.speed -= Math.sign(state.speed) * FRICTION * dt;
        }
      }

      // 3. 阿克曼單車運動學模型
      const angularVelocity = (state.speed / wheelBase) * Math.tan(state.steerAngle);
      state.heading += angularVelocity * dt;

      state.x -= Math.sin(state.heading) * state.speed * dt;
      state.z -= Math.cos(state.heading) * state.speed * dt;

      // 4. 同步模型與 3D 方向盤旋轉 (將車輪轉角放大約 1.5 倍對應方向盤轉圈感)
      carGroup.position.set(state.x, 0, state.z);
      carGroup.rotation.y = state.heading;

      wheelFL.steerPivot.rotation.y = state.steerAngle;
      wheelFR.steerPivot.rotation.y = state.steerAngle;

      // 更新車內 3D 方向盤旋轉動畫 (Z軸旋轉代表打方向盤)
      const steeringWheelMaxAngle = THREE.MathUtils.degToRad(540); // 1.5 圈
      const steeringRatio = state.steerAngle / MAX_STEER;
      steeringWheelGroup.rotation.z = -steeringRatio * (steeringWheelMaxAngle / 2);

      const wheelAngularRoll = (state.speed * dt) / 0.35;
      allWheels.forEach(w => {
        w.spinGroup.rotation.x -= wheelAngularRoll;
      });

      const isReversing = state.speed < -0.05 || (keys.s && state.speed <= 0.05);
      const isBraking = keys.space || (keys.s && state.speed > 0.05) || (keys.w && state.speed < -0.05);

      if (isReversing) {
        reverseLightMat.color.setHex(0xffffff);
        tailLightBarMat.color.setHex(0xdc2626);
        guideGroup.visible = true;
        guideGroup.rotation.y = -state.steerAngle * 0.6;
      } else if (isBraking) {
        reverseLightMat.color.setHex(0x334155);
        tailLightBarMat.color.setHex(0xff2222);
        guideGroup.visible = false;
      } else {
        reverseLightMat.color.setHex(0x334155);
        tailLightBarMat.color.setHex(0x991b1b);
        guideGroup.visible = false;
      }

      const rearDist = getRearObstacleDistance();
      soundEngine.update(dt, state.speed, isReversing, isBraking, rearDist);
      updateRadarHUD(isReversing, rearDist);
    }

    function checkParkingSuccess() {
      if (Math.abs(state.speed) > 0.08) {
        state.isParkedSuccess = false;
        successBanner.classList.remove('show');
        return;
      }

      const halfW = carWidth / 2;
      const halfL = carLength / 2;
      const corners = [
        new THREE.Vector3(-halfW, 0, -halfL),
        new THREE.Vector3(halfW, 0, -halfL),
        new THREE.Vector3(-halfW, 0, halfL),
        new THREE.Vector3(halfW, 0, halfL)
      ];

      corners.forEach(c => {
        c.applyAxisAngle(new THREE.Vector3(0, 1, 0), state.heading);
        c.x += state.x;
        c.z += state.z;
      });

      let normHeading = state.heading % Math.PI;
      if (normHeading > Math.PI / 2) normHeading -= Math.PI;
      if (normHeading < -Math.PI / 2) normHeading += Math.PI;
      const isAligned = Math.abs(normHeading) < THREE.MathUtils.degToRad(12);

      for (const spot of parkingSpots) {
        const minX = spot.x - spot.width / 2;
        const maxX = spot.x + spot.width / 2;
        const minZ = spot.z - spot.length / 2;
        const maxZ = spot.z + spot.length / 2;

        const allCornersInside = corners.every(
          c => c.x >= minX && c.x <= maxX && c.z >= minZ && c.z <= maxZ
        );

        if (allCornersInside && isAligned) {
          if (!state.isParkedSuccess) {
            state.isParkedSuccess = true;
            successTitle.textContent = `🎉 ${spot.name}成功！`;
            successDesc.textContent = `車身完全進入白線內且角度端正（誤差 ${Math.abs(THREE.MathUtils.radToDeg(normHeading)).toFixed(1)}°）`;
            successBanner.classList.add('show');
            soundEngine.playSuccessChime();
          }
          return;
        }
      }
    }

    const currentCamPos = new THREE.Vector3(0, 6, 15);
    const currentLookAt = new THREE.Vector3(0, 0, 8);

    function updateCamera(dt) {
      const targetCamPos = new THREE.Vector3();
      const targetLookAt = new THREE.Vector3();

      if (state.cameraMode === 'chase') {
        const offset = new THREE.Vector3(0, 3.8, 7.6);
        offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), state.heading);
        targetCamPos.set(state.x + offset.x, offset.y, state.z + offset.z);

        const lookOffset = new THREE.Vector3(0, 0.95, -2.5);
        lookOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), state.heading);
        targetLookAt.set(state.x + lookOffset.x, lookOffset.y, state.z + lookOffset.z);
      } else {
        const topOffset = new THREE.Vector3(0, 13.5, 2.2);
        topOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), state.heading);
        targetCamPos.set(state.x + topOffset.x, topOffset.y, state.z + topOffset.z);
        targetLookAt.set(state.x, 0, state.z);
      }

      const lerpFactor = 1 - Math.exp(-8 * dt);
      currentCamPos.lerp(targetCamPos, lerpFactor);
      currentLookAt.lerp(targetLookAt, lerpFactor);

      camera.position.copy(currentCamPos);
      camera.lookAt(currentLookAt);
    }

    const gearDisplay = document.getElementById('gear-display');
    const steerDisplay = document.getElementById('steer-display');
    const speedDisplay = document.getElementById('speed-display');
    const radarFill = document.getElementById('radar-bar-fill');
    const radarDistText = document.getElementById('radar-dist');

    function updateRadarHUD(isReversing, rearDist) {
      if (!isReversing || rearDist > 4.5) {
        radarFill.style.width = '0%';
        radarDistText.textContent = isReversing ? '>4.5m' : '--';
        return;
      }
      const pct = Math.max(10, Math.min(100, ((4.5 - rearDist) / 4.0) * 100));
      radarFill.style.width = `${pct}%`;
      radarFill.style.backgroundColor = rearDist < 1.0 ? '#ef4444' : (rearDist < 2.2 ? '#f59e0b' : '#22c55e');
      radarDistText.textContent = `${rearDist.toFixed(1)}m`;
    }

    function updateHUD() {
      if (Math.abs(state.speed) < 0.05) {
        gearDisplay.textContent = 'P / N';
      } else if (state.speed > 0) {
        gearDisplay.textContent = 'D (前進)';
      } else {
        gearDisplay.textContent = 'R (倒車)';
      }

      const deg = Math.round(THREE.MathUtils.radToDeg(state.steerAngle));
      steerDisplay.textContent = deg === 0 ? '0°' : (deg > 0 ? `左 ${deg}°` : `右 ${Math.abs(deg)}°`);
      speedDisplay.textContent = `${Math.abs(Math.round(state.speed * 3.6))} km/h`;
    }

    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      updatePhysics(dt);
      checkParkingSuccess();
      updateCamera(dt);
      updateHUD();

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate(lastTime);
  </script>
</body>
</html>
